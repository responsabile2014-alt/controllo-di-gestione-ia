ile.","az":"Quando gli scambi esistono ma sono prevalentemente in una direzione."},{"id":"m-reciproco","t":"Metodo reciproco","what":"Riconosce integralmente gli scambi tra ausiliari risolvendo un sistema di equazioni.","why":"Non dipende da un ordine di chiusura arbitrario.","how":["Ogni ausiliario = costo proprio + quota ricevuta dagli altri.","Ai centri produttivi arriva comunque il totale originario.","Utile quando gli scambi sono rilevanti e i dati affidabili."],"ex":"M = 50.000 + 0,20 × S; S = 35.000 + 0,25 × M. Soluzione: M = 60.000, S = 50.000; ai produttivi arrivano gli 85.000 euro originari.","az":"Quando manutenzione e servizi si scambiano molte prestazioni."},{"id":"quadrature","t":"Quadrature","what":"Controlli che verificano che il modello non crei né perda valore: origine = destinazione + residui.","why":"Garantiscono che il totale sia stato distribuito completamente.","how":["Contabilità: totale costi di competenza importato.","Centri: totale ricevuto e trasferito da ciascun centro.","Residui: costi non allocati e capacità inutilizzata.","Controlli su nulli, volumi anomali, oggetti non classificati e variazioni."],"nc":"La quadratura conferma il totale, non la correttezza economica della base.","az":"A ogni chiusura del modello di allocazione."},{"id":"volume-normale","t":"Volume effettivo, normale e capacità pratica","what":"Tre riferimenti possibili per calcolare la tariffa dei costi fissi.","why":"Il volume effettivo rende la tariffa alta nei periodi di bassa attività e bassa nei periodi saturi.","how":["La differenza tra fissi sostenuti e applicati evidenzia la capacità inutilizzata.","Il consuntivo può richiedere attività effettiva; pricing e capacità possono richiedere un riferimento normale.","La finalità va dichiarata."],"az":"Quando i costi unitari oscillano da un mese all'altro."},{"id":"tariffa-prestabilita","t":"Tariffa consuntiva e tariffa prestabilita","what":"Il coefficiente si calcola a consuntivo, con costi e volumi effettivi, oppure in anticipo, con costi e capacità pianificati.","why":"La tariffa prestabilita rende il costo disponibile durante il periodo e lo rende stabile.","how":["La tariffa consuntiva arriva tardi e incorpora oscillazioni di spesa e saturazione.","Scostamento del centro = costi effettivi - costi applicati agli oggetti.","Lo scostamento si legge per spesa, attività, capacità inutilizzata e completezza dei dati.","Le tariffe si aggiornano quando cambiano in modo strutturale costi, processi o capacità, non ogni mese."],"ex":"Il centro costa 210.000 euro e applica 195.000 euro ai prodotti: restano 15.000 euro da spiegare.","nc":"Il residuo non va distribuito in automatico a fine periodo: si perderebbe l'informazione sulla causa.","az":"Quando devi conoscere il costo dei prodotti durante l'esercizio."},{"id":"sovvenzioni","t":"Sovvenzioni incrociate","what":"Distorsione prodotta da una base inadeguata: alcuni prodotti ricevono più costi di quelli che causano e altri meno.","why":"Fa apparire redditizi o onerosi prodotti che non lo sono davvero.","how":["Con una base di volume i prodotti semplici e ad alto volume assorbono più costi comuni di quanti ne generino.","I prodotti complessi e a basso volume possono sembrare artificialmente convenienti.","Segnali: margini inspiegabili, prezzi non competitivi sui prodotti standard, continue eccezioni commerciali, prodotti complessi che sembrano molto redditizi.","Prima di dare la colpa al mercato si riesaminano pool di costo, basi e qualità dei dati."],"ex":"Impresa guida: allocando sulle unità invece che sulle ore macchina, la linea B riceve 35.455 euro in più e la linea C 19.091 euro in meno. Sulle ore, C assorbe 15,00 euro per pezzo, sei volte i 2,50 euro di B.","nc":"Il totale quadra in entrambi i casi: la quadratura non scopre la sovvenzione incrociata.","az":"Quando i margini dei prodotti non si spiegano con la realtà operativa."}]},{"id":"c7","n":7,"title":"Full Costing","full":"Full Costing","intro":"Distinguere le configurazioni progressive: costo primo, costo industriale, costo complessivo e costo economico-tecnico.","topics":[{"id":"costo-primo","t":"Costo primo","what":"Somma di materiali, lavoro e altri costi diretti.","why":"Serve a controllare i consumi direttamente tracciati.","how":["È il primo strato delle configurazioni progressive.","Contiene solo costi diretti.","Non include indiretti di produzione."],"ex":"Materiali 45 + lavoro diretto 25 = costo primo 70 euro.","az":"Quando controlli i consumi diretti di un prodotto."},{"id":"costo-industriale","t":"Costo industriale","what":"Costo primo più indiretti di produzione.","why":"Serve per l'analisi industriale e della produzione.","how":["Costo industriale = costo primo + indiretti di produzione.","Include diretti e indiretti di produzione.","È la vista utile per la valutazione industriale."],"ex":"Costo primo 70 + indiretti di produzione 18 = costo industriale 88 euro. Impresa guida, linea C: 238 + 15 = 253 euro.","nc":"Un costo industriale non è confrontabile con un costo complessivo.","az":"Quando valuti l'efficienza della produzione."},{"id":"costo-complessivo","t":"Costo complessivo","what":"Costo industriale più costi commerciali e amministrativi inclusi nel perimetro.","why":"Serve per valutare la sostenibilità economica di lungo periodo.","how":["Costo complessivo = costo industriale + costi commerciali e amministrativi inclusi.","Aggiungendo valori figurativi pertinenti si ottiene il costo economico-tecnico.","Il perimetro va sempre dichiarato."],"ex":"Costo industriale 88 + commerciale/amministrativo 12 = costo complessivo 100 euro.","az":"Quando verifichi se un prodotto copre nel tempo la struttura."},{"id":"costo-pieno","t":"Costo pieno","what":"Somma dei costi diretti e delle quote di costi indiretti attribuite a un oggetto secondo il perimetro prescelto.","why":"Misura l'assorbimento complessivo di risorse da parte dell'oggetto.","how":["Costo pieno = costi diretti + costi indiretti allocati.","«Pieno» non identifica un unico numero: dipende dal confine scelto (industriale o complessivo).","Va letto per componenti, non come scatola chiusa."],"ex":"Impresa guida, linea C: costo pieno complessivo 312,75 euro contro un prezzo di 289: risultato pieno -23,75 euro/unità.","nc":"Il costo pieno non è il costo evitabile di una decisione.","az":"Nelle analisi di sostenibilità di medio-lungo periodo."},{"id":"full-costing","t":"Full Costing","what":"Metodo che attribuisce agli oggetti sia i costi diretti sia quote di costi indiretti, producendo una configurazione di costo pieno.","why":"Serve per sostenibilità di medio-lungo periodo, valorizzazioni e analisi strutturali.","how":["Può essere a base unica (semplice, ma mescola cause diverse) o a centri di costo (basi specifiche, più dati e governance).","È sensibile alle basi di allocazione e instabile con i volumi quando i costi fissi sono divisi per l'attività effettiva.","Produrre più di quanto si vende può spostare fissi industriali nelle scorte e migliorare solo apparentemente il risultato."],"nc":"Un risultato pieno negativo è un segnale da diagnosticare, non un ordine di eliminazione.","az":"Nel pricing strutturale e nell'analisi dell'assorbimento della struttura."},{"id":"config-progressive","t":"Configurazioni progressive di costo","what":"Costo primo, costo industriale, costo complessivo, costo economico-tecnico: strati successivi dello stesso costo.","why":"Rendono visibile come si forma il costo invece di chiamare tutto «costo prodotto».","how":["Costo primo: diretti.","Industriale: + indiretti di produzione.","Complessivo: + commerciali e amministrativi.","Economico-tecnico: + valori figurativi pertinenti."],"ex":"45 + 25 = 70 (primo); + 18 = 88 (industriale); + 12 = 100 euro (complessivo).","az":"Quando presenti un costo prodotto alla direzione."}]},{"id":"c8","n":8,"title":"Direct Costing","full":"Direct Costing e margine di contribuzione","intro":"Calcolare il margine di contribuzione unitario, totale e percentuale.","topics":[{"id":"direct-costing","t":"Direct Costing","what":"Metodo che attribuisce agli oggetti i costi variabili e, nella versione evoluta, anche i costi fissi specifici.","why":"Mostra quanto ogni oggetto contribuisce alla copertura della struttura.","how":["La grandezza centrale è il margine di contribuzione.","Non carica automaticamente tutti i costi fissi sul prodotto.","Utile per decisioni di breve periodo, ordini aggiuntivi e analisi di segmento."],"nc":"Il margine non è utile: deve ancora coprire i costi fissi.","az":"Quando valuti un ordine aggiuntivo con capacità libera."},{"id":"mdc","t":"Margine di contribuzione","what":"Differenza tra ricavi e costi variabili: misura quanto resta per coprire i costi fissi e formare il risultato.","why":"È la base del Direct Costing, del break-even e delle decisioni di breve periodo.","how":["Margine di contribuzione = ricavi - costi variabili.","Si esprime come unitario, percentuale e totale.","Con un vincolo si calcola anche per unità di fattore scarso."],"ex":"Prezzo 100, costo variabile 60: margine unitario 40 euro, margine percentuale 40%.","nc":"Margine di contribuzione ≠ utile.","az":"In quasi tutte le decisioni di breve periodo."},{"id":"m-unitario","t":"Margine unitario","what":"Prezzo unitario meno costo variabile unitario: contributo di ogni unità venduta.","why":"Mostra quanto ogni unità aggiuntiva contribuisce alla struttura.","how":["Margine unitario = prezzo netto unitario - costo variabile unitario.","Limite: non considera il volume.","Non basta quando esiste un vincolo di capacità."],"ex":"Impresa guida: A 180 - 117 = 63; B 114 - 76 = 38; C 289 - 238 = 51 euro.","nc":"Il prodotto con margine unitario maggiore non è necessariamente da privilegiare se assorbe più capacità.","az":"Nel calcolo del break-even e nelle offerte."},{"id":"m-perc","t":"Margine percentuale","what":"Incidenza del margine di contribuzione sui ricavi.","why":"Serve per il pareggio in fatturato e per confrontare prodotti con prezzi diversi.","how":["Margine percentuale = margine / ricavi × 100.","Limite: non mostra il valore assoluto.","Nel multiprodotto dipende dal mix."],"ex":"Impresa guida: A 35,0%; B 33,3%; C 17,6%.","az":"Quando calcoli il fatturato di pareggio."},{"id":"m-totale","t":"Margine totale","what":"Margine unitario moltiplicato per la quantità: contributo complessivo del segmento.","why":"Mostra quanto il segmento contribuisce davvero alla struttura.","how":["Margine totale = margine unitario × quantità.","Limite: dipende dal volume.","Si confronta con i costi fissi specifici per ottenere il secondo margine."],"ex":"Impresa guida: A 504.000; B 456.000; C 102.000; totale 1.062.000 euro.","az":"Nell'analisi di portafoglio prodotti."},{"id":"fissi-specifici","t":"Costi fissi specifici","what":"Costi fissi che esistono per sostenere uno specifico segmento e possono essere eliminabili se il segmento viene abbandonato.","why":"Separarli dai fissi comuni permette di misurare il secondo margine.","how":["Fissi specifici: struttura dedicata al segmento.","Fissi comuni: restano a livello aziendale.","I comuni non vanno caricati automaticamente nel secondo margine."],"az":"Quando valuti se mantenere un prodotto, un cliente o un canale."},{"id":"secondo-margine","t":"Secondo margine","what":"Margine di contribuzione meno costi fissi specifici.","why":"Evita di fermarsi al solo contributo variabile senza penalizzare il segmento con struttura comune che resterebbe comunque.","how":["Secondo margine = margine di contribuzione - costi fissi specifici.","Utile per prodotti, clienti, canali e unità con struttura dedicata.","Poi si sottraggono i fissi comuni per arrivare al risultato operativo."],"ex":"Ricavi 500.000 - variabili 300.000 = margine 200.000 - fissi specifici 70.000 = secondo margine 130.000 - fissi comuni 90.000 = risultato 40.000 euro.","az":"Nel Conto Economico gestionale per segmento."},{"id":"confronto-fc-dc","t":"Confronto tra Full Costing e Direct Costing","what":"Le due viste rispondono a domande diverse e devono essere entrambe disponibili e riconciliabili.","why":"Scegliere la vista in base alla decisione evita conclusioni sbagliate.","how":["Sostenibilità di lungo periodo: Full Costing.","Ordine aggiuntivo con capacità libera: Direct Costing.","Redditività di segmento: Direct Costing evoluto.","Valutazione industriale: costo pieno industriale."],"ex":"Impresa guida: la linea C ha margine unitario positivo di 51 euro ma risultato pieno negativo di 23,75 euro per effetto della struttura allocata.","nc":"Prima di dire che una linea «perde» specificare configurazione di costo e decisione.","az":"Quando la direzione chiede quale prodotto è redditizio."},{"id":"margine-cliente","t":"Margine per cliente","what":"Margine di prodotto meno i costi del modo in cui il cliente viene servito (logistica, resi, assistenza).","why":"Il margine di prodotto non coincide con il margine cliente.","how":["Ricavi netti - costi variabili prodotto = margine di prodotto.","- logistica, gestione dei resi e assistenza = margine del cliente dopo i costi variabili di servizio.","- costi fissi specifici = secondo margine."],"ex":"Cliente Z: 250.000 - 145.000 = 105.000; - 32.000 = 73.000; - 18.000 = 55.000 euro.","az":"Nelle revisioni commerciali per cliente."}]},{"id":"c9","n":9,"title":"Break-even","full":"Break-even e analisi costo-volume-risultato","intro":"Calcolare il punto di pareggio in unità e in fatturato.","topics":[{"id":"bep","t":"Punto di pareggio","what":"Livello di attività o fatturato al quale ricavi totali e costi totali coincidono e il risultato operativo è zero.","why":"Trasforma la struttura dei costi in una soglia di volume da raggiungere.","how":["Collega prezzo, costo variabile unitario, costi fissi e volume.","È il punto in cui il margine totale copre esattamente i costi fissi.","Dopo il pareggio ogni unità genera risultato pari al margine unitario, finché le ipotesi restano valide."],"nc":"Pareggio economico ≠ pareggio finanziario.","az":"Nella valutazione di un nuovo prodotto o di un piano."},{"id":"bep-unita","t":"Pareggio in unità","what":"Costi fissi divisi per il margine di contribuzione unitario.","why":"Indica la più piccola quantità intera che porta il risultato a zero o sopra zero.","how":["Break-even unità = costi fissi / margine unitario.","Se il risultato non è intero, arrotondare sempre per eccesso.","Verificare capacità, mix, domanda e l'intervallo in cui i costi fissi restano invariati."],"ex":"Costi fissi 200.000; prezzo 100; costo variabile 60; margine 40: pareggio = 5.000 unità.","az":"Quando fissi obiettivi minimi di vendita."},{"id":"bep-fatt","t":"Pareggio in fatturato","what":"Costi fissi divisi per il margine percentuale.","why":"Utile in realtà multiprodotto se il mix e il margine medio restano stabili.","how":["Fatturato di pareggio = costi fissi / margine percentuale.","Se cambia il mix cambia il margine medio e quindi il pareggio.","Il fatturato può crescere senza migliorare il risultato nella misura attesa se il mix si sposta verso prodotti a basso margine."],"ex":"Costi fissi 200.000; margine 40%: fatturato di pareggio 500.000 euro.","az":"Quando ragioni per fatturato e non per pezzi."},{"id":"utile-obiettivo","t":"Utile obiettivo","what":"Volume necessario per ottenere un risultato operativo prefissato.","why":"Trasforma un obiettivo economico in una soglia operativa di volume.","how":["Volume per utile obiettivo = (costi fissi + utile obiettivo) / margine unitario, arrotondato sempre per eccesso.","L'utile obiettivo è un risultato operativo coerente con il perimetro.","Verificare che il volume sia compatibile con domanda e capacità."],"ex":"(200.000 + 80.000) / 40 = 7.000 unità.","nc":"Un obiettivo è credibile solo se il volume richiesto è realizzabile e finanziariamente sostenibile.","az":"Nella costruzione del budget vendite."},{"id":"margine-sicurezza","t":"Margine di sicurezza","what":"Differenza tra vendite previste e vendite di pareggio.","why":"Misura quanto le vendite possono scendere prima di raggiungere il pareggio: è un indicatore di rischio operativo.","how":["Margine di sicurezza = vendite previste - vendite di pareggio.","Margine di sicurezza % = margine di sicurezza / vendite previste × 100.","Va letto con stabilità della domanda e flessibilità dei costi."],"ex":"Vendite previste 650.000; pareggio 500.000: margine di sicurezza 150.000 euro, pari al 23,1%.","az":"Quando valuti la robustezza di un piano."},{"id":"leva","t":"Leva operativa","what":"Margine di contribuzione diviso per il risultato operativo.","why":"Misura la sensibilità del risultato alle variazioni di volume nel punto osservato.","how":["Grado di leva = margine di contribuzione / risultato operativo.","Valida se prezzo, mix e struttura restano coerenti.","Vicino al pareggio può diventare molto elevata: usarla con cautela."],"ex":"Margine 240.000; risultato 40.000: leva 6. Una variazione dell'1% del volume implica circa il 6% di variazione del risultato.","nc":"Non è una proprietà costante: cambia con il livello di attività e le soglie di capacità.","az":"Quando stimi l'impatto di un calo di volumi."},{"id":"mix-multi","t":"Mix multiprodotto","what":"Calcolo del pareggio usando un pacchetto di prodotti nelle proporzioni del mix.","why":"Con più prodotti il pareggio dipende dalla composizione delle vendite.","how":["Margine del pacchetto = somma dei margini unitari × unità nel mix.","Pacchetti di pareggio = costi fissi / margine del pacchetto.","Se il mix cambia, il pareggio va ricalcolato."],"ex":"A margine 40 × 2 + B margine 20 × 1 = pacchetto da 100 euro. Con 300.000 di fissi: 3.000 pacchetti = 6.000 A e 3.000 B.","az":"Quando vendi più prodotti con margini diversi."},{"id":"sensibilita","t":"Analisi di sensibilità","what":"Ricalcolo del pareggio cambiando una variabile alla volta.","why":"Rende visibili le leve (prezzo, costo variabile, fissi).","how":["Base: margine 40, pareggio 5.000 unità.","Costo variabile +5: margine 35, pareggio 5.715 unità.","Prezzo +5: margine 45, pareggio 4.445 unità.","Costi fissi +30.000: pareggio 5.750 unità."],"nc":"La sensibilità non dimostra che prezzo o volume possano cambiare senza reazioni del mercato o della capacità.","az":"Quando prepari scenari per la direzione."},{"id":"bep-tratti","t":"Pareggio con costo a tratti","what":"Pareggio calcolato rispettando la funzione di costo reale quando il costo cambia a soglie.","why":"Break-even e leva devono usare la funzione di costo reale, non una semplificazione lineare.","how":["Impresa guida: margine % a domanda piena 31,364%; struttura base 736.000.","Fatturato di pareggio 2.346.606 euro; pacchetto 4 A + 6 B + 1 C; 1.387 pacchetti.","Ore al pareggio 16.644, sotto 21.000: corretto usare la struttura base.","Margine di sicurezza 1.039.394 euro (30,7%); leva sopra soglia 1,61."],"nc":"Trattare tutti gli 820.000 come fissi darebbe una leva di 4,39: non utilizzabile.","az":"Quando la capacità esterna si attiva oltre una soglia."}]},{"id":"c10","n":10,"title":"Activity Based Costing","full":"Activity Based Costing","intro":"Riconoscere quando il volume non spiega il consumo delle risorse indirette.","topics":[{"id":"abc","t":"Activity Based Costing (ABC)","what":"Metodo che attribuisce i costi delle risorse alle attività e successivamente agli oggetti di costo mediante driver coerenti.","why":"Quando crescono lotti, varianti, ordini e complessità, una sola base volumetrica può distorcere il costo.","how":["Due passaggi: risorse → attività (driver di risorsa) e attività → oggetti (cost driver).","Tariffa driver = costo attività / volume driver.","Costo oggetto = tariffa × driver consumato."],"ex":"300.000 euro di indiretti: tradizionale A 210.000 / B 90.000; ABC A 124.000 / B 176.000. Il totale non cambia.","nc":"La differenza non prova da sola che l'ABC sia corretto: pool, driver e dati vanno validati.","az":"Quando prodotti a basso volume ma alta complessità sembrano troppo redditizi."},{"id":"attivita","t":"Attività","what":"Operazione o insieme omogeneo di operazioni che consuma risorse per produrre un risultato interno o esterno.","why":"È il ponte tra risorse e oggetti di costo.","how":["Esempi: setup, ordini, controlli, consegne, assistenza.","Gerarchia: unità, lotto, prodotto, cliente, struttura.","La gerarchia impedisce di trattare attività di lotto come generate dal numero di pezzi."],"az":"Quando mappi i processi per l'ABC."},{"id":"risorse","t":"Risorse","what":"Personale, sistemi, spazi, impianti e servizi che le attività consumano.","why":"Sono il punto di partenza del percorso del costo ABC.","how":["Vengono distribuite alle attività con i driver di risorsa.","La somma dei pool deve riconciliarsi con il totale delle risorse incluse.","Il modello cambia la lettura delle risorse, non il loro totale."],"az":"All'avvio di un modello ABC."},{"id":"pool","t":"Pool (cost pool)","what":"Il costo totale della singola attività.","why":"Un pool omogeneo è la condizione per una tariffa significativa.","how":["Deve contenere costi omogenei riferiti alla stessa attività.","Separare pool con cause economiche differenti.","Esempio: attrezzaggi 180.000; gestione ordini 240.000; controllo qualità 150.000; assistenza 210.000."],"az":"Quando costruisci le tariffe di attività."},{"id":"resource-driver","t":"Driver di risorsa","what":"Misura di come le risorse vengono assorbite dalle attività.","why":"Distribuisce personale, impianti, sistemi e spazi sulle attività.","how":["Esempi: quote di tempo del personale, utilizzo attrezzature, transazioni di sistema, metri quadrati.","Validare stime con dati, campionamenti o osservazioni.","Evitare percentuali «di comodo» senza evidenze."],"az":"Nel primo passaggio del modello ABC."},{"id":"cost-driver","t":"Cost driver","what":"Misura che esprime la causa o l'intensità con cui un'attività viene richiesta: numero di ordini, setup, controlli.","why":"Porta il costo dell'attività agli oggetti in proporzione alla domanda di attività.","how":["Deve avere relazione causale, essere misurabile e non incentivare comportamenti indesiderati.","Tariffa = costo pool / volume driver.","Se gli eventi differiscono molto, passare dal conteggio alla durata o all'intensità."],"ex":"Attrezzaggi 180.000 / 600 setup = 300 euro/setup; A con 80 setup riceve 24.000 euro.","nc":"Un driver comodo ma poco rappresentativo produce un costo preciso solo in apparenza.","az":"Nel secondo passaggio del modello ABC."},{"id":"drv-transazione","t":"Driver di transazione","what":"Conta il numero di eventi (ordini, setup, consegne).","why":"È semplice e poco costoso da rilevare.","how":["Misura: numero di eventi.","Vantaggio: semplicità.","Limite: presume eventi simili tra loro."],"az":"Quando gli eventi hanno complessità simile."},{"id":"drv-durata","t":"Driver di durata","what":"Misura il tempo impiegato dall'attività.","why":"Rileva differenze di complessità tra eventi.","how":["Misura: tempo impiegato.","Vantaggio: coglie la complessità.","Limite: richiede tempi affidabili."],"az":"Quando alcuni ordini o setup durano molto più di altri."},{"id":"drv-intensita","t":"Driver di intensità","what":"Misura le risorse effettivamente impiegate in ogni evento.","why":"Offre la maggiore precisione.","how":["Misura: risorse effettive impiegate.","Vantaggio: precisione.","Limite: più oneroso da rilevare."],"nc":"La precisione cresce passando dalla transazione all'intensità, ma cresce anche il costo di rilevazione.","az":"Quando la distorsione è rilevante e i dati esistono."},{"id":"tdabc","t":"TDABC (Time-Driven ABC)","what":"Variante dell'ABC che calcola un costo per unità di capacità (per minuto) e usa equazioni di tempo.","why":"Rende visibili complessità e capacità inutilizzata con meno driver separati.","how":["Costo per minuto = costo delle risorse / minuti di capacità pratica.","Capacità pratica: tempo realmente disponibile in condizioni sostenibili.","Equazioni di tempo: durata delle transazioni in base alle caratteristiche."],"ex":"Team 360.000 euro / 600.000 minuti = 0,60 euro/min. Ordine standard 8 minuti = 4,80 euro; complesso 20 minuti = 12 euro.","nc":"La qualità dipende da capacità pratica realistica e tempi non gonfiati da inefficienze.","az":"Nei processi di servizio con transazioni di durata diversa."},{"id":"abc-implementazione","t":"Implementare un modello ABC sostenibile","what":"Percorso in sei passi: perimetro, mappa, pool, driver, calcolo, validazione.","why":"L'obiettivo non è massimizzare il dettaglio ma ridurre le distorsioni che influenzano decisioni rilevanti.","how":["Perimetro: decisioni e oggetti prioritari.","Mappa: processi e attività significative.","Pool e driver: costi omogenei e misure causali.","Validazione: quadrature, confronto con il modello esistente, accettazione operativa."],"az":"Quando avvii un progetto ABC."},{"id":"abc-impresa-guida","t":"ABC nell'impresa guida: i due canali","what":"Modello per attività sulle funzioni commerciali e logistiche: 570.000 euro degli 820.000 della struttura.","why":"Mostra quanto un'allocazione sui ricavi può nascondere la domanda di attività di un canale.","how":["Pool: gestione ordini 240.000, consegne 180.000, assistenza tecnica 150.000 euro.","Driver: 12.000 ordini, 6.000 consegne, 7.500 ore di assistenza. La capacità pratica coincide con i volumi.","Tariffe: 20 euro per ordine, 30 euro per consegna, 20 euro per ora di assistenza.","I restanti 250.000 euro (120.000 indiretti di produzione, 46.000 di amministrazione, 84.000 di capacità esterna) restano fuori dal modello e vengono nominati."],"ex":"Canale diretto: 6.000 ordini, 3.600 consegne, 5.250 ore = 333.000 euro con l'ABC, contro 205.375 allocati sui ricavi. Distributori: 237.000 contro 364.625. Il totale resta 570.000: 127.625 euro si spostano verso il diretto.","nc":"La differenza va validata: volumi dei driver presi dai sistemi, somma dei consumi uguale ai volumi delle tariffe, pool riconciliati con i saldi dei centri.","az":"Quando i canali hanno ricavi medi per ordine molto diversi: 203 euro sul diretto, 361 sui distributori."}]},{"id":"c11","n":11,"title":"Activity Based Management","full":"Activity Based Management","intro":"Passare dalle informazioni dell'ABC alla gestione delle attività, chiedendo perché esistono, se creano valore e come possono essere migliorate.","topics":[{"id":"abm","t":"Activity Based Management (ABM)","what":"Uso delle informazioni prodotte dall'ABC per ridurre sprechi, gestire capacità e migliorare redditività e processi.","why":"Passa dalla misura economica all'intervento manageriale.","how":["Chiede perché le attività esistono, se creano valore e come migliorarle.","Operativo: eseguire meglio l'attività. Strategico: ridurre la domanda di attività.","Capacità: allineare risorse e utilizzo."],"nc":"ABC misura; ABM agisce.","az":"Nei progetti di efficienza sui processi."},{"id":"att-valore","t":"Attività a valore","what":"Attività che contribuiscono a ciò che il cliente richiede, oppure sono necessarie per rendere possibile il processo nel rispetto delle specifiche.","why":"Sono quelle da eseguire meglio, non da eliminare.","how":["L'ABM chiede se ogni attività crea valore.","Si possono migliorare con l'ABM operativo: eseguirle meglio.","Un controllo può non trasformare il prodotto ma essere necessario per la qualità o il rispetto delle specifiche: va reso più efficiente o sostituito da una prevenzione migliore, non eliminato."],"az":"Quando classifichi le attività in un progetto ABM."},{"id":"att-senza-valore","t":"Attività senza valore","what":"Attività come rilavorazione, attesa, movimentazione, controlli generati da errori a monte, inserimento dati duplicato.","why":"Sono il bersaglio principale degli interventi ABM.","how":["Rilavorazione: quale difetto la genera? correggere causa e standard.","Attesa: dove si crea la coda? bilanciare capacità e flusso.","Movimentazione: ridisegnare layout e sequenza.","Inserimento dati: integrare fonte e responsabilità."],"nc":"«Senza valore» non significa automaticamente eliminabile: un controllo può servire per la qualità o il rispetto delle specifiche, ma può essere reso più efficiente o sostituito da una prevenzione migliore.","az":"Nei programmi di riduzione degli sprechi."},{"id":"cost-to-serve","t":"Costo di servizio (cost to serve)","what":"Il costo del modo in cui il cliente viene servito: ordini, consegne, resi, assistenza, credito, personalizzazioni.","why":"Clienti con ricavi simili possono produrre margini molto diversi.","how":["Margine cliente = margine di prodotto - costo di servizio.","Leve: minimo d'ordine, calendario consegne, self-service, supplementi, pacchetti di assistenza.","L'obiettivo non è eliminare il cliente costoso, ma progettare un servizio coerente con il valore."],"ex":"Clienti X e Y: stessi ricavi (240.000) e margine di prodotto (84.000); costo di servizio 26.000 contro 5.600; margine 58.000 (24,2%) contro 78.400 (32,7%).","az":"Nelle analisi di redditività per cliente e canale."},{"id":"cap-inutil-abc","t":"Capacità inutilizzata nelle attività","what":"Capacità fornita meno capacità utilizzata, applicata alle attività.","why":"Distingue risparmio monetario e spazio liberato.","how":["Ridurre un driver libera attività, ma non riduce automaticamente la spesa.","La spesa diminuisce solo se le risorse vengono eliminate o rese evitabili.","La capacità liberata può creare valore se sostiene crescita senza nuove assunzioni."],"ex":"Un processo libera 2.000 ore ma l'organico resta invariato: il beneficio immediato è capacità disponibile, non risparmio monetario. Cliente X: riduzione a tariffa 14.280 euro, di cui 6.348 minore spesa e 7.932 capacità liberata.","az":"In ogni business case ABM."},{"id":"driver-processo","t":"Driver contabile e causa di processo","what":"Il cost driver che attribuisce il costo non sempre coincide con la causa gestionale da modificare.","why":"L'ABM passa dal driver contabile al driver di processo: si agisce sulla causa, non sul numero.","how":["Il numero di resi distribuisce il costo; la causa può essere un errore di configurazione, un imballaggio inadeguato o una promessa commerciale non coerente.","Si parte da volumi, tempi, frequenze, qualità e variabilità.","Si confrontano prodotti, clienti e periodi e si cercano le concentrazioni.","Le ipotesi si verificano con chi esegue il processo."],"nc":"Una relazione statistica senza comprensione operativa indica dove guardare, ma non identifica da sola la causa.","az":"Prima di progettare un intervento ABM."}]},{"id":"c12","n":12,"title":"Budget","full":"Budget","intro":"Intendere il budget come processo che traduce gli obiettivi in programmi coordinati, non come aggiornamento percentuale dell'anno precedente.","topics":[{"id":"finalita-budget","t":"Finalità del budget","what":"Tradurre obiettivi in programmi operativi coordinati: vendite, produzione, acquisti, risorse, investimenti e liquidità.","why":"Rende esplicite ipotesi, responsabilità, tempi e vincoli prima che diventino problemi reali.","how":["Un obiettivo di crescita deve diventare volumi, prezzi, capacità, scorte, costi e cassa.","Il valore nasce dal processo di coordinamento, non solo dal documento.","La qualità si misura sulla coerenza tra programmi, non sulla quantità di dettagli."],"nc":"Il budget non è il Conto Economico dell'anno scorso più una percentuale.","az":"Quando parte il processo di pianificazione annuale."},{"id":"strategia","t":"Strategia","what":"Risponde alla domanda «dove vogliamo andare?» su un orizzonte medio-lungo.","why":"Fornisce la direzione che il budget traduce in impegni annuali.","how":["Orizzonte: medio-lungo.","Si aggiorna quando cambiano scelte e contesto.","Il budget la declina in programmi operativi."],"nc":"Strategia, budget e forecast rispondono a tre domande diverse.","az":"Quando fissi le linee guida del budget."},{"id":"budget","t":"Budget","what":"Piano quantitativo ed economico-finanziario che traduce obiettivi e responsabilità in ricavi, costi, investimenti, fabbisogni e risultati attesi.","why":"Risponde alla domanda «che cosa ci impegniamo a fare?» e resta il riferimento di responsabilità.","how":["Orizzonte di norma annuale.","Baseline stabile o revisionata con regole.","Processo: linee guida, proposte, challenge, consolidamento, decisione, controllo."],"nc":"Budget ≠ forecast: il budget resta la baseline di responsabilità.","az":"Come riferimento per l'analisi degli scostamenti."},{"id":"forecast","t":"Forecast","what":"Previsione aggiornata dell'esito atteso, costruita con consuntivi disponibili, driver correnti e ipotesi sul periodo residuo.","why":"Risponde alla domanda «dove prevediamo di arrivare adesso?».","how":["Scorrevole o a chiusura, aggiornamento periodico.","Mesi chiusi separati dai mesi previsti.","Un beneficio non supportato da un'azione concreta non entra nel forecast."],"nc":"Il forecast non sostituisce il budget: lo affianca.","az":"Nelle revisioni trimestrali o mensili."},{"id":"incrementale","t":"Budgeting incrementale","what":"Parte dalla base esistente e applica variazioni attese.","why":"È rapido ed efficiente per voci stabili e poco rilevanti.","how":["Usarlo per voci stabili e poco rilevanti, che possono essere aggiornate in modo semplice.","Separare eventi una tantum e cambi strutturali.","Non applicare la stessa percentuale a costi guidati da volumi o capacità differenti."],"nc":"Rischia di conservare inefficienze, attività obsolete e costi non più necessari.","az":"Su voci stabili come alcuni contratti ricorrenti."},{"id":"zbb","t":"Budget a base zero (Zero Based Budgeting)","what":"Ogni voce deve essere giustificata a partire dalle attività da svolgere.","why":"Separa ciò che è necessario da ciò che esiste per inerzia storica.","how":["Rispetto all'incrementale, che parte dall'esistente, evita di conservare inefficienze e attività non più necessarie.","Utile su aree strategiche, discrezionali o in trasformazione.","Applicarlo selettivamente: è più selettivo ma richiede tempo e capacità analitica."],"nc":"Il metodo deve essere proporzionato al rischio e alla possibilità di intervento.","az":"Su aree di costo discrezionali da ripensare."},{"id":"dbb","t":"Driver Based Budgeting","what":"Collega i costi a volumi e driver operativi: ordini, clienti, ore, transazioni, consegne, capacità.","why":"Rende il modello spiegabile: quando cambia il risultato si risale alla leva che lo ha modificato.","how":["Ordini, clienti, ore, transazioni e capacità spiegano i costi meglio di percentuali generiche.","Facilita scenari e forecast.","Nella pratica si combina con gli altri approcci, in proporzione al rischio e alla possibilità di intervento."],"nc":"È coerente con la logica ABC.","az":"Quando vuoi scenari e forecast rapidi."},{"id":"scenari","t":"Scenari","what":"Versioni alternative del piano costruite su ipotesi diverse, conservate e confrontabili.","why":"Quando le ipotesi sono incerte, mostrare scenari e sensibilità è più corretto di un unico numero.","how":["Ogni versione ha data, scenario, stato e autore.","Budget iniziale, revisioni, forecast e simulazioni restano oggetti distinti.","Si affiancano almeno uno scenario centrale, uno favorevole e uno prudente."],"az":"Quando la direzione deve decidere in condizioni incerte."},{"id":"processo-budget","t":"Processo di budgeting","what":"Sequenza: linee guida, proposte, challenge, consolidamento, decisione, controllo.","why":"Senza calendario, responsabilità, definizioni comuni e versioni il budgeting diventa negoziazione di file.","how":["Direzione: priorità, scenari, vincoli, decisioni.","Funzioni: piani operativi, driver, iniziative.","Controllo di gestione: metodo, coerenza, consolidamento e analisi.","Finanza: liquidità, capitale circolante, fonti e rischi."],"nc":"Il controller non deve diventare l'autore di numeri che le funzioni non riconoscono.","az":"Nell'organizzazione del calendario di budget."},{"id":"b-tre-prospetti","t":"Budget economico, patrimoniale e finanziario","what":"Tre prospetti collegati dalle stesse ipotesi operative.","why":"Un piano può produrre utile e generare tensione di cassa.","how":["Economico: ricavi, costi e risultato per competenza.","Patrimoniale: crediti, scorte, debiti, investimenti.","Finanziario: incassi, pagamenti, investimenti, debito e liquidità."],"az":"Quando consolidi il budget complessivo."},{"id":"modello-budget","t":"Architettura e versioni del modello","what":"Separazione di input, calcoli e output, con versioni, assunzioni e approvazioni tracciate.","why":"Rende il modello auditabile; senza baseline stabile lo scostamento perde significato.","how":["Input: ipotesi approvate, fonti, responsabili.","Calcoli: formule protette e logiche per driver.","Versione: data, scenario, stato, autore; registro delle assunzioni.","Run rate, driver e iniziative vanno letti separatamente."],"nc":"Un risparmio non va inserito come importo negativo generico: servono azione, baseline, data, ramp-up, investimento e responsabile.","az":"Quando costruisci o erediti un file di budget."},{"id":"run-rate","t":"Run rate, driver e iniziative","what":"Le tre componenti che spiegano il cambiamento del budget rispetto all'anno precedente.","why":"Separa il normale andamento, le ipotesi esterne e le azioni manageriali.","how":["Run rate: effetto a regime delle decisioni già prese.","Driver: volumi, prezzi e attività.","Iniziative: azioni nuove con costi, benefici, tempi e responsabilità.","Un'iniziativa indica azione, base di partenza, data di avvio, ramp-up, investimento e responsabile."],"ex":"Impresa guida: run rate 242.000; volume B (11.400 - 12.000) × 38 = - 22.800; volume C (2.100 - 2.000) × 51 = + 5.100; recupero di prezzo B (118 - 114) × 11.400 = + 45.600; budget 269.900 euro.","nc":"Senza l'iniziativa il risultato sarebbe 224.300 euro, sotto l'esercizio in corso. Se il recupero decorre da luglio e il secondo semestre pesa metà dei volumi di B (5.700 unità), vale 22.800 euro, non 45.600.","az":"Quando presenti alla direzione da dove viene il risultato di budget."},{"id":"sensibilita-c12","t":"Sensibilità e scenario","what":"La sensibilità misura l'effetto di una variabile alla volta; lo scenario combina ipotesi coerenti.","why":"Un solo budget può dare un senso di certezza che il contesto non offre.","how":["Affiancare almeno uno scenario centrale, uno favorevole e uno prudente.","Modificare le variabili realmente incerte: volumi, prezzi, mix, cambi, materie, tempi di incasso e capacità.","Sensibilità: volumi - 10% con costi variabili unitari e costi fissi invariati.","Scenario: recessione con volumi più bassi, prezzi sotto pressione, incassi più lenti e meno spese discrezionali."],"ex":"Impresa guida: 269.900, 247.100 e 224.300 euro cambiano solo il recupero di prezzo della linea B. È una sensibilità su una variabile, non uno scenario.","az":"Quando la direzione approva un budget con ipotesi incerte."}]},{"id":"c13","n":13,"title":"Budget operativo","full":"Budget operativo","intro":"Costruire il programma delle vendite separando quantità e prezzo.","topics":[{"id":"b-vendite","t":"Budget vendite","what":"Previsione dei ricavi come quantità previste per prezzo previsto.","why":"Il programma vendite guida produzione e capacità.","how":["Ricavi di budget = quantità previste × prezzo previsto.","Quantità: portafoglio, pipeline, storico, mercato, capacità, iniziative.","Prezzo: listini, sconti, mix, valuta, condizioni contrattuali."],"ex":"A: 8.000 × 120 = 960.000; B: 5.000 × 80 = 400.000; totale 1.360.000 euro.","nc":"La quantità non è una semplice aspirazione commerciale: deve essere coerente con la capacità di consegna.","az":"Come primo tassello di tutto il budget operativo."},{"id":"b-produzione","t":"Budget produzione","what":"Quantità da produrre: vendite previste più scorte finali desiderate meno scorte iniziali.","why":"Collega il piano vendite alla capacità produttiva.","how":["Produzione = vendite + scorte finali - scorte iniziali.","Applicare per prodotto e periodo.","Considerare lotti, stagionalità, lead time e capacità."],"ex":"Vendite 8.000; scorta finale 1.200; scorta iniziale 900: produzione 8.300 unità.","nc":"Le scorte sono una scelta economica e finanziaria, non una variabile residuale.","az":"Quando pianifichi turni e capacità."},{"id":"b-materiali","t":"Budget materiali","what":"Fabbisogno di materiali per la produzione: quantità da produrre per consumo standard.","why":"Collega produzione e consumi standard.","how":["Fabbisogno = quantità da produrre × consumo standard.","Alimenta il costo industriale.","Poi si aggiusta per la politica di scorta materie."],"ex":"8.300 unità × 3 kg = 24.900 kg di fabbisogno produttivo.","az":"Nel calcolo del costo materiali di budget."},{"id":"b-acquisti","t":"Budget acquisti","what":"Quantità da acquistare: fabbisogno per la produzione più scorta finale materie meno scorta iniziale materie.","why":"Collega produzione, scorte e cassa.","how":["Acquisti = fabbisogno + scorta finale materie - scorta iniziale materie.","Il valore dipende da prezzi, cambi, trasporti, lotti e sconti.","Acquisto, costo di competenza e pagamento alimentano prospetti diversi."],"nc":"Deve collegarsi sia al costo industriale sia al budget di cassa.","az":"Nella pianificazione degli approvvigionamenti."},{"id":"b-lavoro","t":"Budget lavoro","what":"Ore necessarie: quantità da produrre per tempo standard per unità.","why":"Confronta le ore necessarie con la capacità realmente disponibile.","how":["Ore necessarie = quantità da produrre × tempo standard.","Il gap rispetto alla capacità genera straordinari, turni, assunzioni, formazione o esternalizzazioni.","Il costo orario deve includere le componenti coerenti con lo scopo."],"ex":"8.300 unità × 0,5 ore = 4.150 ore.","nc":"Ore pagate e ore produttive non coincidono: ferie, assenze, formazione e fermate riducono la capacità.","az":"Quando dimensioni l'organico."},{"id":"b-indiretti","t":"Budget costi indiretti","what":"Budget dei costi indiretti di produzione costruito per comportamento e driver.","why":"Separando attività, tariffa variabile, struttura, iniziative e capacità il budget può essere flessibilizzato.","how":["Energia di processo: variabile o mista (ore macchina + canone).","Manutenzione programmata: fissa per periodo.","Materiali indiretti: variabili; supervisione: a gradini; ammortamenti: fissi."],"az":"Nel budget dei centri produttivi."},{"id":"b-cassa","t":"Budget di cassa","what":"Previsione dei flussi monetari: cassa finale = cassa iniziale + incassi - pagamenti.","why":"Un piano può produrre utile e generare tensione di cassa.","how":["Le vendite generano ricavi e crediti prima degli incassi.","Gli acquisti generano costi/scorte e debiti prima dei pagamenti.","Il profilo mensile è essenziale: un saldo annuale positivo può nascondere picchi di fabbisogno."],"ex":"Ricavi 300.000 con il 40% incassato nel mese: 120.000 euro di incassi correnti.","az":"Quando verifichi la sostenibilità finanziaria del piano."},{"id":"circolante","t":"Capitale circolante","what":"Crediti, scorte e debiti operativi che si formano tra competenza e cassa.","why":"La crescita di crediti e scorte assorbe cassa anche con margini positivi.","how":["I debiti fornitori possono finanziare una parte del fabbisogno.","Ogni crescita va testata sul capitale circolante.","Nelle decisioni pluriennali il circolante iniziale entra nei flussi e il suo recupero nel periodo finale."],"nc":"Un business case può essere redditizio e comunque richiedere finanziamento significativo.","az":"Quando i ricavi crescono e la cassa non segue."},{"id":"dashboard-budget","t":"Budget e capacità nell'impresa guida","what":"Cruscotto che collega volume, capacità e costo della soluzione esterna.","why":"Un budget economicamente coerente può essere operativamente irrealizzabile.","how":["Annuale: 21.500 unità, ricavi 3.392.100, 24.000 ore contro 21.000 di capacità ordinaria.","Capacità esterna 3.000 ore × 28 = 84.000 euro.","A marzo il fabbisogno (2.000 ore) supera la capacità ordinaria (1.750) di 250 ore."],"nc":"La fattibilità va verificata alla stessa granularità con cui la capacità viene consumata.","az":"Quando presenti il budget alla direzione."},{"id":"verifiche-budget","t":"Verifiche di coerenza del budget operativo","what":"Controlli incrociati da eseguire prima del consolidamento.","why":"Una percentuale stabile non prova correttezza: può nascondere due errori che si compensano.","how":["Unità vendute riconciliate con produzione e scorte.","Materiali, ore e capacità coerenti con i volumi.","Organico e costo del lavoro coerenti con assunzioni, uscite e calendario; investimenti collegati agli ammortamenti.","Prove di resistenza (stress test): meno vendite, materie più care, incassi in ritardo, picco di scorte, investimento che slitta."],"ex":"Impresa guida: la capacità esterna entra una sola volta, 736.000 + 84.000 = 820.000 euro. Contata due volte porterebbe la struttura a 904.000 e il risultato da 269.900 a 185.900 euro.","nc":"Se il modello non reagisce in modo economicamente comprensibile, i collegamenti vanno corretti prima dell'approvazione.","az":"Prima di consolidare e approvare il budget."}]},{"id":"c14","n":14,"title":"Scostamenti","full":"Budget, consuntivo e analisi degli scostamenti","intro":"Leggere lo scostamento come segnale da scomporre in cause, con una convenzione dei segni dichiarata.","topics":[{"id":"b-statico","t":"Budget statico","what":"Budget costruito sul volume pianificato.","why":"È la baseline iniziale di responsabilità.","how":["Si confronta con il flessibile per isolare l'effetto volume.","Non va confrontato direttamente con costi variabili effettivi.","Esempio: 10.000 unità × 6 euro = 60.000 euro di materiale statico."],"nc":"Confrontare un costo variabile effettivo con il budget statico attribuisce alla gestione una differenza dovuta al volume.","az":"Come punto di partenza del ponte del risultato."},{"id":"b-flessibile","t":"Budget flessibile","what":"Budget ricalcolato al livello effettivo di attività, mantenendo prezzi e standard di budget.","why":"Separa l'effetto volume dagli scostamenti di prezzo, efficienza e consumo.","how":["Ricalcola ricavi e costi variabili al volume effettivo.","Mantiene prezzi e standard di budget.","I costi fissi restano quelli di budget."],"ex":"11.000 unità × 6 = 66.000 euro flessibile; costo effettivo 68.200: scostamento operativo 2.200, non 8.200.","az":"Ogni volta che il volume effettivo è diverso da quello pianificato."},{"id":"scostamento","t":"Scostamento","what":"Differenza tra un valore consuntivo e il riferimento adottato (budget, standard, periodo precedente), da scomporre nelle cause.","why":"La differenza totale non indica la causa: va scomposta in componenti interpretabili.","how":["Ricavi: effettivo - budget; positivo = favorevole.","Costi: effettivo - budget; positivo = maggior costo, sfavorevole.","Scegliere una convenzione e mantenerla, oppure usare importi assoluti con F/S."],"nc":"Un costo sotto budget può essere sfavorevole se deriva da attività non svolte o manutenzione rinviata.","az":"In ogni chiusura mensile."},{"id":"eff-volume","t":"Effetto volume","what":"Differenza di quantità valorizzata al prezzo (o al margine) di budget.","why":"Isola quanto della variazione dipende da maggiore o minore attività.","how":["Volume ricavi = (Q eff - Q bud) × P bud.","Sul risultato è spesso più utile valorizzare al margine di budget.","Nel multiprodotto il volume va separato dal mix."],"ex":"Caso completo: statico 50.000, flessibile 63.000: effetto volume +13.000 euro. Impresa guida, marzo: effetto dell'attività sul margine +2.670 euro, cioè effetto quantità +3.500 (70 unità in più × margine medio 50) ed effetto mix -830.","az":"Quando le vendite sono diverse dal budget."},{"id":"eff-prezzo","t":"Effetto prezzo","what":"Differenza di prezzo applicata alla quantità effettiva.","why":"Isola l'impatto delle condizioni di vendita.","how":["Prezzo = (P eff - P bud) × Q eff.","Positivo se si vende a prezzo superiore al budget.","Va letto insieme a sconti e mix."],"ex":"Prezzo più basso di 0,50 su 11.000 unità: effetto prezzo -5.500 euro.","az":"Nelle revisioni con la funzione commerciale."},{"id":"eff-mix","t":"Effetto mix","what":"Variazione del risultato quando la composizione delle vendite si sposta tra prodotti con margini diversi.","why":"Può peggiorare il risultato anche con volume totale in linea o superiore al budget.","how":["Ricostruire le quantità effettive con le quote di budget.","Valorizzare la differenza per linea con il margine unitario di budget.","Collegare l'effetto a disponibilità prodotto, priorità commerciali, domanda e capacità."],"ex":"Impresa guida, marzo: effetto mix -830 euro.","nc":"Un aumento del fatturato non basta se la crescita avviene sui prodotti a contributo inferiore.","az":"Quando il fatturato cresce ma il margine no."},{"id":"sc-materiali","t":"Scostamenti dei materiali","what":"Scomposizione della differenza di costo materiali in prezzo e impiego.","why":"Un prezzo migliore può essere annullato da scarti o resa peggiore.","how":["Prezzo = (P eff - P std) × Q eff.","Impiego = (Q eff - Q std ammessa) × P std.","La responsabilità attraversa più funzioni: acquisti, qualità, produzione."],"az":"Nel controllo mensile dei reparti produttivi."},{"id":"sc-prezzo-mat","t":"Prezzo materiali","what":"Differenziale di prezzo pagato rispetto allo standard, sulla quantità effettiva.","why":"Misura la performance di acquisto.","how":["Formula: (P eff - P std) × Q eff.","Negativo = favorevole (si è pagato meno).","Va letto insieme all'impiego."],"ex":"(2,75 - 3,00) × 24.800 = -6.200 euro, cioè 6.200 euro favorevoli.","az":"Nel confronto con l'ufficio acquisti."},{"id":"sc-impiego","t":"Impiego materiali","what":"Differenziale di consumo rispetto allo standard ammesso per la produzione effettiva.","why":"Misura efficienza nell'uso dei materiali.","how":["Formula: (Q eff - Q std ammessa) × P std.","Q std ammessa = produzione effettiva × consumo standard.","Positivo = sfavorevole (si è consumato di più)."],"ex":"(24.800 - 22.000) × 3 = 8.400 euro sfavorevoli.","az":"Quando crescono scarti o rilavorazioni."},{"id":"sc-lavoro","t":"Scostamenti del lavoro","what":"Scomposizione della differenza di costo del lavoro in tariffa ed efficienza.","why":"Distingue il costo orario dall'uso delle ore.","how":["Tariffa = (T eff - T std) × ore eff.","Efficienza = (ore eff - ore std ammesse) × T std.","Cause possibili: straordinari, mix di qualifiche, guasti, apprendimento, materiali difettosi, standard non aggiornati."],"nc":"Lo scostamento va collegato al processo prima di essere attribuito a un responsabile.","az":"Nel controllo dei reparti a forte componente di manodopera."},{"id":"sc-tariffa","t":"Tariffa","what":"Differenza tra costo orario effettivo e standard, applicata alle ore effettive.","why":"Isola l'effetto del costo della manodopera.","how":["Formula: (T eff - T std) × ore eff.","Positivo = sfavorevole.","Cause tipiche: straordinari, mix di qualifiche."],"ex":"(25 - 24) × 2.900 = 2.900 euro sfavorevoli.","az":"Quando aumentano straordinari o personale più qualificato."},{"id":"sc-efficienza","t":"Efficienza","what":"Differenza tra ore effettive e ore standard ammesse per l'output reale, valorizzata alla tariffa standard.","why":"Misura la produttività delle ore lavorate.","how":["Formula: (ore eff - ore std ammesse) × T std.","Ore standard ammesse = produzione effettiva × tempo standard.","Positivo = sfavorevole."],"ex":"(2.900 - 2.750) × 24 = 3.600 euro sfavorevoli.","az":"Quando la produzione richiede più ore del previsto."},{"id":"sc-indiretti","t":"Scostamenti dei costi indiretti","what":"Per gli indiretti variabili si analizzano spesa ed efficienza rispetto al driver.","why":"Distingue spesa, attività e capacità.","how":["Indiretti variabili: spesa = (tariffa effettiva del driver - tariffa standard) × quantità effettiva del driver; efficienza = (quantità effettiva del driver - quantità standard ammessa) × tariffa standard.","Costi fissi: si confronta la spesa effettiva con il budget e, quando utile, l'assorbimento della capacità.","La differenza tra costo fisso sostenuto e applicato ai prodotti non coincide con un risparmio di cassa."],"az":"Nel controllo dei centri produttivi."},{"id":"sc-fissi","t":"Scostamenti dei costi fissi","what":"Confronto tra spesa effettiva e budget e, quando utile, lettura dell'assorbimento della capacità.","why":"Lo scostamento va interpretato insieme al livello di servizio e alla capacità disponibile.","how":["Una posizione non coperta riduce il costo oggi ma può compromettere capacità futura.","Un progetto rinviato produce scostamento favorevole ma non necessariamente buona performance.","Separare effetto economico immediato da conseguenza gestionale."],"ex":"Caso completo: costi fissi 82.000 contro 80.000 di budget: 2.000 euro sfavorevoli.","az":"Nella lettura dei costi di struttura."},{"id":"bridge","t":"Analisi a ponte del risultato","what":"Ponte che spiega il passaggio dal risultato di budget al consuntivo attraverso componenti calcolate.","why":"Rende leggibile la variazione e la riconcilia esattamente.","how":["Ogni componente ha una formula esplicita; nessuna riga ottenuta come residuo.","L'ordine di calcolo va definito perché alcuni effetti interagiscono.","La somma degli impatti deve riconciliare budget e consuntivo."],"ex":"Budget 120.000 + volume 25.000 - mix 12.000 - prezzo 18.000 - materiali 9.000 + efficienza 6.000 - struttura 7.000 = consuntivo 105.000.","az":"Nel report mensile alla direzione."},{"id":"fc-chiusura","t":"Forecast di chiusura","what":"Previsione di fine anno che separa consuntivo maturato e previsione residua.","why":"Lo scostamento spiega dove siamo stati; il forecast decide dove prevediamo di arrivare.","how":["Non basta sottrarre lo scostamento dal budget: aggiornare volumi, prezzi, costi, tempi e iniziative.","Distinguere effetti permanenti e temporanei.","Confrontare forecast precedenti con consuntivi per misurare bias e accuratezza."],"az":"Dopo ogni chiusura mensile, quando uno scostamento rilevante cambia la previsione."},{"id":"azioni-correttive","t":"Azioni correttive","what":"Interventi decisi a partire dallo scostamento, con costo, data, responsabile e verifica.","why":"Il controllo non termina con la spiegazione: la fase decisiva è tradurla in azione verificabile.","how":["Quantifica, verifica, attribuisci, decidi, aggiorna il forecast, fai follow-up.","Ogni azione indica impatto lordo, costi di attuazione, probabilità, data di avvio e riflesso mensile.","La responsabilità segue la leva, non la codifica contabile."],"az":"Nel comitato di direzione dopo il commento gestionale del mese."},{"id":"caso-marzo","t":"Ponte di marzo nell'impresa guida","what":"Esempio completo di ponte del risultato riconciliato tra budget e consuntivo mensile.","why":"Mostra che ogni causa deve essere quantificata.","how":["Budget: 1.800 unità, risultato 20.800. Consuntivo: 1.870 unità, risultato 19.870.","Quantità +3.500; mix -830; prezzo linea B -4.400; costo variabile unitario 0.","Capacità esterna +1.484; struttura base -684; totale -930."],"nc":"Le 70 unità aggiuntive non migliorano il risultato perché mix e prezzo assorbono il beneficio di volume.","az":"Come modello di report mensile."},{"id":"eff-quantita","t":"Effetto quantità","what":"Parte dello scostamento del margine di contribuzione dovuta alla variazione della quantità totale venduta, valutata al margine unitario medio di budget.","why":"Nel multiprodotto separa la crescita del volume totale dall'effetto della composizione delle vendite (mix).","how":["Effetto quantità = (quantità totale effettiva - quantità totale di budget) × margine unitario medio di budget.","Margine unitario medio di budget = margine di budget / quantità totale di budget.","Effetto quantità + effetto mix = passaggio dal budget statico al flessibile sul margine."],"ex":"Impresa guida, marzo: margine medio 90.000 / 1.800 = 50 euro; (1.870 - 1.800) × 50 = +3.500 euro. Con il mix di -830 l'effetto dell'attività è +2.670 euro.","nc":"Più unità vendute non bastano: se la crescita si concentra sulla linea a margine più basso, il mix ne assorbe una parte.","az":"Quando si vendono più prodotti e il volume totale è diverso dal budget."},{"id":"forecast-mobile","t":"Forecast mobile (rolling forecast)","what":"Forecast in cui a ogni chiusura si aggiunge un mese in fondo, così l'orizzonte resta sempre della stessa lunghezza.","why":"L'orizzonte non si accorcia avvicinandosi alla fine dell'esercizio.","how":["Consuntivo e previsione in colonne separate, con ipotesi dichiarate.","Le versioni precedenti, congelate, si confrontano con il consuntivo per misurarne l'accuratezza.","Per i mesi dell'esercizio successivo il budget non esiste ancora: il confronto si fa con la versione precedente del forecast."],"nc":"Resta un forecast: non sostituisce il budget come riferimento di responsabilità.","az":"A ogni chiusura, accanto al forecast di chiusura."},{"id":"sc-volume-fissi","t":"Scostamento di volume dei costi fissi","what":"Nella lettura a costo pieno, costo fisso non assorbito perché le ore standard ammesse dai volumi effettivi sono diverse dalle ore di budget.","why":"Non è una maggiore spesa: va tenuto separato dallo scostamento di spesa dei costi fissi.","how":["Volume = (ore standard ammesse - ore di budget) × coefficiente di assorbimento.","Si calcola sulle ore standard ammesse, non sulle ore rilevate: lo scarto fra le due riguarda l'efficienza.","Compare solo nella lettura a costo pieno; nel ponte a margine non compare e il risultato del mese resta lo stesso."],"ex":"Impresa guida, marzo: (1.960 - 2.000) × 5,00 = -200 euro. Nella lettura a costo pieno l'attività vale +2.870; +2.870 - 200 = +2.670, come nella lettura a margine.","nc":"I 200 euro non vanno sommati ai 684 di spesa della struttura base: quelli contengono già tutta la spesa dei costi fissi del mese.","az":"Quando si legge il consuntivo con il prospetto a costo pieno."}]},{"id":"c15","n":15,"title":"Costi rilevanti e decisioni","full":"Costi rilevanti e decisioni","intro":"Applicare le tre verifiche di tempo, differenza e causalità per riconoscere i valori rilevanti.","topics":[{"id":"evitabili","t":"Costi evitabili","what":"Costi che scompaiono, interamente o in parte, scegliendo una determinata alternativa.","why":"Sono la vera misura del risparmio di una decisione.","how":["La classificazione richiede contratti, tempi, organico e possibilità reali di riallocazione.","Personale riducibile o riallocabile può essere evitabile o generare un costo opportunità.","Non evitabile: rimane anche dopo la decisione, almeno nell'orizzonte considerato."],"nc":"Capacità liberata non equivale automaticamente a riduzione di spesa.","az":"In ABM, Make or Buy e programmi di efficienza."},{"id":"sommersi","t":"Costi sommersi","what":"Costi già sostenuti e non recuperabili, che nessuna alternativa futura può modificare.","why":"Non cambiano più: devono essere esclusi dal confronto futuro.","how":["Separare la valutazione della decisione passata dalla decisione di oggi.","Usare solo flussi futuri differenziali.","Documentare quando un valore è sommerso per evitare che rientri implicitamente."],"nc":"Continuare un progetto solo per giustificare ciò che è già stato speso può distruggere ulteriore valore.","az":"Quando qualcuno dice «abbiamo già speso troppo per fermarci»."},{"id":"opportunita","t":"Costo opportunità","what":"Beneficio della migliore alternativa a cui si rinuncia quando una risorsa viene impiegata nell'opzione scelta.","why":"Entra nel confronto se l'alternativa è reale e praticabile, soprattutto quando la risorsa è scarsa.","how":["Non compare necessariamente in contabilità perché non nasce da una transazione.","Può essere nullo se la capacità liberata non ha un impiego alternativo.","Non va inventato un valore teorico senza alternativa reale."],"ex":"Capannone usato internamente: si rinuncia a un canone di locazione realmente ottenibile.","az":"Quando una risorsa scarsa può essere usata in più modi."},{"id":"d-rilevanti","t":"Costi rilevanti nella decisione","what":"Costi futuri che cambiano tra le alternative e sono provocati dalla scelta.","why":"Solo le differenze future causate dalla scelta permettono di distinguere le opzioni.","how":["Tempo: il valore riguarda il futuro? I costi già sostenuti sono esclusi.","Differenza: cambia tra le alternative? I valori uguali sono irrilevanti.","Causalità: è provocato dalla scelta?"],"nc":"Una voce può essere importante in bilancio e irrilevante nel confronto.","az":"In ogni business case."},{"id":"differenziali","t":"Costi differenziali","what":"La differenza di costo complessivo tra le alternative.","why":"Il risultato differenziale misura l'effetto economico della scelta.","how":["Risultato differenziale = ricavi differenziali - costi differenziali.","Confrontare solo ciò che cambia rispetto alla situazione di riferimento.","Escludere quote di struttura esistenti che restano identiche."],"ex":"Ordine aggiuntivo: ricavi 50.000 - materiali/lavorazioni 28.000 - trasporto 5.000 - straordinari 4.000 = +13.000 euro.","az":"Quando confronti due o più opzioni."},{"id":"incrementali","t":"Costi incrementali","what":"Costi aggiuntivi che nascono solo scegliendo un'alternativa: variabili e fissi incrementali specifici.","why":"Nel breve periodo rappresentano la soglia economica di un ordine.","how":["Nell'ordine speciale: costi variabili + costi fissi incrementali specifici.","Nel Make: lavoro realmente evitabile o incrementale, energia, lavorazioni legate al volume.","Prezzo minimo con capacità satura = costi incrementali + costo opportunità per unità."],"nc":"Incrementale non significa allocato: una quota di struttura esistente non è incrementale.","az":"Nel calcolo del prezzo minimo di un'offerta."},{"id":"d-evitabili","t":"Costi evitabili nella decisione","what":"Costi che scompaiono scegliendo una determinata alternativa.","why":"Parlare di risparmio prima di verificare che la spesa scompaia è uno degli errori più frequenti.","how":["Verificare concretamente contratti, persone, capacità e tempi.","Una quota allocata non è automaticamente evitabile.","Il lungo periodo può rendere evitabili costi rigidi nel breve."],"az":"Quando si ipotizza di eliminare un prodotto o esternalizzare."},{"id":"d-non-evitabili","t":"Costi non evitabili","what":"Costi che restano, almeno nell'orizzonte osservato, qualunque sia la scelta.","why":"Non sono un risparmio anche se erano allocati all'oggetto eliminato.","how":["I costi comuni allocati che restano verranno redistribuiti sugli oggetti rimanenti.","Esempio: nel Make or Buy, 40.000 euro di fissi allocati che restano non vanno trattati come risparmio.","Vanno esclusi dal confronto."],"az":"Nella pulizia di un business case."},{"id":"sunk","t":"Costi sommersi nella decisione","what":"Costo sommerso: già sostenuto e non recuperabile.","why":"Il passato non deve guidare la scelta futura.","how":["Non cambia più tra le alternative: va escluso.","La difficoltà è spesso manageriale: la pressione a «non sprecare» quanto già speso.","Documentare i valori sommersi per evitare che rientrino implicitamente."],"nc":"Gli ammortamenti di impianti già acquistati non sono flussi di cassa futuri da confrontare.","az":"Quando un progetto costoso va rivalutato."},{"id":"d-opportunita","t":"Costo opportunità nella decisione","what":"Valore della migliore alternativa sacrificata.","why":"È rilevante soprattutto quando la risorsa è scarsa.","how":["Ora macchina dedicata ad A: si rinuncia al margine di B se B è l'alternativa realmente sacrificata.","Se la risorsa non ha impiego alternativo può essere zero.","Deve essere reale, praticabile e coerente con il periodo."],"az":"Con capacità satura e in ogni scelta tra usi alternativi."},{"id":"ordine-speciale","t":"Ordine speciale","what":"Richiesta aggiuntiva, spesso a prezzo diverso da quello abituale, da valutare con costi e ricavi differenziali.","why":"Il costo pieno può portare a rifiutare attività che contribuirebbero alla struttura.","how":["Usare ricavi aggiuntivi, costi variabili e costi fissi incrementali specifici.","Verificare effetti su prezzi esistenti, servizio, qualità, credito e condizioni commerciali.","La soglia di breve non deve diventare politica di prezzo permanente."],"az":"Quando un cliente chiede un prezzo inferiore al listino."},{"id":"cap-libera","t":"Capacità libera","what":"Situazione in cui la risorsa necessaria all'ordine non ha un impiego alternativo.","why":"I costi fissi esistenti sono irrilevanti e il costo opportunità è generalmente nullo.","how":["Un prezzo sotto il costo pieno può essere sostenibile nel breve se genera contributo positivo.","Il limite di breve è dato dai costi incrementali e dagli effetti specifici dell'ordine.","Nel lungo periodo il prezzo medio deve sostenere struttura, investimenti e rendimento."],"az":"Nelle offerte tattiche in periodi di bassa attività."},{"id":"cap-satura","t":"Capacità satura","what":"Situazione in cui accettare un ordine significa sacrificare un'altra attività o acquistare capacità esterna.","why":"Il costo opportunità entra nel prezzo minimo e nel confronto economico.","how":["Identificare esplicitamente la risorsa scarsa.","Calcolare il margine dell'attività sacrificata per unità di fattore scarso.","Confrontare il costo di capacità aggiuntiva con il margine che può generare."],"nc":"Un ordine con margine positivo può distruggere valore se usa capacità che avrebbe generato un margine maggiore altrove.","az":"Nei periodi di picco produttivo."},{"id":"alternative","t":"Alternative","what":"Le opzioni reali confrontate in una decisione, incluso non intervenire.","why":"Un confronto professionale esplicita alternative, perimetro, orizzonte e criteri prima dei numeri.","how":["Obiettivo, alternative, orizzonte, differenziali, opportunità e rischi, decisione e follow-up.","Matrice: economica, capacità, finanziaria, rischio, qualità/servizio, reversibilità, follow-up.","Separare fatti, ipotesi e giudizi."],"az":"All'inizio di ogni analisi decisionale."},{"id":"indifferenza","t":"Punto di indifferenza","what":"Valore del volume (o di un altro driver) al quale due alternative producono lo stesso risultato economico.","why":"Trasforma una previsione puntuale in una soglia osservabile.","how":["Q indifferenza = differenza costi fissi / differenza costi variabili unitari.","Valido con strutture fisse e costi variabili unitari differenti.","Confrontare il volume atteso con un intervallo di incertezza."],"ex":"A: 50.000 fissi + 12/unità; B: 80.000 fissi + 8/unità. 30.000 / 4 = 7.500 unità.","az":"Quando scegli tra due configurazioni produttive o contrattuali."},{"id":"eliminare","t":"Eliminare un prodotto o un segmento","what":"Decisione da valutare confrontando il margine perso con i costi fissi realmente evitabili.","why":"Un risultato pieno negativo non giustifica automaticamente l'eliminazione.","how":["Margine 120.000 e fissi specifici evitabili 80.000: il prodotto contribuisce ancora 40.000 alla struttura.","Eliminandolo il risultato peggiora di 40.000, salvo altri effetti.","Verificare clienti collegati, capacità liberata e alternative d'impiego."],"ex":"Impresa guida, linea C: eliminarla fa perdere 102.000 di margine e risparmia solo 84.000 (-18.000); ridurla a 1.000 unità dà +33.000 rispetto al mantenimento.","az":"Nelle revisioni di portafoglio."},{"id":"van","t":"Valore Attuale Netto (VAN)","what":"Somma dei flussi differenziali attualizzati al tasso minimo richiesto.","why":"Le decisioni su più periodi non si valutano con i totali nominali o guardando solo il primo esercizio.","how":["VAN = somma dei flussi_t / (1 + r)^t.","Solo flussi che cambiano tra le alternative; r coerente con rischio e orizzonte.","Un VAN positivo indica che, nelle ipotesi, il progetto crea valore oltre il rendimento richiesto."],"ex":"Esborso 230.000; risparmi 55.000 per 5 anni; anno 5 anche recupero circolante e valore residuo. All'8%: VAN circa 23.628 euro.","nc":"Gli ammortamenti non sono flussi di cassa e non vanno sommati all'investimento.","az":"Per investimenti, contratti pluriennali e capacità."},{"id":"tir","t":"TIR","what":"Tasso Interno di Rendimento: il tasso che rende il VAN pari a zero.","why":"Con un esborso iniziale e flussi positivi, un TIR sopra il rendimento richiesto segnala convenienza nelle ipotesi.","how":["Può diventare ambiguo con flussi che cambiano segno più volte.","È una percentuale: non misura il valore assoluto creato.","Progetti di dimensione o durata diversa si confrontano soprattutto con VAN e scenari."],"nc":"VAN e TIR non sostituiscono l'analisi di rischi, capacità e reversibilità.","az":"Come indicatore complementare al VAN."},{"id":"rischio-rev","t":"Rischio, flessibilità e reversibilità","what":"Dimensioni che, oltre al valore atteso, orientano la scelta tra alternative.","why":"Un'opzione leggermente meno conveniente può essere preferibile se conserva opzioni e limita le perdite.","how":["Basso rischio + reversibile: rapidità di test e apprendimento.","Alto rischio + reversibile: prova pilota, fasi, opzioni di uscita.","Alto rischio + irreversibile: scenari prudenziali, soglie, governance, buffer."],"nc":"Il controllo di gestione rende trasparenti conseguenze e trade-off; la responsabilità finale resta del management.","az":"Nelle decisioni difficili da invertire."}]},{"id":"c16","n":16,"title":"Make or Buy","full":"Make or Buy","intro":"Confrontare produzione interna e acquisto esterno sullo stesso perimetro di quantità, specifiche, qualità e tempi.","topics":[{"id":"make","t":"Make","what":"Produzione interna: il suo costo rilevante è una misura differenziale, non il costo pieno contabile.","why":"Solo i costi che cambierebbero passando al Buy vanno confrontati.","how":["Includere materiali, lavoro realmente evitabile o incrementale, energia e lavorazioni legate al volume.","Includere manutenzioni specifiche, attrezzature necessarie e costi di coordinamento.","Escludere ammortamenti di impianti già acquistati e costi comuni che resteranno invariati."],"ex":"Esempio 10.000 unità: materiali 60.000 + lavoro evitabile 40.000 + variabili indiretti 20.000 + fissi evitabili 20.000 = Make rilevante 140.000.","az":"Quando un fornitore propone di produrre al posto vostro."},{"id":"buy","t":"Buy","what":"Acquisto esterno: si valuta con il costo totale della fornitura (total cost) e il rischio, non con il solo prezzo unitario.","why":"Il prezzo del fornitore è solo una parte del costo reale dell'acquisto.","how":["Prezzo + trasporto, dazi, assicurazione, controlli, gestione fornitore e scarti.","Minimi d'ordine, scorte di sicurezza, costi finanziari, sistemi e investimenti di integrazione.","Costi di transizione e possibili costi di uscita."],"ex":"Esempio 10.000 unità: prezzo fornitore 140.000 + trasporto e controlli 8.000 = Buy rilevante 148.000.","nc":"Prezzo basso con alta variabilità di qualità può generare costi interni nascosti.","az":"Quando confronti offerte di fornitori."},{"id":"perimetro","t":"Perimetro comparabile","what":"Le alternative devono fornire lo stesso output: quantità, specifiche, qualità, tempi, logistica, controlli, scarti, pagamento e durata.","why":"Confrontare perimetri diversi porta a falsi risparmi.","how":["Il prezzo del fornitore non va confrontato con il costo pieno interno.","Verificare che il livello di servizio sia lo stesso.","Includere capitale circolante, rischio e reversibilità."],"az":"Prima di mettere a confronto i numeri."},{"id":"mb-evitabili","t":"Costi realmente evitabili","what":"Costi interni che scomparirebbero davvero passando al Buy.","why":"Solo questi sono un risparmio del Buy.","how":["Manodopera: si riduce? si rialloca a un'attività che genera margine? resta senza impiego?","Se resta comunque, non è un risparmio immediato.","Fissi allocati che restano non vanno considerati."],"ex":"Nell'esempio da 10.000 unità, 40.000 euro di fissi allocati restano e non sono un risparmio.","az":"Quando il business case dichiara grandi risparmi interni."},{"id":"cap-liberata","t":"Capacità liberata","what":"Risorse interne che il Buy rende disponibili.","why":"Crea valore solo se viene ridotta o riutilizzata.","how":["Se la risorsa liberata ha un impiego alternativo, nasce un costo opportunità del Make.","Se diventa capacità inutilizzata, non genera risparmio.","Va distinta dalla riduzione di spesa."],"ex":"Il Buy costa 8.000 euro in più, ma diventa conveniente se la capacità liberata genera più di 8.000 euro di margine alternativo.","nc":"Capacità liberata ≠ risparmio monetario.","az":"Quando valuti cosa fare delle risorse interne dopo l'esternalizzazione."},{"id":"mb-opportunita","t":"Costo opportunità nel Make or Buy","what":"Il margine che la capacità ordinaria potrebbe generare se liberata dal Buy.","why":"Se reale, va aggiunto al costo del Make.","how":["Nasce se il personale o gli impianti si riallocano su attività che generano margine.","È zero se la capacità liberata non ha impiego.","Deve essere un'alternativa concreta, non teorica."],"az":"Quando la capacità ordinaria è satura."},{"id":"transizione","t":"Costi di transizione","what":"Costi temporanei di selezione, transizione, avvio e uscita.","why":"Vanno collocati nei mesi in cui avvengono, separando il ramp-up dalle condizioni a regime.","how":["Selezione: analisi, qualifica e audit.","Transizione: scorte parallele, doppia gestione, trasferimento dati, penali.","Avvio: scarti, tempi più lunghi, formazione, collaudi.","Uscita: clausole, penali, reversibilità, piano alternativo."],"az":"Nel business case pluriennale del Make or Buy."},{"id":"qualita","t":"Qualità","what":"Difetti, controlli, rilavorazioni, conformità e responsabilità sullo standard.","why":"Una qualità variabile può generare costi interni nascosti.","how":["Tradurre in costi attesi solo dove esistono dati credibili.","Misurare con scorecard e SLA.","Gli SLA devono avere misura, fonte, frequenza e conseguenza."],"az":"Nel monitoraggio del fornitore."},{"id":"rischio","t":"Rischio","what":"Capacità del fornitore, lead time, concentrazione e rischio di interruzione.","why":"Il prezzo del Buy va affiancato dal costo totale della fornitura (total cost) e dal rischio.","how":["Lead time lunghi aumentano scorte e rischio di servizio.","Usare soglie e condizioni per rischi non facilmente monetizzabili.","Considerare soluzioni intermedie: doppia fonte, esternalizzazione dei picchi, contratto pilota."],"az":"Quando il fornitore è unico o lontano."},{"id":"dipendenza","t":"Dipendenza","what":"Rischio legato a conoscenza, proprietà intellettuale, competenze, protezione del know-how e capacità di innovazione.","why":"Per attività strategiche il valore della conoscenza, della protezione del know-how e della capacità di innovazione può superare il differenziale di costo immediato.","how":["Il Make or Buy non è sempre una scelta binaria.","Sono possibili soluzioni intermedie: doppia fonte, quota interna e quota esterna, esternalizzazione dei picchi, contratto pilota.","Riesaminare la scelta quando cambiano volumi, prezzi, capacità o strategia."],"az":"Quando si esternalizzano lavorazioni critiche."},{"id":"reversibilita","t":"Reversibilità","what":"Costo e tempo necessari per tornare alla soluzione interna o cambiare fornitore.","why":"Una decisione difficile da invertire richiede più cautela.","how":["Quanto costa tornare indietro?","Quanto tempo richiede?","Clausole di uscita e piano alternativo."],"az":"Nella negoziazione del contratto di fornitura."},{"id":"mb-indifferenza","t":"Punto di indifferenza Make or Buy","what":"Volume al quale Make e Buy costano uguale.","why":"La soglia permette di monitorare quando il business case cambia.","how":["Volume di indifferenza = costi fissi evitabili del Make / (prezzo Buy - costo variabile Make).","Il denominatore è il vantaggio unitario del Make.","Includere i costi specifici di entrambe le alternative e verificare la capacità."],"ex":"Make: 120.000 fissi + 9/unità; Buy: 15/unità. Soglia = 120.000 / (15 - 9) = 20.000 unità. Sotto conviene il Buy, sopra il Make.","az":"Quando i volumi sono incerti."},{"id":"mb-caso","t":"Capacità aggiuntiva: Make, Buy o rinuncia","what":"Impresa guida: coprire 3.000 ore oltre la capacità ordinaria con un turno, con capacità esterna o rinunciando a 1.000 unità di C.","why":"Il confronto deve includere il costo della capacità e il margine che quella capacità genera.","how":["Make turno: 36.000 fissi evitabili + 14 × 3.000 = 78.000 euro (26 euro/ora): risultato 248.000.","Buy esterno: 3.000 × 28 = 84.000 euro: risultato 242.000.","Rinuncia a 1.000 C: margine 1.011.000 - struttura 736.000 = risultato 275.000."],"nc":"Rinunciare al volume è più redditizio perché C rende 17 euro per ora e la capacità aggiuntiva costa 26-28 euro.","az":"Quando la domanda supera la capacità ordinaria."},{"id":"mb-monitoraggio","t":"Monitoraggio e checklist","what":"Il Make or Buy è una decisione da governare nel tempo, non un contratto da archiviare.","why":"Il business case iniziale va confrontato periodicamente con i risultati reali.","how":["Perimetro, costi, capacità, finanza, rischio, reversibilità, monitoraggio.","Scorecard: qualità, consegna, capacità, solidità, flessibilità, innovazione, continuità della fornitura, rispetto delle specifiche.","Misurare anche costi interni di gestione e scorte, non solo il prezzo fatturato."],"az":"Dopo la firma del contratto."},{"id":"mb-turno-esterno","t":"Turno aggiuntivo o ore esterne","what":"Impresa guida: confronto fra il turno aggiuntivo (Make) e le 3.000 ore esterne a 28 euro (Buy), sullo stesso perimetro.","why":"Un confronto a costo pieno darebbe la risposta opposta a quella corretta.","how":["Make rilevante: 36.000 + 14 × 3.000 = 78.000 euro; Buy: 3.000 × 28 = 84.000 euro. Il turno costa 6.000 euro in meno.","Se sul solo turno si caricasse la quota di indiretti di produzione (5,00 × 3.000 = 15.000 euro), il Make salirebbe a 93.000 euro e sembrerebbe più caro di 9.000 euro. Ma i 120.000 euro di indiretti restano identici con o senza turno.","Volume di indifferenza: 36.000 / (28 - 14) = circa 2.571 ore. Sotto conviene il Buy, sopra il Make.","Il costo per ora del turno scende sotto i 17 euro di margine per ora di C solo oltre 36.000 / (17 - 14) = 12.000 ore: quattro volte il fabbisogno."],"ex":"Le 3.000 ore servono 1.000 unità di C che portano 51.000 euro di margine. Il turno riduce la perdita da 33.000 a 27.000 euro, ma resta una perdita.","nc":"Il confronto fra Make e Buy non chiude la decisione: va confrontato anche con la rinuncia al volume.","az":"Quando devi scegliere come coprire le ore oltre la capacità."}]},{"id":"c17","n":17,"title":"Pricing","full":"Pricing","intro":"Integrare nel prezzo le prospettive del costo, del mercato e del valore per il cliente.","topics":[{"id":"prezzo","t":"Prezzo","what":"Il corrispettivo richiesto al cliente, che dipende da valore, alternative del cliente, concorrenza, capacità e strategia.","why":"Un prezzo sostenibile deve creare valore per il cliente e margine per l'impresa.","how":["Il prezzo non coincide con tutto il valore creato: ne cattura una parte.","Va letto come prezzo netto realizzato, non solo come listino.","L'architettura definisce unità di prezzo, pacchetti, soglie, componenti fisse e variabili."],"az":"In ogni proposta commerciale."},{"id":"costo-pricing","t":"Costo nel pricing","what":"Il costo fissa vincoli e sostenibilità del prezzo; la base di costo va sempre dichiarata.","why":"Una percentuale di ricarico ha senso solo se si sa su quale costo è calcolata.","how":["Base di costo: variabile, industriale o complessiva.","Nel breve con capacità libera il limite è dato dai costi incrementali.","Nel lungo il prezzo medio deve sostenere struttura, investimenti e rendimento atteso."],"az":"Quando imposti un listino o un'offerta."},{"id":"cbp","t":"Cost Based Pricing","what":"Prezzo costruito partendo dal costo più un margine.","why":"È semplice e ancorato alla sostenibilità economica.","how":["Punto di partenza: costo + m
