alternativa sacrificata: entra se l'alternativa è reale.","ex":"Canone di locazione realmente ottenibile per un capannone usato internamente."},"key":"Il primo guarda al passato e non conta; il secondo guarda alle alternative future e conta se praticabile."},{"id":"c14","area":"c14","a":{"t":"Budget statico","d":"Costruito sul volume pianificato.","ex":"10.000 unità × 6 = 60.000 euro di materiale."},"b":{"t":"Budget flessibile","d":"Ricalcolato al volume effettivo con prezzi e standard di budget.","ex":"11.000 unità × 6 = 66.000 euro."},"key":"Con un costo effettivo di 68.200 lo scostamento operativo è 2.200, non 8.200."},{"id":"c15","area":"c6","a":{"t":"Quadratura","d":"Conferma che il totale è stato distribuito senza creare né perdere valore.","ex":"Ore macchina e unità quadrano entrambe a 120.000."},"b":{"t":"Correttezza economica","d":"Verifica che la base rappresenti davvero il consumo.","ex":"Solo le ore macchina riflettono l'assorbimento del reparto."},"key":"La quadratura è necessaria ma non sufficiente."},{"id":"c16","area":"c4","a":{"t":"Costo fisso totale","d":"Resta stabile entro l'intervallo di rilevanza.","ex":"12.000 euro."},"b":{"t":"Costo fisso unitario","d":"Diminuisce quando aumenta il volume.","ex":"Da 12 a 6 euro raddoppiando i volumi."},"key":"La riduzione del costo unitario non è riduzione di spesa: è maggiore assorbimento della capacità."},{"id":"c17","area":"c18","a":{"t":"Margine unitario","d":"Contributo per pezzo.","ex":"A 63, C 51, B 38 euro."},"b":{"t":"Margine per fattore scarso","d":"Contributo per unità della risorsa limitante.","ex":"B 76, A 42, C 17 euro/ora."},"key":"Con un vincolo attivo decide il margine per unità del fattore scarso."},{"id":"c18","area":"c1","a":{"t":"Acquisto","d":"La risorsa entra nella disponibilità dell'impresa.","ex":"Acquistati 30.000 euro di materiali."},"b":{"t":"Costo del periodo","d":"La risorsa viene consumata.","ex":"Consumati 20.000: 10.000 restano in magazzino."},"key":"Il consumo, non l'acquisto, determina il costo economico del periodo."}];var W=[{"id":"f-risultato","area":"c1","n":"Risultato economico","f":"Risultato economico = ricavi - costi del periodo","s":"Misura la ricchezza creata o distrutta nel periodo, secondo la competenza; non dice se in cassa ci sono i soldi.","q":"Per leggere il Conto Economico per gradini.","ex":"Ricavi 200.000 - costi variabili 120.000 - costi fissi 55.000 - oneri finanziari 5.000 = 20.000 euro."},{"id":"f-pn","area":"c1","n":"Patrimonio netto","f":"Patrimonio netto = attività - passività","s":"È un residuo, ottenuto per differenza: non è denaro.","q":"Per leggere lo Stato Patrimoniale a una data.","ex":"Il patrimonio netto può essere investito in crediti, scorte e immobilizzazioni: non coincide con la cassa."},{"id":"f-pn-fine","area":"c1","n":"Patrimonio netto di fine periodo","f":"Patrimonio netto di fine periodo = patrimonio netto di inizio periodo + utile - utili distribuiti, in assenza di nuovi apporti o rimborsi di capitale","s":"Collega il Conto Economico, che misura la variazione di ricchezza, allo Stato Patrimoniale, che la fotografa a una data.","q":"Per verificare che l'utile del periodo compaia nel patrimonio netto.","ex":"Con 20.000 euro di utile e nessun utile distribuito, il patrimonio netto di fine periodo supera di 20.000 euro quello di inizio periodo."},{"id":"f-costo","area":"c3","n":"Costo della risorsa consumata","f":"Costo = quantità consumata × valore unitario","s":"Il costo del periodo nasce dal consumo, non dall'acquisto.","q":"Per determinare il costo di un periodo partendo dai consumi.","ex":"600 kg consumati × 8 euro/kg = 4.800 euro (sui 1.000 kg acquistati, 3.200 euro restano in magazzino)."},{"id":"f-cvt","area":"c4","n":"Costo variabile totale","f":"Costo variabile totale = costo variabile unitario × quantità","s":"Il totale segue i volumi; il costo unitario resta costante.","q":"Per prevedere i costi che cambiano con il volume.","ex":"6 euro × 1.000 unità = 6.000 euro; 6 × 2.000 = 12.000 euro."},{"id":"f-cfu","area":"c4","n":"Costo fisso unitario","f":"Costo fisso unitario = costo fisso totale / quantità","s":"Scende quando il volume cresce, perché lo stesso totale si distribuisce su più unità: non è un costo eliminato.","q":"Per leggere il costo per unità al variare del volume.","ex":"12.000 / 1.000 = 12,00 euro; 12.000 / 2.000 = 6,00 euro."},{"id":"f-misto","area":"c4","n":"Costo misto","f":"Costo totale = componente fissa + tariffa variabile × attività","s":"Separa la spesa strutturale dal consumo.","q":"Per simulare contratti con canone più quota a consumo.","ex":"2.000 + 0,40 × 10.000 transazioni = 6.000 euro."},{"id":"f-highlow","area":"c4","n":"Metodo dei livelli massimo e minimo","f":"Tariffa variabile = variazione costo / variazione attività;  Fisso = costo totale - tariffa × attività","s":"Stima rapida di quota fissa e variabile con due osservazioni.","q":"Quando servono una stima veloce e pochi dati; con dati numerosi servono grafici e regressione.","ex":"(34.000 - 22.000) / (8.000 - 4.000) = 3 euro/ora; fisso = 34.000 - 3 × 8.000 = 10.000 euro."},{"id":"f-previsto","area":"c4","n":"Costo previsto per comportamento","f":"Costo previsto = costi variabili + costi fissi + gradini di capacità","s":"Previsione spiegabile ipotesi per ipotesi.","q":"Nel budget e nel forecast.","ex":"6.000 × 14 + 70.000 + 8.000 (supervisione oltre 5.000 unità) = 162.000 euro."},{"id":"f-tratti","area":"c4","n":"Funzione di costo a tratti (impresa guida)","f":"Costo totale = 736.000 + costi variabili + 28 × MAX(ore richieste - 21.000; 0)","s":"Oltre la capacità ordinaria ogni ora costa 28 euro in più.","q":"Quando esiste una soglia di capacità.","ex":"24.000 ore: 736.000 + 2.324.000 + 28 × 3.000 = 3.144.000 euro."},{"id":"f-inutil","area":"c4","n":"Costo della capacità inutilizzata","f":"Capacità inutilizzata = costo capacità fornita - costo capacità utilizzata","s":"Rende visibile la struttura non impiegata.","q":"Quando i volumi sono sotto la capacità disponibile.","ex":"120.000 / 12.000 ore = 10 euro/ora; 3.000 ore non usate × 10 = 30.000 euro."},{"id":"f-satur","area":"c20","n":"Saturazione","f":"Saturazione = capacità richiesta / capacità disponibile × 100","s":"Sotto il 100% c'è capacità inutilizzata; oltre il 100% serve capacità aggiuntiva.","q":"Per verificare la fattibilità di un piano.","ex":"24.000 / 21.000 = 114,3%: fabbisogno aggiuntivo di 3.000 ore."},{"id":"f-coeff","area":"c6","n":"Coefficiente di allocazione","f":"Coefficiente = costi del centro / volume totale della base;  Costo oggetto = coefficiente × base consumata","s":"Trasforma il costo del centro in una tariffa.","q":"Nella ripartizione dei costi indiretti.","ex":"240.000 / 12.000 ore = 20 euro/ora; 150 ore × 20 = 3.000 euro."},{"id":"f-reciproco","area":"c6","n":"Metodo reciproco","f":"M = costo proprio M + % servizi ricevuti da S × S;  S = costo proprio S + % servizi ricevuti da M × M","s":"Riconosce tutti gli scambi tra centri ausiliari.","q":"Quando gli scambi reciproci sono rilevanti.","ex":"M = 50.000 + 0,20 S; S = 35.000 + 0,25 M → M = 60.000; S = 50.000."},{"id":"f-sc-centro","area":"c6","n":"Scostamento del centro","f":"Scostamento centro = costi effettivi - costi applicati agli oggetti","s":"Differenza fra costo sostenuto e costo applicato con la tariffa prestabilita.","q":"Quando i costi del centro si applicano agli oggetti con una tariffa prestabilita.","ex":"210.000 - 195.000 = 15.000 euro da spiegare, non da ripartire automaticamente."},{"id":"f-pieno","area":"c7","n":"Costo pieno","f":"Costo pieno = costi diretti + costi indiretti allocati","s":"Assorbimento complessivo di risorse secondo il perimetro scelto.","q":"Per sostenibilità di lungo periodo.","ex":"Materiali 45 + lavoro 25 + indiretti produzione 18 + commerciale/amministrativo 12 = 100 euro."},{"id":"f-config","area":"c7","n":"Configurazioni progressive","f":"Costo primo = diretti;  Industriale = primo + indiretti di produzione;  Complessivo = industriale + commerciali e amministrativi","s":"Mostra gli strati del costo.","q":"Quando presenti un costo prodotto.","ex":"70 → 88 → 100 euro."},{"id":"f-mdc","area":"c8","n":"Margine di contribuzione","f":"Margine di contribuzione = ricavi - costi variabili","s":"Quanto resta per coprire i costi fissi e formare il risultato.","q":"Decisioni di breve periodo, break-even.","ex":"Ricavi 200.000 - variabili 120.000 = 80.000 euro."},{"id":"f-munit","area":"c8","n":"Margine unitario","f":"Margine unitario = prezzo netto unitario - costo variabile unitario","s":"Contributo di ogni unità venduta.","q":"Break-even, ordini, offerte.","ex":"100 - 60 = 40 euro."},{"id":"f-mperc","area":"c8","n":"Margine percentuale","f":"Margine % = margine / ricavi × 100","s":"Incidenza del contributo sui ricavi.","q":"Pareggio in fatturato, confronto tra prodotti.","ex":"40 / 100 × 100 = 40%."},{"id":"f-mtot","area":"c8","n":"Margine totale","f":"Margine totale = margine unitario × quantità","s":"Contributo complessivo del segmento.","q":"Analisi di portafoglio.","ex":"Linea A: 63 × 8.000 = 504.000 euro."},{"id":"f-secondo","area":"c8","n":"Secondo margine","f":"Secondo margine = margine di contribuzione - costi fissi specifici","s":"Contributo dopo la struttura dedicata al segmento.","q":"Redditività di prodotti, clienti, canali.","ex":"200.000 - 70.000 = 130.000 euro."},{"id":"f-bepu","area":"c9","n":"Break-even in unità","f":"Break-even unità = costi fissi / margine di contribuzione unitario (arrotondare per eccesso)","s":"Quantità minima per risultato operativo zero.","q":"Obiettivi minimi di vendita.","ex":"200.000 / 40 = 5.000 unità."},{"id":"f-bepf","area":"c9","n":"Break-even in fatturato","f":"Fatturato di pareggio = costi fissi / margine percentuale","s":"Fatturato che copre esattamente i fissi.","q":"Realtà multiprodotto con mix stabile.","ex":"200.000 / 40% = 500.000 euro."},{"id":"f-target","area":"c9","n":"Volume per utile obiettivo","f":"Volume per utile obiettivo = (costi fissi + utile obiettivo) / margine unitario, arrotondato sempre per eccesso","s":"Trasforma un obiettivo di utile in una soglia di volume.","q":"Budget vendite.","ex":"(200.000 + 80.000) / 40 = 7.000 unità."},{"id":"f-ro-netto","area":"c9","n":"Risultato operativo necessario (obiettivo dopo le imposte)","f":"Con l’obiettivo espresso dopo le imposte: risultato operativo necessario = utile netto desiderato / (1 - aliquota) + oneri finanziari","s":"Trasforma un obiettivo di utile netto nel risultato operativo da raggiungere.","q":"Quando l'obiettivo è espresso dopo le imposte.","ex":"56.000 / (1 - 0,30) + 0 = 80.000 euro: con costi fissi 200.000 e margine unitario 40 si torna a (200.000 + 80.000) / 40 = 7.000 unità."},{"id":"f-mds","area":"c9","n":"Margine di sicurezza","f":"Margine di sicurezza = vendite previste - vendite di pareggio; margine di sicurezza % = margine di sicurezza / vendite previste × 100","s":"Quanto possono scendere le vendite prima del pareggio.","q":"Valutazione del rischio operativo.","ex":"650.000 - 500.000 = 150.000 euro; 150.000 / 650.000 = 23,1%."},{"id":"f-leva","area":"c9","n":"Leva operativa","f":"Grado di leva operativa = margine di contribuzione / risultato operativo","s":"Sensibilità del risultato al volume nel punto osservato.","q":"Stima dell'impatto di variazioni di volume.","ex":"240.000 / 40.000 = 6: +1% di volume ≈ +6% di risultato."},{"id":"f-leva-tratti","area":"c9","n":"Leva operativa con la funzione di costo a tratti","f":"Con la funzione di costo a tratti, sopra la soglia di capacità: leva = (margine di contribuzione - costo orario esterno × ore richieste) / risultato operativo","s":"Dal margine si toglie prima il costo che si muove con il volume.","q":"Quando le ore richieste superano la capacità ordinaria e le ore mancanti si acquistano all’esterno.","ex":"(1.062.000 - 28 × 24.000) / 242.000 = 390.000 / 242.000 = 1,61; vale per cali del fatturato fino al 12,5%."},{"id":"f-pacchetto","area":"c9","n":"Pareggio multiprodotto","f":"Pacchetti di pareggio = costi fissi / margine del pacchetto;  margine pacchetto = Σ (margine unitario × unità nel mix)","s":"Il mix entra nel calcolo del pareggio.","q":"Con più prodotti in proporzioni stabili.","ex":"40 × 2 + 20 × 1 = 100; 300.000 / 100 = 3.000 pacchetti = 6.000 A + 3.000 B."},{"id":"f-abc","area":"c10","n":"Tariffa ABC e costo attribuito","f":"Tariffa driver = costo attività / volume driver;  Costo oggetto = tariffa × driver consumato","s":"Porta il costo delle attività agli oggetti.","q":"Quando i costi indiretti dipendono dalla complessità.","ex":"180.000 / 600 setup = 300 euro; A con 80 setup = 24.000 euro."},{"id":"f-tdabc","area":"c10","n":"TDABC: costo per minuto","f":"Costo per minuto = costo delle risorse / minuti di capacità pratica","s":"Costo per unità di capacità.","q":"Transazioni con durate diverse.","ex":"360.000 / 600.000 = 0,60 euro/min; ordine di 8 minuti = 4,80 euro."},{"id":"f-ricavi-bud","area":"c13","n":"Budget vendite","f":"Ricavi di budget = quantità previste × prezzo previsto","s":"Separa volume e prezzo e prepara l'analisi degli scostamenti.","q":"Primo passo del budget operativo.","ex":"8.000 × 120 + 5.000 × 80 = 1.360.000 euro."},{"id":"f-produzione","area":"c13","n":"Budget produzione","f":"Produzione = vendite previste + scorte finali desiderate - scorte iniziali","s":"Collega vendite e scorte alla produzione.","q":"Per prodotto e periodo.","ex":"8.000 + 1.200 - 900 = 8.300 unità."},{"id":"f-fabbisogno","area":"c13","n":"Fabbisogno materiali","f":"Fabbisogno = quantità da produrre × consumo standard","s":"Materiale necessario alla produzione.","q":"Budget materiali.","ex":"8.300 × 3 kg = 24.900 kg."},{"id":"f-acquisti","area":"c13","n":"Budget acquisti","f":"Acquisti = fabbisogno per produzione + scorta finale materie - scorta iniziale materie","s":"Quantità da acquistare.","q":"Budget approvvigionamenti e cassa.","ex":"Esempio: 24.900 + 2.000 - 1.500 = 25.400 kg (valori di scorta illustrativi)."},{"id":"f-ore","area":"c13","n":"Ore lavoro necessarie","f":"Ore necessarie = quantità da produrre × tempo standard per unità","s":"Fabbisogno di lavoro da confrontare con la capacità.","q":"Budget del lavoro.","ex":"8.300 × 0,5 = 4.150 ore."},{"id":"f-cassa","area":"c13","n":"Budget di cassa","f":"Cassa finale = cassa iniziale + incassi - pagamenti","s":"Profilo monetario del piano.","q":"Verifica della sostenibilità finanziaria.","ex":"Ricavi 300.000 con il 40% incassato nel mese: incassi correnti 120.000 euro."},{"id":"f-sc-prezzo","area":"c14","n":"Scostamento prezzo (ricavi)","f":"Prezzo = (P eff - P bud) × Q eff","s":"Differenza di prezzo sulla quantità effettiva.","q":"Analisi dei ricavi.","ex":"-0,50 × 11.000 = -5.500 euro."},{"id":"f-sc-volume","area":"c14","n":"Scostamento volume (ricavi)","f":"Volume = (Q eff - Q bud) × P bud","s":"Differenza di quantità valorizzata al prezzo di budget.","q":"Analisi dei ricavi.","ex":"(11.000 - 10.000) × 25 = 25.000 euro di ricavi."},{"id":"f-sc-pmat","area":"c14","n":"Scostamento prezzo materiali","f":"Prezzo = (P eff - P std) × Q eff","s":"Differenziale di prezzo sulla quantità effettiva.","q":"Controllo acquisti.","ex":"(2,75 - 3,00) × 24.800 = -6.200 (favorevole)."},{"id":"f-sc-imp","area":"c14","n":"Scostamento impiego materiali","f":"Impiego = (Q eff - Q std ammessa) × P std","s":"Differenziale di consumo rispetto allo standard ammesso.","q":"Controllo produzione.","ex":"(24.800 - 22.000) × 3 = 8.400 (sfavorevole)."},{"id":"f-sc-tar","area":"c14","n":"Scostamento tariffa lavoro","f":"Tariffa = (T eff - T std) × ore eff","s":"Costo orario effettivo rispetto allo standard.","q":"Controllo costo del lavoro.","ex":"(25 - 24) × 2.900 = 2.900 (sfavorevole)."},{"id":"f-sc-eff","area":"c14","n":"Scostamento efficienza lavoro","f":"Efficienza = (ore eff - ore std ammesse) × T std","s":"Ore effettive rispetto alle ore ammesse per l'output reale.","q":"Controllo produttività.","ex":"(2.900 - 2.750) × 24 = 3.600 (sfavorevole)."},{"id":"f-sc-cind","area":"c14","n":"Scostamenti dei costi indiretti variabili","f":"Costi indiretti variabili: scostamento spesa = (tariffa effettiva del driver - tariffa standard) × quantità effettiva del driver; scostamento efficienza = (quantità effettiva del driver - quantità standard ammessa) × tariffa standard; la tariffa effettiva è il costo effettivo diviso la quantità effettiva del driver","s":"Stessa forma degli scostamenti del lavoro diretto, con la quantità del driver al posto delle ore.","q":"Per i costi indiretti che variano con un driver.","ex":"Il capitolo 14 non ha un esempio numerico: si seguono gli esempi del lavoro diretto, con quantità e tariffa del driver al posto di ore e tariffa oraria."},{"id":"f-munit-medio","area":"c14","n":"Margine unitario medio di budget","f":"Margine unitario medio di budget = margine di budget / quantità totale di budget","s":"Il margine di una unità di budget, con il mix di budget.","q":"Per separare l'effetto quantità dall'effetto mix.","ex":"Marzo: 90.000 / 1.800 = 50,00 euro."},{"id":"f-eff-quantita","area":"c14","n":"Effetto quantità","f":"Effetto quantità = (quantità totale effettiva - quantità totale di budget) × margine unitario medio di budget","s":"Margine portato dalla variazione della quantità totale venduta, con il mix di budget.","q":"Nel ponte del margine, insieme all'effetto mix.","ex":"Marzo: (1.870 - 1.800) × 50,00 = 3.500 euro."},{"id":"f-eff-mix","area":"c14","n":"Effetto mix","f":"Effetto mix = somma per linea di (quantità effettiva della linea - quantità totale effettiva × quota di budget della linea) × margine unitario di budget della linea","s":"Margine portato dalla diversa composizione delle vendite, a parità di quantità totale.","q":"Nel ponte del margine, quando le linee hanno margini unitari diversi.","ex":"Marzo: 600 × 63 + 1.100 × 42 + 170 × 51 = 92.670 euro; 92.670 - 1.870 × 50,00 = 92.670 - 93.500 = -830 euro."},{"id":"f-ponte-margine","area":"c14","n":"Effetto prezzo ed effetto costo variabile nel ponte del margine","f":"Nel ponte del margine: effetto prezzo = somma per linea di (prezzo netto consuntivo - prezzo netto di budget) × quantità consuntiva; effetto costo variabile = somma per linea di (costo variabile unitario di budget - costo variabile unitario consuntivo) × quantità consuntiva, scritto budget meno consuntivo perché nel ponte ogni effetto è un impatto sul margine","s":"Separano nel ponte l’effetto dei prezzi netti e quello dei costi variabili unitari, entrambi come impatto sul margine.","q":"Nel ponte del margine fra budget e consuntivo.","ex":"Marzo: (114 - 118) × 1.100 unità della linea B = -4.400 euro; costi variabili unitari invariati: effetto 0."},{"id":"f-diff","area":"c15","n":"Risultato differenziale","f":"Risultato differenziale = ricavi differenziali - costi differenziali","s":"Effetto economico della scelta.","q":"Ordini aggiuntivi e alternative.","ex":"50.000 - 28.000 - 5.000 - 4.000 = +13.000 euro."},{"id":"f-indiff","area":"c15","n":"Punto di indifferenza","f":"Q indifferenza = differenza costi fissi / differenza costi variabili unitari","s":"Volume al quale due alternative costano uguale.","q":"Scelta tra configurazioni con strutture diverse.","ex":"(80.000 - 50.000) / (12 - 8) = 7.500 unità."},{"id":"f-van","area":"c15","n":"Valore Attuale Netto","f":"VAN = somma dei flussi_t / (1 + r)^t","s":"Valore creato oltre il rendimento richiesto.","q":"Decisioni su più periodi.","ex":"Esborso 230.000, risparmi 55.000 per 5 anni, recuperi all'anno 5, r = 8%: VAN circa 23.628 euro."},{"id":"f-mb","area":"c16","n":"Punto di indifferenza Make or Buy","f":"Volume di indifferenza = costi fissi evitabili del Make / (prezzo Buy - costo variabile Make)","s":"Sotto la soglia conviene il Buy, sopra il Make.","q":"Make or Buy con volumi incerti.","ex":"120.000 / (15 - 9) = 20.000 unità."},{"id":"f-costplus","area":"c17","n":"Cost Plus","f":"Prezzo con ricarico = costo × (1 + percentuale di ricarico)","s":"Prezzo a partire dal costo e dal ricarico.","q":"Offerte basate sul costo.","ex":"80 × 1,25 = 100."},{"id":"f-margin","area":"c17","n":"Margine percentuale sul prezzo","f":"Margine percentuale sul prezzo = (prezzo - costo) / prezzo × 100","s":"Margine espresso sul prezzo.","q":"Confronto di offerte.","ex":"(100 - 80) / 100 = 20%."},{"id":"f-costo-obiettivo","area":"c17","n":"Costo obiettivo","f":"Costo obiettivo = prezzo di mercato × (1 - margine obiettivo sul prezzo)","s":"Parte dal prezzo che il mercato accetta e ricava il costo massimo del prodotto.","q":"Prima di avviare un prodotto: se il costo stimato è più alto, si riprogetta.","ex":"100 × (1 - 0,20) = 80 euro."},{"id":"f-pmin","area":"c17","n":"Prezzo minimo con capacità satura","f":"Prezzo minimo con vincolo = costi incrementali + costo opportunità per unità","s":"Soglia che copre anche il margine perso sull'uso alternativo della risorsa.","q":"Offerte in periodi di capacità piena.","ex":"Un ordine che assorbe 1 ora deve coprire costi incrementali + margine generabile in quell'ora."},{"id":"f-sconto","area":"c17","n":"Volume necessario dopo uno sconto","f":"Volume necessario = margine totale obiettivo / nuovo margine unitario","s":"Volume che mantiene il contributo dopo lo sconto.","q":"Prima di approvare uno sconto.","ex":"30.000 / 25 = 1.200 unità (+20%)."},{"id":"f-fattore","area":"c18","n":"Margine per fattore scarso","f":"Margine per fattore scarso = margine unitario / risorsa scarsa per unità","s":"Contributo per unità del vincolo.","q":"Priorità produttive con capacità limitata.","ex":"B: 38 / 0,5 = 76 euro/ora; A: 63 / 1,5 = 42; C: 51 / 3 = 17."},{"id":"f-valcap","area":"c18","n":"Valore della capacità aggiuntiva","f":"Valore di 1 unità di capacità = margine generabile nel miglior impiego ancora disponibile","s":"Quanto vale un'ora in più del vincolo.","q":"Confronto con straordinari, outsourcing, investimenti.","ex":"B (30 euro/ora) già servita: un'ora in più per A vale 20 euro."},{"id":"f-ebitda-margin","area":"c20","n":"EBITDA margin","f":"EBITDA margin = EBITDA / ricavi netti × 100","s":"Risultato prima di ammortamenti, svalutazioni, interessi e imposte per ogni 100 euro di ricavi.","q":"Confronto nel tempo e tra unità omogenee; mensile.","ex":"180.000 / 1.200.000 × 100 = 15,00%."},{"id":"f-ros","area":"c20","n":"ROS","f":"ROS = EBIT / ricavi netti × 100","s":"Redditività operativa dopo ammortamenti e svalutazioni.","q":"Mensile, con ROI e rotazione.","ex":"120.000 / 1.200.000 × 100 = 10,00%."},{"id":"f-rotazione","area":"c20","n":"Rotazione del capitale investito","f":"Rotazione = ricavi netti / capitale investito operativo medio;  capitale medio = (iniziale + finale) / 2","s":"Euro di ricavi per ogni euro medio investito.","q":"Mensile sugli ultimi dodici mesi o trimestrale.","ex":"(580.000 + 620.000) / 2 = 600.000; 1.200.000 / 600.000 = 2,00 volte."},{"id":"f-roi","area":"c20","n":"ROI","f":"ROI = EBIT / capitale investito operativo medio × 100;  controllo: ROI = ROS × rotazione","s":"Rendimento operativo del capitale mediamente investito.","q":"Trimestrale o sugli ultimi dodici mesi.","ex":"120.000 / 600.000 × 100 = 20,00% = 10,00% × 2,00."},{"id":"f-scost-ricavi","area":"c20","n":"Scostamento dei ricavi","f":"Scostamento = ricavi consuntivi - ricavi di budget;  % = scostamento / ricavi di budget × 100","s":"Divario complessivo, da scomporre in prezzo, volume, mix e perimetro.","q":"A ogni chiusura mensile.","ex":"1.150.000 - 1.200.000 = -50.000 euro, -4,17%, sfavorevole."},{"id":"f-scost-costi","area":"c20","n":"Scostamento dei costi operativi","f":"Scostamento = costi consuntivi - costi di riferimento (budget flessibile per i variabili, statico per i fissi);  % = scostamento / costi di riferimento × 100","s":"Un valore positivo è sfavorevole.","q":"A ogni chiusura mensile.","ex":"420.000 - 400.000 = +20.000 euro, +5,00%, sfavorevole."},{"id":"f-scost-risultato","area":"c20","n":"Scostamento dell'EBITDA o del risultato operativo","f":"Scostamento = consuntivo - budget;  % = scostamento / |budget| × 100","s":"Il valore assoluto al denominatore mantiene il segno anche con un budget in perdita.","q":"A ogni chiusura, con il ponte del risultato.","ex":"170.000 - 190.000 = -20.000 euro; -20.000 / 190.000 × 100 = -10,53%."},{"id":"f-wape","area":"c20","n":"WAPE, accuratezza e bias","f":"WAPE = Σ |consuntivo - forecast| / Σ |consuntivo| × 100;  Accuratezza = 100% - WAPE;  Bias = Σ (forecast - consuntivo) / Σ |consuntivo| × 100","s":"Il WAPE misura l'errore, il bias la sua direzione (positivo = sovrastima).","q":"Mensile, per orizzonte di previsione, sul forecast congelato.","ex":"Errori 10, 10, 5 su consuntivi 300: WAPE 8,33%; accuratezza 91,67%; bias +5 / 300 = +1,67%."},{"id":"f-gg-incasso","area":"c20","n":"Giorni medi di incasso","f":"Giorni di incasso = crediti commerciali medi / vendite a credito × giorni del periodo","s":"Tempo medio per trasformare le vendite a credito in incassi.","q":"Mensile, con IVA trattata in modo omogeneo.","ex":"120.000 / 900.000 × 365 = 48,67 giorni."},{"id":"f-gg-giacenza","area":"c20","n":"Giorni medi di giacenza","f":"Giorni di giacenza = rimanenze medie / costo del venduto × giorni del periodo","s":"Tempo medio di immobilizzo nelle scorte.","q":"Mensile, per famiglia e classe di movimento.","ex":"150.000 / 900.000 × 365 = 60,83 giorni."},{"id":"f-gg-pagamento","area":"c20","n":"Giorni medi di pagamento","f":"Giorni di pagamento = debiti commerciali medi / acquisti a credito × giorni del periodo","s":"Finanziamento medio ottenuto dai fornitori.","q":"Mensile; se gli acquisti mancano, proxy dichiarata.","ex":"100.000 / 730.000 × 365 = 50,00 giorni."},{"id":"f-ccc","area":"c20","n":"Ciclo di conversione della cassa","f":"Ciclo = giorni di incasso + giorni di giacenza - giorni di pagamento","s":"Giorni di ciclo operativo da finanziare.","q":"Mensile, con componenti sullo stesso periodo.","ex":"48,67 + 60,83 - 50,00 = 59,50 giorni."},{"id":"f-crescita","area":"c20","n":"Tasso di crescita dei ricavi","f":"Crescita = (ricavi correnti - ricavi del periodo comparabile) / ricavi del periodo comparabile × 100","s":"Variazione dei ricavi rispetto a un periodo realmente comparabile.","q":"Mensile e cumulata dall'inizio dell'anno.","ex":"(1.200.000 - 1.100.000) / 1.100.000 × 100 = 9,09%."},{"id":"f-prezzo-medio","area":"c20","n":"Prezzo medio di vendita","f":"Prezzo medio = ricavi netti delle unità vendute / unità vendute","s":"Ricavo netto medio per unità; risente del mix.","q":"Settimanale o mensile, per segmenti omogenei.","ex":"500.000 / 10.000 = 50 euro per unità."},{"id":"f-inc-sconti","area":"c20","n":"Incidenza degli sconti","f":"Incidenza sconti = sconti commerciali concessi / valore lordo a listino delle vendite × 100","s":"Quota del valore a listino ceduta con gli sconti.","q":"Settimanale o mensile, per venditore e segmento.","ex":"60.000 / 600.000 × 100 = 10,00%."},{"id":"f-utilizzo","area":"c20","n":"Utilizzo della capacità","f":"Utilizzo = ore di capacità utilizzate / ore di capacità pratica disponibile × 100","s":"Quota della capacità pratica effettivamente usata.","q":"Settimanale o mensile.","ex":"1.440 / 1.800 × 100 = 80,00%."},{"id":"f-produttivita","area":"c20","n":"Produttività per ora","f":"Produzione omogenea: unità conformi / ore effettive;  eterogenea: ore standard maturate / ore effettive × 100","s":"Output conforme per ora effettivamente impiegata.","q":"Giornaliera o settimanale.","ex":"4.800 / 1.200 = 4 unità per ora."},{"id":"f-costo-unitario","area":"c20","n":"Costo unitario","f":"Costo unitario = costi compresi nella configurazione / unità equivalenti conformi","s":"Costo medio per unità secondo la configurazione dichiarata.","q":"Mensile, dichiarando la configurazione.","ex":"300.000 / 12.000 = 25 euro."},{"id":"f-non-conformita","area":"c20","n":"Tasso di non conformità e rilavorazione","f":"Non conformità = unità non conformi uniche / unità controllate × 100;  Rilavorazione = unità rilavorate / unità prodotte × 100","s":"Due indicatori distinti: non vanno fusi.","q":"Secondo il processo: giornaliera, settimanale o mensile.","ex":"240 / 12.000 = 2,00%; 180 / 12.000 = 1,50%."},{"id":"f-flusso-operativo","area":"c20","n":"Dal risultato operativo alla cassa","f":"Flusso di cassa operativo = risultato operativo + costi senza pagamento - aumento di crediti e scorte + aumento dei debiti verso fornitori","s":"Quanta parte del risultato diventa cassa operativa.","q":"Con il ciclo di conversione della cassa.","ex":"242.000 + 74.000 - 180.000 + 0 + 0 = 136.000 euro; meno investimenti 74.000 = 62.000 euro."}];var J=["Vero","Falso"],f=(i,e,o,s,t,a,r,d)=>({id:i,area:e,type:o,q:s,o:t,a,e:r,r:d}),Ki=[{"id":"q1-1","area":"c1","type":"mc","q":"Un'impresa acquista materiali per 30.000 euro e ne consuma 20.000 nel periodo. Qual è il costo del periodo?","o":["30.000 euro","20.000 euro","10.000 euro","50.000 euro"],"a":1,"e":"Il costo nasce dal consumo, non dall'acquisto: 20.000 euro sono costo del periodo, 10.000 restano in magazzino come attività.","r":"acquisto"},{"id":"q1-2","area":"c1","type":"vf","q":"Un risultato economico positivo garantisce una cassa positiva.","o":["Vero","Falso"],"a":1,"e":"Falso. Utile e liquidità sono dimensioni diverse: crediti elevati, scorte, investimenti o rimborsi possono assorbire la cassa anche con utile.","r":"utile"},{"id":"q1-3","area":"c1","type":"concetto","q":"Quale dimensione risponde alla domanda «che cosa possiedo e che cosa devo a una data»?","o":["Economica","Finanziaria","Patrimoniale","Analitica"],"a":2,"e":"La dimensione patrimoniale è una fotografia a una data di attività, passività e patrimonio netto.","r":"dim-pat"},{"id":"q1-4","area":"c1","type":"mc","q":"Vendita oggi per 50.000 euro con pagamento a 90 giorni. Che cosa accade oggi?","o":["Nasce un incasso","Nasce un ricavo e un credito verso il cliente","Non accade nulla fino al pagamento","Nasce un costo"],"a":1,"e":"Il ricavo nasce alla cessione del bene; fino all'incasso esiste un credito verso il cliente nello Stato Patrimoniale.","r":"ricavo"},{"id":"q1-5","area":"c1","type":"errore","q":"Quale affermazione è ERRATA?","o":["L'ammortamento è un costo senza pagamento nel periodo","Il pagamento di un debito genera sempre un nuovo costo","Il costo misura valore consumato","Costo e pagamento possono cadere in periodi diversi"],"a":1,"e":"Il pagamento estingue un debito: esce denaro ma non nasce automaticamente un nuovo costo.","r":"pagamento"},{"id":"q1-6","area":"c1","type":"concetto","q":"Dove confluisce l'utile prodotto nel periodo?","o":["Automaticamente nella cassa","Nel patrimonio netto","Nei debiti verso fornitori","Nei costi del periodo successivo"],"a":1,"e":"L'utile aumenta il patrimonio netto, non automaticamente la cassa: la liquidità dipende da incassi, pagamenti, scorte, investimenti e finanziamenti.","r":"sp"},{"id":"q1-7","area":"c2","type":"mc","q":"Qual è la classificazione prevalente dei costi in contabilità generale?","o":["Per destinazione","Per oggetto","Per natura","Per attività"],"a":2,"e":"La contabilità generale organizza i costi prevalentemente per natura: materiali, personale, servizi, ammortamenti.","r":"coge"},{"id":"q1-8","area":"c2","type":"vf","q":"La contabilità analitica può usare valori non presenti nella contabilità generale, come il costo opportunità.","o":["Vero","Falso"],"a":0,"e":"Vero, ma deve mantenere una riconciliazione complessiva con i dati ufficiali, salvo differenze documentate.","r":"coan"},{"id":"q1-9","area":"c1","type":"decisione","q":"Un impianto da 100.000 euro ha vita utile di dieci anni. Come lo tratti nel Conto Economico del primo anno?","o":["100.000 euro di costo nel primo anno","Circa 10.000 euro di ammortamento annuo (esempio semplificato)","Nessun costo finché non si rompe","Solo come pagamento"],"a":1,"e":"L'investimento è una risorsa durevole: il costo economico viene distribuito nel tempo con l'ammortamento. Caricarlo su un solo anno distorce il risultato.","r":"investimento"},{"id":"q1-10","area":"c2","type":"dato","q":"Per decidere se accettare un ordine aggiuntivo con capacità libera, come tratti l'affitto del capannone che non cambia?","o":["Lo includi per intero","Ne allochi una quota sui ricavi","È irrilevante, perché non cambia","Lo raddoppi per prudenza"],"a":2,"e":"Lo stesso costo cambia trattamento con la domanda: per l'ordine aggiuntivo con capacità libera l'affitto non cambia ed è irrilevante.","r":"costo-domanda"},{"id":"q2-1","area":"c3","type":"vf","q":"Un costo diretto è sempre variabile.","o":["Vero","Falso"],"a":1,"e":"Falso. Diretto descrive la riferibilità all'oggetto, variabile il comportamento. Un responsabile dedicato a una commessa è diretto e fisso.","r":"diretti"},{"id":"q2-2","area":"c3","type":"concetto","q":"Energia di un impianto comune che cresce con le ore macchina. Come si classifica rispetto ai prodotti?","o":["Diretto e fisso","Diretto e variabile","Indiretto e variabile","Indiretto e fisso"],"a":2,"e":"È comune a più prodotti (indiretto) e cresce con il driver ore macchina (variabile).","r":"indiretti"},{"id":"q2-3","area":"c3","type":"mc","q":"Quale costo è rilevante per una decisione?","o":["Un costo già sostenuto","Un costo futuro che cambia tra le alternative","Un costo che resta uguale in tutte le alternative","Qualsiasi costo registrato in contabilità"],"a":1,"e":"Rilevante è il costo futuro, differenziale e causato dalla scelta.","r":"rilevanti"},{"id":"q2-4","area":"c15","type":"concetto","q":"Spese di sviluppo di un progetto già sostenute e non recuperabili sono:","o":["Costo opportunità","Costo sommerso","Costo evitabile","Costo incrementale"],"a":1,"e":"Il costo sommerso è già sostenuto e non recuperabile: va escluso dal confronto futuro.","r":"sommersi"},{"id":"q2-5","area":"c15","type":"mc","q":"Se la capacità liberata non ha alcun impiego alternativo, il costo opportunità è:","o":["Pari al costo pieno","Pari al margine medio aziendale","Zero","Sempre positivo"],"a":2,"e":"Il costo opportunità può essere nullo quando la risorsa non ha un impiego alternativo. Non va inventato un valore teorico.","r":"opportunita"},{"id":"q2-6","area":"c3","type":"errore","q":"Quale affermazione è ERRATA?","o":["Un costo può essere corretto in contabilità e irrilevante per la decisione","Il nome del conto determina il comportamento del costo","Una stessa voce appartiene a più classificazioni","La controllabilità cambia nel tempo"],"a":1,"e":"Classificare in base al nome del conto è uno dei tre errori frequenti: decide il processo economico che genera il costo.","r":"errori-class"},{"id":"q2-7","area":"c4","type":"mc","q":"Canone 2.000 euro/mese + 0,40 euro per transazione. Con 10.000 transazioni il costo mensile è:","o":["2.400 euro","4.000 euro","6.000 euro","8.000 euro"],"a":2,"e":"2.000 + 0,40 × 10.000 = 2.000 + 4.000 = 6.000 euro. È un costo misto.","r":"misti"},{"id":"q2-8","area":"c4","type":"concetto","q":"Un supervisore ogni dieci addetti è un esempio di costo:","o":["Variabile","Misto","A gradini","Sommerso"],"a":2,"e":"Il costo resta stabile entro una fascia e aumenta quando si supera la soglia: è un costo a gradini.","r":"gradini"},{"id":"q2-9","area":"c3","type":"vf","q":"Lo standard è una media passiva del passato.","o":["Vero","Falso"],"a":1,"e":"Falso. Lo standard rappresenta quanto una risorsa dovrebbe costare e quanto dovrebbe esserne usato in condizioni definite.","r":"standard"},{"id":"q2-10","area":"c3","type":"dato","q":"Per valutare la performance del responsabile di reparto, quali costi useresti?","o":["Tutti i costi assegnati al centro","Solo i costi controllabili dal responsabile nell'orizzonte osservato","Solo gli ammortamenti","I costi della sede centrale"],"a":1,"e":"La performance va letta sui costi effettivamente governabili: attribuire un costo a un centro non significa che il responsabile possa modificarlo.","r":"controllabili"},{"id":"q2-11","area":"c3","type":"mc","q":"1.000 kg acquistati, 600 kg consumati, 8 euro/kg. Quanto resta in magazzino?","o":["4.800 euro","3.200 euro","8.000 euro","600 euro"],"a":1,"e":"Costo del periodo 600 × 8 = 4.800 euro; restano 400 kg × 8 = 3.200 euro in magazzino.","r":"costo"},{"id":"q3-1","area":"c4","type":"mc","q":"Metodo dei livelli massimo e minimo: 8.000 ore macchina → 34.000 euro; 4.000 ore → 22.000 euro. Qual è la tariffa variabile?","o":["2 euro/ora","3 euro/ora","4,25 euro/ora","5,5 euro/ora"],"a":1,"e":"(34.000 - 22.000) / (8.000 - 4.000) = 12.000 / 4.000 = 3 euro/ora.","r":"high-low"},{"id":"q3-2","area":"c4","type":"mc","q":"Con i dati precedenti (tariffa 3 euro/ora), qual è la quota fissa?","o":["10.000 euro","12.000 euro","22.000 euro","34.000 euro"],"a":0,"e":"Fisso = 34.000 - 3 × 8.000 = 10.000 euro (verifica: 22.000 - 3 × 4.000 = 10.000).","r":"high-low"},{"id":"q3-3","area":"c4","type":"vf","q":"Quando il volume aumenta, il costo fisso unitario diminuisce e questo è una riduzione di spesa.","o":["Vero","Falso"],"a":1,"e":"Falso. Il totale resta uguale: la riduzione del costo unitario è maggiore assorbimento della capacità, non minore spesa.","r":"fissi"},{"id":"q3-4","area":"c4","type":"mc","q":"Struttura 120.000 euro per 12.000 ore disponibili; utilizzo 9.000 ore. Costo della capacità inutilizzata?","o":["9.000 euro","30.000 euro","40.000 euro","90.000 euro"],"a":1,"e":"Tariffa 120.000 / 12.000 = 10 euro/ora; 3.000 ore non utilizzate × 10 = 30.000 euro.","r":"cap-inutilizzata"},{"id":"q3-5","area":"c4","type":"concetto","q":"Qual è il driver più corretto per il costo degli attrezzaggi?","o":["Pezzi prodotti","Numero di lotti o setup","Ricavi","Metri quadrati"],"a":1,"e":"Gli attrezzaggi sono generati dal numero di lotti o setup, non necessariamente dai pezzi prodotti.","r":"driver"},{"id":"q3-6","area":"c4","type":"errore","q":"Quale affermazione è ERRATA?","o":["Una funzione di costo deve dichiarare il proprio intervallo di validità","La relazione storica si può estendere a qualsiasi volume","Oltre la capacità possono servire nuovi turni o impianti","Il periodo influenza la rigidità di un costo"],"a":1,"e":"La relazione non va estesa automaticamente oltre i volumi osservati: oltre l'intervallo di rilevanza il costo cambia livello.","r":"relevant-range"},{"id":"q3-7","area":"c4","type":"mc","q":"Impresa guida: con 24.000 ore richieste e capacità ordinaria di 21.000 ore, quanto costa la capacità esterna a 28 euro/ora?","o":["28.000 euro","58.800 euro","84.000 euro","672.000 euro"],"a":2,"e":"(24.000 - 21.000) × 28 = 3.000 × 28 = 84.000 euro.","r":"funzione"},{"id":"q3-8","area":"c4","type":"mc","q":"6.000 unità × 14 euro + 70.000 euro fissi + 8.000 euro di supervisione oltre 5.000 unità. Costo previsto?","o":["154.000 euro","162.000 euro","84.000 euro","170.000 euro"],"a":1,"e":"84.000 + 70.000 + 8.000 = 162.000 euro. Il gradino si attiva perché 6.000 > 5.000.","r":"previsione"},{"id":"q3-9","area":"c4","type":"dato","q":"Per prevedere il costo di logistica del prossimo anno, quale approccio useresti?","o":["Consuntivo precedente + 5%","Driver (consegne, righe, chilometri) × tariffa + quota fissa + soglie","La media degli ultimi dieci anni","Il costo pieno del prodotto"],"a":1,"e":"Un forecast affidabile parte dalla causa economica del costo, non da una percentuale applicata al consuntivo.","r":"previsione"},{"id":"q3-10","area":"c4","type":"mc","q":"Impresa guida all'80% di attività (19.200 ore macchina). Quante ore interne restano inutilizzate?","o":["0","1.200","1.800","2.800"],"a":2,"e":"21.000 - 19.200 = 1.800 ore interne inutilizzate; la capacità esterna è zero.","r":"soglie"},{"id":"q4-1","area":"c6","type":"mc","q":"Centro da 240.000 euro con 12.000 ore. Un prodotto usa 150 ore. Quanto riceve?","o":["2.000 euro","3.000 euro","20.000 euro","1.600 euro"],"a":1,"e":"Coefficiente 240.000 / 12.000 = 20 euro/ora; 150 × 20 = 3.000 euro.","r":"coefficienti"},{"id":"q4-2","area":"c6","type":"vf","q":"Se l'allocazione quadra, il criterio di distribuzione è economicamente corretto.","o":["Vero","Falso"],"a":1,"e":"Falso. La quadratura conferma che il totale è stato distribuito, non che la base rappresenti il consumo.","r":"quadrature"},{"id":"q4-3","area":"c6","type":"concetto","q":"Materiale tracciato per prodotto: come arriva il costo all'oggetto?","o":["Allocazione","Attribuzione","Ribaltamento","Riconciliazione"],"a":1,"e":"Attribuzione: il costo arriva all'oggetto con una misura osservabile del consumo.","r":"attribuzione"},{"id":"q4-4","area":"c6","type":"mc","q":"Quale base è più rappresentativa per ripartire l'affitto?","o":["Ricavi","Metri quadrati occupati","Numero di dipendenti totale","Valore del prodotto"],"a":1,"e":"L'affitto è causato dallo spazio: i metri quadrati occupati sono la base più rappresentativa.","r":"basi"},{"id":"q4-5","area":"c6","type":"concetto","q":"Quale metodo di ribaltamento ignora gli scambi tra centri ausiliari?","o":["Reciproco","A cascata","Diretto","ABC"],"a":2,"e":"Il metodo diretto trasferisce i costi degli ausiliari soltanto ai centri produttivi.","r":"m-diretto"},{"id":"q4-6","area":"c6","type":"mc","q":"Metodo reciproco: M = 50.000 + 0,20 S; S = 35.000 + 0,25 M. Quanto vale M?","o":["50.000","55.000","60.000","85.000"],"a":2,"e":"Sostituendo: M = 50.000 + 0,20 (35.000 + 0,25 M) = 57.000 + 0,05 M → 0,95 M = 57.000 → M = 60.000; S = 35.000 + 15.000 = 50.000.","r":"m-reciproco"},{"id":"q4-7","area":"c6","type":"errore","q":"Quale affermazione sul metodo a cascata è ERRATA?","o":["L'ordine dei centri può modificare il risultato","Riconosce gli scambi in una sola direzione","Un centro già chiuso continua a ricevere costi","È un compromesso tra semplicità e precisione"],"a":2,"e":"Nel metodo a cascata un centro distribuisce il proprio costo anche agli ausiliari che lo seguono nell'ordine, ma una volta chiuso non riceve più nulla da quelli che vengono dopo.","r":"m-cascata"},{"id":"q4-8","area":"c6","type":"mc","q":"Impresa guida: 120.000 euro su 24.000 ore macchina. La linea A usa 12.000 ore. Quanto riceve?","o":["43.636","60.000","30.000","65.455"],"a":1,"e":"Coefficiente 120.000 / 24.000 = 5 euro/ora (per convenzione le 24.000 ore comprendono le 3.000 di capacità esterna; sulle sole 21.000 ore interne sarebbe 5,71); 12.000 × 5 = 60.000 euro.","r":"basi"},{"id":"q4-9","area":"c5","type":"concetto","q":"Il centro Manutenzione, che fornisce servizi ad altri centri, è un centro:","o":["Produttivo","Ausiliario","Di struttura","Finale"],"a":1,"e":"I centri ausiliari forniscono servizi ad altri centri.","r":"c-ausiliari"},{"id":"q4-10","area":"c6","type":"dato","q":"Per ripartire il costo della gestione ordini, quale dato useresti?","o":["Ricavi","Numero e complessità degli ordini","Unità prodotte","Metri quadrati"],"a":1,"e":"La base più rappresentativa è il numero (e la complessità) degli ordini, perché è la causa dell'attività.","r":"basi"},{"id":"q5-1","area":"c8","type":"mc","q":"Prezzo 100, costo variabile 60. Margine unitario e percentuale?","o":["40 euro e 40%","60 euro e 60%","40 euro e 66,7%","100 euro e 40%"],"a":0,"e":"Margine unitario 100 - 60 = 40 euro; percentuale 40 / 100 = 40%.","r":"mdc"},{"id":"q5-2","area":"c7","type":"mc","q":"Materiali 45, lavoro diretto 25, indiretti produzione 18, commerciale/amministrativo 12. Costo industriale?","o":["70","88","100","82"],"a":1,"e":"Costo primo 45 + 25 = 70; industriale 70 + 18 = 88; complessivo 88 + 12 = 100.","r":"costo-industriale"},{"id":"q5-3","area":"c8","type":"vf","q":"Il margine di contribuzione coincide con l'utile.","o":["Vero","Falso"],"a":1,"e":"Falso. Il margine deve ancora coprire i costi fissi prima di diventare risultato.","r":"mdc"},{"id":"q5-4","area":"c7","type":"decisione","q":"La linea C ha costo pieno 312,75 e prezzo 289, ma margine unitario 51. Che cosa fai?","o":["La elimini subito","Verifichi quali costi scomparirebbero davvero prima di decidere","Aumenti la produzione per abbassare il costo unitario","Ignori il dato"],"a":1,"e":"Un risultato pieno negativo è un segnale da diagnosticare: la perdita nasce soprattutto dalla struttura allocata. Bisogna verificare i costi evitabili.","r":"confronto-fc-dc"},{"id":"q5-5","area":"c8","type":"mc","q":"Margine di contribuzione 200.000, costi fissi specifici 70.000, fissi comuni 90.000. Secondo margine?","o":["130.000","40.000","110.000","200.000"],"a":0,"e":"Secondo margine = 200.000 - 70.000 = 130.000. Sottraendo anche i comuni si arriva al risultato operativo di 40.000.","r":"secondo-margine"},{"id":"q5-6","area":"c8","type":"concetto","q":"Per un ordine aggiuntivo con capacità libera, quale vista è più utile?","o":["Full Costing","Direct Costing","Costo pieno complessivo","Costo economico-tecnico"],"a":1,"e":"Il Direct Costing evidenzia costi e margini incrementali, utili per l'ordine aggiuntivo.","r":"confronto-fc-dc"},{"id":"q5-7","area":"c7","type":"errore","q":"Quale affermazione è ERRATA?","o":["Il costo pieno dipende dal confine scelto","Produrre più del venduto può spostare fissi nelle scorte","Il costo pieno coincide con il costo evitabile","Il Full Costing è sensibile alle basi di allocazione"],"a":2,"e":"Il Full Costing misura assorbimento di risorse, non la variazione futura dei costi causata da una scelta.","r":"full-costing"},{"id":"q5-8","area":"c8","type":"mc","q":"Impresa guida, linea A: prezzo 180, costo variabile 117, 8.000 unità. Margine totale?","o":["504.000","1.440.000","936.000","63.000"],"a":0,"e":"Margine unitario 63 × 8.000 = 504.000 euro. Margine % = 63 / 180 = 35%.","r":"m-totale"},{"id":"q5-9","area":"c7","type":"concetto","q":"Quale configurazione aggiunge al costo complessivo i valori figurativi pertinenti?","o":["Costo primo","Costo industriale","Costo economico-tecnico","Costo standard"],"a":2,"e":"Il costo economico-tecnico = costo complessivo + valori figurativi pertinenti.","r":"config-progressive"},{"id":"q5-10","area":"c8","type":"mc","q":"Cliente Z: ricavi netti 250.000, costi variabili prodotto 145.000, logistica, gestione dei resi e assistenza 32.000. Margine del cliente dopo i costi variabili di servizio?","o":["105.000","73.000","55.000","218.000"],"a":1,"e":"Margine di prodotto 105.000 - costi di servizio 32.000 = 73.000 euro.","r":"margine-cliente"},{"id":"q6-1","area":"c9","type":"mc","q":"Costi fissi 200.000, margine unitario 40. Break-even in unità?","o":["4.000","5.000","8.000","50.000"],"a":1,"e":"200.000 / 40 = 5.000 unità.","r":"bep-unita"},{"id":"q6-2","area":"c9","type":"mc","q":"Costi fissi 200.000, margine percentuale 40%. Fatturato di pareggio?","o":["80.000","280.000","500.000","800.000"],"a":2,"e":"200.000 / 0,40 = 500.000 euro.","r":"bep-fatt"},{"id":"q6-3","area":"c9","type":"mc","q":"Vendite previste 650.000, pareggio 500.000. Margine di sicurezza %?","o":["15,0%","23,1%","30,0%","76,9%"],"a":1,"e":"150.000 / 650.000 = 23,1%.","r":"margine-sicurezza"},{"id":"q6-4","area":"c9","type":"mc","q":"Margine di contribuzione 240.000, risultato operativo 40.000. Leva operativa?","o":["0,17","6","200.000","280.000"],"a":1,"e":"240.000 / 40.000 = 6: un +1% di volume implica circa +6% di risultato, nelle ipotesi.","r":"leva"},{"id":"q6-5","area":"c9","type":"vf","q":"Se il break-even calcolato è 5.714,3 unità, si arrotonda a 5.714.","o":["Vero","Falso"],"a":1,"e":"Falso. Si arrotonda sempre per eccesso: 5.715 unità è la più piccola quantità intera che porta il risultato a zero o sopra.","r":"bep-unita"},{"id":"q6-6","area":"c9","type":"mc","q":"Costi fissi 200.000, utile obiettivo 80.000, margine unitario 40. Volume target?","o":["5.000","6.000","7.000","2.000"],"a":2,"e":"(200.000 + 80.000) / 40 = 7.000 unità.","r":"utile-obiettivo"},{"id":"q6-7","area":"c9","type":"concetto","q":"Se il mix si sposta verso prodotti a basso margine, il fatturato di pareggio:","o":["Diminuisce","Resta uguale","Aumenta","Diventa zero"],"a":2,"e":"Scende il margine percentuale medio e quindi serve più fatturato per coprire gli stessi costi fissi.","r":"bep-fatt"},{"id":"q6-8","area":"c9","type":"mc","q":"Pacchetto: 2 A (margine 40) + 1 B (margine 20); costi fissi 300.000. Quante unità di A al pareggio?","o":["3.000","6.000","7.500","5.000"],"a":1,"e":"Margine pacchetto 100; 300.000 / 100 = 3.000 pacchetti = 6.000 A e 3.000 B.","r":"mix-multi"},{"id":"q6-9","area":"c9","type":"errore","q":"Quale affermazione è ERRATA?","o":["Il break-even è una simulazione condizionata dalle ipotesi","La leva operativa è una proprietà costante dell'impresa","Vicino al pareggio la leva può diventare molto elevata","Pareggio economico e pareggio finanziario sono diversi"],"a":1,"e":"La leva cambia con il livello di attività e con le soglie di capacità.","r":"leva"},{"id":"q6-10","area":"c9","type":"mc","q":"Base: fissi 200.000, margine 40. Se il prezzo aumenta di 5 euro, il nuovo pareggio è:","o":["4.444","4.445","5.715","5.750"],"a":1,"e":"Margine 45: 200.000 / 45 = 4.444,4 → arrotondato per eccesso 4.445 unità.","r":"sensibilita"},{"id":"q7-1","area":"c10","type":"mc","q":"Attrezzaggi 180.000 euro, 600 setup. Prodotto B con 220 setup riceve:","o":["24.000","66.000","90.000","300"],"a":1,"e":"Tariffa 180.000 / 600 = 300 euro/setup; 220 × 300 = 66.000 euro.","r":"cost-driver"},{"id":"q7-2","area":"c10","type":"concetto","q":"Che cosa misura il driver di risorsa?","o":["Quanta attività richiede l'oggetto","Come le risorse vengono assorbite dalle attività","Il prezzo del prodotto","Il margine del cliente"],"a":1,"e":"Il driver di risorsa porta le risorse alle attività; il cost driver porta le attività agli oggetti.","r":"resource-driver"},{"id":"q7-3","area":"c10","type":"vf","q":"Passando dal sistema tradizionale all'ABC il totale dei costi indiretti aumenta.","o":["Vero","Falso"],"a":1,"e":"Falso. Il modello cambia la lettura, non il totale: nell'esempio 86.000 euro si spostano da A a B con totale invariato a 300.000.","r":"abc"},{"id":"q7-4","area":"c10","type":"mc","q":"TDABC: team 360.000 euro, 600.000 minuti di capacità pratica. Costo di un ordine complesso di 20 minuti?","o":["4,80","7,20","12,00","20,00"],"a":2,"e":"360.000 / 600.000 = 0,60 euro/min; 20 × 0,60 = 12 euro.","r":"tdabc"},{"id":"q7-5","area":"c11","type":"concetto","q":"Ridurre il numero di piccoli ordini è un intervento di ABM:","o":["Operativo","Strategico (riduce la domanda di attività)","Di capacità","Contabile"],"a":1,"e":"Ridurre il tempo per ordine agisce sull'efficienza (operativo); ridurre il numero di ordini agisce sulla domanda di attività (strategico).","r":"abm"},{"id":"q7-6","area":"c11","type":"decisione","q":"Un processo libera 2.000 ore ma l'organico resta invariato. Come presenti il beneficio?","o":["Come risparmio monetario pari al costo di 2.000 ore","Come capacità disponibile, non come risparmio monetario","Come ricavo aggiuntivo","Non lo presenti"],"a":1,"e":"La spesa diminuisce solo se le risorse vengono eliminate o rese evitabili; altrimenti il beneficio immediato è capacità liberata.","r":"cap-inutil-abc"},{"id":"q7-7","area":"c11","type":"mc","q":"Tariffe 20 euro/ordine, 30 euro/consegna, 20 euro/ora assistenza. Cliente con 600 ordini, 300 consegne, 250 ore. Costo di servizio?","o":["21.000","26.000","32.000","58.000"],"a":1,"e":"600 × 20 + 300 × 30 + 250 × 20 = 12.000 + 9.000 + 5.000 = 26.000 euro.","r":"cost-to-serve"},{"id":"q7-8","area":"c11","type":"errore","q":"Quale affermazione è ERRATA?","o":["Un'attività «senza valore» è automaticamente eliminabile","La rilavorazione va analizzata risalendo al difetto","Un controllo può essere riprogettato","L'attesa può dipendere da capacità non bilanciata"],"a":0,"e":"«Senza valore» non significa eliminabile: un controllo può essere necessario per la qualità o il rispetto delle specifiche, ma può essere reso più efficiente o sostituito da una prevenzione migliore.","r":"att-senza-valore"},{"id":"q7-9","area":"c10","type":"concetto","q":"Quale tipo di driver misura il tempo impiegato?","o":["Transazione","Durata","Intensità","Volume"],"a":1,"e":"Il driver di durata rileva le differenze di complessità attraverso il tempo impiegato.","r":"drv-durata"},{"id":"q7-10","area":"c10","type":"dato","q":"Canale diretto: 36% dei ricavi, ma 50% degli ordini, 60% delle consegne, 70% delle ore di assistenza. Quale base usi per il costo di servizio?","o":["I ricavi","I driver di attività (ordini, consegne, ore)","Le unità vendute","Il numero di clienti"],"a":1,"e":"Allocare per ricavi avrebbe nascosto la maggiore domanda di attività: con i driver il canale diretto assorbe 333.000 invece di 205.375 euro.","r":"abc-impresa-guida"},{"id":"q20-1","area":"c20","type":"dato","q":"EBIT 120.000 euro; capitale investito operativo 580.000 a inizio periodo e 620.000 a fine periodo. Quanto vale il ROI?","o":["19,35%","20,00%","20,69%","10,00%"],"a":1,"e":"Capitale medio = (580.000 + 620.000) / 2 = 600.000; ROI = 120.000 / 600.000 × 100 = 20,00%. Si usa il capitale medio, non quello di fine periodo.","r":"kpi-redditivita"},{"id":"q20-2","area":"c20","type":"dato","q":"Consuntivi 100, 120, 80; forecast 90, 130, 85. Quanto vale il WAPE?","o":["8,33%","1,67%","91,67%","25,00%"],"a":0,"e":"Errori assoluti 10 + 10 + 5 = 25; WAPE = 25 / 300 × 100 = 8,33%. L'accuratezza è 91,67%, il bias +1,67%.","r":"kpi-forecast"},{"id":"q20-3","area":"c20","type":"vf","q":"Un bias del forecast di +1,67% indica che le previsioni sottostimano il consuntivo.","o":["Vero","Falso"],"a":1,"e":"Falso. Il bias è forecast meno consuntivo: un valore positivo indica sovrastima.","r":"kpi-forecast"},{"id":"q20-4","area":"c20","type":"dato","q":"Giorni di incasso 48,67; giorni di giacenza 60,83; giorni di pagamento 50,00. Ciclo di conversione della cassa?","o":["159,50 giorni","37,84 giorni","109,50 giorni","59,50 giorni"],"a":3,"e":"Ciclo = 48,67 + 60,83 - 50,00 = 59,50 giorni.","r":"kpi-circolante"},{"id":"q20-5","area":"c20","type":"concetto","q":"Un input obbligatorio di un KPI non è riconciliato con la fonte. Come si espone il KPI?","o":["Zero","Con il valore del mese precedente","N/D, indicando la causa","Con una stima non dichiarata"],"a":2,"e":"Se un input obbligatorio manca o non è riconciliato, il KPI è N/D con la causa. Uno zero reale e riconciliato resta zero.","r":"kpi-nd"},{"id":"q20-6","area":"c20","type":"errore","q":"Quale regola comune prima del calcolo è ERRATA?","o":["Per i saldi patrimoniali si usa almeno la media tra inizio e fine periodo","Le differenze tra percentuali si esprimono in punti percentuali","Per i costi uno scostamento positivo è favorevole","Numeratore e denominatore hanno lo stesso perimetro"],"a":2,"e":"Scostamento = consuntivo meno riferimento: per i costi un segno positivo è sfavorevole, per ricavi e risultati è favorevole.","r":"kpi-regole"},{"id":"q20-7","area":"c20","type":"dato","q":"EBITDA consuntivo 170.000 euro, budget 190.000 euro. Scostamento percentuale?","o":["-11,76%","+10,53%","-10,53%","-20,00%"],"a":2,"e":"Scostamento = 170.000 - 190.000 = -20.000; -20.000 / |190.000| × 100 = -10,53%. Il denominatore è il budget, non il consuntivo.","r":"kpi-scostamenti"},{"id":"q20-8","area":"c20","type":"concetto","q":"Quanti indicatori contiene di norma il cruscotto mensile?","o":["Tutti i ventiquattro","Da otto a dodici","Uno per ogni reparto","Al massimo tre"],"a":1,"e":"Il cruscotto non mostra tutti i KPI: la selezione ordinaria va da otto a dodici indicatori; gli altri restano per l'approfondimento.","r":"kpi-cruscotto"},{"id":"q20-9","area":"c20","type":"dato","q":"Impresa guida: risultato operativo 242.000, ammortamento 74.000, crediti aumentati di 180.000, scorte e debiti invariati. Flusso di cassa operativo?","o":["136.000 euro","242.000 euro","316.000 euro","62.000 euro"],"a":0,"e":"242.000 + 74.000 - 180.000 = 136.000 euro. Dopo gli investimenti pari agli ammortamenti restano 62.000 euro.","r":"kpi-cassa"},{"id":"q20-10","area":"c20","type":"mc","q":"Nell'incidenza degli sconti, a quale grandezza si rapportano gli sconti concessi?","o":["Ricavi netti","Margine di contribuzione","Costo del venduto","Valore lordo a listino delle vendite"],"a":3,"e":"Incidenza sconti = sconti / valore lordo a listino × 100. Rapportarli ai ricavi netti è l'errore da evitare.","r":"kpi-commerciali"}];var ti=["Vero","Falso"],z=(i,e,o,s,t,a,r,d)=>({id:i,area:e,type:o,q:s,o:t,a,e:r,r:d}),Ji=[{"id":"q8-1","area":"c13","type":"mc","q":"Vendite 8.000; scorta finale 1.200; scorta iniziale 900. Produzione di budget?","o":["7.700","8.000","8.300","10.100"],"a":2,"e":"Produzione = 8.000 + 1.200 - 900 = 8.300 unità.","r":"b-produzione"},{"id":"q8-2","area":"c13","type":"mc","q":"8.300 unità da produrre con consumo standard di 3 kg. Fabbisogno materiali?","o":["2.767 kg","8.303 kg","24.900 kg","24.000 kg"],"a":2,"e":"8.300 × 3 = 24.900 kg; poi si aggiusta per la politica di scorta materie.","r":"b-materiali"},{"id":"q8-3","area":"c13","type":"mc","q":"8.300 unità con tempo standard di 0,5 ore. Ore necessarie?","o":["4.150","8.300","16.600","4.000"],"a":0,"e":"8.300 × 0,5 = 4.150 ore da confrontare con la capacità disponibile.","r":"b-lavoro"},{"id":"q8-4","area":"c12","type":"vf","q":"Budget e forecast sono sinonimi.","o":["Vero","Falso"],"a":1,"e":"Falso. Il budget resta riferimento di responsabilità; il forecast aggiorna la previsione con le informazioni più recenti.","r":"forecast"},{"id":"q8-5","area":"c12","type":"concetto","q":"Quale approccio giustifica ogni voce a partire dalle attività da svolgere?","o":["Incrementale","Zero Based Budgeting","Driver Based Budgeting","Forecast mobile"],"a":1,"e":"Il budget a base zero (Zero Based Budgeting) giustifica attività e risorse partendo da zero; va applicato selettivamente.","r":"zbb"},{"id":"q8-6","area":"c12","type":"errore","q":"Quale affermazione è ERRATA?","o":["Il budget coordina vendite, produzione, acquisti e cassa","Il budget è il Conto Economico dell'anno precedente più una percentuale","Le scorte sono una scelta economica e finanziaria","Un piano può produrre utile e tensione di cassa"],"a":1,"e":"Il budget non è una percentuale applicata all'anno precedente: è un processo di decisioni coordinate.","r":"finalita-budget"},{"id":"q8-7","area":"c13","type":"mc","q":"Ricavi del mese 300.000; il 40% viene incassato nel mese. Incassi correnti?","o":["300.000","180.000","120.000","40.000"],"a":2,"e":"300.000 × 40% = 120.000 euro. Il resto diventa credito e sarà incassato dopo.","r":"b-cassa"},{"id":"q8-8","area":"c12","type":"dato","q":"Per il budget del costo di gestione ordini in un modello driver based, quali dati usi?","o":["Consuntivo + inflazione","Ordini previsti × costo per ordine, se la relazione è valida","Ricavi × percentuale storica","Nessuno: si stima a occhio"],"a":1,"e":"Il driver based budgeting collega i costi a volumi e driver operativi, rendendo il modello spiegabile.","r":"dbb"},{"id":"q8-9","area":"c13","type":"decisione","q":"Il piano annuale è sostenibile in ore, ma a marzo il fabbisogno supera la capacità ordinaria di 250 ore. Che cosa fai?","o":["Niente: il totale annuo va bene","Verifichi la fattibilità alla granularità mensile e pianifichi la soluzione (capacità esterna, anticipi, scorte)","Riduci il budget vendite annuale","Ignori marzo"],"a":1,"e":"La fattibilità va verificata alla stessa granularità con cui la capacità viene consumata.","r":"dashboard-budget"},{"id":"q8-10","area":"c13","type":"mc","q":"Budget vendite: A 8.000 × 120; B 5.000 × 80. Totale ricavi?","o":["960.000","1.360.000","1.000.000","400.000"],"a":1,"e":"960.000 + 400.000 = 1.360.000 euro.","r":"b-vendite"},{"id":"q9-1","area":"c14","type":"mc","q":"Budget statico 10.000 unità × 6 = 60.000 di materiale. Volume effettivo 11.000, costo effettivo 68.200. Scostamento operativo?","o":["8.200 sfavorevole","2.200 sfavorevole","6.000 sfavorevole","2.200 favorevole"],"a":1,"e":"Budget flessibile 11.000 × 6 = 66.000; 68.200 - 66.000 = 2.200 sfavorevole. Gli altri 6.000 sono effetto volume.","r":"b-flessibile"},{"id":"q9-2","area":"c14","type":"mc","q":"Materiali: P eff 2,75; P std 3,00; Q eff 24.800 kg. Scostamento prezzo?","o":["6.200 favorevole","6.200 sfavorevole","8.400 sfavorevole","74.400"],"a":0,"e":"(2,75 - 3,00) × 24.800 = -6.200: si è pagato meno dello standard, quindi favorevole.","r":"sc-prezzo-mat"},{"id":"q9-3","area":"c14","type":"mc","q":"Q eff 24.800 kg; Q std ammessa 22.000 kg; P std 3. Scostamento impiego?","o":["8.400 sfavorevole","8.400 favorevole","6.200 favorevole","2.800"],"a":0,"e":"(24.800 - 22.000) × 3 = 8.400: si è consumato più dello standard, quindi sfavorevole.","r":"sc-impiego"},{"id":"q9-4","area":"c14","type":"mc","q":"Lavoro: T eff 25; T std 24; ore eff 2.900. Scostamento tariffa?","o":["2.900 sfavorevole","3.600 sfavorevole","2.900 favorevole","150"],"a":0,"e":"(25 - 24) × 2.900 = 2.900 sfavorevole.","r":"sc-tariffa"},{"id":"q9-5","area":"c14","type":"mc","q":"Ore eff 2.900; ore std ammesse 2.750; T std 24. Scostamento efficienza?","o":["3.600 sfavorevole","3.750 sfavorevole","150 sfavorevole","3.600 favorevole"],"a":0,"e":"(2.900 - 2.750) × 24 = 3.600 sfavorevole.","r":"sc-efficienza"},{"id":"q9-6","area":"c14","type":"vf","q":"Un costo inferiore al budget è sempre una buona performance.","o":["Vero","Falso"],"a":1,"e":"Falso. Può derivare da attività non svolte, manutenzione rinviata o posizioni non coperte che compromettono capacità futura.","r":"scostamento"},{"id":"q9-7","area":"c14","type":"errore","q":"Quale affermazione sul ponte del risultato è ERRATA?","o":["La somma delle componenti riconcilia budget e consuntivo","L'ordine di calcolo va definito","Una riga può essere calcolata come residuo per far quadrare","Ogni componente ha una formula esplicita"],"a":2,"e":"Un ponte del risultato è utile solo se nessuna riga è ottenuta come residuo.","r":"bridge"},{"id":"q9-8","area":"c14","type":"concetto","q":"Il fatturato cresce ma il margine peggiora perché si vendono più prodotti a basso margine. Quale effetto è?","o":["Effetto prezzo","Effetto mix","Effetto efficienza","Effetto tariffa"],"a":1,"e":"L'effetto mix misura lo spostamento delle vendite tra prodotti con margini diversi.","r":"eff-mix"},{"id":"q9-9","area":"c14","type":"mc","q":"Ponte del risultato: budget 120.000; volume +25.000; mix -12.000; prezzo -18.000; materiali -9.000; efficienza +6.000; struttura -7.000. Consuntivo?","o":["105.000","120.000","93.000","135.000"],"a":0,"e":"120.000 + 25.000 - 12.000 - 18.000 - 9.000 + 6.000 - 7.000 = 105.000.","r":"bridge"},{"id":"q9-10","area":"c14","type":"mc","q":"Prezzo effettivo inferiore di 0,50 euro al budget su 11.000 unità vendute. Effetto prezzo?","o":["+5.500","-5.500","-5.000","-0,50"],"a":1,"e":"(P eff - P bud) × Q eff = -0,50 × 11.000 = -5.500 euro.","r":"eff-prezzo"},{"id":"q9-11","area":"c14","type":"dato","q":"Nel forecast di chiusura, un beneficio previsto senza un'azione concreta che lo sostenga:","o":["Va inserito per ottimismo","Non deve entrare nel forecast","Va inserito al 50%","Sostituisce il budget"],"a":1,"e":"Un beneficio non supportato da un'azione concreta non deve entrare nel forecast.","r":"fc-chiusura"},{"id":"q10-1","area":"c15","type":"mc","q":"Ordine aggiuntivo: ricavi 50.000; materiali/lavorazioni 28.000; trasporto 5.000; straordinari 4.000. Risultato differenziale?","o":["+13.000","+22.000","+50.000","-13.000"],"a":0,"e":"50.000 - 28.000 - 5.000 - 4.000 = +13.000 euro.","r":"differenziali"},{"id":"q10-2","area":"c15","type":"mc","q":"A: 50.000 fissi + 12/unità; B: 80.000 fissi + 8/unità. Punto di indifferenza?","o":["2.500","6.250","7.500","10.000"],"a":2,"e":"(80.000 - 50.000) / (12 - 8) = 30.000 / 4 = 7.500 unità.","r":"indifferenza"},{"id":"q10-3","area":"c15","type":"decisione","q":"Capacità libera, ordine a prezzo inferiore al costo pieno ma superiore al costo variabile, nessun costo fisso incrementale. Che cosa decidi, in prima analisi economica?","o":["Rifiuti perché sotto il costo pieno","Puoi accettare: genera contributo positivo, verificando effetti su prezzi esistenti e condizioni commerciali","Accetti e lo rendi il nuovo listino","Rifiuti sempre gli ordini speciali"],"a":1,"e":"Con capacità libera il costo pieno può portare a rifiutare attività che contribuirebbero alla struttura. La soglia di breve non deve diventare politica stabile.","r":"ordine-speciale"},{"id":"q10-4","area":"c15","type":"vf","q":"Con capacità satura il costo opportunità entra nel prezzo minimo.","o":["Vero","Falso"],"a":0,"e":"Vero. Accettare l'ordine significa sacrificare un'altra attività o acquistare capacità esterna.","r":"cap-satura"},{"id":"q10-5","area":"c15","type":"mc","q":"Prodotto con margine 120.000 e fissi specifici evitabili 80.000. Se lo elimini, il risultato:","o":["Migliora di 80.000","Peggiora di 40.000","Migliora di 40.000","Non cambia"],"a":1,"e":"Perdi 120.000 di margine e risparmi 80.000: il risultato peggiora di 40.000, salvo altri effetti.","r":"eliminare"},{"id":"q10-6","area":"c15","type":"concetto","q":"Quale verifica NON fa parte della regola dei costi rilevanti?","o":["Il valore riguarda il futuro?","Cambia tra le alternative?","È provocato dalla scelta?","È allocato all'oggetto?"],"a":3,"e":"Le tre verifiche sono tempo, differenza e causalità. L'allocazione non rende un costo rilevante.","r":"d-rilevanti"},{"id":"q10-7","area":"c15","type":"errore","q":"Quale affermazione sul VAN è ERRATA?","o":["Usa flussi differenziali","Gli ammortamenti vanno sommati all'investimento come secondo esborso","Un VAN positivo indica creazione di valore nelle ipotesi","r deve essere coerente con rischio e orizzonte"],"a":1,"e":"Gli ammortamenti non sono flussi di cassa e non vanno sommati all'investimento.","r":"van"},{"id":"q10-8","area":"c15","type":"mc","q":"Impresa guida: eliminare la linea C fa perdere 102.000 di margine e risparmia 84.000 di capacità esterna. Effetto sul risultato?","o":["+18.000","-18.000","-102.000","+84.000"],"a":1,"e":"-102.000 + 84.000 = -18.000: il risultato passa da 242.000 a 224.000.","r":"eliminare"},{"id":"q10-9","area":"c15","type":"concetto","q":"Il TIR è:","o":["Il tasso che rende il VAN pari a zero","Il valore assoluto creato dal progetto","Il costo del capitale","La somma dei flussi"],"a":0,"e":"Il TIR è una percentuale e non misura direttamente il valore assoluto creato.","r":"tir"},{"id":"q10-10","area":"c15","type":"dato","q":"Per decidere se continuare un progetto, come tratti le spese già sostenute e non recuperabili?","o":["Le includi per non sprecarle","Le escludi: sono costi sommersi","Le ripartisci sugli anni futuri","Le sottrai dai ricavi futuri"],"a":1,"e":"Si usano solo flussi futuri differenziali. Continuare per giustificare il passato può distruggere valore.","r":"sunk"},{"id":"q11-1","area":"c16","type":"mc","q":"Make rilevante 140.000; Buy: prezzo 140.000 + trasporto e controlli 8.000. Quale costa meno?","o":["Buy di 8.000","Make di 8.000","Sono uguali","Buy di 140.000"],"a":1,"e":"Buy rilevante 148.000 contro Make 140.000: il Make costa 8.000 in meno, salvo costo opportunità della capacità.","r":"buy"},{"id":"q11-2","area":"c16","type":"mc","q":"Make: 120.000 fissi + 9/unità; Buy: 15/unità. Punto di indifferenza?","o":["8.000","13.333","20.000","24.000"],"a":2,"e":"120.000 / (15 - 9) = 20.000 unità. Sotto conviene il Buy, sopra il Make.","r":"mb-indifferenza"},{"id":"q11-3","area":"c16","type":"vf","q":"Nel Make or Buy il prezzo del fornitore si confronta con il costo pieno interno.","o":["Vero","Falso"],"a":1,"e":"Falso. Si confronta con il costo rilevante del Make (costi evitabili e incrementali), non con il costo pieno.","r":"make"},{"id":"q11-4","area":"c16","type":"errore","q":"Quale voce NON va inclusa nel costo rilevante del Make?","o":["Materiali","Lavoro realmente evitabile","Ammortamento di impianti già acquistati","Energia legata al volume"],"a":2,"e":"Gli ammortamenti di impianti già acquistati e i costi comuni che restano vanno esclusi.","r":"make"},{"id":"q11-5","area":"c16","type":"decisione","q":"Il Buy costa 8.000 euro in più, ma la capacità liberata può generare 12.000 euro di margine alternativo reale. Che cosa indica l'analisi economica?","o":["Make, perché costa meno","Buy, perché il margine alternativo (12.000) supera il maggior costo (8.000)","Indifferente","Nessuna delle due"],"a":1,"e":"Il Buy diventa conveniente se la capacità liberata genera più di 8.000 euro di margine alternativo reale; poi vanno valutati qualità, rischio e reversibilità.","r":"cap-liberata"},{"id":"q11-6","area":"c16","type":"concetto","q":"Scorte parallele, doppia gestione, trasferimento dati e penali sono:","o":["Costi sommersi","Costi di transizione","Costi comuni","Costi standard"],"a":1,"e":"Sono costi di transizione, da collocare nei mesi in cui avvengono.","r":"transizione"},{"id":"q11-7","area":"c16","type":"mc","q":"Impresa guida: turno aggiuntivo = 36.000 fissi evitabili + 14 euro × 3.000 ore. Costo del Make?","o":["42.000","78.000","84.000","36.000"],"a":1,"e":"36.000 + 42.000 = 78.000 euro, pari a 26 euro/ora.","r":"mb-caso"},{"id":"q11-8","area":"c16","type":"dato","q":"Quale dato serve per stabilire se il personale interno è un risparmio del Buy?","o":["Il costo pieno del reparto","Se il personale si riduce, si rialloca su attività a margine o resta senza impiego","Il fatturato aziendale","Il prezzo del fornitore"],"a":1,"e":"Se resta comunque non è un risparmio; se si rialloca può nascere un costo opportunità.","r":"mb-evitabili"},{"id":"q11-9","area":"c16","type":"vf","q":"Il Make or Buy è sempre una scelta binaria.","o":["Vero","Falso"],"a":1,"e":"Falso. Sono possibili soluzioni intermedie: doppia fonte, quota interna e quota esterna, esternalizzazione dei picchi, contratto pilota.","r":"dipendenza"},{"id":"q11-10","area":"c16","type":"mc","q":"Impresa guida: perché rinunciare a 1.000 unità di C è meglio che comprare ore?","o":["Perché C ha margine unitario negativo","Perché C rende 17 euro/ora e la capacità aggiuntiva costa 26-28 euro/ora","Perché C non ha domanda","Perché il Buy è vietato"],"a":1,"e":"Il margine per ora di C (51 / 3 = 17) è inferiore al costo della capacità aggiuntiva.","r":"mb-caso"},{"id":"q12-1","area":"c17","type":"mc","q":"Costo 80, ricarico sul costo 25%. Prezzo e margine sul prezzo?","o":["Prezzo 100, margine 25%","Prezzo 100, margine 20%","Prezzo 105, margine 25%","Prezzo 106,67, margine 25%"],"a":1,"e":"Prezzo = 80 × 1,25 = 100; margine sul prezzo = 20 / 100 = 20%, non 25%.","r":"markup"},{"id":"q12-2","area":"c17","type":"mc","q":"Prezzo 100, costo variabile 70. Sconto del 5%. Di quanto scende il margine unitario in percentuale?","o":["5%","7,1%","16,7%","25%"],"a":2,"e":"Margine da 30 a 25: -5 / 30 = -16,7%.","r":"sconti"},{"id":"q12-3","area":"c17","type":"mc","q":"Base 1.000 unità × 30 di margine. Dopo uno sconto il margine è 25. Volume per mantenere lo stesso margine totale?","o":["1.050","1.200","1.250","1.500"],"a":1,"e":"30.000 / 25 = 1.200 unità, cioè +20% di volume.","r":"sconti"},{"id":"q12-4","area":"c17","type":"concetto","q":"Quale approccio parte dai prezzi dei concorrenti?","o":["Cost Based","Market Based","Value Based","Cost Plus"],"a":1,"e":"Market Based Pricing; il rischio è copiare strutture economiche diverse.","r":"mbp"},{"id":"q12-5","area":"c17","type":"mc","q":"Listino 120; sconto 12; premio fine anno 4; resi/rettifiche 1. Ricavo netto unitario?","o":["103","100","108","117"],"a":0,"e":"120 - 12 - 4 - 1 = 103. Togliendo anche il trasporto incluso (3) si ottiene il prezzo netto realizzato di 100.","r":"waterfall"},{"id":"q12-6","area":"c17","type":"errore","q":"Quale affermazione è ERRATA?","o":["Nel breve, con capacità libera, i fissi esistenti non determinano la soglia minima","Il prezzo minimo tattico può diventare politica stabile senza rischi","Con capacità satura il prezzo minimo include il costo opportunità","Nel lungo periodo il prezzo deve sostenere la struttura"],"a":1,"e":"Un prezzo accettabile nel breve può essere distruttivo se diventa la nuova normalità.","r":"prezzo-minimo"},{"id":"q12-7","area":"c17","type":"mc","q":"Linea B: prezzo 114, costo variabile 76. Ricarico sul costo variabile?","o":["33,3%","38%","50%","66,7%"],"a":2,"e":"(114 - 76) / 76 = 38 / 76 = 50%. Il margine sul prezzo è invece 33,3%.","r":"markup"},{"id":"q12-8","area":"c17","type":"dato","q":"Per decidere uno sconto, quali dati servono?","o":["Solo l'effetto sul fatturato","Effetto sul margine, volume aggiuntivo necessario, domanda e capacità","Solo il prezzo dei concorrenti","Solo il costo pieno"],"a":1,"e":"Lo sconto va misurato sul margine; poi si verifica che domanda e capacità sostengano il volume richiesto.","r":"sconti"},{"id":"q12-9","area":"c17","type":"decisione","q":"Linea B: per recuperare lo sconto servono 12.600 unità, ma la domanda massima è 12.000. Conclusione?","o":["Lo sconto si recupera sicuramente","Il volume richiesto supera la domanda: lo sconto non può essere recuperato completamente","Basta aumentare la produzione","Il margine non cambia"],"a":1,"e":"La decisione sullo sconto deve integrare margine, domanda e capacità.","r":"caso-linea-b"},{"id":"q12-10","area":"c17","type":"concetto","q":"Nella price waterfall il trasporto incluso è:","o":["Una riduzione del corrispettivo","Un costo di servizio da non duplicare","Un ricavo","Un premio"],"a":1,"e":"Distinguere riduzioni del ricavo da costi di servizio evita doppi conteggi.","r":"waterfall"},{"id":"q13-1","area":"c18","type":"mc","q":"A: margine 60, 3 ore/unità. B: margine 45, 1,5 ore/unità. Ore macchina limitate: chi ha priorità?","o":["A, perché ha margine unitario più alto","B, perché genera 30 euro/ora contro 20","Indifferente","Nessuno"],"a":1,"e":"A: 60 / 3 = 20 euro/ora; B: 45 / 1,5 = 30 euro/ora.","r":"m-fattore"},{"id":"q13-2","area":"c18","type":"mc","q":"Impresa guida: B margine 38, 0,5 ore/unità. Margine per ora?","o":["19","38","76","114"],"a":2,"e":"38 / 0,5 = 76 euro/ora: B è la prima priorità.","r":"priorita"},{"id":"q13-3","area":"c18","type":"vf","q":"La regola di ordinare per margine per fattore scarso funziona sempre, anche con più vincoli.","o":["Vero","Falso"],"a":1,"e":"Falso. Vale finché esiste un solo vincolo principale e le relazioni sono lineari; con più vincoli ordinare su un solo rapporto può non trovare il mix migliore.","r":"vincoli-multipli"},{"id":"q13-4","area":"c18","type":"mc","q":"B (30 euro/ora) è già servita completamente; la capacità aggiuntiva può andare solo ad A (20 euro/ora). Valore di un'ora in più?","o":["30","20","25","50"],"a":1,"e":"Il valore della capacità è il margine nel miglior impiego ancora disponibile: 20 euro/ora.","r":"valore-capacita"},{"id":"q13-5","area":"c18","type":"mc","q":"Impresa guida: mix B 12.000, A 8.000, C 1.000 con 21.000 ore. Margine totale?","o":["1.062.000","1.011.000","960.000","834.000"],"a":1,"e":"456.000 + 504.000 + 51.000 = 1.011.000; con struttura 736.000 il risultato è 275.000.","r":"mix"},{"id":"q13-6","area":"c18","type":"errore","q":"Programmazione lineare: il mix 1.000 A + 4.000 B con vincolo lavoro 1 A + 2 B ≤ 7.500. Quale affermazione è ERRATA?","o":["Il mix usa 9.000 ore di lavoro","Il mix è ammissibile","Il mix viola il vincolo lavoro","Un criterio su un solo vincolo può fallire"],"a":1,"e":"1.000 + 2 × 4.000 = 9.000 ore di lavoro > 7.500: il mix non è ammissibile.","r":"prog-lineare"},{"id":"q13-7","area":"c18","type":"concetto","q":"Quale delle seguenti NON è tipicamente un fattore scarso?","o":["Ore macchina","Lavoro specialistico","Spazio","Un costo sommerso"],"a":3,"e":"Il vincolo può essere macchina, lavoro specialistico, materia, spazio, capitale o domanda; un costo sommerso non limita il sistema.","r":"fattore-scarso"},{"id":"q13-8","area":"c18","type":"decisione","q":"Il commerciale vuole servire tutta la domanda di C togliendo ore alla linea A. Che cosa mostri alla direzione?","o":["Niente, è una scelta commerciale","Il costo della deviazione: il risultato scende da 275.000 a 200.000 (-75.000)","Che C ha il margine unitario più alto","Che il costo è zero"],"a":1,"e":"Quantificare la deviazione dal mix ottimo rende trasparente il costo della scelta commerciale.","r":"scenari-mix"},{"id":"q13-9","area":"c18","type":"mc","q":"Ordinando per margine unitario (A, C, B) nell'impresa guida il risultato sarebbe:","o":["275.000","242.000","200.000","98.000"],"a":3,"e":"Mix per margine unitario: A 8.000, C 2.000, B 6.000: margine 834.000, risultato 98.000.","r":"scenari-mix"},{"id":"q14-1","area":"c19","type":"vf","q":"Un output generato dall'IA che appare plausibile può essere considerato controllato.","o":["Vero","Falso"],"a":1,"e":"Falso. Un output plausibile non è automaticamente un output controllato.","r":"ia-aiuto"},{"id":"q14-2","area":"c19","type":"concetto","q":"Quale attività resta responsabilità professionale del controller?","o":["Scrivere bozze di formule","Aggregare estrazioni","Decidere driver, basi di allocazione e costi rilevanti","Formattare prospetti"],"a":2,"e":"Le scelte su driver, rilevanza e riconciliazione non possono essere delegate ciecamente.","r":"ia-responsabilita"},{"id":"q14-3","area":"c19","type":"mc","q":"Nell'output compare una percentuale che nel file non esiste. Che tipo di errore è?","o":["Invenzione","Omissione","Classificazione errata","Falsa sicurezza"],"a":0,"e":"È un'invenzione: il controllo è risalire a riga e colonna e vietare dati aggiunti.","r":"ia-rischi"},{"id":"q14-4","area":"c19","type":"mc","q":"Con un esito FAIL critico nel protocollo di controllo, che cosa si fa?","o":["Si pubblica con una nota","Si arrotonda la differenza","Si arresta il lavoro e si consegna il registro delle eccezioni","Si chiede una stima"],"a":2,"e":"Con FAIL critico il lavoro si arresta: non si presenta un risultato parziale come completo.","r":"ia-arresto"},{"id":"q14-5","area":"c19","type":"errore","q":"Quale regola sul dataset è ERRATA?","o":["Una riga di intestazione e una riga per movimento","Nessuna cella unita","Inserire totali intermedi dentro il dataset","Date uniformi"],"a":2,"e":"Nessun totale intermedio o nota dentro il dataset: i totali servono come controllo separato.","r":"ia-dati"},{"id":"q14-6","area":"c19","type":"vf","q":"Se il modello quadra con la contabilità, formule e mapping sono sicuramente corretti.","o":["Vero","Falso"],"a":1,"e":"Falso. La quadratura è necessaria ma non sufficiente: un modello può quadrare e usare un mapping o una formula economicamente sbagliata.","r":"ia-quadrature"},{"id":"q14-7","area":"c19","type":"dato","q":"Righe in ingresso 10.000, righe elaborate 9.850. Quale controllo individua il problema?","o":["Conteggio righe ingresso/uscita + importo escluso","Campione ragionato","Nessuno","Rileggere il commento"],"a":0,"e":"È un'omissione: si controlla con il conteggio delle righe e dell'importo escluso.","r":"ia-rischi"},{"id":"q14-8","area":"c19","type":"concetto","q":"Chi riscrive e approva il commento gestionale prima della pubblicazione?","o":["Lo strumento di IA","Il controller","Il fornitore del software","Nessuno"],"a":1,"e":"La bozza generata non è il documento finale: il controller la riscrive e la approva.","r":"ia-validazione"},{"id":"q14-9","area":"c19","type":"mc","q":"Che cosa deve contenere una richiesta professionale a uno strumento di IA?","o":["Solo la domanda","Solo il file","Solo il formato di output","Ruolo, decisione, dati, regole, formule autorizzate, output, controlli, eccezioni e condizioni di arresto"],"a":3,"e":"Una richiesta incompleta delega allo strumento decisioni implicite su dati, formule e perimetro.","r":"ia-mandato"}];var q=(i,e,o,s,t,a)=>({id:i,area:e,s:o,ok:s,e:t,r:a}),mi=[{"id":"e1","area":"c3","s":"Un costo diretto è sempre variabile.","ok":false,"e":"Diretto e variabile descrivono due aspetti diversi del costo: la riferibilità all'oggetto e il comportamento rispetto all'attività. Un responsabile dedicato a una commessa è diretto e fisso.","r":"diretti"},{"id":"e2","area":"c15","s":"Se un prodotto ha un costo pieno superiore al prezzo deve essere sempre eliminato.","ok":false,"e":"Prima bisogna verificare margine di contribuzione, costi evitabili e costi che rimarranno anche eliminando il prodotto. Nell'impresa guida eliminare C peggiora il risultato di 18.000 euro.","r":"eliminare"},{"id":"e3","area":"c3","s":"Un costo indiretto è sempre fisso.","ok":false,"e":"L'ener
