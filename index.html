argine.","Forma tipica: Cost Plus.","Rischio: ignora valore percepito e prezzi di mercato."],"az":"Per prodotti su commessa o senza riferimenti di mercato."},{"id":"mbp","t":"Market Based Pricing","what":"Prezzo costruito sui prezzi e sul posizionamento dei concorrenti.","why":"Tiene conto delle alternative del cliente.","how":["Punto di partenza: prezzi e posizionamento dei concorrenti.","Va verificato con i propri costi e margini.","Rischio: copia strutture economiche diverse."],"az":"In mercati con prezzi di riferimento visibili."},{"id":"vbp","t":"Value Based Pricing","what":"Prezzo costruito sul valore economico e operativo per il cliente.","why":"Il valore può derivare da risparmio di tempo, minore rischio, aumento ricavi, continuità, qualità o semplicità.","how":["Usare segmentazione, interviste, risultati pilota, dati di utilizzo e costo dell'alternativa.","Evitare affermazioni generiche sul valore senza evidenze.","Collegare valore per il cliente, disponibilità a pagare e costo di servizio."],"nc":"Il valore percepito non sostituisce il controllo economico.","az":"Per servizi con benefici misurabili per il cliente."},{"id":"cost-plus","t":"Cost Plus","what":"Prezzo con ricarico = costo × (1 + percentuale di ricarico).","why":"È la forma tipica di Cost Based Pricing: costo più ricarico.","how":["Prezzo con ricarico = costo × (1 + percentuale di ricarico).","La base di costo va dichiarata.","Confondere ricarico sul costo e margine sul prezzo porta a prezzi inferiori all'obiettivo."],"ex":"Costo 80, ricarico sul costo 25%: prezzo 100.","az":"Nella costruzione rapida di un'offerta."},{"id":"markup","t":"Ricarico sul costo (markup)","what":"Percentuale calcolata sulla base di costo.","why":"Serve a passare dal costo al prezzo.","how":["Ricarico sul costo = (prezzo - costo) / costo.","Prezzo con ricarico = costo × (1 + percentuale di ricarico).","Denominatore: il costo."],"ex":"Impresa guida, linea B: (114 - 76) / 76 = 50% sul costo variabile.","nc":"Un ricarico sul costo del 25% corrisponde a un margine sul prezzo del 20%, non del 25%.","az":"Quando i commerciali parlano di «ricarico»."},{"id":"margin","t":"Margine sul prezzo (margin)","what":"Margine espresso come percentuale del prezzo di vendita.","why":"Mostra quanto del prezzo resta dopo il costo.","how":["Margine percentuale sul prezzo = (prezzo - costo) / prezzo × 100.","Denominatore: il prezzo.","A parità di prezzo e costo è sempre inferiore al ricarico sul costo."],"ex":"Costo 80, prezzo 100: margine sul prezzo 20%. Linea B: 38 / 114 = 33,3%.","az":"Quando confronti la redditività di offerte."},{"id":"prezzo-minimo","t":"Prezzo minimo","what":"Soglia sotto la quale un'offerta non soddisfa il criterio economico definito; varia con capacità, orizzonte e costi rilevanti.","why":"Distingue un prezzo tattico accettabile da uno che distrugge valore.","how":["Capacità libera: costi incrementali ed effetti specifici dell'ordine.","Capacità satura: costi incrementali + costo opportunità per unità.","Una soglia di breve non deve diventare politica stabile."],"ex":"Un ordine che assorbe 1 ora deve coprire i costi incrementali più il margine generabile nell'uso alternativo di quell'ora.","nc":"Un prezzo accettabile nel breve può essere distruttivo se diventa la nuova normalità.","az":"Nelle trattative con richiesta di forte sconto."},{"id":"sconti","t":"Sconti","what":"Riduzioni del prezzo che erodono il margine più del fatturato.","why":"Uno sconto «piccolo» sul prezzo può essere grande sul margine.","how":["Misurare lo sconto sul margine, non solo sul fatturato.","Volume necessario = margine totale obiettivo / nuovo margine unitario.","Verificare che domanda e capacità sostengano il volume richiesto."],"ex":"Prezzo 100, costo variabile 70, margine 30; sconto 5%: margine 25 (-16,7%). Per mantenere 30.000 euro servono 1.200 unità invece di 1.000 (+20%).","az":"Prima di approvare qualsiasi sconto."},{"id":"prezzo-netto","t":"Prezzo netto","what":"Il prezzo dopo sconti, premi e rettifiche sul corrispettivo, cioè il ricavo netto unitario prima dei costi di servizio; il prezzo netto realizzato sottrae anche questi.","why":"È il prezzo che determina davvero il margine realizzato.","how":["Ricavo netto unitario: listino meno riduzioni contrattuali.","Prezzo netto realizzato: valore dopo i costi di servizio considerati.","Prezzo fatturato e margine realizzato possono divergere per mix, resi, servizio e tempi di incasso."],"ex":"Impresa guida, linea B: listino 120, prezzo netto 114, cioè ricavo netto unitario prima dei costi di servizio. I 6 euro di differenza: sconto commerciale 4,00, premio di fine anno 1,20, altre concessioni sul corrispettivo 0,80.","az":"Nella redditività per cliente."},{"id":"waterfall","t":"Price waterfall","what":"La cascata dal prezzo di listino al prezzo netto realizzato.","why":"Distinguere riduzioni del ricavo da costi di servizio evita doppi conteggi.","how":["Listino 120 - sconto commerciale 12 - premio fine anno 4 - resi/rettifiche 1 = ricavo netto 103.","- trasporto incluso 3 (costo di servizio, da non duplicare) = prezzo netto realizzato 100.","Permette di ricostruire la redditività per cliente."],"az":"Quando il margine realizzato è inferiore a quello previsto."},{"id":"pricing-capacita","t":"Capacità nel pricing","what":"La disponibilità di capacità cambia la soglia minima di prezzo.","why":"Con capacità satura la nuova vendita consuma una risorsa che avrebbe generato altro margine.","how":["Capacità libera: prezzo minimo sui costi incrementali.","Capacità satura: si aggiunge il costo opportunità.","Linea B: il volume necessario dopo lo sconto va verificato anche sulle ore richieste (0,5 ore/unità)."],"az":"Nelle offerte durante i periodi di picco."},{"id":"pricing-opportunita","t":"Costo opportunità nel pricing","what":"Margine perso sull'attività sostituita oppure costo della capacità alternativa.","why":"Trasforma la capacità da vincolo operativo a componente economica del prezzo.","how":["Prezzo minimo con vincolo = costi incrementali + costo opportunità per unità.","La risorsa scarsa deve essere misurata.","La migliore alternativa sacrificata deve essere reale."],"az":"Nel calcolo del prezzo minimo con capacità piena."},{"id":"caso-linea-b","t":"Sconto, margine e capacità: linea B","what":"Impresa guida: listino 120, prezzo netto 114, costo variabile 76, prezzo di budget 118, 0,5 ore/unità.","why":"Mostra che il fatturato da solo non descrive l'effetto economico dello sconto.","how":["Margine unitario 38 (33,3% sul prezzo; ricarico sul costo variabile 50%).","Prezzo -3,4% rispetto al budget, ma margine unitario -9,5% (42 → 38).","Per mantenere 478.800 euro di margine servono 12.600 unità: oltre la domanda massima di 12.000."],"az":"Quando si valuta una politica di sconti su una linea."},{"id":"governance-pricing","t":"Governance e segmentazione dei prezzi","what":"Regole su listini, segmenti, autonomie, soglie, motivazioni e approvazioni degli sconti.","why":"Senza governance la deroga ripetuta diventa il nuovo prezzo senza decisione esplicita.","how":["Controlli: offerta, approvazione, ordine, esecuzione, consuntivo, rinnovo.","Indicatori: variazione prezzo, dispersione sconti, margine per segmento, percentuale deroghe.","Le eccezioni devono avere motivazione e durata."],"az":"Nella definizione delle politiche commerciali."},{"id":"target-costing","t":"Target costing","what":"Il percorso inverso del cost plus: parte dal prezzo che il mercato accetta, toglie il margine obiettivo e ottiene il costo massimo ammissibile.","why":"Il costo obiettivo diventa il vincolo per progettazione, acquisti e processo.","how":["Costo obiettivo = prezzo di mercato × (1 - margine obiettivo sul prezzo).","Se il costo stimato supera il costo obiettivo, la differenza non si recupera alzando il prezzo: il mercato non lo accetta.","Si riprogetta prodotto, fornitura o processo prima di avviare la produzione, oppure si rinuncia al prodotto."],"ex":"Prezzo di mercato 100 euro, margine obiettivo 20% sul prezzo: costo obiettivo 100 × (1 - 0,20) = 80 euro.","az":"Quando progetti un prodotto per un mercato che ha già un prezzo."},{"id":"prezzo-minimo-linee","t":"Prezzo minimo delle tre linee","what":"Impresa guida: prezzo minimo per unità con capacità libera, con ore tolte alla linea C e con ore esterne a 28 euro.","why":"Le ore non bastano: un'ora ceduta a un ordine aggiuntivo si toglie alla linea C, che rende 51 euro ogni 3 ore, cioè 17 euro per ora.","how":["Capacità libera (costo variabile): A 117; B 76; C 238 euro.","Ore tolte alla linea C: A 117 + 1,5 × 17 = 142,50; B 76 + 0,5 × 17 = 84,50; C 238 + 3 × 17 = 289 euro.","Ore esterne a 28 euro: A 117 + 1,5 × 28 = 159; B 76 + 0,5 × 28 = 90; C 238 + 3 × 28 = 322 euro.","Per un ordine aggiuntivo si aggiungono i costi di servizio che crescono davvero, per esempio 23 euro di trasporto per consegna, non la tariffa piena di 30 euro."],"ex":"Per giustificare le ore comprate a 28 euro il prezzo netto di C dovrebbe salire da 289 a 322 euro (+11,4%), sopra il listino di 305.","nc":"Se 322 euro sia sostenibile non lo dice il costo: dipende dal valore per i clienti, dalle loro alternative e dalla domanda.","az":"Quando valuti un ordine aggiuntivo con il reparto saturo."}]},{"id":"c18","n":18,"title":"Ottimizzazione dei margini","full":"Ottimizzazione dei margini e alternative produttive","intro":"Individuare la risorsa che limita il sistema nel periodo della decisione.","topics":[{"id":"fattore-scarso","t":"Fattore scarso","what":"Risorsa la cui disponibilità limita produzione o vendite.","why":"In presenza di un vincolo le alternative vanno ordinate per margine per unità del fattore.","how":["Può essere macchina, lavoro specialistico, materia, spazio, capitale o domanda.","Identificare il vero vincolo nel periodo della decisione.","Non ottimizzare una risorsa che non limita il sistema."],"az":"Quando la domanda supera la capacità."},{"id":"capacita-mix","t":"Capacità nel mix","what":"La quantità disponibile della risorsa scarsa nel periodo.","why":"Determina fino a che punto si può servire la domanda.","how":["Impresa guida: capacità ordinaria 21.000 ore; domanda piena 24.000 ore.","Le capacità devono essere coerenti con il periodo.","Dopo la graduatoria verificare domanda massima e altri vincoli."],"az":"Nella pianificazione della produzione."},{"id":"m-fattore","t":"Margine per fattore scarso","what":"Margine unitario diviso per la risorsa scarsa assorbita da ciascuna unità.","why":"Un prodotto con margine unitario più basso può generare più margine per unità del vincolo.","how":["Margine per fattore scarso = margine unitario / risorsa scarsa per unità.","Numeratore: contributo coerente con la decisione.","Denominatore: quantità della risorsa realmente limitante."],"ex":"A: 60 / 3 ore = 20 euro/ora; B: 45 / 1,5 = 30 euro/ora: B ha priorità con ore macchina limitate.","az":"Quando devi scegliere cosa produrre prima."},{"id":"priorita","t":"Priorità produttive","what":"Graduatoria dei prodotti in base al margine per unità del fattore scarso.","why":"Con ore sature la priorità corretta è il margine per ora, non per pezzo.","how":["Impresa guida: B 38/0,5 = 76 euro/ora (1°); A 63/1,5 = 42 (2°); C 51/3 = 17 (3°).","Per margine unitario l'ordine sarebbe A, C, B: completamente diverso.","La graduatoria cambia quando cambia il vincolo."],"az":"Nella programmazione di un periodo saturo."},{"id":"mix","t":"Mix","what":"Combinazione delle quantità di prodotti, servizi, clienti o canali che influenza margine complessivo e utilizzo della capacità.","why":"Il mix giusto massimizza il margine del sistema.","how":["Identifica la risorsa scarsa, calcola il margine per unità, ordina.","Assegna capacità fino alla domanda massima del primo prodotto, poi prosegui.","Verifica vincoli tecnici, commerciali, lotti e contratti."],"ex":"Impresa guida: B 12.000 (6.000 ore), A 8.000 (12.000 ore), C 1.000 (3.000 ore): 21.000 ore, margine 1.011.000, risultato 275.000.","nc":"L'ordinamento per margine per fattore scarso vale con un solo vincolo principale e relazioni lineari; con più vincoli può fallire.","az":"Nel piano di produzione con capacità limitata."},{"id":"valore-capacita","t":"Valore della capacità aggiuntiva","what":"Margine generabile nel miglior impiego ancora disponibile per un'unità in più di capacità.","why":"Va confrontato con straordinari, outsourcing, noleggio o investimento.","how":["Dipende dalla domanda residua e da come la capacità è già assegnata.","Quando la domanda dell'attività migliore è satura, scende al rendimento dell'attività successiva.","Non è costante: cambia se si sposta il vincolo."],"ex":"Se B (30 euro/ora) è già servita completamente, un'ora in più destinabile solo ad A vale 20 euro/ora, non 30.","az":"Quando valuti se comprare ore esterne."},{"id":"scenari-mix","t":"Scenari di mix","what":"Confronto tra il mix ottimo e mix alternativi per quantificare il costo di una deviazione.","why":"Quantificare la deviazione rende trasparente il costo di una scelta commerciale.","how":["Mix per margine/ora: risultato 275.000.","C a 2.000 comprando ore: 242.000 (-33.000).","C a 2.000 togliendo ore ad A: 200.000 (-75.000).","Mix per margine unitario: 98.000."],"az":"Quando il commerciale chiede di servire comunque un cliente."},{"id":"vincoli-multipli","t":"Vincoli multipli","what":"Situazione con due o più risorse limitate che interagiscono.","why":"Ordinare su un solo rapporto può non trovare il mix migliore.","how":["Ore macchina, lavoro specialistico, materiali, domanda e contratti possono interagire.","Serve un modello che consideri tutti i vincoli insieme.","Verificare poi l'operatività: lotti minimi, indivisibilità, sequenze, qualità, rischio."],"az":"Quando più reparti sono contemporaneamente saturi."},{"id":"prog-lineare","t":"Programmazione lineare (introduzione)","what":"Modello di ottimizzazione con variabili decisionali, funzione obiettivo e vincoli.","why":"Trova il mix ottimo quando esistono più vincoli.","how":["Esempio: massimizzare 60 A + 45 B.","Vincoli: 3 A + 1,5 B ≤ 9.000 ore macchina; 1 A + 2 B ≤ 7.500 ore lavoro; A ≤ 2.500; B ≤ 4.000.","Con due variabili l'ottimo si trova in un vertice dell'area ammissibile; nei modelli reali si usa un solver."],"ex":"Il mix 1.000 A + 4.000 B usa 9.000 ore macchina ma 9.000 ore di lavoro: non è ammissibile. Un criterio su un solo vincolo fallisce.","nc":"La qualità dipende dalla correttezza di vincoli e coefficienti, non dalla sofisticazione dell'algoritmo.","az":"Come base per una decisione da spiegare al management."},{"id":"throughput","t":"Throughput e sequenza del vincolo","what":"Throughput: ricavi meno costi totalmente variabili nel breve periodo. La priorità va a chi genera più throughput per unità di vincolo.","why":"Aumentare l'efficienza in un'area che non limita il sistema può produrre scorte senza aumentare l'output complessivo.","how":["Identificare: quale risorsa limita il flusso?","Sfruttare: ridurre fermate e perdite sul vincolo.","Subordinare: allineare il resto del processo.","Elevare: aumentare la capacità se conviene.","Ripetere: verificare dove si è spostato il vincolo."],"ex":"Impresa guida: ogni ora recuperata sul reparto riducendo fermate e perdite vale 17 euro senza esborso; comprarla fuori a 28 euro fa perdere 11 euro per ora.","nc":"Richiede una classificazione rigorosa dei costi realmente variabili.","az":"Quando il vincolo è molto forte."},{"id":"lp-vertici","t":"Mix con due vincoli e prezzo ombra","what":"Nel modello con ore macchina e lavoro specializzato l'ottimo si trova confrontando i vertici dell'area ammissibile.","why":"Ordinare per un solo vincolo alla volta non trova la soluzione migliore.","how":["Solo A alla domanda massima (2.500 A): margine 150.000 euro.","A massimo e ore macchina sature (2.500 A, 1.000 B): 195.000 euro.","Ore macchina e lavoro sature (1.500 A, 3.000 B): 225.000 euro. È l'ottimo.","Solo B con lavoro saturo (3.750 B): 168.750 euro."],"ex":"Prezzo ombra: circa 16,67 euro per un'ora macchina e 10 euro per un'ora di lavoro. Verifica: 9.000 × 50/3 + 7.500 × 10 = 225.000 euro, il margine ottimo.","nc":"I prezzi ombra valgono solo per variazioni limitate della capacità e sono diversi dai 20 o 30 euro calcolati con un solo vincolo.","az":"Quando più risorse sono sature nello stesso periodo."}]},{"id":"c19","n":19,"title":"IA nel controllo di gestione","full":"L'intelligenza artificiale nel controllo di gestione","intro":"Scegliere tra ChatGPT, Claude e Gemini Notebook in base al prodotto finale richiesto.","topics":[{"id":"ia-aiuto","t":"Dove l'IA può aiutare","what":"L'IA può accelerare preparazione dati, modelli, analisi, simulazioni e reporting.","why":"Aumenta la velocità solo se il processo di controllo è definito prima.","how":["Riclassificare e aggregare estrazioni.","Scrivere formule e codice, costruire prospetti e file.","Segnalare anomalie, preparare bozze di commento, simulare scenari.","Lo strumento si sceglie in base all'output atteso; la scelta non è esclusiva."],"nc":"Un output plausibile non è automaticamente un output controllato.","az":"Nelle attività ripetitive del reporting mensile."},{"id":"ia-responsabilita","t":"Cosa resta responsabilità del controller","what":"Perimetro, definizioni, formule, mapping, interpretazione e decisione.","why":"Le scelte su driver, rilevanza dei costi e riconciliazione non possono essere delegate ciecamente.","how":["Definire perimetro, campi e significato economico delle colonne.","Validare formule, segni, unità e intervalli.","Decidere driver, basi di allocazione e costi rilevanti.","Stabilire se un'anomalia è errore, eccezione o fenomeno reale."],"az":"Sempre, prima di portare un numero al management."},{"id":"ia-dati","t":"Qualità dei dati","what":"Il dataset deve essere strutturato e validato prima del calcolo.","why":"La qualità del risultato dipende prima dal dataset e poi dalla richiesta.","how":["Una riga di intestazione, una riga per movimento, colonne tipizzate.","Importi numerici senza simboli, date uniformi, nessuna cella unita, nessun totale dentro il dataset.","Verificare perimetro, chiave univoca, campi, valori mancanti e anomalie."],"nc":"Un report impaginato per una persona non è necessariamente un dataset elaborabile.","az":"Prima di caricare qualsiasi estrazione."},{"id":"ia-controlli","t":"Protocollo universale","what":"Protocollo universale di elaborazione e controllo: sei fasi, da 0 a 5, con esiti PASS, WARN o FAIL definiti prima dell'analisi.","why":"I controlli scritti prima del calcolo sono più efficaci e ripetibili.","how":["Fase 0: validare file, periodo, entità, schema, chiave univoca, tipi, segni, unità, conteggio righe, duplicati, valori mancanti e totali; un errore critico arresta il lavoro.","Fase 1: eseguire il calcolo con formule dichiarate e archiviare codice o formule.","Fase 2: mostrare ogni quadratura come valore A, valore B, differenza, tolleranza ed esito PASS, WARN o FAIL.","Fase 3: provare un caso noto, zero, valore negativo, mancante, duplicato, codice nuovo, data fuori periodo e limiti degli intervalli.","Fase 4: consegnare dati letti ed esclusi, mapping, calcoli, eccezioni, controlli, risultato e ipotesi.","Fase 5: nessun risultato con esito FAIL è pubblicabile o utilizzabile in una decisione.","Il testo del protocollo va incollato in testa alla richiesta o caricato nel progetto: lo strumento non conosce il libro."],"az":"In ogni elaborazione destinata a una decisione."},{"id":"ia-quadrature","t":"Quadrature","what":"Confronto tra il totale calcolato dal modello e una fonte indipendente, con differenza, tolleranza ed esito.","why":"Le differenze non si arrotondano per far quadrare il prospetto.","how":["Valore A: totale del modello. Valore B: fonte ufficiale.","Differenza = A - B, con tolleranza giustificata.","Esito PASS, WARN o FAIL e nota con la causa.","Il valore B viene da fuori (contabilità generale, Conto Economico gestionale approvato): un totale confrontato con la somma dello stesso file non può fallire mai."],"nc":"Una quadratura è necessaria ma non sufficiente: un modello può quadrare e usare una formula sbagliata.","az":"A ogni output generato."},{"id":"ia-riconciliazione","t":"Riconciliazione","what":"Controllo che collega un risultato analitico alla fonte contabile o gestionale, spiegando differenze di perimetro, periodo e classificazione.","why":"È il controllo che decide la pubblicabilità.","how":["Completezza: righe elaborate = righe valide; importi = totale atteso.","Quadratura con la fonte o differenza nominata.","Coerenza interna e campione ragionato su casi ambigui, materiali e nuovi."],"az":"Prima di inserire un numero in un documento per la direzione."},{"id":"ia-validazione","t":"Validazione e revisione umana","what":"Verifica professionale di dati, formule, ipotesi, riconciliazioni e interpretazioni prima che un risultato venga comunicato o utilizzato.","why":"La bozza generata non è il documento finale: la revisione rende visibile il giudizio professionale.","how":["Separare risultato numerico, interpretazione e raccomandazione.","Le cause non supportate dai dati sono ipotesi.","Rendere visibile chi ha validato il risultato e quando."],"az":"Prima di ogni pubblicazione."},{"id":"ia-rischi","t":"Rischi di risultati errati","what":"Quattro errori ricorrenti: invenzione, omissione, classificazione errata, falsa sicurezza.","why":"Senza metodo l'IA aumenta la velocità con cui si produce un errore credibile.","how":["Invenzione: dato inesistente nel file; risalire a riga e colonna.","Omissione: righe non elaborate; contare righe in ingresso e uscita.","Classificazione errata: campione ragionato su voci ambigue.","Falsa sicurezza: elenco esplicito di ipotesi e limiti."],"az":"Nella revisione di qualsiasi output generato."},{"id":"ia-formule","t":"Verificare formule e calcoli","what":"Formule e codice devono essere visibili, riapribili e rieseguibili sugli stessi dati.","why":"Per un numero destinato a una decisione, ripetibilità e tracciabilità valgono più del testo.","how":["Testare almeno un caso noto per ogni famiglia di formule.","Verificare limiti, zero, valori mancanti, duplicati e codici nuovi.","Archiviare input, versione, formule/codice e output insieme.","Nessuna componente si calcola «per differenza»: ciascuna ha la sua formula autorizzata e la somma delle componenti si confronta con il totale."],"nc":"Non accettare un totale «perché sembra corretto».","az":"Quando ricevi un calcolo prodotto con l'IA."},{"id":"ia-mandato","t":"Richiesta come mandato verificabile","what":"Una richiesta professionale specifica ruolo, decisione, dati, regole, formule autorizzate, output, controlli, eccezioni e condizioni di arresto.","why":"Una richiesta incompleta delega allo strumento decisioni implicite su dati, formule e perimetro.","how":["Dichiarare entità, periodo e perimetro del file.","Indicare formule da applicare senza sostituzioni arbitrarie.","Definire quali errori producono FAIL e impediscono il calcolo.","Vietare di aggiungere dati non presenti nel file e chiedere di dichiarare ipotesi e limiti.","Chiedere di scrivere ed eseguire il codice e di mostrarlo insieme al risultato.","Chiedere di separare risultato, interpretazione e raccomandazione."],"az":"Ogni volta che affidi un calcolo a uno strumento di IA."},{"id":"ia-arresto","t":"Regole di arresto","what":"Situazioni in cui il risultato non può essere usato né pubblicato.","why":"La regola di arresto si definisce prima dell'analisi, non si negozia dopo.","how":["Chiave mancante, quadratura non superata o mapping critico irrisolto: FAIL, il calcolo si arresta e si consegna soltanto il registro delle eccezioni.","Quadratura non riuscita: ricercare perimetro, campi, righe e criteri prima di pubblicare.","Dato non presente nel file: eliminarlo e riesaminare le conclusioni.","Esito FAIL: non utilizzare né pubblicare."],"az":"Nel protocollo di ogni processo automatizzato."},{"id":"ia-strumenti","t":"ChatGPT, Claude e Gemini Notebook","what":"Tre strumenti, scelti in base al prodotto finale: modello riutilizzabile, calcolo riproducibile, simulatore o ricostruzione documentale.","why":"Si possono usare insieme, ciascuno per la propria parte: la scelta è di flusso, non un'esclusività tecnica.","how":["ChatGPT: farsi costruire una volta il modello di controllo di gestione su foglio di calcolo e alimentarlo ogni mese; esplorare un'estrazione.","Claude: costruire applicazioni nel browser da usare in riunione, come il simulatore del mix; tenere il contesto stabile in un progetto.","Gemini Notebook: interrogare raccolte selezionate di documenti economico-gestionali, con la citazione del punto.","Altri strumenti: il numero entra in un documento solo se lo strumento mostra formule o codice, lavora sull'intero file e consente la quadratura con un dato esterno."],"nc":"In Gemini Notebook non si fanno i calcoli: i valori estratti si riportano in un foglio che mostri formule e codice.","az":"Prima di scegliere con quale strumento aprire un lavoro."},{"id":"ia-rischi-strumenti","t":"Il rischio da sorvegliare, strumento per strumento","what":"I tre strumenti sbagliano in modo diverso e vanno controllati in modo diverso.","why":"Chi cambia strumento senza cambiare tipo di controllo resta scoperto sull'errore dello strumento che sta usando.","how":["ChatGPT sceglie da solo il metodo di analisi e può non dirlo: il metodo si dichiara nella richiesta.","Claude consegna prospetti completi anche quando ha elaborato solo una parte delle righe: contare sempre le righe in entrata e in uscita.","Gemini Notebook: la citazione dà la sensazione che la verifica sia già fatta; aprire ogni citazione e verificare che la raccolta sia completa.","Le applicazioni si collaudano su numeri noti prima della riunione."],"nc":"I rischi non sono esclusivi: nelle prove dei lavori 10 e 14 anche Claude chiude da solo un punto che la richiesta lasciava aperto.","az":"Ogni volta che si passa da uno strumento all'altro."},{"id":"ia-raccolte","t":"Raccolte documentali e citazioni","what":"In Gemini Notebook si caricano raccolte tematiche di fonti economico-gestionali e si fanno domande circoscritte.","why":"La citazione indica il punto da aprire, ma non dimostra che la frase sia completa, corretta o tratta dalla versione in vigore.","how":["Quattro raccolte stabili: Bilanci e reporting storico; Budget, forecast e decisioni gestionali; Dizionario KPI e serie mensili; Modelli di costo, mapping e chiusura.","Costruire per tema, non per periodo, e caricare i documenti completi di allegati, revisioni e chiarimenti.","Chiedere di trovare, non di sintetizzare, con documento e punto per ogni affermazione.","Aprire la citazione e verificare versione in vigore e funzione della frase: premessa, ipotesi, simulazione o decisione approvata.","Chiedere sempre l'elenco delle domande senza risposta e delle affermazioni senza fonte."],"nc":"Un valore letto in una simulazione non diventa consuntivo solo perché è citato correttamente.","az":"Per ricostruire che cosa è stato deciso, previsto e verificato."},{"id":"ia-collaudo","t":"Collaudare su numeri noti","what":"Un file o un'applicazione si usano solo dopo averli provati su un caso di cui si conosce già la risposta.","why":"Un'applicazione sbagliata si scopre in riunione, quando davanti a chi decide compare un numero diverso da quello calcolato dall'ufficio.","how":["Modello su foglio di calcolo: verificare ogni famiglia di formule, poi incollare un mese chiuso e controllare che riproduca il Conto Economico noto.","Provare apposta codice inesistente, riga duplicata, data fuori periodo, quantità negativa e dato mancante.","Applicazione: riaprirla con i valori iniziali e verificare i risultati attesi, con la formula mostrata accanto a ogni risultato.","Archiviare fuori dalla conversazione il file, il collegamento e la richiesta con cui sono stati costruiti."],"ex":"Simulatore del mix con i valori dell'impresa guida: 8.000 unità di A, 12.000 di B e 1.000 di C, 21.000 ore, margine 1.011.000 euro, risultato operativo 275.000 euro.","nc":"La quadratura del ponte verifica la coerenza aritmetica, non l'integrità del dato: con un codice inesistente il ponte quadra su un numero sbagliato.","az":"Prima del primo utilizzo e prima di ogni riunione."},{"id":"ia-reporting-mensile","t":"Il reporting mensile, fase per fase","what":"Tredici fasi, dall'estrazione dei dati all'archiviazione, ciascuna con strumento, responsabile ed evidenza archiviata.","why":"Un processo di controllo esiste se un'altra persona può rifarlo a distanza di mesi e arrivare allo stesso numero.","how":["Gli strumenti entrano in sette fasi: controlli preliminari, importazione, richiesta, elaborazione, risultato, revisione e archiviazione.","Senza strumenti: origine dei dati, verifica numerica, riconciliazione, decisione e registro del reporting.","La preparazione è intermedia: lo strumento costruisce il modello una volta sola, poi il modello si riusa.","Revisione umana: prima di commentare, cercare che cosa era stato deciso.","La decisione la prende il comitato di direzione su proposta del controllo di gestione."],"ex":"Marzo, impresa guida: le 30 unità in meno della linea C non erano un problema, ma l'esecuzione della riduzione approvata a gennaio con effetto da marzo.","nc":"Lo stesso strumento può eseguire test, ma non è da solo un controllo indipendente: servono una fonte esterna e un riesame umano separato.","az":"A ogni chiusura mensile."},{"id":"ia-non-regge","t":"Quando il risultato non regge","what":"Le situazioni in cui un controllo non passa, con l'azione corretta e la scorciatoia da evitare.","why":"L'errore più costoso è la soluzione rapida che fa sparire il sintomo e lascia in piedi la causa.","how":["Il risultato cambia rifacendo la richiesta: far scrivere il calcolo come codice ed eseguirlo due volte; non scegliere il risultato più convincente.","Le componenti non sommano al totale: rifare la scomposizione con il codice e cercare la doppia imputazione.","Lo strumento dichiara di non poter rispondere: spezzare il lavoro e ricaricare il file in forma semplice; non chiedere una stima al posto del calcolo.","Il risultato contraddice quello che si sapeva: ricalcolare a mano il caso e confrontare i due perimetri.","Un numero è utilizzabile se si sa da dove viene, se quadra con la contabilità e se qualcuno se ne assume la responsabilità."],"nc":"L'instabilità non è un difetto dello strumento: segnala un passaggio interpretativo lasciato aperto.","az":"Quando un controllo non passa o un numero sorprende."}]},{"id":"c20","n":20,"title":"KPI essenziali","full":"KPI essenziali per il controllo di gestione","intro":"Collegare ogni KPI a un obiettivo e a una decisione, definendo perimetro, periodo, fonte, responsabile, target, soglia e azione.","topics":[{"id":"kpi-decisione","t":"Dal numero alla decisione","what":"Un KPI è utile soltanto se collega un obiettivo a una decisione.","why":"Una formula corretta non basta: senza soglia, responsabile e azione prevista l'indicatore è informazione descrittiva, non uno strumento di controllo.","how":["Definire perimetro, periodo, fonte e frequenza.","Fissare responsabile, target e soglia di intervento quando l'indicatore entra nel cruscotto: dipendono dall'impresa.","Stabilire l'azione prevista quando il valore supera la soglia.","Un KPI entra nel cruscotto solo con un obiettivo esplicito, una relazione con il risultato, un responsabile capace di influenzarlo e una decisione associata."],"nc":"Un cruscotto efficace contiene pochi indicatori attivi, riconciliati e leggibili insieme, non un catalogo di misure.","az":"Prima di inserire un indicatore nel cruscotto."},{"id":"kpi-regole","t":"Regole comuni prima del calcolo","what":"Regole che valgono per ogni KPI: perimetro, tempo, unità, segni, fonte e riconciliazione.","why":"Senza regole scritte lo stesso indicatore, calcolato in due mesi diversi, può avere due perimetri diversi.","how":["Perimetro: numeratore e denominatore riferiti alla stessa azienda, unità, linea, cliente o processo.","Tempo: dati di flusso e dati medi sullo stesso periodo; per i saldi patrimoniali almeno la media tra inizio e fine periodo, o medie mensili se c'è stagionalità.","Unità: sempre dichiarate; le differenze tra percentuali si esprimono in punti percentuali.","Segni: scostamento = consuntivo meno riferimento; per i costi un segno positivo è sfavorevole, per ricavi e risultati è favorevole.","Fonte: ogni dato ha una fonte identificabile e il totale è riconciliabile con contabilità o sistema gestionale."],"ex":"Costi consuntivi 420.000, riferimento 400.000: +20.000 euro, +5,00%, sfavorevole.","az":"A ogni calcolo di un indicatore."},{"id":"kpi-nd","t":"Dato mancante: N/D","what":"Se un input obbligatorio manca o non è riconciliato con la fonte, il KPI si espone come N/D, indicando la causa.","why":"Uno zero reale e un dato assente sono cose diverse: confonderli falsa il cruscotto.","how":["Denominatore nullo in un rapporto o in una percentuale: N/D, perché il valore non è definito.","Valore realmente pari a zero, rilevato e riconciliato: resta zero.","Dato stimato: si usa solo dichiarando ipotesi e metodo.","Ciclo di conversione della cassa: se una componente è N/D il ciclo è N/D; la componente mancante non si sostituisce con zero.","Pareggio con margine negativo: si scrive «non raggiungibile», non un valore negativo."],"ex":"Impresa guida: produttività per ora e tasso di non conformità sono N/D, perché il caso non registra unità conformi, unità controllate e difetti.","az":"Quando un dato manca o non quadra con la fonte."},{"id":"kpi-redditivita","t":"Redditività e capitale investito (KPI 1-4)","what":"EBITDA margin, ROS, rotazione del capitale investito e ROI collegano il risultato operativo alle vendite e alle risorse impiegate.","why":"Il rendimento del capitale nasce dalla combinazione tra redditività delle vendite e velocità di rotazione del capitale.","how":["EBITDA margin = EBITDA / ricavi netti × 100.","ROS = EBIT / ricavi netti × 100.","Rotazione = ricavi netti / capitale investito operativo medio; capitale medio = (iniziale + finale) / 2.","ROI = EBIT / capitale investito operativo medio × 100; controllo: ROI = ROS × rotazione, con dati omogenei.","Stesso perimetro economico e temporale; capitale operativo e medio."],"ex":"EBITDA 180.000, EBIT 120.000, ricavi netti 1.200.000, capitale medio 600.000: EBITDA margin 15,00%, ROS 10,00%, rotazione 2,00 volte, ROI 20,00%.","nc":"Non sostituire l'EBIT con l'utile netto o con l'EBITDA: sono grandezze diverse e rispondono a domande diverse.","az":"Mensile per EBITDA margin e ROS; trimestrale o sugli ultimi dodici mesi per il ROI."},{"id":"kpi-margini","t":"Costi, margini e pareggio (KPI 5-8)","what":"Margine unitario, margine percentuale, punto di pareggio e margine di sicurezza collegano la struttura dei costi alla copertura generata dalle vendite.","why":"Mostrano la copertura della struttura e la distanza dal pareggio.","how":["Margine unitario = prezzo netto unitario - costo variabile unitario.","Margine % = margine di contribuzione complessivo / ricavi netti × 100.","Pareggio in quantità = costi fissi operativi / margine unitario, arrotondato per eccesso; in valore = costi fissi / margine % in forma decimale.","Margine di sicurezza = vendite - vendite di pareggio; in % diviso le vendite × 100.","Serve una separazione coerente tra costi variabili e fissi e, con più prodotti, un mix stabile."],"ex":"Prezzo netto 80, costo variabile 52: margine 28 euro. Costi fissi 350.000: pareggio 12.500 unità; con margine 35%, 1.000.000 euro di ricavi. Vendite 1.200.000: margine di sicurezza 200.000 euro, 16,67%.","nc":"Con margine negativo il pareggio non esiste: si scrive «non raggiungibile».","az":"Mensile e a ogni variazione strutturale."},{"id":"kpi-scostamenti","t":"Budget e consuntivo (KPI 9-11)","what":"Scostamento dei ricavi, dei costi operativi e del risultato: consuntivo meno riferimento, con la convenzione dei segni dichiarata.","why":"Il totale segnala il divario ma non la causa: va scomposto in volume, prezzo, mix, efficienza e struttura.","how":["Ricavi: consuntivo - budget; % = scostamento / budget × 100.","Costi: per le componenti variabili il riferimento è il budget flessibile al volume effettivo, per le fisse il budget statico; un valore positivo è sfavorevole.","Risultato: % = scostamento / |valore di budget| × 100; il valore assoluto mantiene il significato del segno anche con un budget in perdita.","Con riferimento nullo lo scostamento in euro resta calcolabile, quello percentuale è N/D."],"ex":"Ricavi 1.150.000 contro 1.200.000: -50.000 euro, -4,17%. EBITDA 170.000 contro 190.000: -20.000 euro, -10,53%.","nc":"Non confrontare costi variabili con un budget costruito su volumi diversi.","az":"A ogni chiusura mensile."},{"id":"kpi-forecast","t":"Accuratezza del forecast: WAPE e bias (KPI 12)","what":"Misura quanto la previsione si avvicina al consuntivo su una serie di prodotti, periodi o unità.","why":"Il WAPE dice quanto si sbaglia, il bias in quale direzione: vanno letti insieme.","how":["WAPE = somma dei valori assoluti di (consuntivo - forecast) / somma dei valori assoluti dei consuntivi × 100.","Accuratezza = 100% - WAPE.","Bias = somma di (forecast - consuntivo) / somma dei valori assoluti dei consuntivi × 100; positivo = sovrastima.","Usare il forecast congelato alla data di previsione, senza ricalcolarlo dopo."],"ex":"Consuntivi 100, 120, 80; forecast 90, 130, 85. Errori assoluti 10, 10, 5: WAPE 25 / 300 = 8,33%; accuratezza 91,67%; bias (-10 + 10 + 5) / 300 = +1,67%.","nc":"Il bias ha un segno proprio (forecast meno consuntivo): è una misura dell'errore, non uno scostamento.","az":"Mensile, distinguendo l'orizzonte di previsione."},{"id":"kpi-circolante","t":"Capitale circolante e cassa (KPI 13-16)","what":"Giorni di incasso, di giacenza, di pagamento e ciclo di conversione della cassa trasformano saldi patrimoniali in tempi medi.","why":"Il ciclo dice per quanti giorni l'attività assorbe finanziamento tra pagamento degli acquisti e incasso delle vendite.","how":["Giorni di incasso = crediti commerciali medi / vendite a credito × giorni del periodo.","Giorni di giacenza = rimanenze medie / costo del venduto × giorni.","Giorni di pagamento = debiti commerciali medi / acquisti a credito × giorni.","Ciclo = giorni di incasso + giorni di giacenza - giorni di pagamento.","Numeratore e denominatore omogenei, anche per l'IVA, e stesso numero di giorni per tutte le componenti."],"ex":"120.000 / 900.000 × 365 = 48,67; 150.000 / 900.000 × 365 = 60,83; 100.000 / 730.000 × 365 = 50,00; ciclo 48,67 + 60,83 - 50,00 = 59,50 giorni.","nc":"Non dividere le scorte valorizzate al costo per i ricavi di vendita.","az":"Mensile; tradurre ogni giorno recuperabile nel suo effetto di cassa."},{"id":"kpi-commerciali","t":"Vendite, prezzi e redditività commerciale (KPI 17-20)","what":"Crescita dei ricavi, prezzo medio di vendita, incidenza degli sconti e margine per prodotto, cliente o canale.","why":"Le medie commerciali sono sensibili al mix: vanno lette per segmenti omogenei.","how":["Crescita = (ricavi correnti - ricavi del periodo comparabile) / ricavi del periodo comparabile × 100.","Prezzo medio = ricavi netti delle unità vendute / unità vendute.","Incidenza sconti = sconti commerciali concessi / valore lordo a listino delle vendite × 100.","Margine di segmento = ricavi netti attribuibili - costi variabili attribuibili; i costi fissi comuni non sono compresi."],"ex":"Ricavi 1.200.000 contro 1.100.000: crescita 9,09%. 500.000 euro su 10.000 unità: prezzo medio 50 euro. Sconti 60.000 su 600.000 lordi: 10,00%. Ricavi 250.000, costi variabili 165.000: margine 85.000 euro, 34,00%.","nc":"Non rapportare gli sconti ai ricavi netti invece che al valore lordo a listino.","az":"Settimanale o mensile per prezzo e sconti; mensile per crescita e margini."},{"id":"kpi-operativi","t":"Produttività, capacità e qualità (KPI 21-24)","what":"Utilizzo della capacità, produttività per ora, costo unitario e tasso di non conformità.","why":"Un buon valore in uno solo fra capacità utilizzata, output conforme e difetti non garantisce una prestazione complessivamente buona.","how":["Utilizzo = ore utilizzate / ore di capacità pratica disponibile × 100.","Produttività = unità conformi / ore effettive; con produzione eterogenea, ore standard maturate / ore effettive × 100.","Costo unitario = costi compresi nella configurazione / unità equivalenti conformi.","Non conformità = unità non conformi uniche / unità controllate × 100; rilavorazione = unità rilavorate / unità prodotte × 100."],"ex":"1.440 ore su 1.800: utilizzo 80,00%. 4.800 unità conformi in 1.200 ore: 4 unità per ora. 300.000 euro su 12.000 unità: 25 euro. 240 non conformi su 12.000: 2,00%; 180 rilavorate: 1,50%.","nc":"Un costo unitario che include costi fissi può scendere anche soltanto per il maggiore assorbimento dovuto a volumi più alti, senza alcun miglioramento di efficienza.","az":"Giornaliera, settimanale o mensile secondo il processo."},{"id":"kpi-cruscotto","t":"Il cruscotto minimo","what":"Una selezione da otto a dodici indicatori, scelti in base al modello economico e alle decisioni del periodo.","why":"La pagina direzionale deve tenere insieme risultato, cause, capitale e azioni.","how":["Risultato: EBITDA margin oppure ROS.","Capitale: ROI e ciclo di conversione della cassa.","Margine: margine di contribuzione percentuale e margine di sicurezza.","Piano: scostamento dei ricavi, dei costi e del risultato.","Previsione: accuratezza del forecast.","Commerciale: prezzo medio, sconti o margine per segmento.","Operazioni: utilizzo della capacità, produttività o non conformità."],"ex":"Scegliendo un solo indicatore nelle righe con «oppure» o «o», la selezione standard conta undici KPI, dentro il limite di dodici.","nc":"Gli altri indicatori restano disponibili per l'approfondimento, ma non occupano la pagina direzionale.","az":"Quando si imposta o si rivede il cruscotto mensile."},{"id":"kpi-routine","t":"La routine mensile","what":"Otto passi, dalla chiusura dei dati alla verifica delle azioni.","why":"Ogni anomalia materiale deve arrivare a un'azione con responsabile, scadenza ed effetto atteso.","how":["1. Chiudere i dati: bloccare periodo, fonti, perimetro e regole di classificazione.","2. Riconciliare ricavi, costi, margini e saldi con le fonti, spiegando ogni differenza.","3. Calcolare con formule versionate e controlli automatici, senza correzioni manuali non tracciate.","4. Confrontare consuntivo, budget, forecast, periodo precedente e target.","5. Spiegare: dallo scostamento alle cause (prezzo, volume, mix, consumo, efficienza, capacità, tempi).","6. Decidere: azione, responsabile, scadenza ed effetto atteso.","7. Aggiornare forecast e priorità quando gli effetti sono ricorrenti.","8. Verificare nel ciclo successivo l'effetto ottenuto rispetto a quello promesso."],"nc":"L'azione si chiude o si rilancia solo dopo il confronto fra risultato ottenuto ed effetto promesso.","az":"A ogni chiusura mensile."},{"id":"kpi-cassa","t":"Dal risultato operativo alla cassa","what":"Raccordo che parte dal risultato operativo, somma i costi senza pagamento e sottrae la cassa assorbita dal capitale circolante operativo.","why":"Il risultato non è cassa: nell'impresa guida l'aumento dei crediti assorbe 180.000 euro dei 242.000 di risultato operativo.","how":["Risultato operativo 242.000 + ammortamento 74.000 - aumento crediti 180.000 + scorte 0 + debiti 0 = flusso di cassa operativo 136.000 euro.","Meno investimenti pari agli ammortamenti, 74.000: 62.000 euro.","Segni: un aumento di crediti o scorte assorbe cassa e si sottrae; un aumento dei debiti verso fornitori si somma; una riduzione ha l'effetto opposto.","Verifica da incassi e pagamenti: 3.206.000 - 2.190.000 - 880.000 = 136.000 euro."],"ex":"Un giorno di vendite vale 3.386.000 / 365 = 9.277 euro: è la misura con cui tradurre in cassa ogni giorno di incasso recuperabile.","nc":"Il flusso è operativo: prima di oneri finanziari e imposte, finanziamenti, rimborsi e distribuzioni di utili.","az":"Quando si legge il ciclo di conversione della cassa insieme al risultato."},{"id":"kpi-impresa-guida","t":"I KPI dell'impresa guida","what":"Molti indicatori sono già calcolati sull'impresa guida; per quelli senza dati il valore corretto è N/D, con la causa.","why":"Collegano le schede ai numeri del libro e mostrano quando un indicatore non si può calcolare.","how":["ROS 7,1% (242.000 / 3.386.000); rotazione 3,39 volte su 1.000.000 di capitale medio; ROI 24,2%.","Margine di contribuzione 31,4%; margine di sicurezza 30,7% con il mix a domanda piena.","Giorni di incasso 60,00, di giacenza 45,00, di pagamento 60,00: ciclo 45,00 giorni.","Scostamento dei ricavi -6.100 euro (-0,2%); del risultato operativo -27.900 euro (-10,3%).","Saturazione 114,3% sulla capacità ordinaria; margine per ora macchina 44,25 euro.","N/D: produttività e non conformità (dati non registrati), crescita dei ricavi (un solo esercizio), incidenza sconti dell'impresa (linea C senza cascata)."],"ex":"Incidenza dello sconto commerciale: linea A 16 su 200 di listino = 8,0%; linea B 4 su 120 = 3,3%.","nc":"L'EBITDA margin non è calcolato per scelta: per l'impresa guida l'indicatore di redditività è il ROS.","az":"Per esercitarsi sulle schede con i numeri del libro."}]}];var Zi=[];var ji=[];var Wi=[];var oi=[{"t":"ABC - Activity Based Costing","area":"c10","d":"Metodo che attribuisce i costi delle risorse alle attività e successivamente agli oggetti di costo mediante driver coerenti.","nc":"ABM: l'ABC misura, l'ABM usa quelle misure per intervenire sui processi."},{"t":"ABM - Activity Based Management","area":"c11","d":"Uso delle informazioni prodotte dall'ABC per ridurre sprechi, gestire capacità e migliorare redditività e processi.","nc":"ABC, che è il metodo di calcolo."},{"t":"Activity (attività)","area":"c10","d":"Operazione o insieme omogeneo di operazioni che consuma risorse per produrre un risultato interno o esterno."},{"t":"Allocazione","area":"c6","d":"Procedimento con cui un costo indiretto comune viene distribuito tra centri, attività o oggetti di costo.","nc":"Attribuzione, che usa una misura osservabile del consumo senza ipotesi di riparto."},{"t":"Attribuzione","area":"c6","d":"Il costo arriva all'oggetto attraverso una misura osservabile del consumo.","nc":"Allocazione."},{"t":"Base di allocazione","area":"c6","d":"Grandezza utilizzata per ripartire un costo indiretto, ad esempio ore macchina, ore di lavoro, metri quadrati o numero di ordini.","nc":"Driver di costo in senso ABC: la base è corretta solo se rappresenta il consumo."},{"t":"Break-even point","area":"c9","d":"Livello di attività o fatturato al quale ricavi totali e costi totali coincidono e il risultato operativo è pari a zero.","nc":"Pareggio finanziario: il pareggio è economico, non di cassa."},{"t":"Ponte degli scostamenti","area":"c14","d":"Prospetto che spiega il passaggio dal risultato di budget al consuntivo con componenti calcolate, senza righe ottenute come residuo."},{"t":"Budget","area":"c12","d":"Piano quantitativo ed economico-finanziario che traduce obiettivi e responsabilità in ricavi, costi, investimenti, fabbisogni e risultati attesi.","nc":"Forecast, che aggiorna la previsione con le informazioni più recenti."},{"t":"Budget flessibile","area":"c14","d":"Budget ricalcolato al livello effettivo di attività per separare l'effetto volume dagli scostamenti di prezzo, efficienza e consumo.","nc":"Budget statico, costruito sul volume pianificato."},{"t":"Budget statico","area":"c14","d":"Budget costruito sul volume pianificato.","nc":"Budget flessibile."},{"t":"Capacità","area":"c4","d":"Risorse rese disponibili dall'organizzazione (capacità fornita), di cui una parte viene assorbita dall'attività (capacità utilizzata).","nc":"Spesa: liberare capacità non riduce automaticamente la spesa."},{"t":"Capacità inutilizzata","area":"c4","d":"Costo della capacità fornita meno costo della capacità utilizzata: va esposta come informazione gestionale, non nascosta nel costo unitario."},{"t":"Centro di costo","area":"c5","d":"Unità organizzativa o logica nella quale vengono raccolti costi omogenei per responsabilità e attività, prima del trasferimento agli oggetti finali.","nc":"Oggetto di costo finale (prodotto, cliente, commessa)."},{"t":"Consuntivo","area":"c14","d":"Insieme dei valori effettivamente maturati o registrati in un periodo, dopo i necessari controlli di completezza, competenza e riconciliazione."},{"t":"Contabilità analitica","area":"c2","d":"Sistema interno che rielabora costi e ricavi per prodotto, cliente, canale, commessa, centro o attività, a supporto delle decisioni gestionali.","nc":"Contabilità generale."},{"t":"Contabilità generale","area":"c2","d":"Sistema che registra i fatti aziendali e rappresenta risultato economico, patrimonio e situazione finanziaria dell'impresa nel suo complesso.","nc":"Contabilità analitica."},{"t":"Cost driver","area":"c10","d":"Misura che esprime la causa o l'intensità con cui un'attività viene richiesta, ad esempio numero di ordini, setup o controlli.","nc":"Driver di risorsa, che porta le risorse alle attività."},{"t":"Costo di servizio (cost to serve)","area":"c11","d":"Costo delle attività con cui il cliente viene servito: ordini, consegne, resi, assistenza, credito, personalizzazioni."},{"t":"Costo","area":"c3","d":"Valore monetario delle risorse consumate per ottenere un risultato o sostenere un'attività.","nc":"Pagamento e acquisto."},{"t":"Costo differenziale","area":"c15","d":"Variazione dei costi futuri provocata dalla scelta di un'alternativa rispetto a un'altra; con i ricavi differenziali forma il risultato differenziale.","nc":"Costo pieno."},{"t":"Costo diretto","area":"c3","d":"Costo attribuibile a uno specifico oggetto mediante misurazione diretta, senza ricorrere a criteri di riparto.","nc":"Costo variabile: diretto descrive la riferibilità, variabile il comportamento."},{"t":"Costo evitabile","area":"c15","d":"Costo che scompare, interamente o in parte, scegliendo una determinata alternativa.","nc":"Costo allocato: una quota allocata non è automaticamente evitabile."},{"t":"Costo fisso","area":"c3","d":"Costo totale che, entro un determinato intervallo di attività e di tempo, non varia al variare del volume.","nc":"Costo indiretto."},{"t":"Costo incrementale","area":"c15","d":"Costo aggiuntivo che nasce solo scegliendo un'alternativa: costi variabili e fissi incrementali specifici."},{"t":"Costo indiretto","area":"c3","d":"Costo comune a più oggetti, non attribuibile direttamente in modo economicamente conveniente e quindi soggetto a un criterio di allocazione.","nc":"Costo fisso: un costo indiretto può essere variabile."},{"t":"Costo opportunità","area":"c15","d":"Beneficio della migliore alternativa a cui si rinuncia utilizzando una risorsa. Non compare in contabilità, ma è rilevante quando la risorsa è scarsa; se la risorsa non ha un impiego alternativo può essere nullo.","nc":"Costo sommerso."},{"t":"Costo pieno","area":"c7","d":"Somma dei costi diretti e delle quote di costi indiretti attribuite a un oggetto secondo il perimetro prescelto.","nc":"Costo rilevante."},{"t":"Costo rilevante","area":"c3","d":"Costo futuro che cambia tra le alternative considerate ed è quindi utile per il confronto decisionale.","nc":"Costo pieno."},{"t":"Costo sommerso","area":"c15","d":"Costo già sostenuto e non recuperabile che nessuna alternativa futura può modificare e che deve essere escluso dal confronto decisionale.","nc":"Costo opportunità."},{"t":"Costo standard","area":"c3","d":"Valore costruito prima dell'attività su condizioni definite: quanto una risorsa dovrebbe costare e quanto dovrebbe esserne usato.","nc":"Media del passato o costo preventivo."},{"t":"Costo variabile","area":"c3","d":"Costo totale che varia in relazione al livello di attività secondo una funzione definita.","nc":"Costo diretto."},{"t":"Direct Costing","area":"c8","d":"Metodo che attribuisce agli oggetti i costi variabili e, nella versione evoluta, anche i costi fissi specifici.","nc":"Full Costing."},{"t":"Driver","area":"c4","d":"Grandezza che spiega il consumo della risorsa: unità, ore macchina, ore lavoro, ordini, consegne, ticket."},{"t":"Fattore scarso","area":"c18","d":"Risorsa la cui disponibilità limita produzione o vendite. In presenza di un vincolo, le alternative vanno ordinate per margine generato per unità del fattore."},{"t":"Forecast","area":"c12","d":"Previsione aggiornata dell'esito atteso, costruita usando consuntivi disponibili, driver correnti e ipotesi sul periodo residuo.","nc":"Budget."},{"t":"Full Costing","area":"c7","d":"Metodo che attribuisce agli oggetti sia i costi diretti sia quote di costi indiretti, producendo una configurazione di costo pieno.","nc":"Direct Costing."},{"t":"Intelligenza artificiale (IA)","area":"c19","d":"Insieme di strumenti capaci di produrre testi, formule, codice, classificazioni, analisi e ipotesi a partire da istruzioni e dati; il capitolo 19 ne usa tre per i lavori tipici del controller. Nel controllo di gestione accelera il lavoro, ma non certifica né sostituisce la verifica dei risultati."},{"t":"KPI","area":"c20","d":"Indicatore chiave collegato a un obiettivo e a una decisione: deve avere formula, fonte, frequenza, perimetro, target, soglia e responsabile definiti, e un'azione prevista in caso di scostamento."},{"t":"Leva operativa","area":"c9","d":"Rapporto tra margine di contribuzione e risultato operativo: misura la sensibilità del risultato alle variazioni di volume nel punto osservato."},{"t":"Margine sul prezzo (margin)","area":"c17","d":"Margine espresso come percentuale del prezzo di vendita, (prezzo - costo) / prezzo.","nc":"Ricarico sul costo (markup)."},{"t":"Margine di contribuzione","area":"c8","d":"Differenza tra ricavi e costi variabili. Misura quanto resta per coprire i costi fissi e formare il risultato.","nc":"Utile."},{"t":"Margine di sicurezza","area":"c9","d":"Differenza tra vendite previste e vendite di pareggio: misura quanto le vendite possono scendere prima di raggiungere il pareggio."},{"t":"Ricarico sul costo (markup)","area":"c17","d":"Ricarico espresso come percentuale del costo, (prezzo - costo) / costo; prezzo con ricarico = costo × (1 + percentuale di ricarico).","nc":"Margine sul prezzo (margin)."},{"t":"Mix produttivo (o di vendita)","area":"c18","d":"Combinazione delle quantità dei diversi prodotti, servizi, clienti o canali che influenza margine complessivo e utilizzo della capacità."},{"t":"Oggetto di costo","area":"c5","d":"Entità di cui si vuole misurare il costo o la redditività, ad esempio prodotto, servizio, cliente, canale, commessa o processo.","nc":"Centro di costo."},{"t":"Prezzo minimo","area":"c17","d":"Soglia di prezzo sotto la quale un'offerta non soddisfa il criterio economico definito; varia con capacità, orizzonte e costi rilevanti."},{"t":"Pricing","area":"c17","d":"Processo con cui si progettano, applicano e controllano prezzi, sconti e condizioni commerciali integrando costi, valore, domanda e capacità."},{"t":"Punto di indifferenza","area":"c15","d":"Valore del volume, del prezzo o di un altro driver in corrispondenza del quale due alternative producono lo stesso risultato economico."},{"t":"Intervallo di rilevanza","area":"c4","d":"Intervallo di attività e di tempo entro cui una relazione di costo resta valida."},{"t":"Riconciliazione","area":"cdg","d":"Controllo che collega un risultato analitico alla fonte contabile o gestionale, spiegando differenze di perimetro, periodo e classificazione.","nc":"Quadratura: la quadratura verifica il totale, non la correttezza economica."},{"t":"Saturazione","area":"c20","d":"Grado di utilizzo della capacità disponibile. Sotto il 100% segnala capacità inutilizzata; oltre il 100% indica fabbisogno aggiuntivo."},{"t":"Scenario","area":"c12","d":"Insieme coerente di ipotesi su volumi, prezzi, costi, capacità e altri driver: non è una previsione isolata, ma una configurazione alternativa utile a misurare conseguenze, rischi e punti di tenuta."},{"t":"Scostamento","area":"c14","d":"Differenza tra un valore consuntivo e il riferimento adottato, come budget, standard o periodo precedente, da scomporre nelle cause rilevanti."},{"t":"Secondo margine","area":"c8","d":"Margine di contribuzione meno costi fissi specifici del segmento."},{"t":"TDABC - Time-Driven ABC","area":"c10","d":"Variante dell'ABC che calcola un costo per unità di capacità (per minuto: costo delle risorse / minuti di capacità pratica) e usa equazioni di tempo."},{"t":"Validazione e revisione umana","area":"c19","d":"Verifica professionale di dati, formule, ipotesi, riconciliazioni e interpretazioni prima che un risultato venga comunicato o usato. Nel capitolo 19 la validazione segue il Protocollo universale di elaborazione e controllo; la revisione umana trasforma poi i prospetti verificati in commento gestionale. Nel lavoro assistito dall'IA resta responsabilità del controller e deve essere documentabile e ripetibile."},{"t":"VAN - Valore Attuale Netto","area":"c15","d":"Somma dei flussi differenziali attualizzati al tasso minimo richiesto: VAN = somma dei flussi_t / (1 + r)^t."},{"t":"TIR - Tasso Interno di Rendimento","area":"c15","d":"Tasso che rende il VAN pari a zero."},{"t":"EBITDA","area":"c20","d":"Risultato operativo prima di ammortamenti, svalutazioni, interessi e imposte, cioè l'EBIT più ammortamenti e svalutazioni operative. Il perimetro di calcolo va dichiarato e mantenuto coerente."},{"t":"EBIT","area":"c20","d":"Risultato operativo dopo ammortamenti e svalutazioni operative, prima di oneri finanziari e imposte. È il numeratore di ROS e ROI; non va sostituito con l'utile netto o con l'EBITDA."},{"t":"ROS","area":"c20","d":"Rapporto tra risultato operativo (EBIT) e ricavi netti. Esprime il risultato operativo prodotto da ogni 100 euro di vendita."},{"t":"ROI","area":"c20","d":"Rapporto tra risultato operativo (EBIT) e capitale investito operativo medio. Si scompone in ROS per rotazione del capitale, con dati omogenei."},{"t":"Rotazione del capitale investito","area":"c20","d":"Ricavi netti divisi per il capitale investito operativo medio: quanti euro di ricavi si generano per ogni euro medio investito. Moltiplicata per il ROS dà il ROI."},{"t":"Capitale investito operativo","area":"c20","d":"Risorse impiegate nella gestione caratteristica: immobilizzazioni operative più capitale circolante operativo, escluse poste finanziarie o estranee. Nei rapporti con grandezze di flusso si usa il valore medio."},{"t":"Capitale circolante operativo","area":"c20","d":"Crediti commerciali più scorte meno debiti commerciali. Un suo aumento, a parità di attività, accresce il fabbisogno finanziario."},{"t":"WAPE","area":"c20","d":"Errore percentuale assoluto ponderato: somma degli errori assoluti di previsione divisa per la somma dei consuntivi in valore assoluto. Non indica la direzione dell'errore e va letto con il bias."},{"t":"Accuratezza del forecast","area":"c20","d":"100% meno il WAPE. Indica la vicinanza complessiva della previsione al consuntivo, non la direzione dell'errore."},{"t":"Bias del forecast","area":"c20","d":"Somma di (forecast - consuntivo) divisa per la somma dei consuntivi in valore assoluto. Positivo indica sovrastima, negativo sottostima; va letto con il WAPE."},{"t":"Giorni medi di incasso","area":"c20","d":"Crediti commerciali medi divisi per le vendite a credito, per i giorni del periodo: tempo medio per incassare i crediti."},{"t":"Giorni medi di giacenza","area":"c20","d":"Rimanenze medie divise per il costo del venduto, per i giorni del periodo: tempo medio in cui il valore resta nelle scorte."},{"t":"Giorni medi di pagamento","area":"c20","d":"Debiti commerciali medi divisi per gli acquisti a credito, per i giorni del periodo: quanta parte del ciclo è finanziata dai fornitori."},{"t":"Ciclo di conversione della cassa","area":"c20","d":"Giorni di incasso più giorni di giacenza meno giorni di pagamento: per quanti giorni il ciclo operativo assorbe finanziamento."},{"t":"Capacità pratica","area":"c20","d":"Capacità disponibile in condizioni operative normali, al netto di pause, manutenzioni e indisponibilità normali. È la base dell'utilizzo della capacità."},{"t":"Unità equivalenti","area":"c20","d":"Produzione espressa in unità finite: le unità ancora in lavorazione si convertono in unità complete in base al grado di avanzamento."},{"t":"Tasso di non conformità","area":"c20","d":"Unità non conformi, contate una sola volta, divise per le unità controllate × 100. Non coincide con la rilavorazione: una non conformità può essere scartata, accettata in deroga o rilavorata."},{"t":"N/D (dato mancante)","area":"c20","d":"Valore esposto quando un input obbligatorio manca o non è riconciliato con la fonte, o quando il denominatore è nullo, con la causa indicata. Uno zero reale e riconciliato resta zero."},{"t":"Target","area":"c20","d":"Valore obiettivo assegnato a un indicatore entro un periodo definito, coerente con risorse, responsabilità e soglie di intervento. Non va confuso con il valore previsto dal forecast."},{"t":"Cruscotto direzionale","area":"c20","d":"Insieme selezionato di indicatori, confronti e segnali che sostiene una responsabilità decisionale: andamento, scostamenti, cause e azioni, senza accumulare misure prive di priorità."},{"t":"Bilancio di verifica","area":"c19","d":"Prospetto contabile che elenca tutti i conti della contabilità generale con i rispettivi saldi, o con i totali dare e avere, a una certa data. Poiché ogni registrazione in partita doppia ha importi uguali in dare e in avere, il totale dare coincide con il totale avere; la quadratura però non dimostra che le registrazioni siano complete e corrette. Estratto a saldi, una riga per conto, è la fonte da cui si ricostruisce il Conto Economico gestionale e con cui lo si quadra."},{"t":"Budget operativo","area":"c13","d":"Insieme dei programmi che formano il budget: parte dalle vendite, perché domanda e prezzi determinano gran parte delle attività successive, e segue la catena fino a produzione, acquisti, personale, costi indiretti e spese di struttura. Deve poi essere tradotto in incassi e pagamenti."},{"t":"Capacità ordinaria","area":"c13","d":"Capacità interna disponibile nelle normali condizioni di lavoro, senza straordinari né lavorazioni esterne; le ore oltre questa soglia sono capacità aggiuntiva, che nei casi del libro si chiama per brevità capacità esterna. È il riferimento per calcolare saturazione, ore mancanti o disponibili e il costo della capacità da acquistare. Non coincide necessariamente con la capacità pratica: nell’impresa guida le 21.000 ore sono la soglia oltre la quale serve capacità aggiuntiva, mentre il caso non indica la capacità pratica del reparto."},{"t":"Centro di responsabilità","area":"c5","d":"Unità organizzativa a cui si assegna un obiettivo economico insieme alle leve per raggiungerlo; secondo ciò che il responsabile governa è un centro di costo, di ricavo, di profitto o di investimento, e risponde soltanto di ciò che può influenzare."},{"t":"Chiave univoca","area":"c19","d":"Campo, o combinazione di campi, che identifica una e una sola riga di un file, come l’identificativo della riga documento o del movimento contabile. Permette di trovare i duplicati, di collegare file diversi e di raccordare il dettaglio con il saldo; il suo controllo fa parte della validazione preliminare dei dati, e una chiave mancante arresta il lavoro."},{"t":"Coefficiente di allocazione","area":"c6","d":"Tariffa ottenuta dividendo il costo del pool o del centro per la quantità totale della base di allocazione. Moltiplicata per la base assorbita da ciascun oggetto determina la quota di costo attribuita."},{"t":"Controller","area":"cdg","d":"Professionista che in azienda svolge il controllo di gestione: prepara budget, analisi dei costi e degli scostamenti e reporting, verifica i numeri con la contabilità e li traduce in informazioni per le decisioni della direzione."},{"t":"Controllo di gestione","area":"cdg","d":"Insieme di strumenti con cui un’impresa programma i propri risultati economici, li misura e interviene quando si discostano da quanto previsto: contabilità analitica, sistemi di costo, budget, analisi degli scostamenti, analisi per le decisioni e KPI."},{"t":"Costo misto","area":"c4","d":"Costo che contiene una componente fissa e una componente variabile, come una tariffa con una quota mensile fissa e un importo per ogni transazione. Esiste anche in assenza di operazioni, ma cresce con l’attività; per prevederlo occorre separare le due componenti."},{"t":"Costo unitario","area":"c4","d":"Costo totale di una configurazione dichiarata, variabile, industriale o piena, diviso per le unità conformi o equivalenti a cui si riferisce. Quando include costi fissi varia con il volume; per questo non va usato come costo rilevante di una decisione senza verificarne la composizione."},{"t":"CSV (file)","area":"c19","d":"Formato di testo semplice in cui ogni riga è un record e i campi sono separati da un carattere stabilito, di solito la virgola o il punto e virgola. È il formato più comune delle estrazioni dal gestionale e dei file caricati negli strumenti di IA; prima dell’uso vanno verificati separatore, simbolo dei decimali, formato delle date, riga di intestazione e numero delle righe."},{"t":"Dare e avere","area":"c19","d":"Le due sezioni di ogni conto nella partita doppia: in dare si registrano, fra l’altro, i costi e gli aumenti delle attività, in avere i ricavi e gli aumenti delle passività e del patrimonio netto. In ogni registrazione gli importi in dare e in avere si equivalgono, e per questo il bilancio di verifica deve chiudere con il totale dare uguale al totale avere."},{"t":"Dataset gestionale","area":"c19","d":"Insieme strutturato di dati destinato a un’analisi, con campi, unità di misura, periodi, granularità e regole di qualità espliciti. Un dataset non riconciliato può produrre risultati formalmente corretti ma gestionalmente falsi."},{"t":"Effetto mix","area":"c14","d":"Parte dello scostamento del margine di contribuzione dovuta alla diversa composizione delle vendite, a parità di quantità totale. Si può calcolare in più modi, e il prospetto deve dichiarare quello usato."},{"t":"Effetto quantità","area":"c14","d":"Parte dello scostamento del margine di contribuzione dovuta alla variazione della quantità totale venduta, valutata al margine unitario medio di budget."},{"t":"Estrazione (dal gestionale)","area":"c19","d":"File esportato dal gestionale per un’analisi, per esempio il venduto per riga documento, il partitario dei costi, le ore di reparto o il bilancio di verifica a saldi. Si usa così come il sistema la esporta, non nella versione impaginata per la stampa, e prima dell’elaborazione se ne controllano periodo, entità, colonne, numero delle righe e totali."},{"t":"Fase 0","area":"c19","d":"La prima delle sei fasi, numerate da 0 a 5, del Protocollo universale di elaborazione e controllo: prima di qualsiasi calcolo si verificano file, periodo, entità, schema, chiave univoca, tipi, segni, unità, conteggio delle righe, duplicati, valori mancanti e totali. Un errore critico arresta il lavoro: il controllo ha esito FAIL e si consegna soltanto il registro delle eccezioni."},{"t":"Funzione di costo a tratti","area":"c4","d":"Costo che si comporta in un modo fino a una soglia di attività e in un altro oltre la soglia. Nell’impresa guida è la capacità esterna: entro le 21.000 ore macchina interne non costa nulla, oltre costa 28 euro per ogni ora in più."},{"t":"Gestionale","area":"c19","d":"Nel linguaggio aziendale, il software con cui l’impresa registra contabilità e operazioni, come ordini, vendite, acquisti, magazzino e produzione; è chiamato anche sistema gestionale o ERP. È la fonte delle estrazioni su cui lavora il controller. Come aggettivo, invece, indica nel volume la lettura economica interna, per esempio nel Conto Economico gestionale."},{"t":"Make or Buy","area":"c16","d":"Decisione che confronta produzione interna e acquisto esterno. Il prezzo del fornitore non va confrontato automaticamente con il costo pieno interno, perché il costo pieno contiene quote che possono restare anche dopo l’esternalizzazione: il confronto corretto usa costi evitabili, costi incrementali, opportunità e conseguenze operative."},{"t":"Mapping (mappatura)","area":"c19","d":"Tabella di corrispondenza che collega i codici di una fonte, come conti, centri o prodotti, alle voci di un’altra struttura, per esempio le righe del prospetto gestionale, le classi di costo o le attività. Si costruisce una volta, va datata e mantenuta nel tempo; i codici non mappati non si attribuiscono a intuito, ma si elencano a parte con importo e descrizione."},{"t":"Margine operativo","area":"c1","d":"Risultato della gestione caratteristica: ricavi meno costi operativi, prima di oneri finanziari e imposte. È un altro nome del risultato operativo, che è il termine usato nel volume; il suo rapporto con i ricavi è il ROS."},{"t":"OOXML","area":"c19","d":"Office Open XML, lo standard aperto con cui sono costruiti i file di Excel, Word e PowerPoint, come .xlsx, .docx e .pptx. Nei file generati via codice le formule si scrivono con i nomi inglesi delle funzioni e con i separatori del formato, anche se l’interfaccia le mostra in italiano: per esempio NA() nel codice corrisponde a NON.DISP() nell’interfaccia italiana."},{"t":"Output da verificare","area":"c19","d":"Testo, formula, tabella, codice o interpretazione generata da uno strumento di IA e non ancora verificata. Può essere plausibile ma contenere dati inventati, riferimenti errati o calcoli incoerenti; come la bozza prodotta dallo strumento, è materiale di lavoro, non un documento."},{"t":"Partitario","area":"c2","d":"Elenco dei movimenti o dei saldi di uno o più conti, con data, conto, descrizione e importo e, quando serve, centro di costo. Nel volume il partitario dei costi della struttura dell’impresa guida è la fonte da cui la contabilità analitica ricolloca gli importi per destinazione, centro e attività."},{"t":"PASS, WARN e FAIL","area":"c19","d":"Esiti con cui si registra ogni controllo di quadratura, esposto come valore A, valore B, differenza e tolleranza: PASS indica che il controllo è superato, WARN che richiede una verifica o una spiegazione prima dell’uso, FAIL che non è superato. Un risultato con esito FAIL non è pubblicabile né utilizzabile in una decisione."},{"t":"Prezzo interno","area":"c5","d":"Valore al quale un centro cede beni o servizi a un altro centro della stessa impresa; sposta risultato da un centro all’altro senza cambiare quello dell’impresa."},{"t":"Prezzo ombra","area":"c18","d":"Valore di un’ora aggiuntiva di una risorsa vincolata, indicato dal modello di ottimizzazione del mix. Vale per variazioni limitate della capacità e, quando i vincoli sono più di uno, può differire dal margine per unità di fattore scarso calcolato con un solo vincolo, perché un’ora in più di una risorsa può essere sfruttata solo spostando il mix e consumando anche l’altra risorsa."},{"t":"Prompt operativo","area":"c19","d":"Istruzione strutturata fornita a uno strumento di IA, contenente obiettivo, dati, regole, formato di uscita e controlli richiesti; nel capitolo 19 è chiamata «richiesta professionale». Un buon prompt rende il risultato più verificabile, ma non sostituisce dati corretti e validazione."},{"t":"Protocollo universale di elaborazione e controllo","area":"c19","d":"Sequenza di sei fasi, numerate da 0 a 5, che ogni lavoro del capitolo 19 segue: validazione dei dati prima del calcolo (Fase 0), calcolo con formule dichiarate e archiviate, quadrature con esito PASS, WARN o FAIL, prove su un caso noto e sui casi limite, consegna di dati letti ed esclusi, mapping, eccezioni, controlli, risultato e ipotesi, divieto di usare in una decisione un risultato con esito FAIL. Lo strumento lo applica soltanto se il testo è incollato in testa alla richiesta o caricato nel progetto."},{"t":"Quadratura","area":"cdg","d":"Controllo che verifica la coincidenza fra due totali che devono corrispondere, per esempio la somma dei centri e il totale del partitario, o il margine del prospetto e quello del Conto Economico gestionale. Si mostra come valore A, valore B, differenza e tolleranza; una differenza va nominata e spiegata, non arrotondata. È il passaggio centrale della riconciliazione e precede ogni allocazione o elaborazione."},{"t":"Registro delle eccezioni","area":"c19","d":"Elenco, consegnato insieme al risultato, di ciò che l’elaborazione non ha potuto trattare secondo le regole della richiesta: codici non mappati, movimenti senza centro valido, chiavi mancanti o duplicate, quadrature non superate, ciascuno con il motivo e, quando c’è, il numero di righe e l’importo. Quando una chiave manca, una quadratura non passa o un mapping critico resta irrisolto, il controllo ha esito FAIL, il calcolo si arresta e lo strumento consegna soltanto il registro delle eccezioni."},{"t":"Ribaltamento","area":"c6","d":"Trasferimento dei costi accumulati nei centri ausiliari o di struttura verso centri destinatari o oggetti finali. Deve seguire basi coerenti con i servizi effettivamente resi e, nel metodo a cascata, una sequenza dichiarata."},{"t":"Run rate","area":"c12","d":"Effetto a regime delle decisioni già prese, che nel budget si tiene separato dai driver di volumi, prezzi e attività e dalle iniziative nuove."},{"t":"Scritture di assestamento","area":"c2","d":"Registrazioni di fine periodo che non nascono da un nuovo scambio con l’esterno ma riportano ciascun valore al periodo di competenza, come ammortamenti, ratei e risconti; solo dopo l’assestamento i dati della contabilità generale sono affidabili per competenza."},{"t":"Struttura base","area":"c4","d":"Nell’impresa guida, i 736.000 euro di costi della struttura senza la capacità esterna: sommati agli 84.000 euro di capacità esterna danno gli 820.000 euro dei costi della struttura."},{"t":"Throughput","area":"c18","d":"Valore generato dalle vendite al netto dei costi realmente variabili, osservato in rapporto al vincolo del sistema. Aiuta a scegliere il mix che massimizza il contributo complessivo quando una risorsa è limitata."}],di={"cdg":"Controllo di gestione (trasversale)"},ui=i=>Array.isArray(i.area)?i.area:[i.area];var pi=[{"id":"c1","area":"c1","a":{"t":"Costo","d":"Valore delle risorse consumate nel periodo. Dimensione economica.","ex":"Servizio consumato a marzo: costo di marzo."},"b":{"t":"Pagamento","d":"Denaro uscito per estinguere un debito. Dimensione finanziaria.","ex":"Lo stesso servizio pagato ad aprile: pagamento di aprile."},"key":"Possono cadere in periodi diversi senza alcuna contraddizione. L'ammortamento è un costo senza pagamento nel periodo."},{"id":"c2","area":"c1","a":{"t":"Ricavo","d":"Nasce quando il bene o servizio viene ceduto e sorge il diritto a essere pagati.","ex":"Vendita oggi di 50.000 euro: ricavo oggi."},"b":{"t":"Incasso","d":"Nasce quando il cliente paga effettivamente.","ex":"Pagamento a 90 giorni: incasso tra tre mesi."},"key":"Nel frattempo esiste un credito verso il cliente. Più fatturato non significa automaticamente più liquidità."},{"id":"c3","area":"c1","a":{"t":"Utile","d":"Ricavi meno costi di competenza: misura la redditività e aumenta il patrimonio netto.","ex":"Impresa in utile con crediti elevati e scorte alte."},"b":{"t":"Liquidità","d":"Denaro disponibile: dipende da incassi, pagamenti, scorte, investimenti e finanziamenti.","ex":"La stessa impresa può avere poca cassa."},"key":"Non usare l'utile come proxy della cassa e non leggere la cassa senza capire da dove proviene."},{"id":"c4","area":"c3","a":{"t":"Costo diretto","d":"Riferibilità: il costo arriva all'oggetto con una misura diretta.","ex":"Responsabile dedicato a una commessa: diretto ma fisso."},"b":{"t":"Costo variabile","d":"Comportamento: il totale cambia con il livello di attività.","ex":"Energia di un impianto comune: indiretta ma variabile con le ore macchina."},"key":"Sono due dimensioni indipendenti: «a chi appartiene?» e «come cambia con l'attività?»."},{"id":"c5","area":"c3","a":{"t":"Costo indiretto","d":"Comune a più oggetti, richiede una base di allocazione.","ex":"Costo comune che cresce con ordini o transazioni: indiretto e variabile."},"b":{"t":"Costo fisso","d":"Stabile nel totale entro un intervallo di attività e un periodo.","ex":"Risorsa dedicata a un solo oggetto con costo stabile: diretta e fissa."},"key":"Indiretto non significa fisso. Classificare per oggetto e per driver separatamente."},{"id":"c6","area":"c15","a":{"t":"Costo pieno","d":"Misura l'assorbimento di risorse: diretti più quote di indiretti allocati.","ex":"Linea C: costo pieno 312,75 contro prezzo 289."},"b":{"t":"Costo rilevante","d":"Misura ciò che cambia tra le alternative: futuro, differenziale, causato dalla scelta.","ex":"Eliminare C fa perdere 102.000 di margine e risparmia solo 84.000."},"key":"Il costo pieno non dice che cosa scompare con la decisione. Nelle decisioni brevi si passa a costi differenziali e margini."},{"id":"c7","area":"c17","a":{"t":"Margine sul prezzo (margin)","d":"Percentuale calcolata sul prezzo: (prezzo - costo) / prezzo.","ex":"Costo 80, prezzo 100: margine sul prezzo 20%."},"b":{"t":"Ricarico sul costo (markup)","d":"Percentuale calcolata sul costo: prezzo = costo × (1 + percentuale di ricarico).","ex":"Costo 80, ricarico sul costo 25%: prezzo 100."},"key":"Stessi numeri, denominatori diversi. Confonderli porta a prezzi inferiori all'obiettivo."},{"id":"c8","area":"c12","a":{"t":"Budget","d":"Che cosa ci impegniamo a fare: baseline di responsabilità, di norma annuale.","ex":"Il budget approvato resta il riferimento per gli scostamenti."},"b":{"t":"Forecast","d":"Dove prevediamo di arrivare adesso: previsione aggiornata con consuntivi e driver correnti.","ex":"Impresa guida: previsione di chiusura 253.000 euro contro 269.900 di budget."},"key":"Non sono sinonimi e non si sovrascrivono: senza baseline stabile lo scostamento perde significato."},{"id":"c9","area":"c11","a":{"t":"ABC","d":"Misura quanto costano le attività e quali oggetti le richiedono.","ex":"Attrezzaggi 180.000 / 600 setup = 300 euro/setup."},"b":{"t":"ABM","d":"Chiede perché le attività esistono, se creano valore e come migliorarle.","ex":"Ridurre il numero di piccoli ordini o il tempo per ordine."},"key":"L'ABC è misura economica; l'ABM è intervento manageriale."},{"id":"c10","area":"c16","a":{"t":"Costo allocato","d":"Quota di un costo comune distribuita su un oggetto con una base.","ex":"40.000 euro di fissi allocati al componente da esternalizzare."},"b":{"t":"Costo evitabile","d":"Costo che scompare davvero scegliendo un'alternativa.","ex":"Solo 20.000 euro di fissi scompaiono con il Buy."},"key":"Un costo allocato che resta non è un risparmio: verrà redistribuito sugli oggetti rimanenti."},{"id":"c11","area":"c11","a":{"t":"Capacità liberata","d":"Tempo o risorse resi disponibili da un intervento.","ex":"Un processo libera 2.000 ore con organico invariato."},"b":{"t":"Risparmio monetario","d":"Spesa che diminuisce davvero perché le risorse vengono eliminate o rese evitabili.","ex":"Cliente X: 14.280 a tariffa, di cui solo 6.348 minore spesa immediata."},"key":"La capacità liberata diventa risparmio solo se viene ridotta o impiegata per altro lavoro."},{"id":"c12","area":"c8","a":{"t":"Full Costing","d":"Costo pieno: diretti più quote di indiretti.","ex":"Utile per sostenibilità di lungo periodo."},"b":{"t":"Direct Costing","d":"Margine di contribuzione: variabili ed eventualmente fissi specifici.","ex":"Utile per un ordine aggiuntivo con capacità libera."},"key":"Non sono concorrenti: si sceglie la vista in base alla decisione e si mantengono riconciliabili."},{"id":"c13","area":"c15","a":{"t":"Costo sommerso","d":"Già sostenuto e non recuperabile: va escluso.","ex":"Spese di un progetto già sostenute."},"b":{"t":"Costo opportunità","d":"Beneficio della migliore
