gia di un impianto comune è indiretta ai prodotti ma cresce con le ore macchina: indiretto e variabile.","r":"indiretti"},{"id":"e4","area":"c1","s":"Un'impresa in utile ha sempre cassa sufficiente.","ok":false,"e":"Crediti elevati, scorte, investimenti o rimborsi possono assorbire la cassa: utile e liquidità non sono intercambiabili.","r":"utile"},{"id":"e5","area":"c3","s":"Il costo del periodo è dato dal consumo della risorsa, non dall'acquisto.","ok":true,"e":"Corretto: materiali acquistati e non consumati restano in magazzino come attività.","r":"costo"},{"id":"e6","area":"c6","s":"Se l'allocazione quadra, la base scelta è corretta.","ok":false,"e":"La quadratura conferma il totale, non la rappresentatività della base: nell'impresa guida sia le ore sia le unità quadrano a 120.000, ma solo le ore riflettono l'assorbimento.","r":"quadrature"},{"id":"e7","area":"c4","s":"Quando il volume raddoppia, il costo fisso unitario si dimezza e l'azienda risparmia.","ok":false,"e":"Il costo fisso unitario scende, ma la spesa totale resta uguale: è maggiore assorbimento della capacità, non risparmio.","r":"fissi"},{"id":"e8","area":"c8","s":"Il margine di contribuzione è l'utile del prodotto.","ok":false,"e":"Il margine di contribuzione deve ancora coprire i costi fissi.","r":"mdc"},{"id":"e9","area":"c9","s":"Il break-even in unità si arrotonda sempre per eccesso.","ok":true,"e":"Corretto: il pareggio è la più piccola quantità intera che porta il risultato a zero o sopra zero.","r":"bep-unita"},{"id":"e10","area":"c9","s":"La leva operativa è una caratteristica costante dell'impresa.","ok":false,"e":"Cambia con il livello di attività e con le soglie di capacità; vicino al pareggio può diventare molto elevata.","r":"leva"},{"id":"e11","area":"c17","s":"Un ricarico sul costo del 25% corrisponde a un margine del 25% sul prezzo.","ok":false,"e":"Costo 80, ricarico sul costo 25%: prezzo 100 e margine sul prezzo 20%. Ricarico e margine hanno denominatori diversi.","r":"markup"},{"id":"e12","area":"c17","s":"Uno sconto del 5% sul prezzo riduce il margine unitario del 5%.","ok":false,"e":"Con prezzo 100 e costo variabile 70 il margine passa da 30 a 25: -16,7%. Lo sconto erode il margine più del fatturato.","r":"sconti"},{"id":"e13","area":"c15","s":"Con capacità libera, un ordine a prezzo inferiore al costo pieno può essere conveniente nel breve periodo.","ok":true,"e":"Corretto, se genera contributo positivo e non ha effetti negativi su prezzi esistenti e condizioni commerciali.","r":"cap-libera"},{"id":"e14","area":"c15","s":"I costi già sostenuti devono pesare nella decisione per non sprecare l'investimento.","ok":false,"e":"Sono costi sommersi: non cambiano tra le alternative e vanno esclusi. Continuare per giustificare il passato può distruggere valore.","r":"sunk"},{"id":"e15","area":"c16","s":"Nel Make or Buy si confronta il prezzo del fornitore con il costo pieno interno.","ok":false,"e":"Si confronta con il costo rilevante del Make: costi evitabili e incrementali, più eventuale costo opportunità. I fissi allocati che restano non sono un risparmio.","r":"make"},{"id":"e16","area":"c16","s":"La capacità liberata con il Buy è sempre un risparmio monetario.","ok":false,"e":"Crea valore solo se viene ridotta o riutilizzata; altrimenti diventa capacità inutilizzata.","r":"cap-liberata"},{"id":"e17","area":"c10","s":"L'ABC cambia il totale dei costi indiretti aziendali.","ok":false,"e":"L'ABC cambia la lettura delle risorse, non il loro totale: nell'esempio 86.000 euro si spostano da A a B con totale invariato.","r":"abc"},{"id":"e18","area":"c11","s":"Un'attività senza valore è automaticamente eliminabile.","ok":false,"e":"Un controllo può essere necessario per la qualità o il rispetto delle specifiche: va reso più efficiente o sostituito da una prevenzione migliore, non per forza eliminato.","r":"att-senza-valore"},{"id":"e19","area":"c11","s":"Clienti con gli stessi ricavi possono avere redditività molto diverse.","ok":true,"e":"Corretto: nell'impresa guida X e Y hanno entrambi 240.000 di ricavi ma margini del 24,2% e del 32,7% per effetto del costo di servizio.","r":"cost-to-serve"},{"id":"e20","area":"c12","s":"Il budget si prepara applicando una percentuale di crescita all'anno precedente.","ok":false,"e":"Il budget è un sistema di decisioni coordinate su vendite, produzione, acquisti, risorse, investimenti e liquidità.","r":"finalita-budget"},{"id":"e21","area":"c12","s":"Budget e forecast sono la stessa cosa.","ok":false,"e":"Il budget è la baseline di responsabilità; il forecast aggiorna la previsione con le informazioni più recenti.","r":"forecast"},{"id":"e22","area":"c12","s":"Un piano può produrre utile e generare tensione di cassa.","ok":true,"e":"Corretto: per questo budget economico, patrimoniale e finanziario devono essere collegati.","r":"b-tre-prospetti"},{"id":"e23","area":"c14","s":"Per valutare la gestione, il costo variabile effettivo va confrontato con il budget statico.","ok":false,"e":"Va confrontato con il budget flessibile, ricalcolato al volume effettivo; altrimenti si attribuisce alla gestione l'effetto volume.","r":"b-flessibile"},{"id":"e24","area":"c14","s":"Un costo inferiore al budget è sempre favorevole alla performance.","ok":false,"e":"Può derivare da attività non svolte, manutenzione rinviata o posizioni non coperte.","r":"scostamento"},{"id":"e25","area":"c14","s":"In un ponte del risultato si può calcolare l'ultima componente per differenza, così il prospetto quadra.","ok":false,"e":"Ogni componente deve avere una formula esplicita: nessuna riga ottenuta come residuo.","r":"bridge"},{"id":"e26","area":"c14","s":"Un prezzo di acquisto migliore dello standard può essere annullato da un maggiore impiego di materiale.","ok":true,"e":"Corretto: nell'esempio 6.200 euro favorevoli di prezzo sono superati da 8.400 euro sfavorevoli di impiego.","r":"sc-materiali"},{"id":"e27","area":"c18","s":"Quando le ore macchina sono sature, conviene produrre prima il prodotto con il margine unitario più alto.","ok":false,"e":"Con un vincolo attivo decide il margine per ora: nell'impresa guida B (76 euro/ora) viene prima di A (42) e C (17), anche se ha il margine unitario più basso.","r":"priorita"},{"id":"e28","area":"c18","s":"Il valore di un'ora aggiuntiva di capacità è sempre uguale al miglior margine per ora.","ok":false,"e":"È il margine del miglior impiego ancora disponibile: se la domanda del prodotto migliore è già servita, scende al rendimento del successivo.","r":"valore-capacita"},{"id":"e29","area":"c15","s":"Il costo opportunità va stimato anche quando la risorsa non ha un impiego alternativo.","ok":false,"e":"Se non esiste un'alternativa reale il costo opportunità può essere zero: non va inventato un valore teorico.","r":"opportunita"},{"id":"e30","area":"c3","s":"Una stessa voce di costo può essere diretta, fissa, controllabile e rilevante contemporaneamente.","ok":true,"e":"Corretto: le classificazioni si sommano, non si sostituiscono.","r":"errori-class"},{"id":"e31","area":"c4","s":"Una funzione di costo stimata sul passato è valida per qualsiasi volume futuro.","ok":false,"e":"Ogni funzione vale entro un intervallo di rilevanza: oltre le soglie di capacità il costo cambia livello.","r":"relevant-range"},{"id":"e32","area":"c4","s":"Il metodo dei livelli massimo e minimo è preciso perché usa i due valori estremi.","ok":false,"e":"Usa solo due osservazioni e può essere distorto da mesi anomali; con dati numerosi servono grafici, anomalie e regressione.","r":"high-low"},{"id":"e33","area":"c7","s":"Aumentare la produzione oltre le vendite migliora sempre il risultato.","ok":false,"e":"Con il Full Costing può spostare costi fissi industriali nelle scorte e migliorare solo apparentemente il risultato corrente.","r":"full-costing"},{"id":"e34","area":"c6","s":"Nel metodo a cascata l'ordine di chiusura dei centri può cambiare il risultato.","ok":true,"e":"Corretto: per questo la sequenza va fissata e mantenuta stabile.","r":"m-cascata"},{"id":"e35","area":"c15","s":"Gli ammortamenti vanno aggiunti all'investimento nel calcolo del VAN.","ok":false,"e":"Gli ammortamenti non sono flussi di cassa e non sono un secondo esborso.","r":"van"},{"id":"e36","area":"c15","s":"Un costo allocato a un prodotto sparisce se il prodotto viene eliminato.","ok":false,"e":"I costi comuni allocati che restano vengono redistribuiti sugli oggetti rimanenti: non sono un risparmio.","r":"d-non-evitabili"},{"id":"e37","area":"c17","s":"Il prezzo minimo con capacità satura comprende il costo opportunità.","ok":true,"e":"Corretto: prezzo minimo = costi incrementali + costo opportunità per unità.","r":"prezzo-minimo"},{"id":"e38","area":"c19","s":"Se il risultato prodotto con l'IA quadra con la contabilità, può essere pubblicato senza altri controlli.","ok":false,"e":"La quadratura è necessaria ma non sufficiente: servono anche mapping, formule, casi limite e validazione umana.","r":"ia-quadrature"},{"id":"e39","area":"c19","s":"L'IA può assumersi la responsabilità della decisione se il calcolo è corretto.","ok":false,"e":"L'IA supporta il controller: non certifica il risultato e non assume la responsabilità della decisione.","r":"ia-responsabilita"},{"id":"e40","area":"c19","s":"Una causa non supportata dai dati va presentata come ipotesi.","ok":true,"e":"Corretto: la distinzione tra dato verificato e interpretazione protegge dalla falsa sicurezza.","r":"ia-validazione"},{"id":"e41","area":"c19","s":"Un report impaginato per la lettura è sempre un buon dataset da elaborare.","ok":false,"e":"Serve l'esportazione strutturata: una riga per movimento, colonne tipizzate, nessuna cella unita, nessun totale intermedio.","r":"ia-dati"},{"id":"e42","area":"c9","s":"Il fatturato di pareggio non cambia se cambia il mix di vendita.","ok":false,"e":"Cambia il margine percentuale medio e quindi cambia il fatturato necessario al pareggio.","r":"bep-fatt"},{"id":"e43","area":"c16","s":"Rinunciare a una parte del volume può essere più redditizio che acquistare capacità.","ok":true,"e":"Corretto: nell'impresa guida C rende 17 euro/ora e la capacità aggiuntiva costa 26-28 euro/ora.","r":"mb-caso"},{"id":"e44","area":"c1","s":"Il patrimonio netto coincide con la cassa disponibile.","ok":false,"e":"Il patrimonio netto può essere investito in crediti, scorte e immobilizzazioni.","r":"sp"},{"id":"e45","area":"c13","s":"Le ore pagate coincidono con le ore produttive.","ok":false,"e":"Ferie, assenze, formazione e fermate riducono la capacità effettiva.","r":"b-lavoro"}];var ii=i=>Math.round(i*10)/10,Ii=i=>Math.round(i*100)/100,Ae=i=>Math.ceil(i-1e-9),m=(i,e,o,s="euro",t)=>({k:i,label:e,type:"num",ans:o,unit:s,tol:t!=null?t:s==="%"?.1:Number.isInteger(o)?.5:.01}),A=(i,e,o,s)=>({k:i,label:e,type:"sel",opts:o,ans:s}),Bi=["Diretto","Indiretto"],xi=["Fisso","Variabile"],Ci=["Rilevante","Irrilevante"],wi=["Evitabile","Non evitabile"],qi=["Favorevole","Sfavorevole"],ki=[{"id":"class","t":"Classificazione costi","area":"c3"},{"id":"margine","t":"Margine di contribuzione","area":"c8"},{"id":"full","t":"Full Costing","area":"c7"},{"id":"direct","t":"Direct Costing","area":"c8"},{"id":"bep","t":"Break-even","area":"c9"},{"id":"alloc","t":"Allocazione","area":"c6"},{"id":"abc","t":"ABC","area":"c10"},{"id":"budget","t":"Budget","area":"c13"},{"id":"scost","t":"Scostamenti","area":"c14"},{"id":"mob","t":"Make or Buy","area":"c16"},{"id":"pricing","t":"Pricing","area":"c17"},{"id":"mix","t":"Mix produttivo","area":"c18"}],O=[{"id":"ex-class-1","cat":"class","level":"base","area":"c3","title":"Diretto o indiretto? Fisso o variabile?","dati":[["Oggetto di costo","Il singolo prodotto (per la voce 4: la commessa)"],["Voce 1","Materiale incorporato nel prodotto"],["Voce 2","Affitto del capannone condiviso tra più linee"],["Voce 3","Energia di un impianto comune, cresce con le ore macchina"],["Voce 4","Responsabile dedicato esclusivamente a una commessa"]],"dom":"Classifica ogni voce per riferibilità e comportamento.","fields":[{"k":"v1a","label":"Voce 1 - riferibilità","type":"sel","opts":["Diretto","Indiretto"],"ans":0},{"k":"v1b","label":"Voce 1 - comportamento","type":"sel","opts":["Fisso","Variabile"],"ans":1},{"k":"v2a","label":"Voce 2 - riferibilità","type":"sel","opts":["Diretto","Indiretto"],"ans":1},{"k":"v2b","label":"Voce 2 - comportamento","type":"sel","opts":["Fisso","Variabile"],"ans":0},{"k":"v3a","label":"Voce 3 - riferibilità","type":"sel","opts":["Diretto","Indiretto"],"ans":1},{"k":"v3b","label":"Voce 3 - comportamento","type":"sel","opts":["Fisso","Variabile"],"ans":1},{"k":"v4a","label":"Voce 4 - riferibilità","type":"sel","opts":["Diretto","Indiretto"],"ans":0},{"k":"v4b","label":"Voce 4 - comportamento","type":"sel","opts":["Fisso","Variabile"],"ans":0}],"steps":["Voce 1: tracciabile sul prodotto e cresce con le unità → diretto e variabile.","Voce 2: sostiene più linee e resta stabile entro la capacità → indiretto e fisso.","Voce 3: comune a più prodotti ma cresce con le ore macchina → indiretto e variabile.","Voce 4: riferibile alla commessa ma stabile nel periodo → diretto e fisso."],"interp":"Riferibilità e comportamento sono due dimensioni indipendenti: in azienda servono entrambe, una per costruire il costo dell'oggetto, l'altra per simulare il costo al variare dei volumi.","ok":"Hai separato correttamente le due domande: «a chi appartiene?» e «come cambia con l'attività?».","ko":"Attenzione: diretto non significa variabile e indiretto non significa fisso. Rispondi separatamente alle due domande."},{"id":"ex-class-2","cat":"class","level":"intermedio","area":"c3","title":"Rilevante o irrilevante per un ordine aggiuntivo","dati":[["Situazione","Ordine aggiuntivo, capacità libera"],["Voce 1","Ammortamento dell'impianto esistente"],["Voce 2","Materiali necessari per l'ordine"],["Voce 3","Nuova attrezzatura da acquistare solo per l'ordine"],["Voce 4","Affitto del capannone, invariato"],["Voce 5","Spese di progettazione già sostenute lo scorso anno"]],"dom":"Quali voci sono rilevanti per decidere se accettare l'ordine?","fields":[{"k":"v1","label":"Voce 1","type":"sel","opts":["Rilevante","Irrilevante"],"ans":1},{"k":"v2","label":"Voce 2","type":"sel","opts":["Rilevante","Irrilevante"],"ans":0},{"k":"v3","label":"Voce 3","type":"sel","opts":["Rilevante","Irrilevante"],"ans":0},{"k":"v4","label":"Voce 4","type":"sel","opts":["Rilevante","Irrilevante"],"ans":1},{"k":"v5","label":"Voce 5","type":"sel","opts":["Rilevante","Irrilevante"],"ans":1}],"steps":["Tre verifiche: è futuro? cambia tra le alternative? è causato dalla scelta?","Voce 1: esiste comunque, non cambia → irrilevante.","Voce 2: nasce solo accettando l'ordine → rilevante.","Voce 3: nuovo investimento richiesto dall'ordine → rilevante.","Voce 4: resta identico → irrilevante.","Voce 5: costo sommerso → irrilevante."],"interp":"Nel business case dell'ordine entrano solo materiali e nuova attrezzatura, confrontati con i ricavi aggiuntivi.","ok":"Corretto: hai incluso solo i costi futuri, differenziali e causati dalla scelta.","ko":"Attenzione: un costo può essere corretto in contabilità e irrilevante nella decisione. Applica le tre verifiche a ogni voce."},{"id":"ex-class-3","cat":"class","level":"operativo","area":"c16","title":"Esternalizzare un componente: che cosa scompare davvero?","dati":[["Decisione","Passare dalla produzione interna (Make) all'acquisto (Buy)"],["Voce 1","Materiali del componente"],["Voce 2","Quota di costi comuni di stabilimento allocata al componente"],["Voce 3","Addetto che resterebbe in organico senza impiego alternativo"],["Voce 4","Contratto di manutenzione dedicato, disdettabile"],["Voce 5","Ammortamento della macchina già acquistata"]],"dom":"Classifica ogni voce come evitabile o non evitabile.","fields":[{"k":"v1","label":"Voce 1","type":"sel","opts":["Evitabile","Non evitabile"],"ans":0},{"k":"v2","label":"Voce 2","type":"sel","opts":["Evitabile","Non evitabile"],"ans":1},{"k":"v3","label":"Voce 3","type":"sel","opts":["Evitabile","Non evitabile"],"ans":1},{"k":"v4","label":"Voce 4","type":"sel","opts":["Evitabile","Non evitabile"],"ans":0},{"k":"v5","label":"Voce 5","type":"sel","opts":["Evitabile","Non evitabile"],"ans":1}],"steps":["Voce 1: scompare con il Buy → evitabile.","Voce 2: il costo comune resta e verrà redistribuito → non evitabile.","Voce 3: se resta senza impiego non è un risparmio → non evitabile.","Voce 4: dedicato e disdettabile → evitabile.","Voce 5: impianto già acquistato → non evitabile (sommerso)."],"interp":"Il risparmio del Buy è la somma dei soli costi evitabili: trattare come risparmio le quote allocate che restano porta a esternalizzazioni che peggiorano il risultato.","ok":"Corretto: hai distinto la quota allocata dal costo che scompare davvero.","ko":"Attenzione: una quota allocata non è automaticamente evitabile e la capacità liberata non è automaticamente un risparmio."},{"id":"ex-marg-1","cat":"margine","level":"base","area":"c8","title":"Margine unitario, percentuale e totale","dati":[["Prezzo unitario","120 euro"],["Costo variabile unitario","72 euro"],["Quantità venduta","5.000 unità"]],"dom":"Calcola margine unitario, margine percentuale e margine totale.","fields":[{"k":"mu","label":"Margine unitario","type":"num","ans":48,"unit":"euro","tol":0.5},{"k":"mp","label":"Margine percentuale","type":"num","ans":40,"unit":"%","tol":0.1},{"k":"mt","label":"Margine totale","type":"num","ans":240000,"unit":"euro","tol":0.5}],"steps":["Margine unitario = 120 - 72 = 48 euro.","Margine percentuale = 48 / 120 × 100 = 40%.","Margine totale = 48 × 5.000 = 240.000 euro."],"interp":"Ogni unità venduta contribuisce con 48 euro alla copertura della struttura; il totale di 240.000 euro è ciò che resta per i costi fissi e il risultato.","ok":"Corretto: hai usato il margine di contribuzione, che separa i costi che seguono il volume da quelli di struttura.","ko":"Ricorda: margine unitario = prezzo - costo variabile unitario; il percentuale si calcola sul prezzo (ricavi), non sul costo."},{"id":"ex-marg-2","cat":"margine","level":"intermedio","area":"c8","title":"Confrontare due linee","dati":[["Linea A","Prezzo 180 euro, costo variabile 117 euro, 8.000 unità"],["Linea B","Prezzo 114 euro, costo variabile 76 euro, 12.000 unità"]],"dom":"Calcola margine percentuale di A e di B, margine totale di B e indica quale linea genera il margine totale più alto.","fields":[{"k":"pa","label":"Margine % linea A","type":"num","ans":35,"unit":"%","tol":0.1},{"k":"pb","label":"Margine % linea B","type":"num","ans":33.3,"unit":"%","tol":0.1},{"k":"tb","label":"Margine totale linea B","type":"num","ans":456000,"unit":"euro","tol":0.5},{"k":"best","label":"Margine totale più alto","type":"sel","opts":["Linea A","Linea B"],"ans":0}],"steps":["A: margine unitario 180 - 117 = 63; 63 / 180 = 35%; totale 63 × 8.000 = 504.000.","B: margine unitario 114 - 76 = 38; 38 / 114 = 33,3%; totale 38 × 12.000 = 456.000.","A genera il margine totale più alto: 504.000 contro 456.000."],"interp":"Unitario, percentuale e totale raccontano aspetti diversi: A vince sul totale, ma se le ore macchina fossero scarse la graduatoria potrebbe cambiare (vedi mix produttivo).","ok":"Corretto: hai letto insieme margine percentuale e margine totale.","ko":"Attenzione: il margine percentuale non mostra il valore assoluto; il totale dipende dal volume."},{"id":"ex-marg-3","cat":"margine","level":"operativo","area":"c15","title":"Ordine aggiuntivo con capacità libera","dati":[["Prezzo di listino","120 euro"],["Costo variabile unitario","72 euro"],["Costo pieno unitario","122 euro"],["Ordine richiesto","1.000 unità a 90 euro"],["Capacità","Libera, nessun uso alternativo; nessun costo fisso incrementale"]],"dom":"Calcola il margine unitario dell'ordine e il contributo totale, poi decidi.","fields":[{"k":"mu","label":"Margine unitario dell'ordine","type":"num","ans":18,"unit":"euro","tol":0.5},{"k":"ct","label":"Contributo totale","type":"num","ans":18000,"unit":"euro","tol":0.5},{"k":"dec","label":"Decisione in prima analisi","type":"sel","opts":["Rifiutare: il prezzo è sotto il costo pieno","Accettare: genera contributo positivo, verificando effetti su prezzi e clienti esistenti"],"ans":1}],"steps":["Con capacità libera i costi fissi esistenti non cambiano: sono irrilevanti.","Margine unitario = 90 - 72 = 18 euro.","Contributo = 18 × 1.000 = 18.000 euro.","Il costo opportunità è nullo perché la capacità non ha usi alternativi."],"interp":"L'ordine migliora il risultato di 18.000 euro. Resta da verificare che non diventi il nuovo prezzo per gli altri clienti.","ok":"Corretto. Hai utilizzato il margine di contribuzione perché stiamo valutando una decisione di breve periodo con capacità disponibile.","ko":"Attenzione. Se hai usato il costo pieno, una parte dei costi allocati rimarrebbe anche rifiutando l'ordine."},{"id":"ex-full-1","cat":"full","level":"base","area":"c7","title":"Configurazioni progressive di costo","dati":[["Materiali","45 euro/unità"],["Lavoro diretto","25 euro/unità"],["Indiretti di produzione allocati","18 euro/unità"],["Costi commerciali e amministrativi allocati","12 euro/unità"]],"dom":"Calcola costo primo, costo industriale e costo complessivo.","fields":[{"k":"cp","label":"Costo primo","type":"num","ans":70,"unit":"euro","tol":0.5},{"k":"ci","label":"Costo industriale","type":"num","ans":88,"unit":"euro","tol":0.5},{"k":"cc","label":"Costo complessivo","type":"num","ans":100,"unit":"euro","tol":0.5}],"steps":["Costo primo = 45 + 25 = 70 euro.","Costo industriale = 70 + 18 = 88 euro.","Costo complessivo = 88 + 12 = 100 euro."],"interp":"Leggere il costo per strati mostra quanto pesa la struttura: 30 euro su 100 non sono consumi diretti.","ok":"Corretto: hai costruito il costo per strati invece di trattarlo come scatola chiusa.","ko":"Ricorda l'ordine: primo (diretti) → industriale (+ indiretti di produzione) → complessivo (+ commerciali e amministrativi)."},{"id":"ex-full-2","cat":"full","level":"intermedio","area":"c7","title":"Costo pieno con centro di costo","dati":[["Materiali","32 euro/unità"],["Lavoro diretto","18 euro/unità"],["Altri costi diretti","4 euro/unità"],["Centro Lavorazione","150.000 euro su 10.000 ore macchina"],["Ore macchina per unità","0,8"],["Commerciali e amministrativi allocati","9 euro/unità"],["Prezzo","80 euro"]],"dom":"Calcola costo primo, tariffa del centro, indiretti per unità, costo industriale, costo complessivo e risultato pieno unitario.","fields":[{"k":"cp","label":"Costo primo","type":"num","ans":54,"unit":"euro","tol":0.5},{"k":"tar","label":"Tariffa del centro (euro/ora)","type":"num","ans":15,"unit":"euro","tol":0.5},{"k":"ind","label":"Indiretti di produzione per unità","type":"num","ans":12,"unit":"euro","tol":0.5},{"k":"ci","label":"Costo industriale","type":"num","ans":66,"unit":"euro","tol":0.5},{"k":"cc","label":"Costo complessivo","type":"num","ans":75,"unit":"euro","tol":0.5},{"k":"rp","label":"Risultato pieno unitario","type":"num","ans":5,"unit":"euro","tol":0.5}],"steps":["Costo primo = 32 + 18 + 4 = 54 euro.","Tariffa = 150.000 / 10.000 = 15 euro/ora.","Indiretti per unità = 15 × 0,8 = 12 euro.","Costo industriale = 54 + 12 = 66 euro.","Costo complessivo = 66 + 9 = 75 euro.","Risultato pieno = 80 - 75 = 5 euro/unità."],"interp":"Il prodotto copre la struttura con 5 euro per unità. Il valore dipende dalla base (ore macchina): con una base diversa il costo pieno cambierebbe anche senza cambiare i consumi.","ok":"Corretto: hai trasferito gli indiretti con una tariffa per ora macchina.","ko":"Controlla il coefficiente: costi del centro / volume totale della base, poi × base consumata dall'unità."},{"id":"ex-full-3","cat":"full","level":"operativo","area":"c7","title":"La linea C «in perdita»","dati":[["Prezzo","289 euro"],["Costo variabile (diretto di produzione)","238 euro"],["Indiretti di produzione allocati","15 euro"],["Quota di struttura allocata sui ricavi","59,75 euro"]],"dom":"Calcola costo industriale, costo pieno, risultato pieno unitario e margine industriale; poi scegli la conclusione corretta.","fields":[{"k":"ci","label":"Costo industriale","type":"num","ans":253,"unit":"euro","tol":0.5},{"k":"cp","label":"Costo pieno","type":"num","ans":312.75,"unit":"euro","tol":0.01},{"k":"rp","label":"Risultato pieno unitario","type":"num","ans":-23.75,"unit":"euro","tol":0.01},{"k":"mi","label":"Margine industriale unitario","type":"num","ans":36,"unit":"euro","tol":0.5},{"k":"dec","label":"Conclusione","type":"sel","opts":["La linea va eliminata: perde 23,75 euro a pezzo","Il risultato pieno negativo va diagnosticato: prima si verificano i costi realmente evitabili"],"ans":1}],"steps":["Costo industriale = 238 + 15 = 253 euro.","Costo pieno = 253 + 59,75 = 312,75 euro.","Risultato pieno = 289 - 312,75 = -23,75 euro.","Margine industriale = 289 - 253 = 36 euro; margine di contribuzione = 289 - 238 = 51 euro."],"interp":"La perdita piena nasce dalla quota di struttura allocata. Nell'impresa guida eliminare C farebbe perdere 102.000 euro di margine risparmiando al massimo gli 84.000 euro di capacità esterna: il risultato operativo scenderebbe da 242.000 a 224.000 euro nell'ipotesi più favorevole.","ok":"Corretto: un risultato pieno negativo è un segnale da diagnosticare, non un ordine di eliminazione.","ko":"Attenzione: il costo pieno misura assorbimento, non ciò che scompare con la decisione."},{"id":"ex-dir-1","cat":"direct","level":"base","area":"c8","title":"Conto economico a margine","dati":[["Ricavi","200.000 euro"],["Costi variabili","120.000 euro"],["Costi fissi di struttura","55.000 euro"]],"dom":"Calcola margine di contribuzione e risultato operativo.","fields":[{"k":"mdc","label":"Margine di contribuzione","type":"num","ans":80000,"unit":"euro","tol":0.5},{"k":"ro","label":"Risultato operativo","type":"num","ans":25000,"unit":"euro","tol":0.5}],"steps":["Margine = 200.000 - 120.000 = 80.000 euro.","Risultato operativo = 80.000 - 55.000 = 25.000 euro."],"interp":"Il margine di 80.000 euro è la copertura disponibile per la struttura; quello che resta (25.000) è il risultato della gestione caratteristica.","ok":"Corretto: hai letto il risultato per gradini.","ko":"Ricorda: prima si sottraggono i costi variabili, poi la struttura."},{"id":"ex-dir-2","cat":"direct","level":"intermedio","area":"c8","title":"Direct Costing evoluto","dati":[["Ricavi","500.000 euro"],["Costi variabili","300.000 euro"],["Costi fissi specifici del segmento","70.000 euro"],["Costi fissi comuni","90.000 euro"]],"dom":"Calcola margine di contribuzione, secondo margine e risultato operativo.","fields":[{"k":"mdc","label":"Margine di contribuzione","type":"num","ans":200000,"unit":"euro","tol":0.5},{"k":"sm","label":"Secondo margine","type":"num","ans":130000,"unit":"euro","tol":0.5},{"k":"ro","label":"Risultato operativo","type":"num","ans":40000,"unit":"euro","tol":0.5}],"steps":["Margine = 500.000 - 300.000 = 200.000 euro.","Secondo margine = 200.000 - 70.000 = 130.000 euro.","Risultato operativo = 130.000 - 90.000 = 40.000 euro."],"interp":"Ogni gradino indica una leva diversa: costo variabile, struttura specifica, struttura comune. Il segmento contribuisce con 130.000 euro alla struttura comune.","ok":"Corretto: hai separato fissi specifici e fissi comuni.","ko":"Attenzione: i fissi comuni non vanno caricati nel secondo margine."},{"id":"ex-dir-3","cat":"direct","level":"operativo","area":"c8","title":"Margine per cliente","dati":[["Ricavi netti cliente Z","250.000 euro"],["Costi variabili prodotto","145.000 euro"],["Logistica, resi e assistenza","32.000 euro"],["Costi fissi specifici del cliente","18.000 euro"]],"dom":"Calcola margine di prodotto, margine del cliente dopo i costi variabili di servizio, secondo margine e secondo margine in percentuale dei ricavi.","fields":[{"k":"mp","label":"Margine di prodotto","type":"num","ans":105000,"unit":"euro","tol":0.5},{"k":"mc","label":"Margine del cliente dopo i costi variabili di servizio","type":"num","ans":73000,"unit":"euro","tol":0.5},{"k":"sm","label":"Secondo margine","type":"num","ans":55000,"unit":"euro","tol":0.5},{"k":"pc","label":"Secondo margine % sui ricavi","type":"num","ans":22,"unit":"%","tol":0.1}],"steps":["Margine di prodotto = 250.000 - 145.000 = 105.000 euro.","Margine del cliente dopo i costi variabili di servizio = 105.000 - 32.000 = 73.000 euro.","Secondo margine = 73.000 - 18.000 = 55.000 euro.","55.000 / 250.000 = 22%."],"interp":"Il margine di prodotto non coincide con il margine cliente: il modo in cui il cliente ordina, riceve e chiede assistenza assorbe 32.000 euro.","ok":"Corretto: hai portato il costo di servizio nella redditività del cliente.","ko":"Ricorda i livelli: prodotto → cliente (dopo costi di servizio) → secondo margine (dopo fissi specifici)."},{"id":"ex-bep-1","cat":"bep","level":"base","area":"c9","title":"Pareggio in unità e in fatturato","dati":[["Costi fissi","200.000 euro"],["Prezzo","100 euro"],["Costo variabile unitario","60 euro"]],"dom":"Calcola margine unitario, break-even in unità e break-even in fatturato.","fields":[{"k":"mu","label":"Margine unitario","type":"num","ans":40,"unit":"euro","tol":0.5},{"k":"bu","label":"Break-even in unità","type":"num","ans":5000,"unit":"unità","tol":0.5},{"k":"bf","label":"Break-even in fatturato","type":"num","ans":500000,"unit":"euro","tol":0.5}],"steps":["Margine unitario = 100 - 60 = 40 euro; margine % = 40%.","Break-even unità = 200.000 / 40 = 5.000 unità.","Break-even fatturato = 200.000 / 40% = 500.000 euro."],"interp":"A 5.000 unità il margine totale è 200.000 e copre esattamente i fissi: il risultato operativo è zero.","ok":"Corretto.","ko":"Ricorda: costi fissi / margine unitario (unità) oppure / margine percentuale (fatturato)."},{"id":"ex-bep-2","cat":"bep","level":"intermedio","area":"c9","title":"Pareggio e margine di sicurezza","dati":[["Prezzo","120 euro"],["Costo variabile unitario","72 euro"],["Costi fissi","250.000 euro"],["Vendite previste","7.000 unità"]],"dom":"Calcola break-even in unità (arrotondato per eccesso), break-even in fatturato, margine di sicurezza in euro e in percentuale.","fields":[{"k":"bu","label":"Break-even in unità","type":"num","ans":5209,"unit":"unità","tol":0.5},{"k":"bf","label":"Break-even in fatturato","type":"num","ans":625000,"unit":"euro","tol":0.5},{"k":"ms","label":"Margine di sicurezza","type":"num","ans":215000,"unit":"euro","tol":0.5},{"k":"msp","label":"Margine di sicurezza %","type":"num","ans":25.6,"unit":"%","tol":0.1}],"steps":["Margine unitario = 120 - 72 = 48 euro; margine % = 40%.","Break-even = 250.000 / 48 = 5.208,33 → 5.209 unità (per eccesso).","Fatturato di pareggio = 250.000 / 40% = 625.000 euro.","Vendite previste = 7.000 × 120 = 840.000 euro.","Margine di sicurezza = 840.000 - 625.000 = 215.000 euro; 215.000 / 840.000 = 25,6%."],"interp":"Le vendite possono scendere di circa un quarto prima di raggiungere il pareggio: va letto insieme alla stabilità della domanda.","ok":"Corretto: hai arrotondato per eccesso e calcolato la sicurezza sulle vendite previste.","ko":"Attenzione all'arrotondamento: il pareggio in unità si arrotonda sempre per eccesso. La percentuale si calcola sulle vendite previste."},{"id":"ex-bep-3","cat":"bep","level":"operativo","area":"c9","title":"Utile obiettivo e leva operativa","dati":[["Prezzo","120 euro"],["Costo variabile unitario","72 euro"],["Costi fissi","250.000 euro"],["Utile obiettivo","110.000 euro"],["Capacità massima","7.200 unità"],["Volume corrente","7.000 unità"]],"dom":"Calcola il volume per l'utile obiettivo, verifica la capacità, poi calcola la leva operativa al volume corrente.","fields":[{"k":"vt","label":"Volume target","type":"num","ans":7500,"unit":"unità","tol":0.5},{"k":"cap","label":"L'obiettivo è raggiungibile con la capacità attuale?","type":"sel","opts":["Sì","No"],"ans":1},{"k":"ro","label":"Risultato operativo a 7.000 unità","type":"num","ans":86000,"unit":"euro","tol":0.5},{"k":"leva","label":"Leva operativa a 7.000 unità","type":"num","ans":3.91,"unit":"x","tol":0.01}],"steps":["Volume target = (250.000 + 110.000) / 48 = 7.500 unità.","7.500 > 7.200 di capacità: l'obiettivo non è raggiungibile senza capacità aggiuntiva.","A 7.000 unità: margine = 48 × 7.000 = 336.000; risultato = 336.000 - 250.000 = 86.000 euro.","Leva = 336.000 / 86.000 = 3,91."],"interp":"Un obiettivo di utile è credibile solo se il volume è realizzabile. Con leva 3,91, un calo dell'1% del volume riduce il risultato di circa il 3,9%.","ok":"Corretto: hai collegato l'obiettivo economico al vincolo di capacità.","ko":"Ricorda di verificare sempre il volume richiesto contro domanda e capacità."},{"id":"ex-alloc-1","cat":"alloc","level":"base","area":"c6","title":"Coefficiente e costo allocato","dati":[["Costi del centro","240.000 euro"],["Base totale","12.000 ore"],["Ore consumate dal prodotto","150"]],"dom":"Calcola il coefficiente e il costo allocato al prodotto.","fields":[{"k":"c","label":"Coefficiente (euro/ora)","type":"num","ans":20,"unit":"euro","tol":0.5},{"k":"a","label":"Costo allocato","type":"num","ans":3000,"unit":"euro","tol":0.5}],"steps":["Coefficiente = 240.000 / 12.000 = 20 euro/ora.","Costo allocato = 20 × 150 = 3.000 euro."],"interp":"Il calcolo è semplice: la qualità dipende da perimetro del centro e rappresentatività della base.","ok":"Corretto.","ko":"Coefficiente = costi del centro / volume totale della base."},{"id":"ex-alloc-2","cat":"alloc","level":"intermedio","area":"c6","title":"Allocazione per linea e quadratura","dati":[["Indiretti di produzione","120.000 euro"],["Ore macchina totali","24.000"],["Linea A","12.000 ore; 8.000 unità"],["Linea B","6.000 ore; 12.000 unità"],["Linea C","6.000 ore; 2.000 unità"]],"dom":"Calcola coefficiente, costo allocato ad A, B e C, costo per unità di A e verifica la quadratura.","fields":[{"k":"c","label":"Coefficiente (euro/ora)","type":"num","ans":5,"unit":"euro","tol":0.5},{"k":"a","label":"Allocato ad A","type":"num","ans":60000,"unit":"euro","tol":0.5},{"k":"b","label":"Allocato a B","type":"num","ans":30000,"unit":"euro","tol":0.5},{"k":"cc","label":"Allocato a C","type":"num","ans":30000,"unit":"euro","tol":0.5},{"k":"ua","label":"Costo per unità di A","type":"num","ans":7.5,"unit":"euro","tol":0.01},{"k":"q","label":"Totale allocato (quadratura)","type":"num","ans":120000,"unit":"euro","tol":0.5}],"steps":["Coefficiente = 120.000 / 24.000 = 5 euro/ora. Per convenzione le 24.000 ore comprendono le 3.000 di capacità esterna; sulle sole 21.000 ore interne sarebbe 5,71.","A = 12.000 × 5 = 60.000; B = 6.000 × 5 = 30.000; C = 6.000 × 5 = 30.000.","Per unità: A 60.000 / 8.000 = 7,5 euro; B 2,50; C 15,00.","Quadratura: 60.000 + 30.000 + 30.000 = 120.000."],"interp":"Allocando sulle unità (5,4545 euro/unità) anche il totale quadrerebbe, ma B riceverebbe 65.455 euro: la quadratura non valida la scelta della base.","ok":"Corretto: hai allocato e verificato che origine = destinazione.","ko":"Verifica il coefficiente e che la somma degli allocati torni a 120.000."},{"id":"ex-alloc-3","cat":"alloc","level":"operativo","area":"c6","title":"Manutenzione: scegliere la base","dati":[["Costo della manutenzione","90.000 euro"],["Ore di intervento","Reparto 1: 1.200 · Reparto 2: 600 · Reparto 3: 200"],["Unità prodotte","Reparto 1: 10.000 · Reparto 2: 20.000 · Reparto 3: 30.000"]],"dom":"Scegli la base più rappresentativa, calcola coefficiente, quota del Reparto 1 e del Reparto 3, e la quota del Reparto 1 se si usassero le unità.","fields":[{"k":"base","label":"Base più rappresentativa","type":"sel","opts":["Unità prodotte","Ore di intervento"],"ans":1},{"k":"c","label":"Coefficiente (euro/ora di intervento)","type":"num","ans":45,"unit":"euro","tol":0.5},{"k":"r1","label":"Quota Reparto 1 (ore)","type":"num","ans":54000,"unit":"euro","tol":0.5},{"k":"r3","label":"Quota Reparto 3 (ore)","type":"num","ans":9000,"unit":"euro","tol":0.5},{"k":"u1","label":"Quota Reparto 1 se base = unità","type":"num","ans":15000,"unit":"euro","tol":0.5}],"steps":["Per la manutenzione la base più rappresentativa sono le ore di intervento.","Coefficiente = 90.000 / 2.000 = 45 euro/ora.","Reparto 1 = 1.200 × 45 = 54.000; Reparto 2 = 27.000; Reparto 3 = 200 × 45 = 9.000.","Con le unità: 90.000 / 60.000 = 1,5 euro/unità; Reparto 1 = 15.000 euro."],"interp":"Con la base «unità» il Reparto 1, che richiede più interventi, riceverebbe 15.000 invece di 54.000: il totale quadra ma la distribuzione è fuorviante.","ok":"Corretto: hai scelto la base che rappresenta la causa del costo.","ko":"Attenzione: una base comoda può quadrare e distorcere. Scegli la misura che spiega il consumo."},{"id":"ex-abc-1","cat":"abc","level":"base","area":"c10","title":"Tariffa di attività","dati":[["Costo attività Attrezzaggi","180.000 euro"],["Numero setup totali","600"],["Setup del prodotto A","80"]],"dom":"Calcola la tariffa per setup e il costo attribuito ad A.","fields":[{"k":"t","label":"Tariffa (euro/setup)","type":"num","ans":300,"unit":"euro","tol":0.5},{"k":"a","label":"Costo attribuito ad A","type":"num","ans":24000,"unit":"euro","tol":0.5}],"steps":["Tariffa = 180.000 / 600 = 300 euro/setup.","A = 80 × 300 = 24.000 euro."],"interp":"Il numero di pezzi non entra nel calcolo: la causa dell'attività è il setup.","ok":"Corretto.","ko":"Tariffa = costo attività / volume driver; costo oggetto = tariffa × driver consumato."},{"id":"ex-abc-2","cat":"abc","level":"intermedio","area":"c10","title":"Tre attività, un prodotto","dati":[["Gestione ordini","240.000 euro / 12.000 ordini"],["Controllo qualità","150.000 euro / 3.000 controlli"],["Assistenza","210.000 euro / 7.000 ore"],["Prodotto Z consuma","500 ordini, 120 controlli, 300 ore di assistenza"]],"dom":"Calcola le tre tariffe e il costo ABC attribuito a Z.","fields":[{"k":"t1","label":"Tariffa ordini","type":"num","ans":20,"unit":"euro","tol":0.5},{"k":"t2","label":"Tariffa controlli","type":"num","ans":50,"unit":"euro","tol":0.5},{"k":"t3","label":"Tariffa ore assistenza","type":"num","ans":30,"unit":"euro","tol":0.5},{"k":"z","label":"Costo attribuito a Z","type":"num","ans":25000,"unit":"euro","tol":0.5}],"steps":["Ordini: 240.000 / 12.000 = 20 euro/ordine.","Controlli: 150.000 / 3.000 = 50 euro/controllo.","Assistenza: 210.000 / 7.000 = 30 euro/ora.","Z = 500 × 20 + 120 × 50 + 300 × 30 = 10.000 + 6.000 + 9.000 = 25.000 euro."],"interp":"Ogni tariffa ha un driver, una fonte e un controllo di completezza: senza questi elementi il modello non è ripetibile.","ok":"Corretto.","ko":"Calcola una tariffa per ogni pool, poi moltiplica per il driver consumato."},{"id":"ex-abc-3","cat":"abc","level":"operativo","area":"c11","title":"Costo di servizio di due clienti","dati":[["Tariffe","20 euro/ordine · 30 euro/consegna · 20 euro/ora assistenza"],["Cliente X","600 ordini, 300 consegne, 250 ore"],["Cliente Y","150 ordini, 60 consegne, 40 ore"],["Entrambi","Ricavi 240.000 euro; margine di prodotto 84.000 euro"]],"dom":"Calcola costo di servizio di X e di Y, margine cliente di X e di Y e margine % di X.","fields":[{"k":"cx","label":"Costo di servizio X","type":"num","ans":26000,"unit":"euro","tol":0.5},{"k":"cy","label":"Costo di servizio Y","type":"num","ans":5600,"unit":"euro","tol":0.5},{"k":"mx","label":"Margine cliente X","type":"num","ans":58000,"unit":"euro","tol":0.5},{"k":"my","label":"Margine cliente Y","type":"num","ans":78400,"unit":"euro","tol":0.5},{"k":"px","label":"Margine % X","type":"num","ans":24.2,"unit":"%","tol":0.1}],"steps":["X = 600 × 20 + 300 × 30 + 250 × 20 = 12.000 + 9.000 + 5.000 = 26.000 euro.","Y = 150 × 20 + 60 × 30 + 40 × 20 = 3.000 + 1.800 + 800 = 5.600 euro.","Margine X = 84.000 - 26.000 = 58.000; margine Y = 84.000 - 5.600 = 78.400.","Margine % X = 58.000 / 240.000 = 24,2% (Y: 32,7%)."],"interp":"Stessi ricavi, redditività diversa. Leve su X: minimo d'ordine, calendario consegne, pacchetti di assistenza - senza dimenticare che la riduzione a tariffa non è tutta minore spesa.","ok":"Corretto: la domanda di attività è il vero driver del margine cliente.","ko":"Moltiplica ogni driver del cliente per la sua tariffa e somma."},{"id":"ex-bud-1","cat":"budget","level":"base","area":"c13","title":"Budget vendite","dati":[["Prodotto A","8.000 unità a 120 euro"],["Prodotto B","5.000 unità a 80 euro"]],"dom":"Calcola i ricavi di A, di B e il totale.","fields":[{"k":"a","label":"Ricavi A","type":"num","ans":960000,"unit":"euro","tol":0.5},{"k":"b","label":"Ricavi B","type":"num","ans":400000,"unit":"euro","tol":0.5},{"k":"t","label":"Totale","type":"num","ans":1360000,"unit":"euro","tol":0.5}],"steps":["A = 8.000 × 120 = 960.000 euro.","B = 5.000 × 80 = 400.000 euro.","Totale = 1.360.000 euro."],"interp":"Separare quantità e prezzo rende il piano verificabile e prepara l'analisi degli scostamenti.","ok":"Corretto.","ko":"Ricavi di budget = quantità previste × prezzo previsto."},{"id":"ex-bud-2","cat":"budget","level":"intermedio","area":"c13","title":"Produzione, materiali e lavoro","dati":[["Vendite previste","8.000 unità"],["Scorta finale desiderata","1.200 unità"],["Scorta iniziale","900 unità"],["Consumo standard","3 kg/unità"],["Tempo standard","0,5 ore/unità"]],"dom":"Calcola produzione, fabbisogno materiali e ore necessarie.","fields":[{"k":"p","label":"Produzione","type":"num","ans":8300,"unit":"unità","tol":0.5},{"k":"m","label":"Fabbisogno materiali","type":"num","ans":24900,"unit":"kg","tol":0.5},{"k":"h","label":"Ore necessarie","type":"num","ans":4150,"unit":"ore","tol":0.5}],"steps":["Produzione = 8.000 + 1.200 - 900 = 8.300 unità.","Fabbisogno = 8.300 × 3 = 24.900 kg.","Ore = 8.300 × 0,5 = 4.150 ore."],"interp":"Le ore vanno confrontate con la capacità realmente disponibile: il gap genera straordinari, turni, assunzioni, formazione o esternalizzazioni.","ok":"Corretto.","ko":"Produzione = vendite + scorte finali - scorte iniziali; poi applica consumi e tempi standard alla produzione, non alle vendite."},{"id":"ex-bud-3","cat":"budget","level":"operativo","area":"c13","title":"Catena completa del budget operativo","dati":[["Vendite","10.000 unità a 50 euro"],["Scorte prodotti","Iniziale 1.000 · Finale desiderata 1.500"],["Consumo standard","2 kg/unità"],["Scorte materie","Iniziale 2.000 kg · Finale desiderata 3.000 kg"],["Prezzo materia","4 euro/kg"],["Tempo standard","0,4 ore/unità"],["Capacità disponibile","4.000 ore"]],"dom":"Completa ricavi, produzione, fabbisogno, acquisti in kg e in euro, ore necessarie e gap di capacità.","fields":[{"k":"r","label":"Ricavi","type":"num","ans":500000,"unit":"euro","tol":0.5},{"k":"p","label":"Produzione","type":"num","ans":10500,"unit":"unità","tol":0.5},{"k":"f","label":"Fabbisogno materiali","type":"num","ans":21000,"unit":"kg","tol":0.5},{"k":"a","label":"Acquisti","type":"num","ans":22000,"unit":"kg","tol":0.5},{"k":"av","label":"Valore acquisti","type":"num","ans":88000,"unit":"euro","tol":0.5},{"k":"h","label":"Ore necessarie","type":"num","ans":4200,"unit":"ore","tol":0.5},{"k":"g","label":"Ore mancanti rispetto alla capacità","type":"num","ans":200,"unit":"ore","tol":0.5}],"steps":["Ricavi = 10.000 × 50 = 500.000 euro.","Produzione = 10.000 + 1.500 - 1.000 = 10.500 unità.","Fabbisogno = 10.500 × 2 = 21.000 kg.","Acquisti = 21.000 + 3.000 - 2.000 = 22.000 kg; valore = 22.000 × 4 = 88.000 euro.","Ore = 10.500 × 0,4 = 4.200 ore; gap = 4.200 - 4.000 = 200 ore."],"interp":"Il piano è economicamente coerente ma richiede 200 ore oltre la capacità: va deciso come coprirle prima di approvare il budget. Gli acquisti alimentano anche il budget di cassa.","ok":"Corretto: hai collegato vendite, produzione, acquisti, lavoro e capacità.","ko":"Segui la catena: vendite → produzione → fabbisogno → acquisti; ore dalla produzione, poi confronto con la capacità."},{"id":"ex-sc-1","cat":"scost","level":"base","area":"c14","title":"Budget statico e flessibile","dati":[["Budget statico","10.000 unità × 6 euro di materiale = 60.000 euro"],["Volume effettivo","11.000 unità"],["Costo materiale effettivo","68.200 euro"]],"dom":"Calcola il budget flessibile, lo scostamento operativo e la quota di differenza dovuta al volume.","fields":[{"k":"bf","label":"Budget flessibile","type":"num","ans":66000,"unit":"euro","tol":0.5},{"k":"sg","label":"Scostamento operativo (importo)","type":"num","ans":2200,"unit":"euro","tol":0.5},{"k":"sgf","label":"Segno dello scostamento operativo","type":"sel","opts":["Favorevole","Sfavorevole"],"ans":1},{"k":"ev","label":"Differenza dovuta al volume","type":"num","ans":6000,"unit":"euro","tol":0.5}],"steps":["Budget flessibile = 11.000 × 6 = 66.000 euro.","Gestione = 68.200 - 66.000 = 2.200 euro, sfavorevole (maggior costo).","Volume = 66.000 - 60.000 = 6.000 euro: dipende dalla maggiore attività."],"interp":"Attribuire alla gestione 8.200 euro sarebbe sbagliato: 6.000 derivano semplicemente dal maggior volume.","ok":"Corretto: hai usato il budget flessibile.","ko":"Attenzione: il costo variabile effettivo si confronta con il budget flessibile, non con quello statico."},{"id":"ex-sc-2","cat":"scost","level":"intermedio","area":"c14","title":"Materiali e lavoro","dati":[["Materiali","P eff 2,75 · P std 3,00 · Q eff 24.800 kg · Q std ammessa 22.000 kg"],["Lavoro","T eff 25 · T std 24 · Ore eff 2.900 · Ore std ammesse 2.750"]],"dom":"Calcola prezzo, impiego, tariffa ed efficienza (importo e segno).","fields":[{"k":"pm","label":"Prezzo materiali (importo)","type":"num","ans":6200,"unit":"euro","tol":0.5},{"k":"pmf","label":"Prezzo materiali","type":"sel","opts":["Favorevole","Sfavorevole"],"ans":0},{"k":"im","label":"Impiego materiali (importo)","type":"num","ans":8400,"unit":"euro","tol":0.5},{"k":"imf","label":"Impiego materiali","type":"sel","opts":["Favorevole","Sfavorevole"],"ans":1},{"k":"ta","label":"Tariffa (importo)","type":"num","ans":2900,"unit":"euro","tol":0.5},{"k":"taf","label":"Tariffa","type":"sel","opts":["Favorevole","Sfavorevole"],"ans":1},{"k":"ef","label":"Efficienza (importo)","type":"num","ans":3600,"unit":"euro","tol":0.5},{"k":"eff","label":"Efficienza","type":"sel","opts":["Favorevole","Sfavorevole"],"ans":1}],"steps":["Prezzo = (2,75 - 3,00) × 24.800 = -6.200 → 6.200 favorevole.","Impiego = (24.800 - 22.000) × 3 = 8.400 → sfavorevole.","Tariffa = (25 - 24) × 2.900 = 2.900 → sfavorevole.","Efficienza = (2.900 - 2.750) × 24 = 3.600 → sfavorevole."],"interp":"Il prezzo di acquisto migliore è annullato da maggiori consumi. Prima di attribuire le responsabilità va collegato ogni scostamento al processo: acquisti, qualità, produzione.","ok":"Corretto: hai applicato prezzo alla quantità effettiva e consumo al prezzo standard.","ko":"Ricorda: prezzo sulla quantità effettiva; impiego/efficienza valorizzati allo standard."},{"id":"ex-sc-3","cat":"scost","level":"operativo","area":"c14","title":"Volume, prezzo e risultato","dati":[["Budget statico","10.000 unità · ricavi 250.000 · risultato 50.000"],["Budget flessibile","11.000 unità · ricavi 275.000 · risultato 63.000"],["Consuntivo","11.000 unità · ricavi 269.500 · risultato 46.800"]],"dom":"Calcola effetto volume sui ricavi, effetto prezzo, effetto volume sul risultato e scostamento totale del risultato.","fields":[{"k":"ev","label":"Effetto volume sui ricavi","type":"num","ans":25000,"unit":"euro","tol":0.5},{"k":"ep","label":"Effetto prezzo sui ricavi","type":"num","ans":-5500,"unit":"euro","tol":0.5},{"k":"er","label":"Effetto volume sul risultato","type":"num","ans":13000,"unit":"euro","tol":0.5},{"k":"st","label":"Scostamento totale del risultato","type":"num","ans":-3200,"unit":"euro","tol":0.5}],"steps":["P bud = 250.000 / 10.000 = 25; P eff = 269.500 / 11.000 = 24,5.","Volume ricavi = (11.000 - 10.000) × 25 = 25.000 euro.","Prezzo = (24,5 - 25) × 11.000 = -5.500 euro.","Volume sul risultato = 63.000 - 50.000 = 13.000 euro.","Totale = 46.800 - 50.000 = -3.200 euro."],"interp":"Il risultato è 3.200 euro sotto il budget statico, ma il maggior volume ha prodotto +13.000: prezzo, materiali, lavoro e struttura hanno assorbito 16.200 euro. Serve un ponte del risultato completo con azioni correttive.","ok":"Corretto: hai separato l'effetto attività dalla gestione.","ko":"Effetto prezzo = (P eff - P bud) × Q eff; effetto volume = (Q eff - Q bud) × P bud. Scrivi i negativi con il segno meno."},{"id":"ex-mob-1","cat":"mob","level":"base","area":"c16","title":"Make or Buy su 10.000 unità","dati":[["Make","Materiali 60.000 · lavoro evitabile 40.000 · variabili indiretti 20.000 · fissi evitabili 20.000"],["Fissi allocati che restano","40.000 (non evitabili)"],["Buy","Prezzo fornitore 140.000 · trasporto e controlli 8.000"]],"dom":"Calcola costo rilevante del Make, del Buy e la differenza; poi indica la scelta economica.","fields":[{"k":"m","label":"Make rilevante","type":"num","ans":140000,"unit":"euro","tol":0.5},{"k":"b","label":"Buy rilevante","type":"num","ans":148000,"unit":"euro","tol":0.5},{"k":"d","label":"Differenza (Buy - Make)","type":"num","ans":8000,"unit":"euro","tol":0.5},{"k":"s","label":"Scelta economica, senza usi alternativi della capacità","type":"sel","opts":["Make","Buy"],"ans":0}],"steps":["Make = 60.000 + 40.000 + 20.000 + 20.000 = 140.000 euro.","I 40.000 di fissi allocati che restano non entrano: non sono un risparmio.","Buy = 140.000 + 8.000 = 148.000 euro.","Il Buy costa 8.000 euro in più."],"interp":"Il Buy diventerebbe conveniente se la capacità liberata generasse più di 8.000 euro di margine alternativo reale.","ok":"Corretto: hai confrontato perimetri comparabili e solo costi evitabili.","ko":"Attenzione: i fissi allocati che restano non sono un risparmio del Buy; trasporto e controlli fanno parte del costo del Buy."},{"id":"ex-mob-2","cat":"mob","level":"intermedio","area":"c16","title":"Punto di indifferenza","dati":[["Make","120.000 euro di fissi + 9 euro/unità"],["Buy","15 euro/unità"],["Volume atteso","15.000 unità"]],"dom":"Calcola la soglia, il costo del Make e del Buy al volume atteso e scegli.","fields":[{"k":"q","label":"Volume di indifferenza","type":"num","ans":20000,"unit":"unità","tol":0.5},{"k":"m","label":"Costo Make a 15.000 unità","type":"num","ans":255000,"unit":"euro","tol":0.5},{"k":"b","label":"Costo Buy a 15.000 unità","type":"num","ans":225000,"unit":"euro","tol":0.5},{"k":"s","label":"Scelta al volume atteso","type":"sel","opts":["Make","Buy"],"ans":1}],"steps":["Soglia = 120.000 / (15 - 9) = 20.000 unità.","Make = 120.000 + 9 × 15.000 = 255.000 euro.","Buy = 15 × 15.000 = 225.000 euro.","Sotto la soglia conviene il Buy (30.000 euro in meno)."],"interp":"La soglia è più utile del confronto su un volume: se i volumi superassero stabilmente 20.000 unità il business case cambierebbe.","ok":"Corretto.","ko":"Soglia = costi fissi Make / (prezzo Buy - costo variabile Make)."},{"id":"ex-mob-3","cat":"mob","level":"operativo","area":"c16","title":"Esternalizzare con capacità riutilizzabile","dati":[["Volume","8.000 unità"],["Make","Materiali 24 · lavoro evitabile 10 · variabili indiretti 4 (euro/unità) · fissi specifici evitabili 40.000"],["Fissi comuni allocati","56.000 (restano)"],["Buy","Prezzo 45 euro/unità · trasporto e controlli 2 euro/unità"],["Capacità liberata","Margine alternativo realmente ottenibile 30.000 euro"]],"dom":"Calcola Make rilevante, Buy rilevante, Make comprensivo del costo opportunità e decidi.","fields":[{"k":"m","label":"Make rilevante","type":"num","ans":344000,"unit":"euro","tol":0.5},{"k":"b","label":"Buy rilevante","type":"num","ans":376000,"unit":"euro","tol":0.5},{"k":"mo","label":"Make + costo opportunità","type":"num","ans":374000,"unit":"euro","tol":0.5},{"k":"s","label":"Scelta economica","type":"sel","opts":["Make","Buy"],"ans":0}],"steps":["Make = (24 + 10 + 4) × 8.000 + 40.000 = 304.000 + 40.000 = 344.000 euro.","Buy = (45 + 2) × 8.000 = 376.000 euro.","Make + costo opportunità = 344.000 + 30.000 = 374.000 euro.","374.000 < 376.000: il Make resta più conveniente di 2.000 euro."],"interp":"Chi confrontasse il Buy con il costo pieno (344.000 + 56.000 = 400.000) sceglierebbe il Buy per errore. Il margine è sottile: qualità, rischio e reversibilità possono pesare più dei 2.000 euro.","ok":"Corretto: hai incluso il costo opportunità ed escluso i fissi comuni.","ko":"Attenzione: i 56.000 di fissi comuni restano comunque; il costo opportunità si aggiunge al Make se l'alternativa è reale."},{"id":"ex-pr-1","cat":"pricing","level":"base","area":"c17","title":"Ricarico sul costo e margine sul prezzo","dati":[["Costo","80 euro"],["Ricarico sul costo (markup)","25%"]],"dom":"Calcola il prezzo e il margine percentuale sul prezzo.","fields":[{"k":"p","label":"Prezzo","type":"num","ans":100,"unit":"euro","tol":0.5},{"k":"m","label":"Margine sul prezzo %","type":"num","ans":20,"unit":"%","tol":0.1}],"steps":["Prezzo = 80 × (1 + 25%) = 100 euro.","Margine sul prezzo = (100 - 80) / 100 = 20%."],"interp":"Un ricarico sul costo del 25% non è un margine del 25%: specificare sempre base di costo e denominatore.","ok":"Corretto.","ko":"Il ricarico si calcola sul costo, il margine sul prezzo."},{"id":"ex-pr-2","cat":"pricing","level":"intermedio","area":"c17","title":"L'effetto di uno sconto","dati":[["Prezzo","100 euro"],["Costo variabile","70 euro"],["Volume attuale","1.000 unità"],["Sconto proposto","5%"]],"dom":"Calcola nuovo prezzo, nuovo margine unitario, riduzione percentuale del margine e volume necessario per mantenere il margine totale.","fields":[{"k":"np","label":"Nuovo prezzo","type":"num","ans":95,"unit":"euro","tol":0.5},{"k":"nm","label":"Nuovo margine unitario","type":"num","ans":25,"unit":"euro","tol":0.5},{"k":"rid","label":"Riduzione del margine unitario","type":"num","ans":16.7,"unit":"%","tol":0.1},{"k":"v","label":"Volume necessario","type":"num","ans":1200,"unit":"unità","tol":0.5}],"steps":["Nuovo prezzo = 100 × 0,95 = 95 euro.","Nuovo margine = 95 - 70 = 25 euro.","Riduzione = (30 - 25) / 30 = 16,7%.","Volume = 30.000 / 25 = 1.200 unità (+20%)."],"interp":"Uno sconto del 5% richiede +20% di volume solo per restare fermi, prima di considerare capacità e costi aggiuntivi.","ok":"Corretto: hai misurato lo sconto sul margine.","ko":"Attenzione: lo sconto va misurato sul margine, non solo sul fatturato."},{"id":"ex-pr-3","cat":"pricing","level":"operativo","area":"c17","title":"Prezzo minimo con capacità libera e satura","dati":[["Costi incrementali dell'ordine","60 euro/unità"],["Ore macchina per unità","2"],["Margine per ora dell'attività che verrebbe sacrificata","30 euro/ora"],["Prezzo offerto dal cliente","105 euro"]],"dom":"Calcola il prezzo minimo con capacità libera e con capacità satura, poi decidi in caso di capacità satura.","fields":[{"k":"pl","label":"Prezzo minimo con capacità libera","type":"num","ans":60,"unit":"euro","tol":0.5},{"k":"co","label":"Costo opportunità per unità","type":"num","ans":60,"unit":"euro","tol":0.5},{"k":"ps","label":"Prezzo minimo con capacità satura","type":"num","ans":120,"unit":"euro","tol":0.5},{"k":"d","label":"Con capacità satura, a 105 euro","type":"sel","opts":["Accettare","Non accettare (o rinegoziare)"],"ans":1}],"steps":["Capacità libera: soglia = costi incrementali = 60 euro.","Costo opportunità = 2 ore × 30 euro = 60 euro/unità.","Capacità satura: 60 + 60 = 120 euro.","105 < 120: con capacità satura l'ordine distruggerebbe 15 euro per unità rispetto all'uso alternativo."],"interp":"Con capacità libera 105 euro darebbe un contributo di 45 euro/unità; con capacità satura lo stesso prezzo è insufficiente. La capacità diventa componente economica del prezzo.","ok":"Corretto: hai integrato il costo opportunità della capacità.","ko":"Ricorda: con capacità satura prezzo minimo = costi incrementali + costo opportunità per unità."},{"id":"ex-mix-1","cat":"mix","level":"base","area":"c18","title":"Margine per ora","dati":[["Prodotto A","Margine 60 euro · 3 ore macchina"],["Prodotto B","Margine 45 euro · 1,5 ore macchina"],["Vincolo","Ore macchina limitate"]],"dom":"Calcola il margine per ora di A e B e indica la priorità.","fields":[{"k":"a","label":"Margine per ora A","type":"num","ans":20,"unit":"euro","tol":0.5},{"k":"b","label":"Margine per ora B","type":"num","ans":30,"unit":"euro","tol":0.5},{"k":"p","label":"Priorità","type":"sel","opts":["A","B"],"ans":1}],"steps":["A = 60 / 3 = 20 euro/ora.","B = 45 / 1,5 = 30 euro/ora.","B ha priorità anche se il suo margine unitario è più basso."],"interp":"Con un vincolo attivo l'obiettivo è massimizzare il margine del sistema, non quello del singolo pezzo.","ok":"Corretto.","ko":"Dividi il margine unitario per le ore del vincolo assorbite da ogni unità."},{"id":"ex-mix-2","cat":"mix","level":"intermedio","area":"c18","title":"Graduatoria dell'impresa guida","dati":[["Linea A","Margine 63 · 1,5 ore"],["Linea B","Margine 38 · 0,5 ore"],["Linea C","Margine 51 · 3 ore"]],"dom":"Calcola il margine per ora di ogni linea e scegli la graduatoria corretta.","fields":[{"k":"a","label":"Margine per ora A","type":"num","ans":42,"unit":"euro","tol":0.5},{"k":"b","label":"Margine per ora B","type":"num","ans":76,"unit":"euro","tol":0.5},{"k":"c","label":"Margine per ora C","type":"num","ans":17,"unit":"euro","tol":0.5},{"k":"g","label":"Graduatoria","type":"sel","opts":["A, C, B","B, A, C","C, A, B"],"ans":1}],"steps":["A = 63 / 1,5 = 42 euro/ora.","B = 38 / 0,5 = 76 euro/ora.","C = 51 / 3 = 17 euro/ora.","Graduatoria: B, A, C (per margine unitario sarebbe A, C, B)."],"interp":"Le due graduatorie sono completamente diverse: con ore sature decide il margine per ora.","ok":"Corretto.","ko":"Attenzione a non ordinare per margine unitario quando le ore sono il vincolo."},{"id":"ex-mix-3","cat":"mix","level":"operativo","area":"c18","title":"Saturare 21.000 ore","dati":[["Capacità ordinaria","21.000 ore"],["Domanda","B 12.000 unità (0,5 h) · A 8.000 (1,5 h) · C 2.000 (3 h)"],["Margini unitari","B 38 · A 63 · C 51"],["Struttura base","736.000 euro"],["Capacità esterna","28 euro/ora"]],"dom":"Costruisci il mix che satura la capacità, calcola unità di C, margine totale e risultato operativo; valuta l'acquisto di ore esterne per C.","fields":[{"k":"c","label":"Unità di C producibili","type":"num","ans":1000,"unit":"unità","tol":0.5},{"k":"m","label":"Margine totale","type":"num","ans":1011000,"unit":"euro","tol":0.5},{"k":"ro","label":"Risultato operativo","type":"num","ans":275000,"unit":"euro","tol":0.5},{"k":"v","label":"Margine per ora di C (valore dell'ora aggiuntiva)","type":"num","ans":17,"unit":"euro","tol":0.5},{"k":"d","label":"Comprare ore esterne a 28 euro per produrre più C?","type":"sel","opts":["Sì","No"],"ans":1}],"steps":["B: 12.000 × 0,5 = 6.000 ore; A: 8.000 × 1,5 = 12.000 ore; restano 3.000 ore.","C: 3.000 / 3 = 1.000 unità.","Margine = 456.000 + 504.000 + 51.000 = 1.011.000 euro.","Risultato = 1.011.000 - 736.000 = 275.000 euro.","Un'ora in più andrebbe a C e vale 17 euro, meno dei 28 euro dell'ora esterna."],"interp":"Servire tutto C comprando ore porterebbe il risultato a 242.000 (-33.000): quantificare la deviazione rende trasparente il costo di una scelta commerciale.","ok":"Corretto: hai applicato la regola con un solo vincolo e verificato il valore della capacità aggiuntiva.","ko":"Assegna le ore in ordine di margine per ora fino alla domanda massima, poi passa al prodotto successivo."}];var Me=i=>Math.round(i*10)/10,ye=i=>Math.ceil(i-1e-9),M=(i,e,o,s="euro",t)=>({k:i,label:e,type:"num",ans:o,unit:s,tol:t!=null?t:s==="%"?.1:Number.isInteger(o)?.5:.01}),U=(i,e,o,s)=>({k:i,label:e,type:"sel",opts:o,ans:s}),D=[{"id":"caso-1","area":"c9","title":"L'ordine a 90 euro","min":5,"scenario":"Un prodotto viene venduto a 120 euro. Il costo variabile è 72 euro. I costi fissi aziendali sono 250.000 euro. Arriva un ordine aggiuntivo a 90 euro e la capacità è libera.","fields":[{"k":"mu","label":"Qual è il margine unitario?","type":"num","ans":48,"unit":"euro","tol":0.5},{"k":"mp","label":"Qual è il margine percentuale?","type":"num","ans":40,"unit":"%","tol":0.1},{"k":"bep","label":"Quante unità servono per il break-even?","type":"num","ans":5209,"unit":"unità","tol":0.5},{"k":"costi","label":"Per l'ordine a 90 euro con capacità libera, quali costi consideri?","type":"sel","opts":["Il costo pieno, fissi compresi","I costi variabili e gli eventuali costi incrementali specifici dell'ordine; i fissi esistenti che non cambiano sono irrilevanti","Solo i costi fissi"],"ans":1},{"k":"mo","label":"Margine unitario dell'ordine","type":"num","ans":18,"unit":"euro","tol":0.5}],"steps":["Margine unitario = 120 - 72 = 48 euro.","Margine percentuale = 48 / 120 = 40%.","Break-even = 250.000 / 48 = 5.208,33 → 5.209 unità (arrotondamento per eccesso).","Ordine: con capacità libera contano ricavi aggiuntivi, costi variabili e fissi incrementali specifici; il costo opportunità è nullo.","Margine dell'ordine = 90 - 72 = 18 euro per unità: contributo positivo."],"interp":"L'ordine può essere accettato nel breve, verificando effetti su prezzi esistenti, servizio e condizioni commerciali. Non deve diventare il nuovo listino."},{"id":"caso-2","area":"c1","title":"Materiali in magazzino","min":3,"scenario":"Nel mese si acquistano 1.500 kg di materiale a 10 euro/kg. Se ne consumano 1.100 kg. Il 60% dell'acquisto viene pagato nel mese.","fields":[{"k":"c","label":"Costo del mese","type":"num","ans":11000,"unit":"euro","tol":0.5},{"k":"m","label":"Valore che resta in magazzino","type":"num","ans":4000,"unit":"euro","tol":0.5},{"k":"p","label":"Pagamento del mese","type":"num","ans":9000,"unit":"euro","tol":0.5},{"k":"d","label":"Il pagamento del mese genera un nuovo costo?","type":"sel","opts":["Sì","No"],"ans":1}],"steps":["Costo = 1.100 × 10 = 11.000 euro (consumo).","Magazzino = (1.500 - 1.100) × 10 = 4.000 euro (attività).","Pagamento = 15.000 × 60% = 9.000 euro (dimensione finanziaria).","Il pagamento estingue un debito: non genera un nuovo costo."],"interp":"Acquisto (15.000), costo (11.000) e pagamento (9.000) sono tre grandezze diverse: il controller deve sapere in quale dimensione si trova."},{"id":"caso-3","area":"c3","title":"La voce ambigua","min":4,"scenario":"La voce «lavorazioni esterne e straordinari di reparto» vale 84.000 euro. Il costo è 28 euro/ora oltre una capacità ordinaria di 21.000 ore; le ore richieste sono 24.000.","fields":[{"k":"h","label":"Ore acquistate oltre la capacità","type":"num","ans":3000,"unit":"ore","tol":0.5},{"k":"comp","label":"Comportamento corretto","type":"sel","opts":["Fisso","Variabile su tutte le ore","Zero entro 21.000 ore, variabile a 28 euro/ora oltre la soglia"],"ans":2},{"k":"ev","label":"Quando è evitabile?","type":"sel","opts":["Mai","Se il fabbisogno rientra nella capacità ordinaria","Solo tagliando i prezzi"],"ans":1}],"steps":["84.000 / 28 = 3.000 ore = 24.000 - 21.000.","Il comportamento è a tratti: nessun costo entro 21.000 ore, 28 euro per ogni ora oltre.","È evitabile se il fabbisogno rientra nella capacità ordinaria."],"interp":"La posizione della voce nel Conto Economico non ne determina il comportamento: è il processo che la genera a decidere."},{"id":"caso-4","area":"c4","title":"Il reparto sottoutilizzato","min":4,"scenario":"Un reparto ha una struttura di 180.000 euro per 15.000 ore disponibili. Nel periodo ne utilizza 12.000.","fields":[{"k":"t","label":"Tariffa sulla capacità disponibile (euro/ora)","type":"num","ans":12,"unit":"euro","tol":0.5},{"k":"ci","label":"Costo della capacità inutilizzata","type":"num","ans":36000,"unit":"euro","tol":0.5},{"k":"te","label":"Tariffa se si caricasse tutto sulle ore usate (euro/ora)","type":"num","ans":15,"unit":"euro","tol":0.5},{"k":"d","label":"Come presenti i 36.000 euro?","type":"sel","opts":["Dentro il costo unitario dei prodotti","Come capacità inutilizzata esposta a parte"],"ans":1}],"steps":["Tariffa = 180.000 / 15.000 = 12 euro/ora.","Capacità inutilizzata = 3.000 ore × 12 = 36.000 euro.","Caricando tutto sulle 12.000 ore: 180.000 / 12.000 = 15 euro/ora.","La differenza (3 euro/ora) nasconderebbe un problema di saturazione dentro il costo dei prodotti."],"interp":"La capacità inutilizzata va esposta come informazione gestionale: il problema è di saturazione, non di efficienza dei prodotti."},{"id":"caso-5","area":"c6","title":"Due basi che quadrano","min":4,"scenario":"120.000 euro di indiretti di produzione. Linea B: 6.000 ore macchina su 24.000 totali; 12.000 unità su 22.000 totali.","fields":[{"k":"o","label":"Quota di B con base ore macchina","type":"num","ans":30000,"unit":"euro","tol":0.5},{"k":"u","label":"Quota di B con base unità (arrotondata)","type":"num","ans":65455,"unit":"euro","tol":1},{"k":"b","label":"Quale base riflette il consumo del reparto?","type":"sel","opts":["Le unità","Le ore macchina"],"ans":1}],"steps":["Ore: 120.000 / 24.000 = 5 euro/ora; B = 6.000 × 5 = 30.000.","Unità: 120.000 / 22.000 = 5,4545 euro/unità; B = 12.000 × 120.000 / 22.000 = 65.455 (coefficiente non arrotondato).","Entrambe quadrano a 120.000, ma solo le ore macchina riflettono l'assorbimento del reparto."],"interp":"La quadratura conferma il totale, non la scelta economica della base. Con le unità B riceverebbe 35.455 euro in più."},{"id":"caso-6","area":"c15","title":"Mantenere, eliminare o ridurre C","min":5,"scenario":"Impresa guida: C ha margine unitario 51 euro, 3 ore/unità, 2.000 unità. Margine totale aziendale 1.062.000; struttura base 736.000; oltre 21.000 ore la capacità esterna costa 28 euro/ora (oggi 3.000 ore = 84.000 euro).","fields":[{"k":"m","label":"Risultato operativo mantenendo C","type":"num","ans":242000,"unit":"euro","tol":0.5},{"k":"e","label":"Risultato eliminando C","type":"num","ans":224000,"unit":"euro","tol":0.5},{"k":"r","label":"Risultato riducendo C a 1.000 unità","type":"num","ans":275000,"unit":"euro","tol":0.5},{"k":"d","label":"Opzione migliore","type":"sel","opts":["Mantenere","Eliminare","Ridurre a 1.000"],"ans":2}],"steps":["Mantenere: 1.062.000 - 736.000 - 84.000 = 242.000.","Eliminare: perdo 102.000 di margine, risparmio 84.000: 960.000 - 736.000 = 224.000 (-18.000).","Ridurre a 1.000: perdo 51.000, le ore scendono a 21.000 e la capacità esterna si azzera: 1.011.000 - 736.000 = 275.000 (+33.000)."],"interp":"La configurazione economicamente migliore non coincide con la lettura a costo pieno della linea C."},{"id":"caso-7","area":"c11","title":"Il cliente che costa","min":4,"scenario":"X e Y hanno 240.000 euro di ricavi e 84.000 di margine di prodotto. X: 600 ordini, 300 consegne, 250 ore di assistenza. Tariffe: 20 euro/ordine, 30 euro/consegna, 20 euro/ora.","fields":[{"k":"cx","label":"Costo di servizio di X","type":"num","ans":26000,"unit":"euro","tol":0.5},{"k":"mx","label":"Margine cliente di X","type":"num","ans":58000,"unit":"euro","tol":0.5},{"k":"rid","label":"Riduzione a tariffa se X passa a 300 ordini e 24 consegne","type":"num","ans":14280,"unit":"euro","tol":0.5},{"k":"d","label":"La riduzione a tariffa è tutta minore spesa?","type":"sel","opts":["Sì","No: una parte è capacità liberata"],"ans":1}],"steps":["X = 600 × 20 + 300 × 30 + 250 × 20 = 26.000 euro.","Margine X = 84.000 - 26.000 = 58.000 euro.","Riduzione = 300 ordini × 20 + 276 consegne × 30 = 6.000 + 8.280 = 14.280 euro.","Nell'impresa guida 6.348 euro sono minore spesa immediata e 7.932 capacità liberata."],"interp":"Ogni business case ABM deve distinguere riduzione di spesa, costo evitato futuro, capacità liberata e ricavo aggiuntivo."},{"id":"caso-8","area":"c13","title":"Il picco di marzo","min":3,"scenario":"Budget di marzo: 2.000 ore macchina richieste contro 1.750 ore di capacità ordinaria del reparto. La capacità esterna costa 28 euro/ora.","fields":[{"k":"g","label":"Ore mancanti a marzo","type":"num","ans":250,"unit":"ore","tol":0.5},{"k":"c","label":"Costo della capacità esterna di marzo","type":"num","ans":7000,"unit":"euro","tol":0.5},{"k":"d","label":"Dove si verifica la fattibilità?","type":"sel","opts":["Solo sul totale annuo","Alla stessa granularità con cui la capacità viene consumata (anche mensile)"],"ans":1}],"steps":["Ore mancanti = 2.000 - 1.750 = 250.","Costo = 250 × 28 = 7.000 euro.","Un piano coerente sull'anno può essere irrealizzabile nel mese."],"interp":"Il cruscotto di budget deve collegare volume, capacità e costo della soluzione esterna, mese per mese."},{"id":"caso-9","area":"c14","title":"Lo scostamento che inganna","min":4,"scenario":"Materiale: budget statico 10.000 unità × 6 euro = 60.000. Volume effettivo 11.000 unità. Costo effettivo 68.200 euro. Il responsabile di produzione viene accusato di 8.200 euro di sforamento.","fields":[{"k":"f","label":"Budget flessibile","type":"num","ans":66000,"unit":"euro","tol":0.5},{"k":"g","label":"Scostamento attribuibile alla gestione","type":"num","ans":2200,"unit":"euro","tol":0.5},{"k":"d","label":"Lettura corretta","type":"sel","opts":["8.200 euro sono tutti inefficienza","6.000 euro dipendono dal maggior volume; 2.200 sono lo scostamento operativo"],"ans":1}],"steps":["Flessibile = 11.000 × 6 = 66.000.","Gestione = 68.200 - 66.000 = 2.200 sfavorevole.","Volume = 66.000 - 60.000 = 6.000."],"interp":"Lo scostamento va collegato al processo prima di essere attribuito a un responsabile."},{"id":"caso-10","area":"c16","title":"Il fornitore più economico?","min":4,"scenario":"Il fornitore offre 10.000 unità a 140.000 euro, più 8.000 di trasporto e controlli. Il costo pieno interno è 180.000, di cui 40.000 di fissi allocati che restano.","fields":[{"k":"m","label":"Make rilevante","type":"num","ans":140000,"unit":"euro","tol":0.5},{"k":"b","label":"Buy rilevante","type":"num","ans":148000,"unit":"euro","tol":0.5},{"k":"d","label":"Il Buy fa risparmiare 32.000 euro (180.000 - 148.000)?","type":"sel","opts":["Sì","No: rispetto al Make rilevante costa 8.000 euro in più"],"ans":1},{"k":"s","label":"Margine alternativo minimo della capacità liberata per rendere conveniente il Buy (oltre)","type":"num","ans":8000,"unit":"euro","tol":0.5}],"steps":["Make rilevante = 180.000 - 40.000 = 140.000.","Buy = 140.000 + 8.000 = 148.000.","Il Buy costa 8.000 in più: il confronto con il costo pieno creerebbe un falso risparmio di 32.000.","Il Buy conviene solo se la capacità liberata genera più di 8.000 euro di margine alternativo reale."],"interp":"Un prezzo esterno più basso non è automaticamente un risparmio se i costi interni non scompaiono."},{"id":"caso-11","area":"c17","title":"Lo sconto sulla linea B","min":4,"scenario":"Linea B: prezzo di budget 118, prezzo netto attuale 114, costo variabile 76. Il margine di budget da mantenere è 478.800 euro. Domanda massima 12.000 unità.","fields":[{"k":"mb","label":"Margine unitario di budget","type":"num","ans":42,"unit":"euro","tol":0.5},{"k":"ma","label":"Margine unitario attuale","type":"num","ans":38,"unit":"euro","tol":0.5},{"k":"rid","label":"Riduzione del margine unitario vs budget","type":"num","ans":9.5,"unit":"%","tol":0.1},{"k":"v","label":"Volume per mantenere 478.800 euro","type":"num","ans":12600,"unit":"unità","tol":0.5},{"k":"d","label":"Lo sconto è recuperabile con il volume?","type":"sel","opts":["Sì","No: 12.600 supera la domanda massima di 12.000"],"ans":1}],"steps":["Margine di budget = 118 - 76 = 42; attuale = 114 - 76 = 38.","Il prezzo scende del 3,4%, il margine del 9,5% (4 / 42).","Volume = 478.800 / 38 = 12.600 unità.","12.600 > 12.000: il recupero completo non è possibile."],"interp":"La decisione sullo sconto deve integrare margine, domanda e capacità."},{"id":"caso-12","area":"c16","title":"Le ore che mancano","min":4,"scenario":"Capacità ordinaria 21.000 ore; domanda piena 24.000 ore. Opzioni: turno aggiuntivo (36.000 fissi evitabili + 14 euro/ora per 3.000 ore), capacità esterna a 28 euro/ora, o rinuncia a 1.000 unità di C (margine 51, 3 ore/unità).","fields":[{"k":"t","label":"Costo del turno aggiuntivo","type":"num","ans":78000,"unit":"euro","tol":0.5},{"k":"ch","label":"Costo orario del turno","type":"num","ans":26,"unit":"euro","tol":0.5},{"k":"mc","label":"Margine per ora di C","type":"num","ans":17,"unit":"euro","tol":0.5},{"k":"d","label":"Scelta economicamente migliore","type":"sel","opts":["Turno aggiuntivo","C
