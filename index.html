<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Controllo di gestione con l'intelligenza artificiale</title><meta name="description" content="Web app di supporto al libro «Controllo di gestione con l'intelligenza artificiale» di Tania Cilio: costi, margini, budget e decisioni."><style>:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F8F9FB; --ink:#1B2533; --ink-2:#4A5668; --ink-3:#6B7686;
  --line:#DCE2EA; --line-2:#C9D1DC;
  --accent:#E35B14; --accent-ink:#B8470B; --accent-soft:#FFEEE3; --accent-line:#F6C3A3; --on-accent:#FFFFFF;
  --navy:#1F3A5F; --navy-2:#2A4B75; --on-navy:#F2F5F9; --on-navy-2:#B9C6D8;
  --red:#C62828; --red-soft:#FDECEC; --green:#1D7A4B; --green-soft:#E6F4EC; --amber:#9A6200; --amber-soft:#FFF4DC;
  --shadow:0 1px 2px rgba(20,35,60,.06),0 4px 14px rgba(20,35,60,.06);
  --r:10px; --r-s:7px;
  --f-display:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; --f-body:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
}
html{font-size:16px;color-scheme:light}
html.present{font-size:19.5px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-ink);text-underline-offset:2px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.ico{flex:none}
.muted{color:var(--ink-3)}
.center{text-align:center}

/* ── Top bar ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--navy);color:var(--on-navy);border-bottom:3px solid var(--accent)}
.brand{display:flex;align-items:center;gap:10px;color:var(--on-navy);text-decoration:none;min-width:0}
.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;background:var(--accent);color:#fff;font-family:var(--f-display);font-weight:800;font-size:1.15rem;flex:none}
.brand-t{font-family:var(--f-display);font-weight:700;font-size:1rem;line-height:1.1}
.brand-t span{font-weight:500;color:var(--on-navy-2)}
.menu-btn{display:none;background:none;border:0;color:var(--on-navy);padding:6px;border-radius:6px;cursor:pointer}
.search{position:relative;margin-left:auto;width:min(420px,48vw)}
.search form{display:flex;align-items:center;gap:8px;background:var(--navy-2);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:0 10px;color:var(--on-navy-2)}
.top .search input{flex:1;min-width:0;background:transparent;border:0;padding:9px 0;min-height:0;color:var(--on-navy);outline:none;box-shadow:none;font-size:.95rem;-webkit-appearance:none;appearance:none}
.top .search input::placeholder{color:var(--on-navy-2)}
.search form:focus-within{border-color:var(--accent)}
.sugg{position:absolute;right:0;left:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;max-height:70vh;overflow:auto}
.sugg-i,.sugg-all{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px;cursor:pointer}
.sugg-i:hover,.sugg-all:hover{background:var(--accent-soft)}
.sugg-all{color:var(--accent-ink);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 6px 6px}
.sugg-empty{padding:10px;color:var(--ink-3)}
.res-k{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);font-weight:600;white-space:nowrap}

/* ── Shell ── */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);align-self:start;height:calc(100vh - 59px);overflow:auto;padding:18px 12px;border-right:1px solid var(--line);background:var(--surface)}
.nav-g{margin-bottom:14px}
.nav-h{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600;padding:4px 10px}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-foot{font-size:.85rem;color:var(--ink-3);padding:10px;border-top:1px solid var(--line);margin-top:10px}
.main{padding-block:26px 40px;padding-inline:clamp(16px,3.5vw,44px);max-width:1120px;width:100%;min-width:0}
.foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:.85rem}
.scrim{display:none}

/* ── Page head ── */
.phead{margin-bottom:22px}
.kicker{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--accent-ink);margin-bottom:6px}
.phead h1{font-size:clamp(1.6rem,2.6vw,2.2rem);font-weight:750;line-height:1.15}
.lead{color:var(--ink-2);font-size:1.06rem;max-width:68ch;margin:.6em 0 0}
.h2{font-size:1.3rem;font-weight:700;margin:34px 0 14px}
.h3{font-size:1.1rem;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumb{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink-2);padding:4px 0;margin-bottom:10px;cursor:pointer;font-weight:500}
.crumb:hover{color:var(--accent-ink)}

/* ── Buttons, chips, tags ── */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;border:1px solid transparent;line-height:1.2;text-align:left}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover:not(:disabled){filter:brightness(.94)}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent-ink)}
.btn-good{background:var(--green);color:#fff}
.btn-warn{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.btn-danger{background:var(--red);color:#fff}
.actions-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.actions-row.end{justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:.93rem}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.tag{display:inline-flex;align-items:center;font-size:.8rem;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;text-decoration:none;cursor:default}
a.tag,.gl-area .tag{cursor:pointer}
.badge{display:inline-flex;font-size:.82rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);letter-spacing:.02em}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.pill{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;margin:4px 6px 0 0;font-size:.92rem}
.note{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r-s);padding:10px 14px;margin-bottom:14px}
.note.warn{background:var(--amber-soft);border-color:var(--amber)}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:22px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* ── Forms ── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px;display:grid;gap:14px}
.panel.slim{padding:12px 16px}
.form-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.fld{display:grid;gap:6px;min-width:0}
.fld>span{font-size:.85rem;font-weight:600;color:var(--ink-2)}
.fld.grow{flex:1 1 260px}
select,input[type=search],.num-in input{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;min-height:42px;max-width:100%}
select{padding-right:30px}
select:focus,input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.num-in{display:flex;align-items:center;gap:8px}
.num-in input{width:100%;min-width:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.unit{color:var(--ink-3);font-size:.9rem;white-space:nowrap}
.score{font-weight:500;margin-left:auto}

/* ── Progress ── */
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.bar-s{height:7px;margin:0}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}

/* ── Home ── */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:stretch;margin-bottom:22px}
.hero-txt{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:clamp(22px,3.4vw,38px);position:relative;overflow:hidden}
.hero-txt::after{content:'';position:absolute;right:-110px;top:-110px;width:240px;height:240px;border:26px solid var(--accent);border-radius:50%;opacity:.85}
.hero-txt .kicker{color:#FFB48A}
.hero-t{font-size:clamp(1.9rem,4.2vw,3rem);font-weight:800;line-height:1.02;text-transform:uppercase;letter-spacing:-.015em;max-width:15ch;position:relative;z-index:1}
.hero-d{margin:14px 0 0;color:var(--on-navy-2);font-size:1.05rem;position:relative;z-index:1}
.hero-d b{color:var(--on-navy)}
.hero-l{margin:10px 0 0;max-width:44ch;color:var(--on-navy);position:relative;z-index:1}
.hero-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px;align-content:start}
.hc-h{font-family:var(--f-display);font-weight:700;font-size:1.1rem;display:flex;justify-content:space-between;align-items:baseline}
.hc-pct{font-size:1.6rem;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.hc-row{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3em;gap:10px;align-items:center;font-size:.93rem}
.hc-row b{text-align:right;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.q-btn{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;font-weight:600;min-width:0}
.q-btn small{display:block;font-weight:500;color:var(--ink-3);font-size:.82rem}
.q-btn span{min-width:0}
.q-btn:hover{border-color:var(--accent)}
.q-btn.prim{background:var(--accent-soft);border-color:var(--accent-line)}
.q-btn .ico{color:var(--accent-ink)}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.feat{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;row-gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer}
.feat:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.feat-i{grid-row:span 2;display:grid;place-items:center;width:42px;height:42px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink)}
.feat-t{font-family:var(--f-display);font-weight:700;font-size:1.02rem;text-transform:uppercase;letter-spacing:.01em}
.feat-d{color:var(--ink-2);font-size:.93rem}
.area-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.as-item{display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
.as-item:hover{border-color:var(--accent)}
.as-n,.area-n,.mini-n,.pr-n{font-family:var(--f-mono);font-weight:500;color:var(--accent-ink)}
.as-p{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:.9rem}

/* ── Studia ── */
.grid-areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.area-card{display:grid;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;align-content:start}
.area-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.area-n{font-size:1.4rem}
.area-t{font-family:var(--f-display);font-weight:700;font-size:1.12rem;line-height:1.2}
.area-i{color:var(--ink-2);font-size:.93rem}
.area-f{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums}
.topic-list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.topic-row{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.topic-row:hover{border-color:var(--accent)}
.tr-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center}
.topic-row.seen .tr-check{background:var(--green);border-color:var(--green);color:#fff}
.tr-body{display:grid;gap:2px;min-width:0}
.tr-t{font-weight:600;font-size:1.03rem}
.tr-d{color:var(--ink-2);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scheda{display:grid;gap:12px}
.scheda section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.scheda h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px;font-family:var(--f-body)}
.scheda p{margin:0;max-width:72ch}
.scheda ul{margin:0;padding-left:1.2em;display:grid;gap:6px;max-width:74ch}
.s-what{border-left:5px solid var(--accent)!important}
.s-what p{font-size:1.15rem;font-weight:500}
.s-ex{background:var(--surface-2)!important}
.s-ex p{font-family:var(--f-mono);font-size:.95rem;font-variant-numeric:tabular-nums}
.s-nc{background:var(--red-soft)!important;border-color:transparent!important}
.s-nc h3{color:var(--red)}
.s-az{background:var(--accent-soft)!important;border-color:var(--accent-line)!important}
.s-az h3{color:var(--accent-ink)}
.callout{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--r);padding:14px 18px;margin-top:16px}
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:22px}

/* ── Quiz ── */
.grid-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.mini{display:grid;grid-template-columns:2em 1fr;row-gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}
.mini .muted{grid-column:2;font-size:.85rem}
.mini:hover{border-color:var(--accent)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,2.5vw,26px)}
.q-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.q-count{font-family:var(--f-mono);font-size:.85rem;color:var(--ink-3)}
.q-text{font-family:var(--f-body);font-size:1.25rem;font-weight:600;line-height:1.4;margin-bottom:16px;letter-spacing:0}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:grid;grid-template-columns:2em 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line-2);border-radius:9px;padding:12px 14px;cursor:pointer;font-size:1.02rem}
.opt:hover:not(:disabled):not(.static){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt-l{display:grid;place-items:center;width:1.9em;height:1.9em;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-mono);font-weight:500}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .ico{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .ico{color:var(--red)}
.opt.dim{opacity:.6}
.opt.picked{border-color:var(--navy);background:var(--surface-2)}
.fb{border-radius:10px;padding:14px 16px;margin-top:16px;border:1px solid}
.fb p{margin:.4em 0 0;max-width:75ch}
.fb-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem}
.fb-ok{background:var(--green-soft);border-color:var(--green)}
.fb-ok .fb-h{color:var(--green)}
.fb-ko{background:var(--red-soft);border-color:var(--red)}
.fb-ko .fb-h{color:var(--red)}
.review{margin-top:8px;font-size:.95rem}
.review>span:first-child{font-weight:600}
.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.res-score{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px}
.big-n{font-family:var(--f-display);font-size:3.2rem;font-weight:800;color:var(--accent-ink);font-variant-numeric:tabular-nums;line-height:1}
.judg{font-weight:700;font-size:1.1rem;padding:4px 12px;border-radius:999px}
.judg.good{background:var(--green-soft);color:var(--green)}
.judg.mid{background:var(--accent-soft);color:var(--accent-ink)}
.judg.low{background:var(--red-soft);color:var(--red)}
.rev-list{padding-left:1.1em;display:grid;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.kpis.wide{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis>div{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px;display:grid}
.k-n{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.kpis span:not(.k-n){color:var(--ink-2);font-size:.9rem}
.rev-area{margin-top:14px}
.rev-area-h{font-weight:700;margin-bottom:6px}
.rev-q{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px;background:var(--surface-2)}
.rev-q summary{cursor:pointer;font-weight:500}
.rev-q p{margin:.4em 0}
.plain{margin:0;padding-left:1.1em;display:grid;gap:4px}

/* ── Esercizi / Solver ── */
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.lvl{display:inline-flex;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:6px;letter-spacing:.02em}
.lvl-base{background:var(--green-soft);color:var(--green)}
.lvl-intermedio{background:var(--amber-soft);color:var(--amber)}
.lvl-operativo{background:var(--accent-soft);color:var(--accent-ink)}
.ex-grid,.case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ex-card,.case-card{display:grid;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;align-content:start}
.ex-card:hover,.case-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.ex-top,.case-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ex-cat{font-size:.82rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.ex-t,.case-t{font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.25}
.case-s{color:var(--ink-2);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.solver{display:grid;gap:14px}
.scenario{background:var(--surface);border-left:5px solid var(--navy);border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin:0;font-size:1.06rem;max-width:80ch}
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem;background:var(--surface)}
.tbl caption{text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--ink-3);padding:10px 14px 0}
.tbl th,.tbl td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl thead th{background:var(--surface-2);font-size:.85rem;color:var(--ink-2)}
.tbl tr:last-child td,.tbl tr:last-child th{border-bottom:0}
.tbl.dati th{width:38%;font-weight:600;color:var(--ink-2)}
.tbl.dati td{font-family:var(--f-mono);font-size:.93rem;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.domanda{margin:0;font-size:1.05rem}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.fields .actions-row{grid-column:1/-1;margin:4px 0 0}
.f{display:grid;gap:6px;align-content:start;padding:10px;border-radius:8px;border:1px solid transparent}
.f label{font-weight:600;font-size:.93rem}
.f select{width:100%}
.f.ok{background:var(--green-soft);border-color:var(--green)}
.f.ko{background:var(--red-soft);border-color:var(--red)}
.f-fb{display:flex;gap:6px;align-items:center;font-size:.88rem;font-weight:600}
.f.ok .f-fb{color:var(--green)}
.f.ko .f-fb{color:var(--red)}
.sol{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:var(--r);padding:16px 18px}
.sol ol{margin:0 0 12px;padding-left:1.3em;display:grid;gap:6px}
.sol ol li{font-family:var(--f-mono);font-size:.93rem;font-variant-numeric:tabular-nums}
.sol h3{font-size:1rem;margin:6px 0 8px}
.sol p{margin:0;max-width:78ch}
.sol-ans{margin-bottom:12px}

/* ── Flashcard ── */
.fc-stats{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.fc-stats .btn{margin-left:auto}
.fc-count{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--ink-3);font-family:var(--f-mono);font-size:.9rem;margin-bottom:8px}
.fc{position:relative;display:grid;place-items:center;width:100%;min-height:260px;background:var(--surface);border:1px solid var(--line);border-bottom:5px solid var(--accent);border-radius:14px;padding:44px 24px 28px;cursor:pointer;text-align:center}
.fc.flipped{background:var(--navy);color:var(--on-navy);border-bottom-color:var(--accent)}
.fc-side{position:absolute;top:14px;left:18px;font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--ink-3)}
.fc.flipped .fc-side{color:var(--on-navy-2)}
.fc-front{font-family:var(--f-display);font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:800;line-height:1.15;max-width:22ch}
.fc-back{display:grid;gap:12px;font-size:1.18rem;max-width:58ch;line-height:1.5}
.fc-nc{font-size:.95rem;color:#FFC7A6;display:flex;gap:6px;align-items:flex-start;text-align:left;justify-content:center}
.fc-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}

/* ── Glossario ── */
.letters{display:flex;flex-wrap:wrap;gap:6px}
.letter{min-width:2.2em;padding:6px 8px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;cursor:pointer;font-weight:600}
.letter.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.gl-letter{font-size:1.5rem;color:var(--accent-ink);margin:22px 0 8px;font-weight:800}
.gl{margin:0;display:grid;gap:8px}
.gl-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,15em) 1fr;gap:6px 18px}
.gl dt{font-weight:700;font-size:1.03rem}
.gl dd{margin:0;display:grid;gap:6px;color:var(--ink)}
.gl-nc{font-size:.93rem;color:var(--ink-2);background:var(--red-soft);border-radius:6px;padding:6px 10px}
.gl-nc b{color:var(--red)}

/* ── Trova l'errore ── */
.err-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,2.6vw,28px)}
.err-s{font-family:var(--f-display);font-size:clamp(1.3rem,2.6vw,1.8rem);font-weight:700;line-height:1.3;margin:6px 0 18px;padding:0;max-width:40ch}
.err-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err-b{display:flex;justify-content:center;align-items:center;gap:8px;padding:16px;border-radius:10px;border:2px solid var(--line-2);background:var(--surface);font-weight:800;font-size:1.05rem;letter-spacing:.06em;cursor:pointer}
.err-b:hover:not(:disabled){border-color:var(--accent)}
.err-b:disabled{cursor:default}
.err-b.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.err-b.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.err-b.dim{opacity:.5}

/* ── Non confondere ── */
.cf-list{display:grid;gap:14px}
.cf{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.cf-h{font-size:1.2rem;font-weight:800;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin-bottom:12px;text-transform:uppercase;letter-spacing:.01em}
.vs{font-family:var(--f-mono);font-size:.85rem;color:var(--on-accent);background:var(--accent);border-radius:5px;padding:2px 7px;text-transform:lowercase}
.cf-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cf-col{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.cf-col p{margin:.3em 0 0}
.cf-t{font-weight:700}
.cf-ex{font-family:var(--f-mono);font-size:.9rem;color:var(--ink-2)}
.cf-key{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-weight:500}
.cf-key .ico{color:var(--accent-ink);margin-top:2px}

/* ── Formule ── */
.fx-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-top:8px}
.fx{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.fx-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.fx-top h2{font-size:1.08rem;font-weight:700}
.fx-f{font-family:var(--f-mono);font-weight:500;background:var(--navy);color:var(--on-navy);border-radius:8px;padding:12px 14px;font-size:.98rem;line-height:1.5;overflow-wrap:anywhere}
.fx-dl{margin:0;display:grid;gap:8px}
.fx-dl dt{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--ink-3)}
.fx-dl dd{margin:0}
.fx-ex{font-family:var(--f-mono);font-size:.92rem;font-variant-numeric:tabular-nums}
.fx .btn{justify-self:start}

/* ── Calcolatori ── */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{border:1px solid var(--line-2);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.calc{display:grid;gap:16px}
.calc-ins{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.calc-in small{font-size:.82rem}
.calc-in.bad input{border-color:var(--red)}
.err{color:var(--red)}
.calc-outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.out{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:grid;gap:2px}
.out span{font-size:.88rem;color:var(--ink-2)}
.out b{font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.out.strong{background:var(--accent-soft);border-color:var(--accent-line)}
.out.strong b{color:var(--accent-ink);font-size:1.3rem}
.out.neg b{color:var(--red)}
.out.pos b{color:var(--green)}
.calc-note{grid-column:1/-1;margin:0;color:var(--ink-2);font-size:.93rem;max-width:80ch}
.chart{grid-column:1/-1;margin:0}
.chart-wrap{overflow-x:auto}
.chart svg{width:100%;min-width:420px;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-3);font-size:12px;font-family:var(--f-mono)}
.l-rev{stroke:var(--accent);stroke-width:3}
.l-cost{stroke:var(--navy-2);stroke-width:3}
.l-fix{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:5 5}
.l-bep{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:3 4}
.pt-bep{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.88rem;color:var(--ink-2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:4px;border-radius:2px}
.sw.rev{background:var(--accent)} .sw.cost{background:var(--navy-2)} .sw.fix{background:var(--ink-3)} .sw.bep{background:var(--ink-2);height:10px;width:10px;border-radius:50%}
.cap-bar{grid-column:1/-1;position:relative;display:flex;height:22px;border-radius:6px;background:var(--line);overflow:hidden}
.cap-fill{background:var(--navy-2)}
.cap-over{background:var(--red)}
.cap-legend{grid-column:1/-1;display:flex;justify-content:space-between;font-size:.82rem;color:var(--ink-3);margin-top:-8px}
.calc-panel{gap:12px}

/* ── Ripasso / Progressi ── */
.rip-plan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rip-step{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px;font-weight:600}
.rip-step .ico{color:var(--accent-ink)}
.rip-def{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.done-list{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:8px}
.done-list li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.done-list .ico{color:var(--green);align-self:center}
.prog-table{display:grid;gap:6px}
.prog-row{display:grid;grid-template-columns:minmax(0,14em) 1fr 3.2em;grid-template-rows:auto auto;gap:4px 14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 14px;cursor:pointer}
.prog-row:hover{border-color:var(--accent)}
.pr-name{font-weight:600;display:flex;gap:8px}
.pr-pct{font-family:var(--f-mono);text-align:right}
.pr-parts{grid-column:1/-1;font-size:.85rem}
.tag-cloud{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.danger-zone{margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--red-soft);border:1px solid var(--red);border-radius:9px;padding:12px}

/* ── Ricerca ── */
.res-list{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.res{display:grid;gap:3px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;cursor:pointer}
.res:hover{border-color:var(--accent)}
.res-t{font-weight:700;font-size:1.03rem}
.res-d{color:var(--ink-2);font-size:.93rem}

/* ── Docente ── */
.doc-body{margin-top:16px}
.qcard.big .q-text{font-size:1.6rem}
.qcard.big .opt{font-size:1.2rem;padding:14px 16px}
.opt.static{cursor:default}
.err-card.big .err-s{font-size:2rem}
.solver.big .scenario{font-size:1.2rem}

/* ── Accordion ── */
.acc{border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.acc-h{display:flex;width:100%;justify-content:space-between;gap:8px;align-items:center;background:none;border:0;padding:12px 14px;cursor:pointer;font-weight:600;text-align:left}
.acc-b{padding:0 14px 14px}

/* ── Responsive ── */
@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  .menu-btn{display:inline-flex}
  .side{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 59px);bottom:0;height:auto;width:min(290px,84vw);z-index:25;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:20;background:rgba(10,18,30,.45)}
  .hero{grid-template-columns:1fr}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .top{gap:8px;padding:8px 12px}
  .brand-t{display:none}
  .search{width:auto;flex:1}
  .quick{grid-template-columns:1fr}
  .opts.two,.err-btns,.cf-cols{grid-template-columns:1fr}
  .kpis,.kpis.wide{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rip-plan{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gl-item{grid-template-columns:1fr}
  .prog-row{grid-template-columns:1fr 3.2em}
  .pr-bar{grid-column:1/-1;grid-row:2}
  .pr-parts{grid-row:3}
  .hc-row{grid-template-columns:minmax(0,8em) 1fr 2.8em}
  .fx-list{grid-template-columns:1fr}
  .q-text{font-size:1.12rem}
  .fc{min-height:220px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
.gl-area{display:flex;flex-wrap:wrap;gap:6px}

</script><script>(()=>{var Xi=[{"id":"c1","n":1,"title":"Realtà economica dell'impresa","full":"Leggere la realtà economica dell'impresa","intro":"Distinguere la dimensione economica, finanziaria e patrimoniale di uno stesso fatto aziendale.","topics":[{"id":"realta","t":"Realtà economica dell'impresa","what":"Il ciclo con cui l'impresa acquista risorse, le utilizza, produce, vende, incassa e paga.","why":"Serve a capire che valore, denaro e patrimonio seguono tempi diversi: prima di usare una grandezza bisogna sapere in quale dimensione si trova.","how":["Acquista: procura risorse e assume l'obbligo di pagarle.","Utilizza e produce: consuma materiali, lavoro, servizi e capacità e li trasforma in beni o servizi.","Vende: genera ricavi e crediti verso clienti.","Incassa e paga: trasforma crediti in disponibilità e regola i debiti."],"ex":"Una vendita genera oggi un ricavo e un credito; il denaro entra solo quando il cliente paga.","nc":"Il momento della vendita non coincide con il momento dell'incasso.","az":"Quando devi collocare un dato (ricavo, costo, incasso, pagamento) nel momento giusto del ciclo."},{"id":"dim-eco","t":"Dimensione economica","what":"Misura quanto valore è stato prodotto e consumato: ricavi, costi e risultato secondo la competenza.","why":"Risponde alla domanda «quanto abbiamo guadagnato nel periodo».","how":["Grandezze osservate: ricavi, costi, risultato.","Logica temporale: competenza.","Si legge nel Conto Economico."],"nc":"Un risultato economico positivo non garantisce cassa positiva.","az":"Quando analizzi margini e redditività di un periodo."},{"id":"dim-pat","t":"Dimensione patrimoniale","what":"Descrive che cosa l'impresa possiede e che cosa deve a una certa data: attività, passività e patrimonio netto.","why":"Fornisce la fotografia della ricchezza presente in un momento preciso.","how":["Grandezze osservate: attività, passività, patrimonio netto.","Logica temporale: fotografia a una data.","Si legge nello Stato Patrimoniale."],"nc":"Il patrimonio netto non è cassa: può essere investito in crediti, scorte e immobilizzazioni.","az":"Quando valuti crediti, scorte, debiti e investimenti a fine periodo."},{"id":"dim-fin","t":"Dimensione finanziaria","what":"Misura quanto denaro è entrato e uscito: incassi, pagamenti e saldo di cassa.","why":"Mostra se l'impresa ha la liquidità per sostenere la gestione.","how":["Grandezze osservate: incassi, pagamenti, saldo di cassa.","Logica temporale: movimento monetario.","Si collega al budget di cassa e al capitale circolante."],"nc":"Il pagamento non è il costo: il costo misura valore consumato, il pagamento denaro uscito.","az":"Quando prepari il calendario di incassi e pagamenti o valuti il fabbisogno di cassa."},{"id":"ce","t":"Conto Economico","what":"Il prospetto che misura la dimensione economica di un periodo: il risultato è la differenza tra ricavi e costi di competenza.","why":"Dice quanto si è guadagnato nel periodo; letto per gradini aiuta a capire anche come si è formato il risultato.","how":["I ricavi nascono quando il valore viene ceduto al cliente, non quando viene incassato.","I costi misurano risorse consumate nel periodo, non importi acquistati o pagati.","La lettura gestionale osserva margini intermedi e struttura dei costi, non solo l'ultima riga."],"ex":"Ricavi 200.000 - costi variabili 120.000 = margine 80.000; - costi fissi 55.000 = risultato operativo 25.000; - oneri finanziari 5.000 = risultato economico 20.000 euro.","nc":"Il Conto Economico non dice quali prodotti o clienti hanno generato il risultato.","az":"Quando devi spiegare alla direzione da dove nasce il risultato del periodo."},{"id":"ce-gradini","t":"Conto Economico gestionale per gradini","what":"Lettura del risultato attraverso passaggi intermedi: margine di contribuzione, risultato operativo, risultato economico.","why":"I gradini permettono di diagnosticare la causa del risultato e di collegarla alle leve gestionali.","how":["Margine di contribuzione: quanto resta dopo i costi collegati al volume.","Risultato operativo: quanto resta dopo la struttura della gestione caratteristica.","Risultato economico finale: include gli effetti del finanziamento e, nella pratica completa, le imposte."],"ex":"Due imprese possono avere lo stesso utile finale ma strutture di costo molto diverse: quella con costi fissi elevati reagisce più violentemente alle variazioni dei volumi.","az":"Quando confronti periodi o unità con lo stesso utile ma strutture diverse."},{"id":"sp","t":"Stato Patrimoniale","what":"La fotografia a una data di attività, passività e patrimonio netto (attività meno passività).","why":"Misura la ricchezza presente a una data, mentre il Conto Economico ne misura la variazione.","how":["Attività: cassa, crediti, magazzino, impianti e altri beni.","Passività: debiti e obbligazioni verso soggetti esterni.","Patrimonio netto: parte residuale; l'utile lo aumenta, la perdita lo riduce, le distribuzioni lo riducono."],"ex":"Un credito cliente è un'attività perché rappresenta un diritto a incassare; un impianto lo è perché fornisce utilità su più periodi.","nc":"L'utile confluisce nel patrimonio netto, non automaticamente nella cassa.","az":"Quando colleghi il risultato del periodo a crediti, scorte e debiti."},{"id":"acquisto","t":"Acquisto","what":"Il momento in cui la risorsa entra nella disponibilità dell'impresa (consegna): nasce un'attività o un costo e un debito verso il fornitore.","why":"Separare acquisto e consumo evita di caricare sul periodo risorse che restano in magazzino.","how":["Ordine: nasce un impegno operativo, non ancora costo né acquisto contabile.","Consegna: la risorsa entra nella disponibilità; nasce attività o costo e debito.","Consumo: nasce il costo economico del periodo."],"ex":"Acquisti di materiali per 30.000 euro con consumi per 20.000: il costo del periodo è 20.000 e 10.000 restano in magazzino.","nc":"Acquistare una risorsa non significa averla già consumata.","az":"Quando riconcili acquisti, consumi e variazione delle scorte."},{"id":"pagamento","t":"Pagamento","what":"L'uscita di denaro che estingue un debito: appartiene alla dimensione finanziaria.","why":"Il controller deve sapere se sta analizzando competenza economica o flusso monetario.","how":["Il pagamento non genera automaticamente un nuovo costo.","Costo e pagamento possono avvenire in periodi diversi senza contraddizione.","L'ammortamento è un costo economico senza pagamento nel periodo corrente."],"ex":"Un servizio consumato oggi e pagato il mese prossimo genera costo oggi e pagamento dopo.","nc":"Usare il pagamento al posto del costo altera margini, forecast e decisioni.","az":"Quando costruisci il budget di cassa partendo dai costi di competenza."},{"id":"ricavo","t":"Ricavo","what":"Nasce quando il bene o servizio viene ceduto e sorge il diritto a essere pagati.","why":"Misura il valore ceduto ai clienti nel periodo, indipendentemente dall'incasso.","how":["Nasce alla cessione del bene o servizio.","Fino all'incasso esiste un credito verso il cliente nello Stato Patrimoniale.","Nel budget: ricavi = quantità previste × prezzo previsto."],"ex":"Vendita oggi per 50.000 euro con pagamento a 90 giorni: ricavo oggi, incasso tra tre mesi.","nc":"Aumentare il fatturato non significa automaticamente aumentare la liquidità.","az":"Quando leggi la crescita dei ricavi insieme ai tempi di incasso."},{"id":"incasso","t":"Incasso","what":"Il momento in cui il cliente paga effettivamente e il credito si trasforma in disponibilità finanziaria.","why":"È il dato che alimenta la cassa e il budget finanziario.","how":["Segue il ricavo di un intervallo pari ai tempi di pagamento concessi.","Se i tempi di incasso si allungano, cresce il fabbisogno di capitale circolante.","Per il budget servono sia la previsione economica sia il calendario degli incassi."],"ex":"Ricavi 300.000 con il 40% incassato nel mese: 120.000 euro di incassi correnti.","nc":"Ricavo e incasso entrano in tempi diversi.","az":"Quando prepari il budget di cassa mensile."},{"id":"utile","t":"Utile","what":"Il risultato economico positivo del periodo: ricavi di competenza meno costi di competenza.","why":"Misura la redditività, ma non dice nulla sulla cassa disponibile.","how":["L'utile aumenta il patrimonio netto.","Non va usato come proxy della cassa.","Va letto insieme a capitale circolante, investimenti e debito."],"ex":"Utile con poca liquidità: possibili crediti elevati, scorte, investimenti o rimborsi. Il problema non è il margine ma la conversione in cassa.","nc":"Utile ≠ liquidità: sono dimensioni collegate ma non intercambiabili.","az":"Quando un'impresa in utile segnala tensioni di cassa."},{"id":"liquidita","t":"Liquidità","what":"La disponibilità di denaro, che dipende da incassi, pagamenti, scorte, investimenti e finanziamenti.","why":"Serve a capire se l'impresa riesce a sostenere la gestione, indipendentemente dal risultato economico.","how":["Utile + liquidità: situazione da leggere comunque con investimenti e debito.","Perdita + liquidità: cassa sostenuta da finanziamenti, disinvestimenti o incassi passati; non indica sostenibilità.","Perdita + poca liquidità: priorità a margini, capitale circolante e fonti."],"nc":"Non leggere la cassa senza capire da dove proviene.","az":"Quando valuti se una crescita è sostenibile sul capitale circolante."},{"id":"investimento","t":"Investimento e ammortamento","what":"Un investimento procura una risorsa durevole che genera utilità su più periodi; l'ammortamento ne rappresenta il consumo economico.","why":"L'esborso può essere concentrato all'acquisto, mentre il costo viene distribuito nel tempo.","how":["Caricare tutto l'investimento su un solo periodo distorce il risultato economico.","Ignorare l'esborso distorce la lettura finanziaria.","Per decidere un investimento servono anche flussi di cassa, capitale circolante, valore residuo e rischio."],"ex":"Impianto da 100.000 euro con vita utile di dieci anni: nell'esempio semplificato circa 10.000 euro di costo annuo.","az":"Quando un grande esborso rischia di essere letto come costo di un solo anno."},{"id":"caso-guida","t":"Impresa guida","what":"L'impresa manifatturiera che accompagna il libro: tre linee di prodotto (A, B, C) e un reparto di lavorazione comune, sempre con gli stessi valori.","why":"Mantiene la coerenza tra costi, margini, capacità e decisioni lungo tutto il libro.","how":["A: 8.000 unità a 180 euro, costo variabile 117, margine 63, 1,5 ore/unità.","B: 12.000 unità a 114 euro, costo variabile 76, margine 38, 0,5 ore/unità.","C: 2.000 unità a 289 euro, costo variabile 238, margine 51, 3 ore/unità.","Margine totale 1.062.000; struttura 820.000 (736.000 base + 84.000 capacità esterna); risultato operativo 242.000.","Capacità ordinaria 21.000 ore; domanda piena 24.000 ore; capacità esterna a 28 euro/ora."],"az":"Come riferimento per gli esercizi e i casi costruiti sull'impresa guida."},{"id":"guida-cassa","t":"Impresa guida: risultato e cassa","what":"Lo stesso esercizio dell'impresa guida letto sul piano economico e sul piano finanziario.","why":"Il risultato operativo di 242.000 euro non è il denaro disponibile a fine anno.","how":["Fra i costi della struttura ci sono 74.000 euro di ammortamento degli impianti: sono costo dell'esercizio, ma non comportano pagamenti nell'esercizio.","Ipotesi del caso: i crediti verso i clienti aumentano di 180.000 euro nell'anno.","Incassi dalle vendite = 3.386.000 - 180.000 = 3.206.000 euro.","L'utile, dopo oneri finanziari e imposte, confluisce nel patrimonio netto, non in cassa."],"ex":"Ricavi 3.386.000 euro, incassi 3.206.000 euro: i 180.000 euro di differenza compaiono nello Stato Patrimoniale come credito.","nc":"Il totale di 242.000 euro non dice quanto rende ciascuna linea: per questo serve la contabilità analitica.","az":"Quando devi spiegare perché un'impresa in utile ha meno cassa del previsto."}]},{"id":"c2","n":2,"title":"Contabilità generale e analitica","full":"Contabilità generale e contabilità analitica","intro":"Distinguere finalità, destinatari e regole della contabilità generale e della contabilità analitica.","topics":[{"id":"coge","t":"Contabilità generale","what":"Sistema che registra i fatti aziendali e rappresenta risultato economico, patrimonio e situazione finanziaria dell'impresa nel suo complesso.","why":"Fornisce il «quanto complessivo» affidabile: è la base con cui le analisi gestionali devono riconciliarsi.","how":["Registra scambi con l'esterno e scritture di assestamento.","Organizza i costi prevalentemente per natura.","Non nasce per misurare il costo di prodotto, cliente, commessa o processo."],"nc":"Contabilità generale e analitica non competono: la seconda dipende dalla prima.","az":"Quando devi riconciliare un report gestionale con il dato ufficiale."},{"id":"coan","t":"Contabilità analitica","what":"Sistema interno che rielabora costi e ricavi per prodotto, cliente, canale, commessa, centro o attività, a supporto delle decisioni.","why":"Costruisce il «dove, perché e per quale oggetto» a partire dal dato ufficiale.","how":["Passa dalla natura alla destinazione e all'oggetto.","Integra quantità, ore, ordini, consegne, driver e capacità.","Può usare valori non presenti in contabilità generale, come il costo opportunità.","Deve riconciliarsi con i dati ufficiali, salvo differenze documentate."],"nc":"La libertà dell'analitica è utile solo se perimetri, driver e regole sono espliciti e verificabili.","az":"Quando devi misurare margini per prodotto, cliente o canale."},{"id":"oggetti-analisi","t":"Oggetti di analisi","what":"La dimensione su cui si misura costo o risultato: prodotto, commessa, cliente, centro, processo, canale.","why":"Non esiste un oggetto «giusto» in assoluto: è la domanda gestionale a decidere la dimensione di analisi.","how":["Prodotto: quanto costa e quale margine genera?","Cliente: quanto resta dopo il costo del servizio?","Processo/attività: quali attività generano costo?","Canale/area: quale modalità di vendita crea valore?"],"az":"Quando imposti un nuovo report e devi scegliere il livello di dettaglio."},{"id":"costo-domanda","t":"Lo stesso costo cambia trattamento con la domanda","what":"Una stessa voce, ad esempio l'affitto del capannone, ha ruoli diversi a seconda della decisione analizzata.","why":"Non esiste un unico costo valido per ogni scopo: il costo utile dipende da oggetto, periodo e decisione.","how":["Per il costo di prodotto può servire allocarne una quota con una base rappresentativa.","Per un ordine aggiuntivo con capacità libera è irrilevante, perché non cambia.","Per decidere se chiudere il capannone torna centrale, perché cambia tra le alternative."],"az":"Sempre: la domanda viene prima della configurazione di costo."},{"id":"assestamento","t":"Scritture di assestamento","what":"Registrazioni di fine periodo che non nascono da un nuovo scambio con l'esterno: riportano ogni valore al periodo di competenza.","why":"I dati che la contabilità analitica riceve dalla contabilità generale sono affidabili per competenza solo dopo l'assestamento.","how":["Ammortamento: ripartisce sugli anni di utilizzo il costo di un impianto pagato una volta sola.","Ratei: costi e ricavi già maturati nel periodo, che saranno pagati o incassati dopo la chiusura.","Risconti: rinviano al periodo seguente la parte di un costo o di un ricavo già registrato che non appartiene al periodo in chiusura.","Accantonamenti: oneri che nascono da fatti del periodo, con importo o data non ancora certi.","Alla chiusura si valutano anche le rimanenze finali e si rilevano le forniture ricevute ma non ancora fatturate."],"ex":"Premio assicurativo annuale pagato in anticipo: la quota che non appartiene al periodo in chiusura si rinvia con un risconto.","nc":"Nelle chiusure mensili bisogna sapere quali rettifiche sono già registrate e quali mancano: altrimenti il costo del mese comprende fatture di altri periodi o esclude consumi già avvenuti.","az":"Prima di usare i costi di un mese o di un anno nella contabilità analitica."},{"id":"guida-destinazione","t":"Impresa guida: struttura per natura e per destinazione","what":"Gli 820.000 euro della struttura dell'impresa guida letti prima per natura, poi per destinazione.","why":"La riclassificazione sposta gli importi, non li crea e non li perde: i due totali coincidono.","how":["Per natura: retribuzioni 438.000, ammortamenti 74.000, lavorazioni esterne e straordinari 84.000, servizi, sistemi e materiali 224.000.","Per destinazione: reparto di lavorazione 204.000, gestione ordini 240.000, consegne 180.000, assistenza tecnica 150.000, amministrazione 46.000.","Gestione ordini, consegne e assistenza valgono insieme 570.000 euro: fuori dal reparto, il peso della struttura è nelle funzioni che servono i clienti."],"ex":"Le retribuzioni di 438.000 euro stanno per 186.000 nell'ufficio ordini, 118.000 nell'assistenza tecnica, 42.000 nelle consegne, 46.000 nel reparto e 46.000 in amministrazione.","nc":"Il totale per destinazione deve coincidere con il totale per natura: 820.000 euro.","az":"Quando passi dai conti per natura a un report per funzione."}]},{"id":"c3","n":3,"title":"Costo e classificazioni","full":"Il concetto di costo e le classificazioni","intro":"Definire il costo come valore monetario delle risorse consumate, riferito a un oggetto, a un periodo e a uno scopo.","topics":[{"id":"costo","t":"Costo","what":"Il valore monetario delle risorse consumate per ottenere un risultato o sostenere un'attività.","why":"La parola chiave è «consumate»: il costo del periodo nasce dal consumo, non dall'acquisto.","how":["Costo = quantità consumata × valore unitario.","Diventa informativo solo se collegato a oggetto, periodo e scopo.","Appartiene alla dimensione economica."],"ex":"1.000 kg acquistati, 600 kg consumati, 8 euro/kg: costo del periodo 4.800 euro; 3.200 euro restano in magazzino.","nc":"Costo ≠ pagamento ≠ acquisto: sono tre momenti diversi.","az":"Quando devi determinare il costo di un periodo partendo da acquisti e consumi."},{"id":"natura","t":"Costi per natura","what":"Raggruppano i costi in base al tipo di risorsa consumata: materiali, personale, servizi, godimento beni di terzi, ammortamenti.","why":"È la lettura tipica della contabilità generale e la base di riconciliazione.","how":["Domanda: quale risorsa è stata consumata?","Monitora la composizione complessiva dei consumi.","Va integrata con destinazione, driver e oggetti per diventare informazione gestionale."],"ex":"Un aumento del costo del personale segnala la variazione, ma non spiega dove e perché si è prodotta.","nc":"Non dedurre comportamento o rilevanza dal nome del conto.","az":"Quando parti dal bilancio di verifica per costruire un report gestionale."},{"id":"destinazione","t":"Costi per destinazione","what":"Raggruppano i costi secondo funzione, unità organizzativa, reparto, processo o attività in cui la risorsa è stata impiegata.","why":"Crea il ponte tra piano dei conti e organizzazione reale.","how":["La stessa natura può distribuirsi su più destinazioni: produzione, logistica, commerciale, amministrazione.","Il dato contabile fornisce il totale; i dati operativi spiegano come si distribuisce.","La riclassificazione deve quadrare: sposta importi, non li crea e non li perde."],"az":"Quando devi capire quanto costa una funzione o un reparto."},{"id":"diretti","t":"Costi diretti","what":"Costi attribuibili a uno specifico oggetto mediante misurazione diretta, senza ricorrere a criteri di riparto.","why":"Arrivano all'oggetto in modo immediato e attendibile, senza ipotesi di allocazione.","how":["Esempio tipico: materiale incorporato in un prodotto.","La distinzione dipende dall'oggetto: lo stipendio del responsabile è diretto al reparto, indiretto ai prodotti.","Un materiale di valore minimo può essere trattato come indiretto per economicità della rilevazione."],"nc":"Diretto non significa variabile, né importante, né evitabile.","az":"Quando costruisci il costo primo di un prodotto o di una commessa."},{"id":"indiretti","t":"Costi indiretti","what":"Costi comuni a più oggetti, non attribuibili direttamente in modo economicamente conveniente e quindi soggetti a un criterio di allocazione.","why":"Richiedono una base di allocazione: la qualità del costo dipende da quanto la base è rappresentativa.","how":["Esempio: affitto di un capannone con più linee.","Richiedono pool omogenei e basi che rappresentino il consumo.","Possono essere fissi o variabili."],"nc":"Indiretto non significa fisso: l'energia di un impianto comune è indiretta ma cresce con le ore macchina.","az":"Quando devi ripartire costi comuni tra prodotti, clienti o commesse."},{"id":"consuntivi","t":"Costi consuntivi","what":"Valori costruiti dopo l'attività per misurare costo reale e redditività ottenuta.","why":"Sono il riscontro effettivo di ciò che è accaduto.","how":["Si costruiscono dopo i fatti.","Richiedono controlli di completezza, competenza e riconciliazione.","Da soli non dicono se il risultato sia soddisfacente."],"nc":"Il consuntivo non si modifica nel forecast: i mesi chiusi restano separati dai mesi previsti.","az":"Nelle chiusure mensili e nel confronto con il budget."},{"id":"preventivi","t":"Costi preventivi","what":"Valori costruiti prima dell'attività sulla base di ipotesi attese.","why":"Servono per offerte, simulazioni e budget.","how":["Si costruiscono prima dell'attività.","Dipendono dalla qualità delle ipotesi.","Le ipotesi vanno rese esplicite."],"nc":"Preventivo non è standard: lo standard si basa su condizioni operative definite.","az":"Quando prepari un'offerta o una simulazione."},{"id":"standard","t":"Costi standard","what":"Valori costruiti prima dell'attività su condizioni definite: quanto una risorsa dovrebbe costare e quanto dovrebbe esserne usato.","why":"Sono il riferimento per misurare efficienza e scostamenti.","how":["Non sono una media passiva del passato.","Definiscono prezzo standard e consumo standard ammesso.","Rischio: diventano obsoleti se non aggiornati."],"nc":"Uno standard non aggiornato genera scostamenti che non dipendono dalla gestione.","az":"Quando calcoli scostamenti di prezzo, impiego, tariffa ed efficienza."},{"id":"controllabili","t":"Costi controllabili","what":"Costi che il responsabile può influenzare nel proprio ruolo e nell'orizzonte osservato.","why":"La performance manageriale va letta sui costi effettivamente governabili.","how":["Attribuire un costo a un centro non significa che il responsabile possa modificarlo.","Scarti, impiego ore e materiali di consumo possono essere controllabili dal reparto.","Ammortamenti o contratti centrali possono non esserlo; un contratto rigido nel mese può diventare negoziabile alla scadenza."],"az":"Quando valuti la performance di un responsabile di reparto."},{"id":"rilevanti","t":"Costi rilevanti","what":"Costi futuri che cambiano tra le alternative considerate e sono quindi utili per il confronto decisionale.","why":"Solo ciò che cambia tra le alternative aiuta a scegliere.","how":["Tre verifiche: è futuro? è differenziale? è causato dalla scelta?","La rilevanza è specifica della decisione e dell'orizzonte.","Un nuovo investimento richiesto dall'ordine è rilevante perché esiste solo scegliendo quell'alternativa."],"nc":"Un costo può essere corretto in contabilità e completamente irrilevante nella decisione.","az":"In ogni decisione: ordini speciali, Make or Buy, eliminazione di prodotti."},{"id":"irrilevanti","t":"Costi irrilevanti","what":"Costi che restano identici qualunque scelta venga presa e quindi non aiutano a distinguere le opzioni.","why":"Escluderli evita di alterare il confronto tra alternative.","how":["Esempio: ammortamento di un impianto esistente per un ordine aggiuntivo con capacità libera.","I costi sommersi sono sempre irrilevanti.","Un impegno futuro irrevocabile, uguale in tutte le alternative, può dover essere pagato ma resta irrilevante."],"nc":"Irrilevante non significa inesistente: il costo esiste, ma non cambia tra le opzioni.","az":"Quando pulisci un business case dai costi che non cambiano."},{"id":"coordinate","t":"Le tre coordinate di un costo","what":"Oggetto, periodo e scopo: senza queste tre coordinate un costo non è leggibile.","why":"Prima di confrontare due costi bisogna verificare che abbiano stesso oggetto, periodo e perimetro.","how":["Oggetto: costo di che cosa?","Periodo: in quale intervallo temporale?","Scopo: per quale decisione o controllo?"],"nc":"Un costo industriale non è direttamente confrontabile con un costo complessivo.","az":"Prima di ogni confronto tra costi."},{"id":"errori-class","t":"Tre errori frequenti di classificazione","what":"Trattare le etichette come proprietà assolute, classificare in base al nome del conto, scegliere il criterio dopo aver visto il risultato.","why":"La precisione aritmetica non garantisce correttezza economica.","how":["Separare le componenti quando una voce contabile è mista.","Definire prima i criteri di allocazione e di rilevanza.","Con ipotesi incerte, mostrare scenari e sensibilità invece di un unico numero."],"ex":"Voce «lavorazioni esterne e straordinari» di 84.000 euro: zero entro 21.000 ore, variabile a 28 euro/ora oltre la soglia (3.000 ore × 28).","az":"Quando una voce del piano dei conti contiene cose diverse."},{"id":"guida-volume","t":"Impresa guida: che cosa si riduce se cala il volume","what":"Gli 820.000 euro della struttura divisi in tre gruppi rispetto alla decisione di rinunciare a un volume.","why":"Nessun gruppo coincide con diretti e indiretti o con fissi e variabili: sono prospettive diverse sugli stessi importi.","how":["Si riducono entro l'esercizio 254.000 euro: lavorazioni esterne e straordinari 84.000, trasporti su vendite 138.000 (se diminuiscono le consegne), ricambi e trasferte di assistenza 32.000 (se diminuiscono gli interventi).","Si riducono soltanto intervenendo sugli organici 392.000 euro di retribuzioni: produzione indiretta, ufficio ordini, spedizione, tecnici di assistenza.","Restano invariati 174.000 euro: ammortamento degli impianti, sistemi di gestione degli ordini, retribuzioni amministrative.","Nelle decisioni sui volumi il caso assume che consegne e interventi non cambino: allora si riducono soltanto gli 84.000 euro."],"ex":"254.000 + 392.000 + 174.000 = 820.000 euro.","az":"Quando devi dire quali costi scompaiono davvero rinunciando a un volume."}]},{"id":"c4","n":4,"title":"Comportamento dei costi","full":"Comportamento dei costi","intro":"Scegliere la misura di attività che spiega il consumo di ciascun costo.","topics":[{"id":"fissi","t":"Costi fissi","what":"Costi totali che, entro un determinato intervallo di attività e di tempo, non variano al variare del volume.","why":"Rappresentano il peso della capacità e dell'organizzazione.","how":["Il totale resta stabile entro l'intervallo di rilevanza.","Il costo fisso unitario diminuisce quando aumenta il volume.","Oltre determinate soglie un costo «fisso» può cambiare livello."],"ex":"Totale 12.000 euro: il costo unitario scende da 12 a 6 euro quando i volumi raddoppiano.","nc":"La riduzione del costo fisso unitario non è una riduzione di spesa.","az":"Quando valuti la sensibilità del risultato ai volumi."},{"id":"variabili","t":"Costi variabili","what":"Costi totali che variano in relazione al livello di attività secondo una funzione definita.","why":"Seguono il volume: sono la base del margine di contribuzione.","how":["Il comportamento va definito rispetto a un driver: pezzi, ore, ordini, consegne.","Il costo variabile unitario tende a restare stabile in condizioni normali.","Sconti quantità, urgenze, scarti o inefficienze possono modificare la relazione."],"ex":"Costo variabile unitario 6 euro: il totale cresce in proporzione al driver.","nc":"La proporzionalità è un modello da verificare, non una legge automatica.","az":"Quando simuli il costo a volumi diversi."},{"id":"misti","t":"Costi misti","what":"Costi che contengono una quota fissa e una quota variabile legata al driver.","why":"Separare le due componenti permette di simulare il costo quando cambia il driver.","how":["Costo totale = componente fissa + tariffa variabile × attività.","La componente fissa esiste anche ad attività zero.","Per budget e forecast la funzione esplicita è più utile del totale storico."],"ex":"Canone 2.000 euro/mese + 0,40 euro per transazione: con 10.000 transazioni il costo è 6.000 euro.","nc":"Applicare una percentuale al costo storico nasconde la struttura del costo.","az":"Quando prepari il budget di contratti con canone più consumo."},{"id":"gradini","t":"Costi a gradini","what":"Costi che restano stabili entro una fascia e aumentano quando l'attività supera la capacità del blocco disponibile.","why":"Le soglie cambiano struttura e margini in modo non proporzionale.","how":["La relazione è discreta: non cresce a ogni singola unità.","Identificare le soglie e il costo del blocco aggiuntivo.","Evitare medie che trasformano una soglia in una falsa relazione lineare."],"ex":"Un supervisore ogni dieci addetti, o un mezzo ogni determinato numero di consegne.","az":"Quando il piano prevede volumi vicini a una soglia di capacità."},{"id":"driver","t":"Driver","what":"La grandezza che spiega il consumo della risorsa: unità, ore macchina, ore lavoro, ordini, consegne, ticket.","why":"Un forecast affidabile parte dalla causa economica del costo, non da una percentuale sul consuntivo.","how":["Materiali: spesso unità prodotte o quantità fisica.","Attrezzaggi: numero di lotti o setup, non pezzi prodotti.","Logistica: consegne, righe d'ordine, chilometri o spazio, secondo la causa."],"nc":"La misura più facile da trovare non è necessariamente quella economicamente corretta.","az":"Prima di stimare qualsiasi costo."},{"id":"funzione","t":"Funzione di costo","what":"La relazione esplicita tra costo e driver: quota fissa, tariffa variabile ed eventuali gradini.","why":"Rende il forecast spiegabile e aggiornabile ipotesi per ipotesi.","how":["Costo previsto = costi variabili + costi fissi + gradini di capacità.","Ogni funzione deve dichiarare il proprio intervallo di validità.","Nell'impresa guida: costo totale = 736.000 + costi variabili di linea + 28 × MAX(ore richieste - 21.000; 0)."],"ex":"Con 24.000 ore: variabili 2.324.000 + capacità esterna 84.000 + struttura 736.000 = 3.144.000 euro.","az":"Quando costruisci un modello di budget o di simulazione."},{"id":"relevant-range","t":"Intervallo di rilevanza","what":"L'intervallo di attività e di tempo entro cui una relazione di costo resta valida.","why":"Un costo è fisso solo entro una fascia; oltre la capacità servono nuovi turni, impianti o spazi.","how":["Non estendere automaticamente la relazione oltre i volumi storici osservati.","Il periodo conta: un organico può essere rigido nel mese e modificabile nell'anno.","Le simulazioni devono mostrare le soglie invece di nasconderle in medie."],"nc":"Dire «questo costo è fisso» senza periodo, driver e intervallo è una classificazione incompleta.","az":"Quando simuli volumi molto diversi da quelli storici."},{"id":"capacita","t":"Capacità","what":"Le risorse rese disponibili dall'organizzazione (capacità fornita) per svolgere l'attività.","why":"La capacità modifica il comportamento dei costi e deve entrare esplicitamente nelle simulazioni.","how":["Capacità fornita: risorse rese disponibili.","Capacità utilizzata: parte effettivamente assorbita dall'attività.","Saturazione: sotto il 100% c'è capacità inutilizzata; oltre il 100% serve capacità aggiuntiva."],"ex":"Impresa guida: capacità del reparto 21.000 ore macchina, domanda piena 24.000 ore, quindi 3.000 ore esterne.","az":"Quando verifichi se un piano è realizzabile."},{"id":"cap-utilizzata","t":"Capacità utilizzata","what":"La parte della capacità fornita effettivamente assorbita dall'attività.","why":"È la base corretta a cui collegare il costo dei prodotti.","how":["Costo della capacità utilizzata = tariffa × ore utilizzate.","Si confronta con la capacità fornita.","Va misurata alla stessa granularità con cui la capacità viene consumata (anche mensile)."],"ex":"Struttura 120.000 euro per 12.000 ore = 10 euro/ora; 9.000 ore utilizzate = 90.000 euro.","az":"Quando calcoli tariffe orarie e costi di prodotto."},{"id":"cap-inutilizzata","t":"Capacità inutilizzata","what":"Costo della capacità fornita meno costo della capacità utilizzata.","why":"Va esposta come informazione gestionale, non occultata dentro il costo unitario.","how":["Formula: costo capacità fornita - costo capacità utilizzata.","Caricare tutta la struttura sulle sole ore utilizzate aumenta il costo unitario e nasconde il problema di saturazione.","Va esposta come residuo di capacità."],"ex":"120.000 euro per 12.000 ore = 10 euro/ora; utilizzo 9.000 ore: 30.000 euro di capacità non impiegata.","az":"Quando i costi unitari salgono solo perché i volumi calano."},{"id":"previsione","t":"Previsione dei costi","what":"La stima del costo futuro costruita per comportamento: volumi e driver, contratti, soglie.","why":"Una previsione spiegabile è più utile di una percentuale di crescita applicata al totale passato.","how":["Volumi e driver alimentano le componenti variabili.","Contratti e decisioni di struttura alimentano i costi fissi.","Le soglie attivano eventuali gradini."],"ex":"6.000 unità × 14 euro + 70.000 euro fissi + 8.000 euro di supervisione oltre 5.000 unità = 162.000 euro.","az":"Nel forecast mensile e nel budget."},{"id":"high-low","t":"Metodo dei livelli massimo e minimo","what":"Stima rapida di un costo misto usando il livello di attività più alto e quello più basso.","why":"Separa quota fissa e tariffa variabile con pochi dati.","how":["Tariffa variabile = variazione costo / variazione attività.","Quota fissa = costo totale - tariffa × attività.","Usa solo due osservazioni: può essere distorto da mesi anomali; per molti dati servono grafici, analisi anomalie e regressione."],"ex":"8.000 ore → 34.000 euro; 4.000 ore → 22.000 euro. Tariffa = 12.000 / 4.000 = 3 euro/ora. Fisso = 34.000 - 3 × 8.000 = 10.000 euro.","nc":"La stima statistica non sostituisce la conoscenza del contratto e del processo.","az":"Quando devi stimare velocemente la struttura di un costo misto."},{"id":"soglie","t":"Soglie di capacità","what":"I livelli di attività oltre i quali il costo cambia livello o si attiva una capacità aggiuntiva.","why":"Sono spesso la parte economicamente più importante del modello.","how":["Nell'impresa guida la capacità esterna si azzera all'87,5% di attività (21.000 ore).","Al 90% servono 600 ore esterne (16.800 euro).","All'80% emergono 1.800 ore interne inutilizzate."],"nc":"Break-even e leva operativa devono rispettare la funzione di costo reale, non una semplificazione lineare unica.","az":"Quando il volume pianificato è vicino a un limite di capacità."},{"id":"controlli-relazione","t":"Controlli prima di usare una relazione di costo","what":"Verifiche su perimetro, prezzi, tempo, anomalie e capacità prima di usare una relazione storica.","why":"Cambi di tecnologia, esternalizzazioni, fermate, acquisizioni e inflazione possono interrompere una relazione storica.","how":["Perimetro: le attività sono le stesse?","Prezzi: le tariffe sono comparabili?","Tempo: costo e driver sono allineati?","Anomalie: esistono eventi eccezionali?","Capacità: sono state superate soglie?"],"az":"Prima di proiettare un costo storico nel budget."},{"id":"guida-livelli","t":"Impresa guida: costi a diversi livelli di attività","what":"La funzione di costo a tratti dell'impresa guida applicata a quattro livelli di attività, con le stesse proporzioni fra le linee.","why":"Mostra nello stesso prospetto tre comportamenti diversi: costi variabili, capacità esterna e struttura fissa.","how":["80%: 19.200 ore, costi variabili 1.859.200, capacità esterna 0, costo totale 2.595.200 euro.","87,5%: 21.000 ore, costi variabili 2.033.500, capacità esterna 0, costo totale 2.769.500 euro.","90%: 21.600 ore, costi variabili 2.091.600, capacità esterna 16.800, costo totale 2.844.400 euro.","100%: 24.000 ore, costi variabili 2.324.000, capacità esterna 84.000, costo totale 3.144.000 euro.","La struttura base resta 736.000 euro: per ora macchina pesa 30,67 euro al 100% e 38,33 euro all'80%. È un indicatore di peso, non un aumento di costo né una tariffa."],"ex":"All'80% restano libere 1.800 ore. Costo della capacità del reparto: 120.000 / 21.000 = 5,71 euro/ora. Le ore libere valgono 1.800 × 120.000 / 21.000 = circa 10.286 euro, da esporre come capacità non impiegata.","nc":"I livelli oltre il 100% non si simulano: la domanda massima di ogni linea coincide con i volumi dell'esercizio.","az":"Quando simuli un calo di volume e devi separare costi variabili, soglia di capacità e struttura."}]},{"id":"c5","n":5,"title":"Oggetti e centri di costo","full":"Oggetti di costo e centri di costo","intro":"Scegliere l'oggetto di costo partendo dalle decisioni che il management deve prendere.","topics":[{"id":"oggetto","t":"Oggetto di costo","what":"Entità di cui si vuole misurare il costo o la redditività: prodotto, servizio, cliente, canale, commessa, processo.","why":"La scelta dell'oggetto determina dati, granularità e regole di attribuzione.","how":["Oggetti finali: prodotto, cliente, commessa; ricevono il costo conclusivo.","Oggetti intermedi: reparto, centro di servizio, processo; raccolgono costi da trasferire.","Lo stesso reparto può essere intermedio per il costing e finale per il controllo del responsabile."],"nc":"Più dettaglio non significa automaticamente più valore.","az":"All'inizio di ogni progetto di contabilità analitica."},{"id":"centro","t":"Centro di costo","what":"Unità organizzativa o logica in cui si raccolgono costi omogenei per responsabilità e attività, prima del trasferimento agli oggetti finali.","why":"Serve sia al controllo di responsabilità sia al trasferimento ordinato dei costi indiretti.","how":["Un centro ben definito ha perimetro, responsabile, attività riconoscibili e una misura del lavoro svolto.","Centri troppo ampi mescolano driver diversi; troppo dettagliati aumentano manutenzione e rischio di errore.","Il piano dei centri non deve copiare l'organigramma."],"az":"Quando progetti o rivedi il piano dei centri."},{"id":"c-produttivi","t":"Centri produttivi","what":"Centri che realizzano direttamente l'output.","why":"Sono i centri da cui i costi passano ai prodotti.","how":["Basi tipiche: ore macchina, ore lavoro, quantità.","Ricevono i costi ribaltati dai centri ausiliari.","Nell'impresa guida la Lavorazione ha costi propri per 66.000 euro; con i 54.000 euro ribaltati da Manutenzione e Programmazione e qualità arriva a 120.000 euro di indiretti di produzione."],"az":"Quando calcoli il costo industriale."},{"id":"c-ausiliari","t":"Centri ausiliari","what":"Centri che forniscono servizi ad altri centri, ad esempio manutenzione o servizi energetici.","why":"I loro costi vanno trasferiti ai centri che usano i servizi.","how":["Basi tipiche: ore intervento, consumi, richieste.","Si chiudono a zero con il ribaltamento.","Metodi: diretto, a cascata, reciproco."],"az":"Quando ribalti manutenzione o servizi interni."},{"id":"c-struttura","t":"Centri di struttura","what":"Centri che sostengono l'organizzazione nel suo complesso.","why":"Distribuire tutta la struttura sui prodotti non è sempre utile: il perimetro dipende dallo scopo.","how":["Trattamento: criterio specifico, perimetro più ampio o gestione separata.","Nel Direct Costing evoluto restano costi fissi comuni.","Nel Full Costing complessivo possono essere allocati."],"az":"Quando decidi fin dove spingere il costo pieno."},{"id":"centri-resp","t":"Centri di responsabilità","what":"Unità a cui si assegna un obiettivo economico insieme alle leve per raggiungerlo. Il centro di costo è il caso più semplice.","why":"Il tipo di centro dipende da che cosa governa il responsabile: si risponde soltanto di ciò che si può influenzare.","how":["Centro di costo: governa l'impiego delle risorse e risponde dei costi.","Centro di ricavo: governa prezzi e volumi di vendita e risponde dei ricavi.","Centro di profitto: governa costi e ricavi e risponde del margine.","Centro di investimento: decide anche gli investimenti e risponde del rendimento del capitale investito.","Prezzo interno: valore a cui un centro cede servizi a un altro. Fra due centri di costo conviene la tariffa prestabilita del centro che cede."],"ex":"Impresa guida: i sette centri del piano raccolgono soltanto costi e la Lavorazione trasferisce alle linee i costi di produzione. Il problema del prezzo interno non si pone.","nc":"Il prezzo interno sposta il risultato da un centro all'altro, ma non cambia quello dell'impresa.","az":"Quando assegni obiettivi economici ai responsabili."},{"id":"piano-centri","t":"Piano dei centri e scheda del centro","what":"Elenco dei centri di costo, ciascuno documentato in una scheda con regole verificabili.","why":"Le regole non devono dipendere dalla memoria di chi ha costruito il modello.","how":["Si parte dalle decisioni ricorrenti: per ognuna si fissano oggetto, misura economica, frequenza, responsabile e dettaglio necessario.","La scheda indica identità, responsabile, perimetro, attività, driver, dati e criterio di allocazione.","Servono codici stabili e regole per aprire, chiudere o fondere centri, altrimenti si perde la confrontabilità storica.","La quadratura del piano si esegue prima di qualsiasi allocazione."],"ex":"Impresa guida: sette centri. Manutenzione 36.000 e Programmazione e qualità 18.000 (ausiliari); Lavorazione 66.000 (produttivo); Gestione ordini 240.000, Consegne 180.000 e Assistenza tecnica 150.000 (commerciali e logistici); Amministrazione 46.000 (struttura, gestione separata). Totale 736.000 euro; con gli 84.000 euro di capacità esterna su una riga propria si torna a 820.000.","nc":"Il piano dei centri non copia l'organigramma né il partitario: nel partitario i 120.000 euro sono ammortamento e retribuzioni, nel piano sono letti per funzione.","az":"Quando progetti o rivedi il piano dei centri."}]},{"id":"c6","n":6,"title":"Diretti, indiretti e allocazione","full":"Costi diretti, indiretti e allocazione","intro":"Distinguere l'attribuzione dei costi diretti dall'allocazione dei costi indiretti.","topics":[{"id":"attribuzione","t":"Attribuzione","what":"Il costo arriva all'oggetto attraverso una misura osservabile del consumo.","why":"Non contiene ipotesi di riparto: è la via più affidabile.","how":["Esempio: materiale tracciato per prodotto.","Richiede dati operativi affidabili.","Riguarda i costi diretti."],"nc":"Attribuzione ≠ allocazione: l'allocazione contiene sempre un'ipotesi.","az":"Quando hai una misura diretta del consumo."},{"id":"allocazione","t":"Allocazione","what":"Procedimento con cui un costo indiretto comune viene distribuito tra centri, attività o oggetti di costo.","why":"Serve a costruire costi pieni e ad assegnare costi comuni.","how":["Usa una base che rappresenta il consumo o la causa economica.","Se l'ipotesi è debole, il totale resta corretto ma la distribuzione è fuorviante.","Esempio: manutenzione comune ripartita per ore di intervento."],"nc":"Un costo allocato non è automaticamente evitabile.","az":"Quando ripartisci costi comuni."},{"id":"basi","t":"Basi di allocazione","what":"Grandezza usata per ripartire un costo indiretto: ore macchina, ore lavoro, metri quadrati, numero di ordini.","why":"La qualità della ripartizione dipende dalla rappresentatività della base.","how":["Manutenzione: meglio ore di intervento che unità prodotte.","Gestione ordini: meglio numero e complessità ordini che ricavi.","Affitto: meglio metri quadrati che ricavi.","Bilanciare relazione causale, disponibilità del dato, stabilità e costo della misura."],"ex":"Impresa guida: 120.000 euro su ore macchina danno 60.000/30.000/30.000; sulle unità 43.636/65.455/10.909. Entrambe quadrano, ma solo le ore riflettono l'assorbimento.","az":"Quando scegli o rivedi un criterio di riparto."},{"id":"coefficienti","t":"Coefficienti di allocazione","what":"Rapporto tra costi del centro e volume totale della base.","why":"Trasforma il costo del centro in una tariffa applicabile agli oggetti.","how":["Coefficiente = costi del centro / volume totale della base.","Costo oggetto = coefficiente × base consumata dall'oggetto.","Dividere i fissi per il volume effettivo rende la tariffa instabile; può servire la capacità pratica o un volume normale."],"ex":"Centro 240.000 euro / 12.000 ore = 20 euro/ora; prodotto con 150 ore: 3.000 euro allocati.","az":"In ogni calcolo di costo pieno a centri."},{"id":"ribaltamenti","t":"Ribaltamenti","what":"Trasferimento dei costi dei centri ausiliari ai centri produttivi.","why":"Porta i costi dei servizi interni verso i centri che realizzano l'output.","how":["Metodo diretto: solo verso i produttivi.","Metodo a cascata: in sequenza, scambi in una sola direzione.","Metodo reciproco: tutti gli scambi tra ausiliari.","I centri ausiliari devono chiudersi a zero."],"az":"Nella chiusura mensile della contabilità analitica."},{"id":"m-diretto","t":"Metodo diretto","what":"Trasferisce i costi degli ausiliari soltanto ai centri produttivi, ignorando gli scambi tra ausiliari.","why":"È il metodo più semplice, adeguato quando gli scambi reciproci sono poco rilevanti.","how":["Ricalcolare le percentuali sui soli destinatari produttivi.","Verificare che gli ausiliari si chiudano a zero e il totale resti invariato.","Valutare la distorsione rispetto ai metodi che riconoscono i servizi reciproci."],"az":"Quando gli scambi tra ausiliari sono marginali."},{"id":"m-cascata","t":"Metodo a cascata","what":"Ordina i centri ausiliari e trasferisce i costi progressivamente; un centro chiuso non riceve più costi.","why":"È un compromesso tra semplicità e precisione.","how":["Riconosce gli scambi reciproci in una sola direzione.","L'ordine scelto può modificare la distribuzione finale.","La governance deve fissare una sequenza coerente e stabile."],"nc":"Se l'ordine cambia il risultato in modo materiale, il metodo può essere troppo sensib
